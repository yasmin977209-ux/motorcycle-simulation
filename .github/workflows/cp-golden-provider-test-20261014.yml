name: CP-D2 Golden Provider Test

on:
  push:
    branches:
      - "tmp/cp-golden-provider-20261014"

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[cp-golden-provider-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact CP-D2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Check diff whitespace, Python syntax, and workflow constraints
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 327a4220c3be4f675d08a28cf8bbd973cc5fbd3a...HEAD
          python -m compileall -q run_batch.py scripts/golden_reference_provider.py tests/test_golden_reference_provider.py tests/test_run_batch.py
          python - <<'PY'
          import yaml
          from pathlib import Path

          path = Path(".github/workflows/cp-golden-provider-test-20261014.yml")
          workflow = yaml.safe_load(path.read_text(encoding="utf-8"))
          job = workflow["jobs"]["verify"]
          assert job["timeout-minutes"] == 45
          trigger = workflow.get("on") or workflow.get(True) or {}
          assert trigger["push"]["branches"] == ["tmp/cp-golden-provider-20261014"]
          assert "workflow_dispatch" not in trigger
          assert not any("*" in branch for branch in trigger["push"]["branches"])
          print("DIFF_SYNTAX_WORKFLOW_GATES=PASS")
          PY
          changed="$(git diff --name-only 327a4220c3be4f675d08a28cf8bbd973cc5fbd3a...HEAD | sort)"
          printf '%s\n' "$changed" | tee /tmp/cp_d2_changed_paths.txt
          if printf '%s\n' "$changed" | grep -E '^(constants\.py|dateutils\.py|rng\.py|entities\.py|state_machine\.py|daily_engine\.py|accounting\.py|collection\.py|guarantee\.py|friday\.py|settlement\.py|closure\.py|partner_equity\.py|monte_carlo\.py|docs/|results_stage|.*\.parquet$)'; then
            echo "UNAUTHORIZED_MODEL_OR_DATA_CHANGE" >&2
            exit 1
          fi
          echo "MODEL_AND_DATA_BOUNDARY=PASS"

      - name: Generate Stage 5 test fixtures
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py
          test -f results_stage5/worker_equivalence_manifest.json
          test -f results_stage5/trials_summary.parquet
          test -f results_stage5/daily_distribution.parquet



      - name: Run CP-D2 focused tests
        env:
          PYTHONPATH: .
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp_golden_evidence
          python -m pytest -q tests/test_golden_reference_provider.py tests/test_run_batch.py 2>&1 | tee cp_golden_evidence/pytest_targeted.txt

      - name: Run complete pytest suite
        env:
          PYTHONPATH: .
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee cp_golden_evidence/pytest_full.txt
          pytest_status=$?
          printf '%s\n' "$pytest_status" > cp_golden_evidence/pytest_exit_code.txt
          exit "$pytest_status"

      - name: Upload tested evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-d2-golden-provider-evidence
          path: cp_golden_evidence/
          if-no-files-found: warn
          retention-days: 30
