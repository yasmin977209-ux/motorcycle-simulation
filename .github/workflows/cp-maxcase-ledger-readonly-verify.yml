name: CP MaxCase Stage 12 Read-only Verifier

on:
  push:
    branches:
      - "tmp/cp-maxcase-ledger-verify-20261019"

permissions:
  contents: read
  actions: read

jobs:
  verify-existing-artifacts:
    name: Verify official TrialResult IDs and Stage 12 daily completeness
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact verifier commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow
      - name: Verify official Stage 7/10/12 artifacts without running the model
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yasmin977209-ux/motorcycle-simulation
          VERIFIER_SHA: ${{ github.sha }}
        run: |
          mkdir -p cp_maxcase_evidence
          python - <<'PY'
          import base64, hashlib, json, math, os, re, subprocess, sys, zipfile
          from datetime import date, timedelta
          from io import BytesIO
          from pathlib import Path
          import pyarrow.parquet as pq

          REPO = os.environ["GH_REPO"]
          EVIDENCE = Path("cp_maxcase_evidence")
          SOURCE_SHA = "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          SEED = 20270101
          S7_RUN, S7_HEAD = 37225915321, "e0b2fab6710833774937d778097363d7a8ee8e59"
          S10_RUN, S10_HEAD = 37709936740, "ca73f2df37baacebbcad965fc5f433f129675820"
          S12_RUN, S12_HEAD = 37964656154, "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
          S12_GLOBAL = "7a5de15c78b862749bc3ff6e689fe44909827d903ba7cbc4b469ca126ff25d44"
          SCENARIOS = [f"C{c:03d}_G{g:03d}" for c in (100,85,70,50,30) for g in (100,70,50,30,0)]
          COLUMN_TYPES = {
            "scenario_id":"string","trial_id":"int64","date":"string","source_sha":"string","master_seed":"int64",
            "Opening_Cash":"int64","cash_inflows":"int64","cash_outflows":"int64","Closing_Cash":"int64",
            "Opening_AR":"int64","ar_accruals":"int64","ar_collections":"int64","ar_transfers_to_guarantee":"int64","Closing_AR":"int64",
            "Opening_Gross_Bike_Assets":"int64","capitalized_purchases_and_customs":"int64","gross_writeoffs_on_ownership":"int64",
            "Closing_Gross_Bike_Assets":"int64","Opening_Accumulated_Depreciation":"int64","depreciation_expense":"int64",
            "ad_removed_on_writeoff":"int64","Closing_Accumulated_Depreciation":"int64","Net_Bike_Assets":"int64","Capital":"int64",
            "Retained_Earnings":"int64","Opening_Equity":"int64","Operating_Net_Profit":"int64","Closing_Equity":"int64",
            "Guarantee_Claim_Receivable":"int64","Total_Assets":"int64","Liabilities":"int64","Balance_Difference":"int64",
            "Final_Close_Date":"string","Simulation_Stopped":"bool","Active_Bikes":"int64","Owned_Transferred_Bikes":"int64",
            "Pending_Claims":"int64","result_sha256":"string"
          }
          IDENTITY_KEY = b"stage12.dataset_identity"
          RNG_POLICY = "rng.py:SHA-256(seed key master_seed|scenario_id|trial_id|bike_id|date|event_type); draw=first_8_digest_bytes_big_endian/2^64; probability boundaries are deterministic"
          SAMPLING_POLICY = "one-based contiguous trial IDs; C100 scenarios use 1..1; non-C100 scenarios use 1..550; one materialization per scenario/trial; no cross-run inputs or resume"
          STABILITY_POLICY = "C100 uses one deterministic trial and no CI gate; non-C100 checkpoint N=300 then +50; 95% Student-t CI half-width <1% of absolute mean for Final_Net_Project_Equity, Partner1_Final_Entitlement, Partner2_Final_Entitlement; CI_ABSOLUTE_EPSILON=1; three consecutive successful checkpoints; accepted N=550 (checkpoints 450, 500, 550)"
          TRIAL_ID_POLICY = "one-based contiguous trial IDs from 1 to scenario target; no duplicate IDs"

          def api_json(endpoint):
            p = subprocess.run(["gh","api",endpoint], capture_output=True, text=True)
            if p.returncode:
              raise RuntimeError(f"GH_API_FAILED endpoint={endpoint} exit={p.returncode} stderr={p.stderr[-1000:]}")
            v = json.loads(p.stdout)
            return v
          def sha(b): return hashlib.sha256(b).hexdigest()
          def sha_file(p):
            h=hashlib.sha256()
            with open(p,"rb") as f:
              for b in iter(lambda:f.read(1024*1024),b""): h.update(b)
            return h.hexdigest()
          def canonical_row_sha(row):
            raw=json.dumps(row,ensure_ascii=False,sort_keys=True,separators=(",",":"),default=str).encode("utf-8")
            return sha(raw)
          def canonical_block_fp(rows):
            def cv(v):
              if isinstance(v,float): return v.hex()
              if isinstance(v,dict): return {str(k):cv(v[k]) for k in sorted(v,key=str)}
              if isinstance(v,(list,tuple)): return [cv(x) for x in v]
              return v
            rows=sorted(rows,key=lambda x:int(x["trial_id"]))
            payload="\n".join(json.dumps(cv(x),ensure_ascii=False,sort_keys=True,separators=(",",":")) for x in rows)
            return sha(payload.encode("utf-8"))
          def load_main_json(path, expected_blob):
            obj=api_json(f"repos/{REPO}/contents/{path}?ref=main")
            if obj.get("sha") != expected_blob:
              raise RuntimeError(f"MAIN_FILE_BLOB_MISMATCH path={path} expected={expected_blob} actual={obj.get('sha')}")
            raw=base64.b64decode(obj["content"])
            return json.loads(raw.decode("utf-8")), {"path":path,"blob_sha":obj["sha"],"raw_sha256":sha(raw),"size_bytes":len(raw)}
          def run_info(run_id, head, expected_conclusion=None):
            r=api_json(f"repos/{REPO}/actions/runs/{run_id}")
            if int(r.get("id",-1))!=run_id or r.get("head_sha")!=head:
              raise RuntimeError(f"RUN_IDENTITY_MISMATCH run={run_id} expected_head={head} actual={r.get('head_sha')}")
            if r.get("status")!="completed":
              raise RuntimeError(f"RUN_NOT_COMPLETED run={run_id} status={r.get('status')}")
            if expected_conclusion is not None and r.get("conclusion")!=expected_conclusion:
              raise RuntimeError(f"RUN_CONCLUSION_MISMATCH run={run_id} expected={expected_conclusion} actual={r.get('conclusion')}")
            return {k:r.get(k) for k in ("id","name","head_branch","head_sha","status","conclusion","html_url","created_at","updated_at")}
          def artifacts_for(run_id):
            obj=api_json(f"repos/{REPO}/actions/runs/{run_id}/artifacts?per_page=100")
            arr=obj.get("artifacts",[])
            if int(obj.get("total_count",-1))!=len(arr):
              raise RuntimeError(f"ARTIFACT_INDEX_INCOMPLETE run={run_id} total={obj.get('total_count')} returned={len(arr)}")
            byname={}
            for a in arr:
              if a.get("expired"): continue
              if a.get("name") in byname: raise RuntimeError(f"DUPLICATE_ARTIFACT_NAME run={run_id} name={a.get('name')}")
              byname[a["name"]]=a
            return byname
          def download_artifact(a, tag):
            if not a or a.get("expired"): raise RuntimeError(f"ARTIFACT_MISSING_OR_EXPIRED tag={tag}")
            dest=EVIDENCE/f"tmp_{tag}.zip"
            p=subprocess.run(["gh","api",f"repos/{REPO}/actions/artifacts/{int(a['id'])}/zip"],stdout=dest.open("wb"),stderr=subprocess.PIPE)
            if p.returncode or not zipfile.is_zipfile(dest):
              raise RuntimeError(f"ARTIFACT_DOWNLOAD_FAILED tag={tag} id={a.get('id')} exit={p.returncode} stderr={p.stderr.decode(errors='replace')[-1000:]}")
            digest=sha_file(dest)
            expected=a.get("digest")
            if expected and digest != expected.removeprefix("sha256:"):
              raise RuntimeError(f"ARTIFACT_ZIP_DIGEST_MISMATCH tag={tag} expected={expected} actual={digest}")
            return dest, {"artifact_id":int(a["id"]),"name":a["name"],"size_in_bytes":a.get("size_in_bytes"),"zip_sha256":digest,"api_digest":expected}
          def member_by_basename(zf, basename):
            matches=[n for n in zf.namelist() if n.rsplit("/",1)[-1]==basename]
            if len(matches)!=1: raise RuntimeError(f"ZIP_MEMBER_COUNT basename={basename} count={len(matches)} members={zf.namelist()[:20]}")
            return zf.read(matches[0]), matches[0]
          def parse_meta(raw, stage10=False):
            mode="standard_json"
            if raw.endswith(b"}\\n"):
              if not stage10: raise RuntimeError("UNEXPECTED_LITERAL_BACKSLASH_N_SUFFIX")
              trimmed=raw[:-2]
              if not trimmed.endswith(b"}"): raise RuntimeError("STAGE10_SUFFIX_TRIM_INVALID")
              raw=trimmed
              mode="known_stage10_literal_backslash_n_suffix_removed_in_memory"
            v=json.loads(raw.decode("utf-8"))
            if not isinstance(v,dict): raise RuntimeError("METADATA_ROOT_NOT_OBJECT")
            return v,mode
          def find_metric(row):
            hits=[k for k in row if re.sub(r"[^a-z0-9]","",k.lower())=="finalnetprojectequity"]
            if len(hits)!=1: raise RuntimeError(f"FINAL_NET_PROJECT_EQUITY_COLUMN_COUNT keys={list(row)} matches={hits}")
            v=row[hits[0]]
            if isinstance(v,bool) or not isinstance(v,(int,float)) or not math.isfinite(v) or int(v)!=v:
              raise RuntimeError(f"FINAL_NET_PROJECT_EQUITY_NOT_FINITE_INTEGER key={hits[0]} value={v!r}")
            return int(v)
          def verify_source_block(scenario, zf, start, end, run_id, manifest, stage10=False):
            meta_name=f"block_{start}_{end}_metadata.json"
            parquet_name=f"block_{start}_{end}.parquet"
            meta_raw,meta_member=member_by_basename(zf,meta_name)
            parquet_raw,parquet_member=member_by_basename(zf,parquet_name)
            meta,parse_mode=parse_meta(meta_raw,stage10=stage10)
            checks={
              "scenario":meta.get("scenario")==scenario,
              "source_sha":meta.get("source_sha")==SOURCE_SHA,
              "run_id":str(meta.get("run_id"))==str(run_id),
              "trial_id_start":int(meta.get("trial_id_start",-1))==start,
              "trial_id_end":int(meta.get("trial_id_end",-1))==end,
              "trial_count":int(meta.get("trial_count",-1))==end-start+1,
              "log_events_false":meta.get("log_events") is False
            }
            if not all(checks.values()): raise RuntimeError(f"SOURCE_BLOCK_METADATA_IDENTITY_MISMATCH scenario={scenario} range={start}-{end} checks={checks}")
            expected_fp=manifest.get("block_fingerprints",{}).get(scenario,{}).get(f"{start}-{end}")
            if expected_fp is not None and meta.get("fingerprint_sha256")!=expected_fp:
              raise RuntimeError(f"OFFICIAL_BLOCK_FINGERPRINT_MISMATCH scenario={scenario} range={start}-{end} expected={expected_fp} actual={meta.get('fingerprint_sha256')}")
            rows=pq.read_table(BytesIO(parquet_raw)).to_pylist()
            if len(rows)!=end-start+1: raise RuntimeError(f"SOURCE_BLOCK_ROW_COUNT_MISMATCH scenario={scenario} range={start}-{end} rows={len(rows)}")
            hashes=meta.get("per_trial_sha256")
            if not isinstance(hashes,list) or len(hashes)!=len(rows): raise RuntimeError(f"SOURCE_BLOCK_HASH_COUNT_MISMATCH scenario={scenario} range={start}-{end}")
            for i,row in enumerate(rows):
              tid=start+i
              if int(row.get("trial_id",-1))!=tid or row.get("scenario_id")!=scenario:
                raise RuntimeError(f"SOURCE_BLOCK_ROW_KEY_MISMATCH scenario={scenario} expected_trial_id={tid} actual={row.get('trial_id')}")
              actual=canonical_row_sha(row)
              if hashes[i]!=actual: raise RuntimeError(f"SOURCE_BLOCK_ROW_SHA_MISMATCH scenario={scenario} trial_id={tid} expected={hashes[i]} actual={actual}")
            if stage10 and canonical_block_fp(rows)!=meta.get("fingerprint_sha256"):
              raise RuntimeError(f"STAGE10_NEW_BLOCK_FINGERPRINT_MISMATCH scenario={scenario}")
            return rows, {"range":[start,end],"metadata_member":meta_member,"metadata_raw_sha256":sha(meta_raw),"metadata_parse_mode":parse_mode,"parquet_member":parquet_member,"parquet_sha256":sha(parquet_raw),"row_count":len(rows),"block_fingerprint_sha256":meta.get("fingerprint_sha256"),"official_manifest_fingerprint_sha256":expected_fp,"per_trial_sha_matches_rows":True}
          def daily_identity(scenario):
            return {"schema_version":"stage12-daily-accounting-v1","scenario":scenario,"source_sha":SOURCE_SHA,"master_seed":SEED,"rng_policy":RNG_POLICY,"sampling_policy":SAMPLING_POLICY,"stability_policy":STABILITY_POLICY,"trial_id_policy":TRIAL_ID_POLICY}

          report={
            "schema_version":"cp-maxcase-stage12-readonly-evidence-v1",
            "verifier_commit":os.environ["VERIFIER_SHA"],
            "status":"RUNNING",
            "source_sha":SOURCE_SHA,"master_seed":SEED,
            "runs":{},"main_evidence":{},"scenario_count_expected":25,
            "scenario_count_verified":0,"trial_count_verified":0,"daily_rows_verified":0,"scenarios":[],
            "scope":{"read_only":True,"trials_rerun":False,"monte_carlo_run":False,"source_or_parquet_changed":False,"gate_a_production_run":False}
          }
          try:
            manifest,mi=load_main_json("docs/stage9a/dataset_manifest.json","e796fa2443493b607f1f9c60b58eb63607959c26")
            roll,ri=load_main_json("docs/stage12/roll_forward_validation.json","6084e8f68fa649fcf0726daa04f41ae9b0636706")
            closure,ci=load_main_json("docs/stage12/closure_settlement_validation.json","81bc3cd9c7666487b69b644dcc3291d0547c8e8b")
            if manifest.get("source_sha")!=SOURCE_SHA or int(manifest.get("master_seed",-1))!=SEED or manifest.get("global_manifest_sha256")!="892da438955160bb59aff3046271402f57bdd61a4abb35f41db7188f61346ff6":
              raise RuntimeError("STAGE9A_MANIFEST_IDENTITY_MISMATCH")
            if roll.get("source_sha")!=SOURCE_SHA or int(roll.get("master_seed",-1))!=SEED or roll.get("schema_version")!="stage12-daily-accounting-v1" or roll.get("overall_result")!="PASS":
              raise RuntimeError("STAGE12_ROLL_FORWARD_REPORT_IDENTITY_OR_STATUS_MISMATCH")
            if closure.get("source_sha")!=SOURCE_SHA or int(closure.get("master_seed",-1))!=SEED or closure.get("schema_version")!="stage12-daily-accounting-v1" or closure.get("overall_result")!="PASS":
              raise RuntimeError("STAGE12_CLOSURE_REPORT_IDENTITY_OR_STATUS_MISMATCH")
            if roll.get("expected_global_sha256_from_cp12b")!=S12_GLOBAL or closure.get("expected_global_sha256")!=S12_GLOBAL:
              raise RuntimeError("STAGE12_GLOBAL_HASH_REPORT_MISMATCH")
            report["main_evidence"]={"manifest":mi,"roll_forward":ri,"closure":ci,"manifest_global_sha256":manifest["global_manifest_sha256"],"stage12_global_sha256":S12_GLOBAL}
            report["runs"]["stage7"]=run_info(S7_RUN,S7_HEAD,"success")
            report["runs"]["stage10"]=run_info(S10_RUN,S10_HEAD,None)
            report["runs"]["stage12"]=run_info(S12_RUN,S12_HEAD,"success")
            s7=artifacts_for(S7_RUN); s10=artifacts_for(S10_RUN); s12=artifacts_for(S12_RUN)
            s7jobs=api_json(f"repos/{REPO}/actions/runs/{S7_RUN}/jobs?per_page=100").get("jobs",[])
            s10jobs=api_json(f"repos/{REPO}/actions/runs/{S10_RUN}/jobs?per_page=100").get("jobs",[])
            s7job={j["name"]:j.get("conclusion") for j in s7jobs}
            s10job={j["name"]:j.get("conclusion") for j in s10jobs}
            if not any(a.get("name")=="stage7-summary-1" and int(a.get("id",-1))==11313318432 for a in api_json(f"repos/{REPO}/actions/runs/{S7_RUN}/artifacts?per_page=100").get("artifacts",[])):
              raise RuntimeError("STAGE7_OFFICIAL_SUMMARY_ARTIFACT_MISSING_OR_ID_MISMATCH")
            total_trials=0; total_daily=0; undefined=[]
            for scenario in SCENARIOS:
              c100=scenario.startswith("C100_")
              expected_trials=1 if c100 else 550
              if s7job.get(f"simulation-{scenario}")!="success":
                raise RuntimeError(f"STAGE7_SCENARIO_JOB_NOT_SUCCESS scenario={scenario} conclusion={s7job.get(f'simulation-{scenario}')}")
              if s10job.get(f"bench-{scenario}-1")!="success":
                raise RuntimeError(f"STAGE10_CANONICAL_SCENARIO_JOB_NOT_SUCCESS scenario={scenario} conclusion={s10job.get(f'bench-{scenario}-1')}")
              s7_name=f"stage7-blocks-{scenario}-1"
              s7_art=s7.get(s7_name)
              expected_s7_id=int(manifest["artifact_manifest"]["official_block_artifacts"][scenario])
              if not s7_art or int(s7_art["id"])!=expected_s7_id:
                raise RuntimeError(f"STAGE7_ARTIFACT_ID_MISMATCH scenario={scenario} expected={expected_s7_id} actual={None if not s7_art else s7_art['id']}")
              s7zip,s7info=download_artifact(s7_art,f"s7_{scenario}")
              with zipfile.ZipFile(s7zip) as zf:
                ranges=[(1,1)] if c100 else [(1,300),(301,350),(351,400),(401,450)]
                source_rows=[]
                block_evidence=[]
                for start,end in ranges:
                  rows,ev=verify_source_block(scenario,zf,start,end,S7_RUN,manifest,False)
                  source_rows.extend(rows); block_evidence.append(ev)
              s7zip.unlink(missing_ok=True)
              stage10_evidence=None
              if not c100:
                s10_name=f"stage10-bench-{scenario}-1"
                s10_art=s10.get(s10_name)
                if not s10_art: raise RuntimeError(f"STAGE10_ARTIFACT_MISSING scenario={scenario} name={s10_name}")
                s10zip,s10info=download_artifact(s10_art,f"s10_{scenario}")
                with zipfile.ZipFile(s10zip) as zf:
                  new_rows,stage10_evidence=verify_source_block(scenario,zf,451,550,S10_RUN,manifest,True)
                s10zip.unlink(missing_ok=True)
                source_rows.extend(new_rows)
              source_rows.sort(key=lambda row:int(row["trial_id"]))
              if [int(row["trial_id"]) for row in source_rows] != list(range(1,expected_trials+1)):
                raise RuntimeError(f"OFFICIAL_TRIAL_ID_COVERAGE_MISMATCH scenario={scenario} expected_count={expected_trials} actual_ids={[int(x['trial_id']) for x in source_rows[:3]]}...{[int(x['trial_id']) for x in source_rows[-3:]]}")
              candidates=[]
              for row in source_rows:
                metric=find_metric(row)
                candidates.append({"trial_id":int(row["trial_id"]),"final_net_project_equity":metric,"result_sha256":canonical_row_sha(row)})
              positive=[x for x in candidates if x["final_net_project_equity"]>0]
              selected=sorted(positive,key=lambda x:(-x["final_net_project_equity"],x["trial_id"]))[0] if positive else None
              if selected is None: undefined.append(scenario)

              s12_name=f"stage12-daily-{scenario}"
              s12_art=s12.get(s12_name)
              if not s12_art: raise RuntimeError(f"STAGE12_ARTIFACT_MISSING scenario={scenario} name={s12_name}")
              s12zip,s12info=download_artifact(s12_art,f"s12_{scenario}")
              with zipfile.ZipFile(s12zip) as zf:
                parquet_members=[n for n in zf.namelist() if n.endswith(".parquet")]
                if len(parquet_members)!=1: raise RuntimeError(f"STAGE12_PARQUET_MEMBER_COUNT scenario={scenario} members={parquet_members}")
                parquet_raw=zf.read(parquet_members[0])
              s12zip.unlink(missing_ok=True)
              rs=roll.get("scenarios",{}).get(scenario); cs=closure.get("scenarios",{}).get(scenario)
              if not isinstance(rs,dict) or not isinstance(cs,dict): raise RuntimeError(f"STAGE12_SCENARIO_REPORT_MISSING scenario={scenario}")
              member_sha=sha(parquet_raw)
              if member_sha!=rs.get("content_sha256") or member_sha!=cs.get("content_sha256"):
                raise RuntimeError(f"STAGE12_PARQUET_MEMBER_SHA_MISMATCH scenario={scenario} actual={member_sha} roll={rs.get('content_sha256')} closure={cs.get('content_sha256')}")
              pf=pq.ParquetFile(BytesIO(parquet_raw)); schema=pf.schema_arrow
              if {f.name:str(f.type) for f in schema}!=COLUMN_TYPES:
                raise RuntimeError(f"STAGE12_SCHEMA_TYPE_MISMATCH scenario={scenario} actual={{{', '.join(f'{f.name}:{f.type}' for f in schema)}}}")
              if any(f.nullable!=(f.name=="Final_Close_Date") for f in schema):
                raise RuntimeError(f"STAGE12_SCHEMA_NULLABILITY_MISMATCH scenario={scenario}")
              ident=(schema.metadata or {}).get(IDENTITY_KEY)
              if ident is None or json.loads(ident.decode("utf-8"))!=daily_identity(scenario):
                raise RuntimeError(f"STAGE12_DATASET_IDENTITY_MISMATCH scenario={scenario}")
              if int(rs.get("trials",-1))!=expected_trials or int(cs.get("trial_count",-1))!=expected_trials:
                raise RuntimeError(f"STAGE12_TRIAL_COUNT_REPORT_MISMATCH scenario={scenario}")
              if rs.get("content_sha256_matches_cp12b_manifest") is not True or cs.get("content_sha256_matches_cp12c_report") is not True:
                raise RuntimeError(f"STAGE12_REPORTED_HASH_MATCH_NOT_TRUE scenario={scenario}")
              selected_daily=None; scenario_rows=0; closed_trials=0
              current=None; first_day=None; last_day=None; day_count=0; current_hash=None
              def close_trial():
                global current,first_day,last_day,day_count,current_hash,closed_trials,selected_daily
                if current is None: return
                if first_day!=date(2027,1,1): raise RuntimeError(f"STAGE12_FIRST_DATE_MISMATCH scenario={scenario} trial_id={current} date={first_day}")
                if day_count!=(last_day-first_day).days+1: raise RuntimeError(f"STAGE12_DAILY_GAP_OR_DUPLICATE scenario={scenario} trial_id={current} rows={day_count} span={(last_day-first_day).days+1}")
                if current_hash is None or re.fullmatch(r"[0-9a-f]{64}",current_hash) is None: raise RuntimeError(f"STAGE12_RESULT_SHA_INVALID scenario={scenario} trial_id={current}")
                if selected is not None and current==selected["trial_id"]:
                  matches=current_hash==selected["result_sha256"]
                  selected_daily={"trial_id":current,"daily_rows":day_count,"first_date":first_day.isoformat(),"last_date":last_day.isoformat(),"stage12_result_sha256":current_hash,"official_trial_result_sha256":selected["result_sha256"],"fingerprint_matches":matches}
                  if not matches: raise RuntimeError(f"MAXCASE_SELECTED_TRIAL_FINGERPRINT_MISMATCH scenario={scenario} trial_id={current} stage12={current_hash} official={selected['result_sha256']}")
                closed_trials+=1
              for batch in pf.iter_batches(batch_size=65536,columns=["scenario_id","trial_id","date","source_sha","master_seed","result_sha256"]):
                for row in batch.to_pylist():
                  scenario_rows+=1
                  if row["scenario_id"]!=scenario or row["source_sha"]!=SOURCE_SHA or int(row["master_seed"])!=SEED:
                    raise RuntimeError(f"STAGE12_ROW_IDENTITY_MISMATCH scenario={scenario} trial_id={row.get('trial_id')}")
                  tid=int(row["trial_id"]); d=date.fromisoformat(row["date"]); h=row["result_sha256"]
                  if not isinstance(h,str) or re.fullmatch(r"[0-9a-f]{64}",h) is None:
                    raise RuntimeError(f"STAGE12_RESULT_SHA_INVALID scenario={scenario} trial_id={tid} value={h!r}")
                  if current is None or tid!=current:
                    close_trial()
                    expected_tid=closed_trials+1
                    if tid!=expected_tid:
                      raise RuntimeError(f"STAGE12_TRIAL_ID_SEQUENCE_MISMATCH scenario={scenario} expected={expected_tid} actual={tid}")
                    current=tid; first_day=d; last_day=d; day_count=1; current_hash=h
                  else:
                    if d!=last_day+timedelta(days=1):
                      raise RuntimeError(f"STAGE12_DAILY_DATE_GAP_OR_DUPLICATE scenario={scenario} trial_id={tid} date={d} previous={last_day}")
                    if h!=current_hash:
                      raise RuntimeError(f"STAGE12_RESULT_SHA_DRIFT_WITHIN_TRIAL scenario={scenario} trial_id={tid}")
                    last_day=d; day_count+=1
              close_trial()
              if closed_trials!=expected_trials or [*range(1,closed_trials+1)]!=list(range(1,expected_trials+1)):
                raise RuntimeError(f"STAGE12_TRIAL_COVERAGE_MISMATCH scenario={scenario} closed={closed_trials} expected={expected_trials}")
              if scenario_rows!=int(rs.get("daily_rows",-1)) or scenario_rows!=int(cs.get("daily_rows",-1)):
                raise RuntimeError(f"STAGE12_DAILY_ROW_COUNT_MISMATCH scenario={scenario} actual={scenario_rows} roll={rs.get('daily_rows')} closure={cs.get('daily_rows')}")
              if scenario_rows!=int(pf.metadata.num_rows):
                raise RuntimeError(f"STAGE12_PARQUET_METADATA_ROW_COUNT_MISMATCH scenario={scenario} streamed={scenario_rows} parquet_metadata={pf.metadata.num_rows}")
              if rs.get("first_date")!="2027-01-01" or not rs.get("last_date"):
                raise RuntimeError(f"STAGE12_DATE_SPAN_REPORT_MISMATCH scenario={scenario}")
              if selected is not None and (selected_daily is None or not selected_daily["fingerprint_matches"]):
                raise RuntimeError(f"MAXCASE_SELECTED_DAILY_ROWS_NOT_PROVEN scenario={scenario}")
              if selected is None:
                role_status="UNDEFINED_BUSINESS_RULE"
              else:
                role_status="PROVEN"
              report["scenarios"].append({
                "scenario":scenario,"status":role_status,"canonical_trial_count":len(source_rows),
                "selected_maxcase":selected,"positive_trial_count":len(positive),
                "source_stage7":{"run_id":S7_RUN,"head_sha":S7_HEAD,**s7info,"blocks":block_evidence},
                "source_stage10":({"run_id":S10_RUN,"head_sha":S10_HEAD,**s10info,"block_451_550":stage10_evidence} if stage10_evidence else {"run_id":S10_RUN,"head_sha":S10_HEAD,"canonical_trials_added":0,"reason":"C100 official canonical trial_id=1 comes from Stage 7; Stage 10 is benchmark-only for this scenario"}),
                "source_stage12":{"run_id":S12_RUN,"head_sha":S12_HEAD,**s12info,"parquet_member":parquet_members[0],"parquet_member_sha256":member_sha,"schema_identity_sha256":sha(ident),"daily_rows":scenario_rows,"trial_count":closed_trials,"all_trials_dates_contiguous":True,"no_duplicate_or_missing_trial_ids":True,"result_sha_constant_within_each_trial":True,"selected_trial_daily":selected_daily},
                "roll_forward_report":{"blob_sha":ri["blob_sha"],"reported_daily_rows":rs["daily_rows"],"first_date":rs["first_date"],"last_date":rs["last_date"]},
                "closure_report":{"blob_sha":ci["blob_sha"],"reported_daily_rows":cs["daily_rows"],"all_trials_finalized":cs.get("all_trials_finalized")}
              })
              total_trials+=len(source_rows); total_daily+=scenario_rows
              report["scenario_count_verified"]=len(report["scenarios"])
              report["trial_count_verified"]=total_trials
              report["daily_rows_verified"]=total_daily
            if total_trials!=11005 or total_daily!=22546465 or len(report["scenarios"])!=25:
              raise RuntimeError(f"GLOBAL_COVERAGE_MISMATCH scenarios={len(report['scenarios'])} trials={total_trials} rows={total_daily}")
            report["status"]="BLOCKED_UNDEFINED_BUSINESS_RULE" if undefined else "PASS_ROW_LEVEL_MAXCASE_AND_DAILY_COMPLETENESS"
            report["undefined_business_rule_scenarios"]=undefined
            report["summary"]={"scenarios":len(report["scenarios"]),"canonical_trial_results":total_trials,"daily_rows":total_daily,"stage12_global_sha256":S12_GLOBAL,"all_scenario_daily_sequences_contiguous":True,"all_trial_ids_unique_contiguous":True,"all_result_sha_constant_within_trial":True,"selected_maxcase_fingerprints_match_stage12":all((s["selected_maxcase"] is None) or s["source_stage12"]["selected_trial_daily"]["fingerprint_matches"] for s in report["scenarios"])}
          except Exception as exc:
            report["status"]="FAIL"
            report["error_type"]=type(exc).__name__
            report["error"]=str(exc)
            raise
          finally:
            out=EVIDENCE/"maxcase_stage12_readonly_evidence.json"
            out.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
            lines=[
              "# Read-only MaxCase / Stage 12 verification",
              "",
              f"- Status: **{report.get('status')}**",
              f"- Verifier SHA: `{report.get('verifier_commit')}`",
              f"- Source SHA: `{SOURCE_SHA}`; master seed: `{SEED}`",
              f"- Scenarios verified: {report.get('scenario_count_verified',0)}/25",
              f"- Official trial results verified: {report.get('trial_count_verified',0)}/11,005",
              f"- Daily rows verified: {report.get('daily_rows_verified',0):,}/22,546,465",
              f"- Trial/Monte Carlo reruns: **none**; source/Parquet mutations: **none**",
              "",
              "| Scenario | Selected trial_id | Final_Net_Project_Equity | Daily rows | Date span | Fingerprint | Status |",
              "|---|---:|---:|---:|---|---|---|"
            ]
            for s in report.get("scenarios",[]):
              sel=s.get("selected_maxcase"); daily=s.get("source_stage12",{}).get("selected_trial_daily") or {}
              lines.append(f"| {s['scenario']} | {sel['trial_id'] if sel else '—'} | {sel['final_net_project_equity'] if sel else '—'} | {daily.get('daily_rows','—')} | {daily.get('first_date','—')} → {daily.get('last_date','—')} | {'MATCH' if daily.get('fingerprint_matches') else ('N/A' if not sel else 'MISMATCH')} | {s.get('status')} |")
            if report.get("error"): lines += ["",f"Exact error: `{report['error']}`"]
            (EVIDENCE/"maxcase_stage12_readonly_evidence.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Upload verifier evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-maxcase-stage12-readonly-evidence
          path: cp_maxcase_evidence/
          if-no-files-found: warn
          retention-days: 30
