name: R4 statistical gate fail-closed validation (fixture-safe)

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/golden_reference_provider.py"
      - "tests/test_golden_provider_workflow_integration.py"
      - "tests/test_acceptance_16_v2.py"
      - ".github/workflows/r4-statistical-gate.yml"
      - "docs/stage7/statistical_execution_gate.json"
      - "requirements.txt"
  workflow_dispatch:

concurrency:
  group: r4-statistical-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  r4-tests:
    name: Focused R4 regression and fixture-independent suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Focused R4 regression test
        run: python -m pytest -q tests/test_golden_provider_workflow_integration.py::test_statistical_gate_cannot_be_cleared_by_status_string_alone
      - name: Read-only fixture provenance gate (no trial execution)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("results_stage5")
          required = [
              root / "worker_equivalence_manifest.json",
              root / "trials_summary.parquet",
              root / "selection.parquet",
              root / "C100_G100_trial_000001_daily.json",
              root / "daily_distribution.parquet",
          ]
          present = [str(path) for path in required if path.exists()]
          if present:
              raise SystemExit(
                  "UNREVIEWED_STAGE5_FIXTURE_FILES_PRESENT:"
                  + ",".join(present)
                  + "; refusing to consume unpinned test inputs"
              )
          report = {
              "status": "MISSING_EVIDENCE",
              "execution": "NOT_EXECUTED",
              "fixture_builder_trials_started": False,
              "required_immutable_inputs": [str(path) for path in required],
              "reason": "No retained, reviewed fixture bundle with pinned source/cohort/schema and SHA-256 was found.",
              "policy": "Do not replay C100_G100 trial 1 or C070_G100 trial IDs 1..3 to manufacture fixtures."
          }
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Stage 5 fixture provenance\n\n")
              summary.write("**MISSING_EVIDENCE / NOT_EXECUTED:** no immutable, hash-pinned fixture bundle is present. ")
              summary.write("No model Trial was executed to construct fixtures. Four dependent test cases are explicitly excluded below.\n")
          PY
      - name: Run fixture-independent repository regression
        if: success()
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest -q tests \
            --deselect='tests/test_acceptance_16_v2.py::test_127_تطابق_التسلسلي_والمتوازي' \
            --deselect='tests/test_acceptance_16_v2.py::test_159_اختيار_التكرار_التمثيلي_حسب_Final_Net_Project_Equity_فقط' \
            --deselect='tests/test_acceptance_16_v2.py::test_160_التكرارات_التوضيحية_الاربعة_تنتج_فعليا' \
            --deselect='tests/test_acceptance_16_v2.py::test_161_DAILY_DISTRIBUTION_لكل_يوم_تقويمي_بلا_فجوات'
      - name: Record explicit regression scope
        if: always()
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Regression scope
          The focused R4 test and all fixture-independent tests are run. Tests 127, 159, 160 and 161 are **NOT_EXECUTED** while their authoritative fixture bundle is absent. A successful workflow is not a full-suite acceptance result and does not establish production Gate A/B, convergence, accounting balance, or delivery acceptance.
          EOF
