name: Tri-hash Preservation Bridge — GitHub / OneDrive / Dropbox
on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - .github/workflows/tri-hash-preservation-bridge.yml
      - scripts/verify_tri_hash_preservation_bridge.py
      - scripts/quickxorhash.c
      - tests/test_tri_hash_preservation_bridge.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: tri-hash-preservation-bridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Raw-byte tri-hash, multipart restore and provider retention readback
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only verifier dependencies
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.3 openpyxl python-docx pypdf pyarrow pytest

      - name: Compile QuickXorHash and run bridge unit tests
        run: |
          set -euo pipefail
          cc -O3 -fPIC -shared scripts/quickxorhash.c -o /tmp/libquickxorhash.so
          echo "QUICKXOR_LIB=/tmp/libquickxorhash.so" >> "$GITHUB_ENV"
          python -m pytest -q -rs tests/test_tri_hash_preservation_bridge.py

      - name: Fail closed if read-only provider secrets are unavailable
        env:
          ONEDRIVE_GRAPH_ACCESS_TOKEN: ${{ secrets.ONEDRIVE_GRAPH_ACCESS_TOKEN }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p tri-hash-output
          if [[ -z "${ONEDRIVE_GRAPH_ACCESS_TOKEN}" || -z "${DROPBOX_ACCESS_TOKEN}" ]]; then
            python - <<'PY'
          import json, pathlib
          pathlib.Path("tri-hash-output/TRI_HASH_PRESERVATION_LEDGER_2026-11-07.json").write_text(
              json.dumps({
                  "schema": "tri-hash-preservation-ledger-v1",
                  "repository": "yasmin977209-ux/motorcycle-simulation",
                  "branch": "tmp/d1-rebuild-20261101",
                  "tested_sha": "${{ github.sha }}",
                  "workflow_run_id": int("${{ github.run_id }}"),
                  "overall": "BLOCKED_MISSING_PROVIDER_SECRETS",
                  "provider_reads": "NOT_PERFORMED",
                  "required_secret_names": ["ONEDRIVE_GRAPH_ACCESS_TOKEN", "DROPBOX_ACCESS_TOKEN"],
                  "secret_values_logged": False,
                  "write_operations": "NONE"
              }, indent=2) + "\n", encoding="utf-8")
          PY
            echo "::error::Missing read-only provider credentials. No provider read was attempted."
            exit 1
          fi

      - name: Execute raw-byte tri-hash and restore verifier
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ONEDRIVE_GRAPH_ACCESS_TOKEN: ${{ secrets.ONEDRIVE_GRAPH_ACCESS_TOKEN }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          QUICKXOR_LIB: /tmp/libquickxorhash.so
        run: |
          set -euo pipefail
          python scripts/verify_tri_hash_preservation_bridge.py --output-dir tri-hash-output

      - name: Upload tri-hash ledger and restore evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRI-HASH-PRESERVATION-LEDGER-${{ github.run_id }}
          path: tri-hash-output/
          if-no-files-found: warn
          retention-days: 90
