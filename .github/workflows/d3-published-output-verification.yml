name: D3 Published Output Exact-HEAD Verification

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-published-output-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-published-output:
    name: Verify committed D3 outputs without rebuilding workbooks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert exact branch and remote HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "tmp/d1-rebuild-20261101"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          echo "D3_EXACT_BRANCH_AND_REMOTE_HEAD_PASS local=$actual remote=$remote_head"

      - name: Install bounded verification dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt requests

      - name: Run source-free D3 exporter and registry regression tests
        run: |
          python -m pytest -q tests/test_s6_excel_export.py tests/test_d3_registry_extension.py tests/test_d3_excel_export_complete.py

      - name: Read back committed D3 outputs and evidence from exact GitHub Raw SHA
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EXACT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import pathlib
          import subprocess
          import urllib.parse
          import requests
          import os

          repo = os.environ["REPOSITORY"]
          exact_sha = os.environ["EXACT_SHA"]
          branch = "tmp/d1-rebuild-20261101"
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
          headers = {"Accept": "application/vnd.github+json"}
          if token:
              headers["Authorization"] = "Bearer " + token

          required = [
              "deliverables/النتائج_الكاملة_AR.xlsx",
              "deliverables/Full_Results_EN.xlsx",
              "deliverables/D3_BUILD_AUDIT.json",
              "deliverables/D3_MANIFEST.json",
              "results/number_registry.json",
              "docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md",
          ]
          for path in required:
              if not pathlib.Path(path).is_file():
                  raise SystemExit("D3_REQUIRED_COMMITTED_FILE_MISSING:" + path)

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "deliverables"], text=False
          ).split(b"\0")
          paths = set(required)
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = raw_path.decode("utf-8")
              name = pathlib.Path(path).name
              if name.startswith("D3_") or name in {"النتائج_الكاملة_AR.xlsx", "Full_Results_EN.xlsx"}:
                  if pathlib.Path(path).is_file():
                      paths.add(path)

          optional_evidence = [
              ".github/workflows/d3-published-output-verification.yml",
              "scripts/d3_registry_extension.py",
              "scripts/d3_excel_export_complete.py",
              "tests/test_d3_registry_extension.py",
              "tests/test_d3_excel_export_complete.py",
              "docs/stage_d/D3_FINAL_REVIEW_AND_REMEDIATION_STATUS_2026-11-02.md",
              "docs/stage_d/D3_OPERATIONAL_AUDIT_AND_REMEDIATION_2026-11-02.md",
              "docs/stage_d/D3_CONTINUATION_AUDIT_2026-11-02.md",
              "docs/stage_d/D3_LIVE_REVIEW_AUDIT_2026-11-02.md",
              "docs/stage_d/D3_REQUIREMENTS_MATRIX_2026-11-01.md",
              "docs/stage_d/D3_SOURCE_DATE_AUDIT_2026-11-02.md",
              "docs/stage_d/D3_REMOTE_EVIDENCE_LEDGER_2026-11-01.md",
              "docs/stage_d/D3_CODE_STATIC_VALIDATION_REPORT_2026-11-02.json",
              "docs/stage_d/D3_REPAIR_AND_PUBLICATION_ADDENDUM_2026-11-02.md",
              "docs/stage_d/D3_OWNER_APPROVED_SOURCE_REPROCESSING_2026-11-02.json",
              "docs/stage_d/D3_FINAL_CLOSURE_EVIDENCE_2026-11-02.md",
              "docs/stage_d/D3_FINAL_CLOSURE_EVIDENCE_2026-11-02.json",
              "docs/stage_d/D3_BUILD_REPORT_2026-11-02.md",
              "docs/stage_d/D3_SCOPED_CLOSURE_REPORT_2026-11-02.md",
              "docs/PROJECT_CONTINUITY.md",
              "docs/PROJECT_HANDOFF.md",
              "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md",
              "docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md",
          ]
          for path in optional_evidence:
              if pathlib.Path(path).is_file():
                  paths.add(path)

          session = requests.Session()
          count = 0
          for path in sorted(paths):
              local_path = pathlib.Path(path)
              local = local_path.read_bytes()
              encoded = urllib.parse.quote(path, safe="/")
              url = f"https://raw.githubusercontent.com/{repo}/{exact_sha}/{encoded}"
              response = session.get(url, headers=headers, timeout=(30, 300))
              response.raise_for_status()
              remote = response.content
              if remote != local:
                  raise SystemExit("D3_RAW_BYTE_MISMATCH:" + path)
              digest = hashlib.sha256(remote).hexdigest()
              blob = hashlib.sha1(b"blob " + str(len(remote)).encode() + bytes([0]) + remote).hexdigest()
              print(f"VERIFIED_RAW {path} bytes={len(remote)} sha256={digest} blob_sha1={blob} commit={exact_sha}")
              count += 1

          remote_head = subprocess.check_output(
              ["git", "ls-remote", "origin", f"refs/heads/{branch}"], text=True
          ).split()[0]
          if remote_head != exact_sha:
              raise SystemExit("D3_FINAL_REMOTE_HEAD_MISMATCH:" + remote_head)
          print(f"D3_PUBLISHED_OUTPUT_EXACT_HEAD_PASS {exact_sha} files={count}")
          PY
