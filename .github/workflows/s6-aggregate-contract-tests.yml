name: S6 full repository regression after aggregate correction

on:
  push:
    branches:
      - "tmp/s6-aggregate-contract-fix-20261027"
    paths:
      - "scripts/s6_first_checkpoint.py"
      - "tests/test_s6_first_checkpoint.py"
      - ".github/workflows/s6-aggregate-contract-tests.yml"
      - ".github/workflows/s6-n600-checkpoint.yml"
      - "docs/stage7/statistical_execution_gate.json"

permissions:
  contents: read

jobs:
  verify:
    name: Validate full repository after S6 aggregate correction
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Record exact source and policy hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum scripts/s6_first_checkpoint.py tests/test_s6_first_checkpoint.py stats_integrity.py constants.py docs/stage7/statistical_execution_gate.json docs/stage7/test192_coverage_proof.json .github/workflows/s6-n600-checkpoint.yml .github/workflows/s6-aggregate-contract-tests.yml
      - name: Compile S6 entry point and validate CLI
        run: |
          set -euo pipefail
          python -m py_compile scripts/s6_first_checkpoint.py
          python scripts/s6_first_checkpoint.py --help
      - name: Run the full repository test suite on the exact corrected head
        run: python -m pytest -q tests
