      - uses: actions/upload-artifact@v4
        with:
          name: stage5-round3-c030
          path: results_stage5/
          if-no-files-found: error

  aggregate:
    needs: [measure-c070, measure-c030]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: stage5-round3-c*
          path: results_stage5/incoming
          merge-multiple: true
      - name: Build round3_measurement.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results_stage5/incoming")
          c070 = json.loads(
              (root / "C070_G100_measurement.json").read_text(encoding="utf-8")
          )
          c030 = json.loads(
              (root / "C030_G000_measurement.json").read_text(encoding="utf-8")
          )
          per_g_level_totals = 1 + 4 * 300
          all_25_total = 5 * per_g_level_totals
          projected_25_after_escalation_50 = 5 * (1 + 4 * (300 + 50))
          projected_25_after_escalation_100 = 5 * (1 + 4 * (300 + 100))

          measurement = {
              "scenarios": [c070, c030],
              "per_g_level_totals": per_g_level_totals,
              "all_25_total": all_25_total,
              "projected_25_all_at_start": all_25_total,
              "projected_25_after_escalation_50": projected_25_after_escalation_50,
              "projected_25_after_escalation_100": projected_25_after_escalation_100,
              "active_trial_count_series_ok": all(
                  item["active_trial_count_series_ok"]
                  for item in (c070, c030)
              ),
              "daily_distribution_days_max": max(
                  item["daily_distribution_days_max"]
                  for item in (c070, c030)
              ),
          }
          output = Path("results_stage5/round3_measurement.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(measurement, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  measurement,
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage5-round3-measurement
          path: results_stage5/round3_measurement.json
          if-no-files-found: error
