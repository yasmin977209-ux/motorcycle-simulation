name: stage5-round3-temporary-validation

on:
  push:
    branches: ["tmp/stage5-round3-20261003"]

permissions:
  contents: read

jobs:
  round3-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Round 3 unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_monte_carlo_round3.py

  measure-c070:
    needs: round3-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Measure 300 C070_G100
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p results_stage5
          python - <<'PY'
          import gzip
          import json
          import os
          import time
          from pathlib import Path

          import pyarrow as pa
          import pyarrow.parquet as pq

          import monte_carlo

          scenario = "C070_G100"
          trials_count = 300
          timeout_min = 20
          started = time.perf_counter()
          results, slices = monte_carlo.run_trials_sequentially(
              scenario,
              tuple(range(1, trials_count + 1)),
          )
          elapsed = time.perf_counter() - started
          distribution = monte_carlo.build_daily_distribution(results, slices)

          flat_rows = []
          for trial_id in sorted(slices):
              for row in slices[trial_id]:
                  flat_rows.append({"scenario_id": scenario, **row})

          parquet_path = Path("results_stage5/C070_G100_daily_slices.parquet")
          pq.write_table(
              pa.Table.from_pylist(flat_rows),
              parquet_path,
              compression="zstd",
          )

          jsonl_path = Path("results_stage5/C070_G100_daily_slices.jsonl.gz")
          with gzip.open(jsonl_path, "wt", encoding="utf-8") as stream:
              for row in flat_rows:
                  stream.write(
                      json.dumps(
                          row,
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      ) + "\n"
                  )

          dates = sorted({row["date"] for row in flat_rows})
          expected_dates = [
              (
                  monte_carlo.date.fromisoformat(dates[0])
                  + monte_carlo.timedelta(days=i)
              ).isoformat()
              for i in range(
                  (
                      monte_carlo.date.fromisoformat(dates[-1])
                      - monte_carlo.date.fromisoformat(dates[0])
                  ).days
                  + 1
              )
          ]
          date_series_ok = dates == expected_dates
          active_series_ok = date_series_ok and all(
              row["active_trial_count"]
              == sum(
                  result.final_close_date is None
                  or result.final_close_date >= row["date"]
                  for result in results
              )
              for row in distribution
          )

          payload = {
              "scenario": scenario,
              "trials_count": trials_count,
              "elapsed_total_s": elapsed,
              "elapsed_per_trial_s": elapsed / trials_count,
              "cpu_count": os.cpu_count(),
              "timeout_min": timeout_min,
              "parquet_bytes": parquet_path.stat().st_size,
              "jsonl_gz_bytes": jsonl_path.stat().st_size,
              "active_trial_count_series_ok": active_series_ok,
              "daily_distribution_days_max": max(
                  len(rows) for rows in slices.values()
              ),
              "distribution_rows": len(distribution),
          }
          Path("results_stage5/C070_G100_measurement.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage5-round3-c070
          path: results_stage5/
          if-no-files-found: error

  measure-c030:
