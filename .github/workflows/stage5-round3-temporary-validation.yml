name: stage5-round3-temporary-validation

on:
  push:
    branches: ["tmp/stage5-round3-20261003"]

permissions:
  contents: read

jobs:
  round3-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Round 3 unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_monte_carlo_round3.py

  measure-c070-1:
    needs: round3-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Measure C070_G100 trials 1-100
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p results_stage5
          python - <<'PY'
          import gzip
          import json
          import os
          import time
          from dataclasses import asdict
          from pathlib import Path

          import monte_carlo

          scenario = "C070_G100"
          batch_start = 1
          batch_count = 100
          timeout_min = 20
          trial_ids = tuple(range(batch_start, batch_start + batch_count))

          started = time.perf_counter()
          results, slices = monte_carlo.run_trials_sequentially(
              scenario,
              trial_ids,
          )
          elapsed = time.perf_counter() - started

          results_path = Path(
              "results_stage5/C070_G100_results_1_100.jsonl"
          )
          with results_path.open("w", encoding="utf-8") as stream:
              for result in results:
                  stream.write(
                      json.dumps(
                          asdict(result),
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      ) + "\n"
                  )

          slices_path = Path(
              "results_stage5/C070_G100_slices_1_100.jsonl.gz"
          )
          with gzip.open(slices_path, "wt", encoding="utf-8") as stream:
              for trial_id in sorted(slices):
                  for row in slices[trial_id]:
                      stream.write(
                          json.dumps(
                              {"scenario_id": scenario, **row},
                              ensure_ascii=False,
                              sort_keys=True,
                              separators=(",", ":"),
                          ) + "\n"
                      )

          payload = {
              "scenario": scenario,
              "batch_start": batch_start,
              "batch_count": len(results),
              "elapsed_total_s": elapsed,
              "elapsed_per_trial_s": elapsed / len(results),
              "cpu_count": os.cpu_count(),
              "timeout_min": timeout_min,
              "trial_id_first": min(result.trial_id for result in results),
              "trial_id_last": max(result.trial_id for result in results),
              "results_bytes": results_path.stat().st_size,
              "slices_jsonl_gz_bytes": slices_path.stat().st_size,
          }
          Path(
              f"results_stage5/C070_G100_batch_{start}_{end}.json"
          ).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stage5-round3-c070-b1
          path: results_stage5/
          if-no-files-found: error
