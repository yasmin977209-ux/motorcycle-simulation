name: Stage 13 synthetic compatibility verification

on:
  push:
    branches:
      - "tmp/cp-stage13-excel-compat-20261017"
    paths:
      - "scripts/stage13_assemble.py"
      - "scripts/excel_builder.py"
      - "tests/test_stage13_assembler.py"
      - "tests/test_excel_builder_adaptive_mode.py"
      - "tests/test_excel_builder_legacy_compat.py"
      - "requirements.txt"
      - ".github/workflows/cp-stage13-synthetic-compat-verify.yml"

permissions:
  contents: read

jobs:
  synthetic-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Record validation scope
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          scope = {
              "workflow": ".github/workflows/cp-stage13-synthetic-compat-verify.yml",
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "tested_sha": os.environ.get("GITHUB_SHA"),
              "scope": "Stage 13 synthetic authoring/runtime verification only",
              "input_source": "tests/test_stage13_assembler.py::demo_data synthetic fixture",
              "canonical_dataset_read": False,
              "production_or_historical_payloads_read": False,
              "monte_carlo_started": False,
              "trial_or_checkpoint_started": False,
              "seed_rng_sampling_or_source_identity_changed": False,
              "main_modified": False,
              "merge_or_release": False,
          }
          Path("scope-metadata.json").write_text(json.dumps(scope, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Install declared test dependencies
        id: deps
        run: python -m pip install -r requirements.txt

      - name: Run focused synthetic regression tests
        id: tests
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_stage13_assembler.py::test_assemble_185_sheets_and_five_representative_roles \
            tests/test_stage13_assembler.py::test_loss_and_max_case_selection_matches_normative_decision \
            tests/test_stage13_assembler.py::test_max_case_without_positive_equity_is_undefined_business_rule \
            tests/test_stage13_assembler.py::test_incorrect_recorded_representative_trial_id_is_rejected \
            tests/test_excel_builder_adaptive_mode.py \
            tests/test_excel_builder_legacy_compat.py 2>&1 | tee pytest.log

      - name: Generate and audit synthetic demo workbook
        id: synthetic_audit
        if: ${{ always() && steps.deps.outcome == 'success' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, json, runpy
          from pathlib import Path
          from openpyxl import load_workbook
          from scripts.stage13_assemble import assemble_workbook, _validate_representatives

          ns = runpy.run_path("tests/test_stage13_assembler.py")
          demo_data = ns["demo_data"]
          data = demo_data()
          _validate_representatives(data, mode="demo")

          strict_checks = []
          for bad in (True, 1.0, "1"):
              case = demo_data()
              case["representatives_by_scenario"]["C100_G100"]["Loss"]["summary"]["trial_id"] = bad
              try:
                  _validate_representatives(case, mode="demo")
              except RuntimeError as exc:
                  assert str(exc).startswith("REPRESENTATIVE_PAYLOAD_TRIAL_MISMATCH: C100_G100/Loss"), str(exc)
                  strict_checks.append({"field": "summary.trial_id", "rejected_value_type": type(bad).__name__})
              else:
                  raise AssertionError(f"non-int summary trial_id accepted: {bad!r}")

          for bad in (True, 1.0, "1"):
              case = demo_data()
              case["representatives_by_scenario"]["C100_G100"]["Loss"]["daily"][0]["trial_id"] = bad
              try:
                  _validate_representatives(case, mode="demo")
              except RuntimeError as exc:
                  assert str(exc).startswith("REPRESENTATIVE_DAILY_TRIAL_MISMATCH: C100_G100/Loss"), str(exc)
                  strict_checks.append({"field": "daily.trial_id", "rejected_value_type": type(bad).__name__})
              else:
                  raise AssertionError(f"non-int daily trial_id accepted: {bad!r}")

          output = Path("stage13_synthetic_demo.xlsx")
          result = assemble_workbook(data, output, mode="demo")
          assert result.get("success") is True, result
          assert result.get("sheets_count") == 185, result
          assert result.get("excel_errors") == 0, result
          assert result.get("formula_cells") == 0, result

          wb = load_workbook(output, data_only=False, read_only=True)
          assert len(wb.sheetnames) == 185, len(wb.sheetnames)
          ws = wb["REPRESENTATIVE_CASES"]
          summaries = [
              tuple(row) for row in ws.iter_rows(min_row=2, values_only=True)
              if row[0] in ns["FOCUS_SCENARIOS"] and row[2] == "SUMMARY"
          ]
          roles = sorted({row[1] for row in summaries})
          assert len(summaries) == 25, len(summaries)
          assert roles == ["Loss Case", "Max Case", "P10", "P50", "P90"], roles
          formula_or_error_cells = 0
          for sheet in wb.worksheets:
              for row in sheet.iter_rows():
                  for cell in row:
                      if cell.data_type in {"f", "e"}:
                          formula_or_error_cells += 1
          wb.close()
          assert formula_or_error_cells == 0, formula_or_error_cells

          h = hashlib.sha256()
          with output.open("rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          audit = {
              "status": "SYNTHETIC_DEMO_ONLY",
              "tested_sha": __import__("os").environ.get("GITHUB_SHA"),
              "assemble_result": result,
              "workbook_sha256": h.hexdigest(),
              "workbook_size_bytes": output.stat().st_size,
              "sheet_count": 185,
              "representative_summary_rows": len(summaries),
              "representative_roles": roles,
              "formula_or_error_cells": formula_or_error_cells,
              "strict_trial_id_rejections": strict_checks,
              "canonical_data_read": False,
              "production_or_historical_payloads_read": False,
              "monte_carlo_started": False,
              "trial_or_checkpoint_started": False,
          }
          Path("synthetic_audit.json").write_text(json.dumps(audit, indent=2, sort_keys=True, default=str) + "\n", encoding="utf-8")
          PY

      - name: Upload bounded verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage13-synthetic-compat-${{ github.sha }}
          path: |
            pytest.log
            stage13_synthetic_demo.xlsx
            synthetic_audit.json
            scope-metadata.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail closed if verification did not pass
        if: ${{ always() }}
        env:
          DEPENDENCIES_OUTCOME: ${{ steps.deps.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SYNTHETIC_AUDIT_OUTCOME: ${{ steps.synthetic_audit.outcome }}
        run: |
          test "$DEPENDENCIES_OUTCOME" = "success"
          test "$TESTS_OUTCOME" = "success"
          test "$SYNTHETIC_AUDIT_OUTCOME" = "success"
