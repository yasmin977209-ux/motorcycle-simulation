name: cp-stability-policy-verify

on:
  push:
    branches:
      - "tmp/cp-stability-policy-impl-20261017"
    paths:
      - "constants.py"
      - "run_batch.py"
      - "scripts/stage7_stability.py"
      - ".github/workflows/stage7-full-run.yml"
      - ".github/workflows/stage1-verification.yml"
      - "tests/test_stage1.py"
      - "tests/test_run_batch.py"
      - "tests/test_stage7_authoring.py"
      - "tests/test_stage7_stability.py"

permissions:
  contents: read

jobs:
  verify-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-stability-policy-impl-20261017
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository dependencies
        timeout-minutes: 5
        run: python -m pip install -r requirements.txt
      - name: Compile source and validate YAML / embedded orchestrator
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q constants.py run_batch.py scripts/stage7_stability.py
          python - <<'PY'
          import ast
          from pathlib import Path
          import re
          import yaml

          for name in (
              ".github/workflows/stage7-full-run.yml",
              ".github/workflows/stage1-verification.yml",
          ):
              with Path(name).open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"YAML_PARSE_PASS={name}")

          workflow = yaml.safe_load(
              Path(".github/workflows/stage7-full-run.yml").read_text(encoding="utf-8")
          )
          jobs = workflow["jobs"]
          source = jobs["matrix-simulation"]["steps"]
          step = next(item for item in source if item.get("name") == "Adaptive scenario orchestration")
          script = step["run"]
          script_lines = script.splitlines()
          start = next(
              (index for index, line in enumerate(script_lines)
               if line.strip() == "cat > /tmp/stage7_orchestrator.py <<'PY'"),
              None,
          )
          if start is None:
              raise AssertionError("embedded Stage 7 orchestrator heredoc not found")
          stop = next(
              (index for index in range(start + 1, len(script_lines))
               if script_lines[index].strip() == "PY"),
              None,
          )
          if stop is None:
              raise AssertionError("embedded Stage 7 Python heredoc terminator not found")
          embedded_python = "\n".join(script_lines[start + 1:stop])
          ast.parse(embedded_python, filename="stage7-full-run.yml:adaptive-orchestration")
          print("EMBEDDED_STAGE7_AST_PASS")
          triggers = workflow.get("on", workflow.get(True, {}))
          assert triggers["push"]["branches"] == ["tmp/cp-stability-policy-impl-20261017"]
          assert "workflow_dispatch" not in triggers
          assert workflow["permissions"] == {"contents": "read"}
          assert all(job.get("timeout-minutes") for job in jobs.values())
          print("WORKFLOW_BOUNDARY_PASS")
          PY
      - name: Run focused deterministic regression suite
        id: pytest
        timeout-minutes: 6
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python -m pytest -q \
            tests/test_stage7_stability.py \
            tests/test_run_batch.py \
            tests/test_stage7_authoring.py \
            tests/test_stage1.py \
            --junitxml=policy-test-results.xml
      - name: Write post-test evidence manifest
        if: always()
        timeout-minutes: 2
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
          TEST_CONCLUSION: ${{ steps.pytest.conclusion }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          paths = [
              "constants.py",
              "run_batch.py",
              "scripts/stage7_stability.py",
              ".github/workflows/stage7-full-run.yml",
              ".github/workflows/stage1-verification.yml",
              "tests/test_stage1.py",
              "tests/test_run_batch.py",
              "tests/test_stage7_authoring.py",
              "tests/test_stage7_stability.py",
              "policy-test-results.xml",
          ]
          files = {}
          for name in paths:
              path = Path(name)
              if not path.is_file():
                  files[name] = {"exists": False}
                  continue
              data = path.read_bytes()
              files[name] = {
                  "exists": True,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          manifest = {
              "purpose": "static and deterministic regression only; no Monte Carlo run",
              "tested_sha": head,
              "test_outcome": os.environ.get("TEST_OUTCOME"),
              "test_conclusion": os.environ.get("TEST_CONCLUSION"),
              "production_simulation_executed": False,
              "source_sha_changed": False,
              "rng_or_seed_changed": False,
              "files": files,
          }
          Path("cp-stability-policy-evidence.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload inspectable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-stability-policy-test-evidence
          path: |
            cp-stability-policy-evidence.json
            policy-test-results.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce test result
        if: always()
        timeout-minutes: 1
        env:
          TEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          test "$TEST_OUTCOME" = "success" || {
            echo "FOCUSED_TESTS_FAILED=$TEST_OUTCOME" >&2
            exit 1
          }
