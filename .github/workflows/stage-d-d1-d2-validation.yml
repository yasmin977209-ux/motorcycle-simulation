name: Stage D1-D2 Source Validation
on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths-ignore:
      - tmp/reference-payload/**
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  d1-source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone current Stage D branch and validate exact remote head
        run: |
          set -euo pipefail
          git clone --depth 1 --branch tmp/d1-rebuild-20261101 https://github.com/yasmin977209-ux/motorcycle-simulation.git d1
          cd d1
          python -m pip install --upgrade pytest pyarrow requests
      - name: Download and cryptographically verify the three pinned historical artifacts
        working-directory: d1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, requests
          repo = "yasmin977209-ux/motorcycle-simulation"
          pins = {
              12852969854: (9357996, "ec05a69ae8968585decf83cf0716d56c264f47f86187cfd3cf53b11f52ca2e54", "aggregate.zip"),
              12998778418: (310827203, "403371cc8eb12880dda05529b4c83dd675bfa609e8680c09d35efa729c5b5aeb", "full-logging.zip"),
              12630457193: (361733, "c977d1cbb5204919eadc72358533f77cdbbc239902bcd6f921bf1a915a716e79", "c100.zip"),
          }
          headers = {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Accept": "application/vnd.github+json"}
          out = pathlib.Path("stage-d-artifacts")
          out.mkdir(exist_ok=True)
          for artifact_id, (expected_size, expected_sha, filename) in pins.items():
              meta = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}", headers=headers, timeout=60)
              meta.raise_for_status()
              item = meta.json()
              if item.get("expired") or item.get("size_in_bytes") != expected_size or item.get("digest") != f"sha256:{expected_sha}":
                  raise SystemExit(f"ARTIFACT_METADATA_PIN_MISMATCH:{artifact_id}")
              response = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip",
                                      headers=headers, allow_redirects=False, timeout=60)
              if response.status_code not in (301, 302, 303, 307, 308) or not response.headers.get("Location"):
                  raise SystemExit(f"ARTIFACT_DOWNLOAD_REDIRECT_MISSING:{artifact_id}:{response.status_code}")
              target = out / filename
              digest = hashlib.sha256()
              size = 0
              with requests.get(response.headers["Location"], stream=True, timeout=180) as download:
                  download.raise_for_status()
                  with target.open("wb") as stream:
                      for chunk in download.iter_content(1024 * 1024):
                          if chunk:
                              stream.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)
              if size != expected_size or digest.hexdigest() != expected_sha:
                  raise SystemExit(f"ARTIFACT_BYTES_PIN_MISMATCH:{artifact_id}:{size}:{digest.hexdigest()}")
              print(f"VERIFIED_ARTIFACT id={artifact_id} bytes={size} sha256={digest.hexdigest()}")
          PY
      - name: Compile source and run unit plus real artifact integration tests
        working-directory: d1
        env:
          STAGE_D_AGGREGATE: stage-d-artifacts/aggregate.zip
          STAGE_D_FULL_LOGGING: stage-d-artifacts/full-logging.zip
          STAGE_D_C100: stage-d-artifacts/c100.zip
        run: |
          set -euo pipefail
          python -m compileall -q scripts/s6_artifact_reader.py scripts/s6_deliverables_model.py scripts/s6_manifest_resolver.py scripts/s6_deliverables_builder.py scripts/s6_number_registry.py scripts/s6_validate_representatives.py tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
          python -m pytest -q -rs tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
      - name: Assert tested SHA is still the exact live branch HEAD
        working-directory: d1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)"
