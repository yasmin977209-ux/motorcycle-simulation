name: Stage13 Final Sample Replay

on:
  push:
    branches:
      - tmp/stage13.3-final-excel-20261010

permissions:
  contents: read
  actions: read

jobs:
  acceptance:
    if: ${{ !contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      SOURCE_SHA: f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify pinned engine/RNG identity
        id: source_integrity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          for file in constants.py entities.py dateutils.py rng.py accounting.py closure.py collection.py guarantee.py partner_equity.py friday.py settlement.py state_machine.py daily_engine.py monte_carlo.py; do
            git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- "$file"
          done
          python -m compileall -q scripts/stage13_prepare_test_fixtures.py scripts/stage13_validate_acceptance.py scripts/stage13_rerun_sample.py scripts/stage13_scenario_worker.py scripts/stage13_assemble.py
          mkdir -p results_stage13/acceptance
          echo "ENGINE_AND_RNG_SOURCE_UNCHANGED=PASS"
      - name: Generate run-local test fixtures
        id: fixtures
        run: python scripts/stage13_prepare_test_fixtures.py
      - name: Run complete pytest suite with JUnit evidence
        id: acceptance_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=results_stage13/acceptance/pytest.xml > results_stage13/acceptance/pytest_stdout.txt 2>&1
          code=$?
          cat results_stage13/acceptance/pytest_stdout.txt
          printf '%s\n' "$code" > results_stage13/acceptance/pytest_exit_code.txt
          exit "$code"
      - name: Build explicit 163-test acceptance report
        id: validate_acceptance
        if: always() && steps.fixtures.outcome == 'success' && steps.acceptance_tests.outcome != 'skipped'
        run: |
          python scripts/stage13_validate_acceptance.py \
            --junit results_stage13/acceptance/pytest.xml \
            --output results_stage13/acceptance/validation_163.json \
            --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA" --source-sha "$SOURCE_SHA"
      - name: Gate source, fixtures and acceptance
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source_integrity.outcome }}
          FIXTURE_OUTCOME: ${{ steps.fixtures.outcome }}
          TESTS_OUTCOME: ${{ steps.acceptance_tests.outcome }}
          REPORT_OUTCOME: ${{ steps.validate_acceptance.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'SOURCE=%s FIXTURES=%s TESTS=%s REPORT=%s\n' "$SOURCE_OUTCOME" "$FIXTURE_OUTCOME" "$TESTS_OUTCOME" "$REPORT_OUTCOME"
          [[ "$SOURCE_OUTCOME" == success && "$FIXTURE_OUTCOME" == success && "$TESTS_OUTCOME" == success && "$REPORT_OUTCOME" == success ]]
          gate=$(python -c "import json; print(json.load(open('results_stage13/acceptance/validation_163.json', encoding='utf-8')).get('status','MISSING'))")
          echo "ACCEPTANCE_163_STATUS=$gate"
          [[ "$gate" == PASS ]]
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-acceptance-evidence
          path: |
            results_stage13/acceptance/
            results_stage5/fixture_identity.json
          if-no-files-found: warn
          retention-days: 30

  sample:
    if: ${{ !contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
    needs: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    env:
      PYTHONPATH: .
      SOURCE_SHA: f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b
      SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Prepare isolated paths
        run: mkdir -p results_stage13/previous-checkpoints results_stage13/checkpoints/"$SCENARIO" results_stage13/scenarios/"$SCENARIO"
      - name: Download checkpoint for exact same-run resume if present
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: stage13-checkpoint-${{ matrix.scenario }}
          path: results_stage13/previous-checkpoints
      - name: Check engine identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          for file in constants.py entities.py dateutils.py rng.py accounting.py closure.py collection.py guarantee.py partner_equity.py friday.py settlement.py state_machine.py daily_engine.py monte_carlo.py; do
            git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- "$file"
          done
      - name: Run 25 identity-bound sample trials with checkpoints
        run: |
          python scripts/stage13_scenario_worker.py \
            --scenario "$SCENARIO" \
            --output-root results_stage13/scenarios \
            --checkpoint-root results_stage13/checkpoints \
            --resume-dir results_stage13/previous-checkpoints \
            --source-sha "$SOURCE_SHA"
      - name: Upload resumable checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-checkpoint-${{ matrix.scenario }}
          path: results_stage13/checkpoints/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 30
          overwrite: true
      - name: Upload completed scenario package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-sample-${{ matrix.scenario }}
          path: results_stage13/scenarios/${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 30

  assemble:
    needs: [acceptance, sample]
    if: ${{ always() && (needs.acceptance.result == 'success' || contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]')) && (needs.sample.result == 'success' || contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      SOURCE_SHA: f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b
      SAMPLE_RUN_ID: ${{ contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') && '38005557997' || github.run_id }}
      SAMPLE_HEAD_SHA: ${{ contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') && '648b5315da1ef46146226d7982020a88c4905dcb' || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Verify source code matches the pinned completed sample cohort
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SAMPLE_HEAD_SHA^{commit}"
          if [[ "$SAMPLE_RUN_ID" != "$GITHUB_RUN_ID" || "$SAMPLE_HEAD_SHA" != "$GITHUB_SHA" ]]; then
            for file in constants.py entities.py dateutils.py rng.py accounting.py closure.py collection.py guarantee.py partner_equity.py friday.py settlement.py state_machine.py daily_engine.py monte_carlo.py requirements.txt scripts/stage13_scenario_worker.py scripts/stage13_rerun_sample.py scripts/stage13_prepare_test_fixtures.py scripts/stage13_validate_acceptance.py scripts/stage13_assemble.py scripts/excel_builder.py tests; do
              git diff --exit-code "$SAMPLE_HEAD_SHA" "$GITHUB_SHA" -- "$file"
            done
          fi
      - name: Download the 25 scenario packages from the pinned completed run
        if: ${{ contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
        uses: actions/download-artifact@v4
        with:
          pattern: stage13-sample-*
          path: results_stage13/scenario-artifacts
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: 38005557997
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the 25 scenario packages from this run
        if: ${{ !contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
        uses: actions/download-artifact@v4
        with:
          pattern: stage13-sample-*
          path: results_stage13/scenario-artifacts
          merge-multiple: false
      - name: Download pinned acceptance evidence from completed sample run
        if: ${{ contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
        uses: actions/download-artifact@v4
        with:
          name: stage13-acceptance-evidence
          path: results_stage13/acceptance-artifacts
          repository: ${{ github.repository }}
          run-id: 38005557997
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download acceptance evidence from this run
        if: ${{ !contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
        uses: actions/download-artifact@v4
        with:
          name: stage13-acceptance-evidence
          path: results_stage13/acceptance-artifacts
      - name: Verify pinned engine identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"
          for file in constants.py entities.py dateutils.py rng.py accounting.py closure.py collection.py guarantee.py partner_equity.py friday.py settlement.py state_machine.py daily_engine.py monte_carlo.py; do
            git diff --exit-code "$SOURCE_SHA" "$GITHUB_SHA" -- "$file"
          done
      - name: Build workbook and independently execute all 500 comparisons
        run: |
          python scripts/stage13_assemble.py \
            --scenario-artifacts results_stage13/scenario-artifacts \
            --acceptance-artifacts results_stage13/acceptance-artifacts \
            --output-dir results_stage13/final \
            --run-id "$SAMPLE_RUN_ID" --head-sha "$SAMPLE_HEAD_SHA"
      - name: Record recovery lineage for reused completed trials
        if: ${{ contains(github.event.head_commit.message, '[stage13-reassemble-only:38005557997]') }}
        env:
          SAMPLE_RUN_ID: ${{ env.SAMPLE_RUN_ID }}
          SAMPLE_HEAD_SHA: ${{ env.SAMPLE_HEAD_SHA }}
          ASSEMBLY_RUN_ID: ${{ github.run_id }}
          ASSEMBLY_HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path("results_stage13/final")
          identity_path = output_dir / "dataset_identity.json"
          definition_path = output_dir / "20point_gate_definition.json"
          report_path = output_dir / "20point_gate_report.json"
          workbook_path = output_dir / "Stage13_Sample_Results_EN.xlsx"

          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          definition = json.loads(definition_path.read_text(encoding="utf-8"))
          gate_report = json.loads(report_path.read_text(encoding="utf-8"))

          expected_result_sha = "ba6f1e0dcf6daad1a4e5dcf07c01ff26b8dbac79320b4dcc2a3d3514e276c772"
          expected_workbook_sha = "26452c0a7968a66057ac364e38cfdd188fd612857f1f1d1d82fb5251058c1ef0"
          cohort_id = "STAGE13_SAMPLE_TRIAL_IDS_26_50_V2"
          expected_trial_ids = list(range(26, 51))

          if identity.get("cohort_id") != cohort_id:
              raise SystemExit(f"RECOVERY_COHORT_ID_FAIL: {identity.get('cohort_id')!r}")
          if identity.get("source_sha") != "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b":
              raise SystemExit(f"RECOVERY_SOURCE_SHA_FAIL: {identity.get('source_sha')!r}")
          if str(identity.get("run_id")) != "38005557997":
              raise SystemExit(f"RECOVERY_SOURCE_RUN_ID_FAIL: {identity.get('run_id')!r}")
          if identity.get("run_head_sha") != "648b5315da1ef46146226d7982020a88c4905dcb":
              raise SystemExit(f"RECOVERY_SOURCE_HEAD_SHA_FAIL: {identity.get('run_head_sha')!r}")
          if identity.get("status") != "ASSEMBLED_PENDING_20POINT_GATE":
              raise SystemExit(f"RECOVERY_PRE_NORMALIZATION_STATUS_FAIL: {identity.get('status')!r}")
          if identity.get("scenario_count") != 25 or identity.get("trial_result_count") != 625:
              raise SystemExit("RECOVERY_TRIAL_SCOPE_FAIL")
          if identity.get("unique_scenario_trial_pairs") != 625:
              raise SystemExit("RECOVERY_UNIQUE_TRIAL_PAIR_COUNT_FAIL")
          if identity.get("trial_results_fingerprint_sha256") != expected_result_sha:
              raise SystemExit("RECOVERY_TRIAL_RESULT_FINGERPRINT_FAIL")
          if identity.get("sampling", {}).get("trial_ids") != expected_trial_ids:
              raise SystemExit(f"RECOVERY_TRIAL_ID_RANGE_FAIL: {identity.get('sampling', {}).get('trial_ids')!r}")
          if definition.get("definition_status") != "DEFINED" or "status" in definition:
              raise SystemExit("RECOVERY_GATE_DEFINITION_STATUS_FAIL")
          if gate_report.get("cohort_id") != cohort_id or gate_report.get("source_sha") != identity.get("source_sha"):
              raise SystemExit("RECOVERY_GATE_REPORT_IDENTITY_FAIL")
          if str(gate_report.get("run_id")) != "38005557997" or gate_report.get("run_head_sha") != "648b5315da1ef46146226d7982020a88c4905dcb":
              raise SystemExit("RECOVERY_GATE_REPORT_PRODUCER_IDENTITY_FAIL")
          if "status" not in gate_report or "result" in gate_report or "execution_status" in gate_report:
              raise SystemExit("RECOVERY_GATE_REPORT_SHAPE_FAIL")

          gate_result = gate_report["status"]
          comparisons = gate_report.get("comparisons")
          gates = gate_report.get("gates")
          scope = gate_report.get("scope", {})
          workbook_summary = gate_report.get("workbook", {})
          workbook_sha = hashlib.sha256(workbook_path.read_bytes()).hexdigest() if workbook_path.is_file() else None
          matched_count = sum(item.get("exact_match") is True for item in comparisons) if isinstance(comparisons, list) else -1

          if gate_result != "PASS":
              raise SystemExit(f"STAGE13_GATE_RESULT_NOT_PASS: {gate_result!r}")
          if not isinstance(gates, dict) or not gates or not all(value is True for value in gates.values()):
              raise SystemExit("STAGE13_GATE_PREREQUISITE_FAIL")
          if not isinstance(comparisons, list) or len(comparisons) != 500 or matched_count != 500:
              raise SystemExit(f"STAGE13_500_POINT_GATE_FAIL: matched={matched_count}; expected=500; actual={len(comparisons) if isinstance(comparisons, list) else 'MISSING'}")
          if scope.get("expected_comparison_count") != 500 or scope.get("actual_comparison_count") != 500:
              raise SystemExit(f"STAGE13_COMPARISON_SCOPE_FAIL: {scope!r}")
          if scope.get("trial_count") != 625 or scope.get("trial_ids_per_scenario") != expected_trial_ids:
              raise SystemExit(f"STAGE13_REPORT_TRIAL_SCOPE_FAIL: {scope!r}")
          if workbook_sha != expected_workbook_sha or workbook_summary.get("sha256") != expected_workbook_sha:
              raise SystemExit(f"STAGE13_WORKBOOK_SHA_FAIL: actual={workbook_sha!r}; report={workbook_summary.get('sha256')!r}")
          if workbook_summary.get("sheets") != 185:
              raise SystemExit(f"STAGE13_WORKBOOK_SHEETS_FAIL: {workbook_summary.get('sheets')!r}")
          if workbook_summary.get("excel_error_cells") != 0:
              raise SystemExit(f"STAGE13_WORKBOOK_ERROR_CELLS_FAIL: {workbook_summary.get('excel_error_cells')!r}")
          if workbook_summary.get("formula_cells") != 0:
              raise SystemExit(f"STAGE13_WORKBOOK_FORMULA_CELLS_FAIL: {workbook_summary.get('formula_cells')!r}")

          gate_executed_at = datetime.now(timezone.utc).isoformat(timespec="microseconds").replace("+00:00", "Z")
          gate_report.pop("status")
          gate_report["result"] = gate_result
          gate_report["execution_status"] = "COMPLETED"
          identity.pop("status")
          identity.update({
              "assembly_status": "ASSEMBLED",
              "gate_definition_status": definition["definition_status"],
              "gate_execution_result": gate_result,
              "gate_executed_at": gate_executed_at,
          })
          report_path.write_text(json.dumps(gate_report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          identity_path.write_text(json.dumps(identity, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "GATE_METADATA_NORMALIZATION": "PASS",
              "ASSEMBLY_STATUS": identity["assembly_status"],
              "GATE_DEFINITION_STATUS": identity["gate_definition_status"],
              "GATE_EXECUTION_RESULT": identity["gate_execution_result"],
              "GATE_EXECUTED_AT": gate_executed_at,
              "POINTS_MATCHED": matched_count,
              "POINTS_EXPECTED": 500,
              "TRIAL_RESULTS_FINGERPRINT_SHA256": identity["trial_results_fingerprint_sha256"],
              "WORKBOOK_SHA256": workbook_sha,
          }, ensure_ascii=False, sort_keys=True))
          cohort_id = "STAGE13_SAMPLE_TRIAL_IDS_26_50_V2"
          trial_ids = list(range(26, 51))
          stability = "diagnostic 25-trial cohort; no Gate A/B statistical status inferred"
          sampling_policy = "fresh, one-based deterministic keys 26..50; replaces no canonical trials"
          sampling = {
              "cohort_id": cohort_id,
              "policy": sampling_policy,
              "trial_ids": trial_ids,
              "trials_per_scenario": 25,
              "scenario_count": 25,
          }

          identity_path = output_dir / "dataset_identity.json"
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          identity["sampling"] = sampling
          identity["stability"] = stability
          for scenario_identity in identity.get("scenario_identities", {}).values():
              scenario_identity["sampling"] = sampling_policy
              scenario_identity["stability"] = stability
          identity_path.write_text(
              json.dumps(identity, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          for scenario_identity_path in sorted((output_dir / "dataset").glob("*/dataset_identity.json")):
              scenario_identity = json.loads(scenario_identity_path.read_text(encoding="utf-8"))
              scenario_identity["sampling"] = sampling_policy
              scenario_identity["stability"] = stability
              scenario_identity_path.write_text(
                  json.dumps(scenario_identity, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )

          scenario_manifest_paths = sorted((output_dir / "dataset").glob("*/artifact_manifest.json"))
          if len(scenario_manifest_paths) != 25:
              raise SystemExit(f"SCENARIO_ARTIFACT_MANIFEST_COUNT_FAIL: {len(scenario_manifest_paths)}")
          for scenario_manifest_path in scenario_manifest_paths:
              scenario_root = scenario_manifest_path.parent
              scenario_manifest = json.loads(scenario_manifest_path.read_text(encoding="utf-8"))
              scenario_hashes = {}
              for path in sorted(scenario_root.rglob("*")):
                  if path.is_file() and path != scenario_manifest_path:
                      scenario_hashes[path.relative_to(scenario_root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              scenario_manifest["file_hashes_sha256"] = scenario_hashes
              scenario_manifest["file_count_excluding_manifest"] = len(scenario_hashes)
              scenario_manifest_path.write_text(
                  json.dumps(scenario_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
              )
              verified_scenario_manifest = json.loads(scenario_manifest_path.read_text(encoding="utf-8"))
              if scenario_manifest_path.name in verified_scenario_manifest["file_hashes_sha256"]:
                  raise SystemExit(f"SCENARIO_ARTIFACT_MANIFEST_SELF_HASH_FORBIDDEN: {scenario_root.name}")
              for relative_path, expected_hash in verified_scenario_manifest["file_hashes_sha256"].items():
                  payload_path = scenario_root / relative_path
                  if not payload_path.is_file() or hashlib.sha256(payload_path.read_bytes()).hexdigest() != expected_hash:
                      raise SystemExit(f"SCENARIO_ARTIFACT_MANIFEST_HASH_FAIL: {scenario_root.name}/{relative_path}")
              listed_scenario_file_count = len(verified_scenario_manifest["file_hashes_sha256"])
              actual_scenario_file_count = sum(1 for path in scenario_root.rglob("*") if path.is_file() and path != scenario_manifest_path)
              if listed_scenario_file_count != verified_scenario_manifest["file_count_excluding_manifest"] or actual_scenario_file_count != verified_scenario_manifest["file_count_excluding_manifest"]:
                  raise SystemExit(f"SCENARIO_ARTIFACT_MANIFEST_COUNT_MISMATCH: {scenario_root.name}; listed={listed_scenario_file_count}; actual={actual_scenario_file_count}; manifest={verified_scenario_manifest['file_count_excluding_manifest']}")
          print("SCENARIO_ARTIFACT_MANIFESTS_REBUILT_AND_VERIFIED=25")

          global_manifest_path = output_dir / "manifest.json"
          global_manifest = json.loads(global_manifest_path.read_text(encoding="utf-8"))
          global_manifest["sampling"] = sampling
          global_manifest["stability"] = stability
          global_manifest_path.write_text(
              json.dumps(global_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          recovery = {
              "status": "REASSEMBLED_EXISTING_DATASET_NO_TRIALS_RERUN",
              "sample_run_id": os.environ["SAMPLE_RUN_ID"],
              "sample_head_sha": os.environ["SAMPLE_HEAD_SHA"],
              "assembly_run_id": os.environ["ASSEMBLY_RUN_ID"],
              "assembly_head_sha": os.environ["ASSEMBLY_HEAD_SHA"],
              "scenario_artifacts_source_run_id": os.environ["SAMPLE_RUN_ID"],
              "acceptance_evidence_source_run_id": os.environ["SAMPLE_RUN_ID"],
              "cohort_id": cohort_id,
              "trial_ids_per_scenario": [26, 50],
              "stability": stability,
          }
          recovery_path = output_dir / "recovery_execution.json"
          recovery_path.write_text(
              json.dumps(recovery, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )

          manifest_path = output_dir / "artifact_manifest.json"
          artifact_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          identity = json.loads(identity_path.read_text(encoding="utf-8"))
          definition = json.loads(definition_path.read_text(encoding="utf-8"))
          gate_report = json.loads(report_path.read_text(encoding="utf-8"))
          status_summary = {
              "assembly_status": identity.get("assembly_status"),
              "gate_definition_status": identity.get("gate_definition_status"),
              "gate_execution_result": identity.get("gate_execution_result"),
              "gate_executed_at": identity.get("gate_executed_at"),
          }
          if status_summary["assembly_status"] != "ASSEMBLED" or status_summary["gate_definition_status"] != definition.get("definition_status") or status_summary["gate_execution_result"] != gate_report.get("result") or gate_report.get("execution_status") != "COMPLETED" or not status_summary["gate_executed_at"]:
              raise SystemExit(f"RECOVERY_STATUS_CONSISTENCY_FAIL: {status_summary!r}")
          if "status" in identity or "status" in definition or "status" in gate_report:
              raise SystemExit("RECOVERY_LEGACY_AMBIGUOUS_STATUS_REMAINS")
          artifact_manifest.pop("20point_gate_status", None)
          artifact_manifest.update(status_summary)
          hashes = {}
          for path in sorted(output_dir.rglob("*")):
              if path.is_file() and path != manifest_path:
                  hashes[path.relative_to(output_dir).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          artifact_manifest["file_hashes_sha256"] = hashes
          artifact_manifest["file_count_excluding_manifest"] = len(hashes)
          artifact_manifest["sampling"] = sampling
          artifact_manifest["stability"] = stability
          manifest_path.write_text(
              json.dumps(artifact_manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          verified_artifact_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          for relative_path, expected_hash in verified_artifact_manifest["file_hashes_sha256"].items():
              payload_path = output_dir / relative_path
              if not payload_path.is_file() or hashlib.sha256(payload_path.read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f"FINAL_ARTIFACT_MANIFEST_HASH_FAIL: {relative_path}")
          if manifest_path.name in verified_artifact_manifest["file_hashes_sha256"]:
              raise SystemExit("FINAL_ARTIFACT_MANIFEST_SELF_HASH_FORBIDDEN")
          listed_file_count = len(verified_artifact_manifest["file_hashes_sha256"])
          actual_file_count = sum(1 for path in output_dir.rglob("*") if path.is_file() and path != manifest_path)
          if listed_file_count != verified_artifact_manifest["file_count_excluding_manifest"] or actual_file_count != verified_artifact_manifest["file_count_excluding_manifest"]:
              raise SystemExit(f"FINAL_ARTIFACT_MANIFEST_COUNT_MISMATCH: listed={listed_file_count}; actual={actual_file_count}; manifest={verified_artifact_manifest['file_count_excluding_manifest']}")
          if "20point_gate_status" in verified_artifact_manifest:
              raise SystemExit("FINAL_ARTIFACT_MANIFEST_LEGACY_GATE_STATUS_REMAINS")
          for key, value in status_summary.items():
              if verified_artifact_manifest.get(key) != value:
                  raise SystemExit(f"FINAL_ARTIFACT_MANIFEST_STATUS_MISMATCH: {key}")
          if identity.get("gate_execution_result") != gate_report.get("result") or gate_report.get("execution_status") != "COMPLETED" or definition.get("definition_status") != "DEFINED":
              raise SystemExit("FINAL_GATE_STATUS_SEMANTICS_MISMATCH")
          print(json.dumps({
              "FINAL_ARTIFACT_MANIFEST_INTEGRITY": "PASS",
              "FILES": listed_file_count,
              "ASSEMBLY_STATUS": verified_artifact_manifest["assembly_status"],
              "GATE_DEFINITION_STATUS": verified_artifact_manifest["gate_definition_status"],
              "GATE_EXECUTION_RESULT": verified_artifact_manifest["gate_execution_result"],
              "GATE_EXECUTED_AT": verified_artifact_manifest["gate_executed_at"],
          }, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload workbook and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-sample-final-evidence
          path: results_stage13/final/
          if-no-files-found: warn
          retention-days: 30
