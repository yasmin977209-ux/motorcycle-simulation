name: Temporary CP Gate A C030_G030 N=2400 checkpoint

on:
  push:
    branches:
      - "tmp/cp-gatea-c030-n2400-20261015"
    paths:
      - "scripts/cp_gatea_c030_n2400_checkpoint.py"

permissions:
  contents: read
  actions: read

jobs:
  checkpoint:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
      SOURCE_COMMIT: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
      MASTER_SEED: "20270101"
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout exact checkpoint code head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence directory
        run: mkdir -p results_gatea

      - name: Fetch and pin approved model source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${SOURCE_COMMIT}"
          git worktree add --detach "${RUNNER_TEMP}/pinned-model-source" "${SOURCE_COMMIT}"
          test "$(git -C "${RUNNER_TEMP}/pinned-model-source" rev-parse HEAD)" = "${SOURCE_COMMIT}"
          test -z "$(git -C "${RUNNER_TEMP}/pinned-model-source" status --porcelain --untracked-files=all)"
          printf 'PINNED_SOURCE_COMMIT=%s\n' "$(git -C "${RUNNER_TEMP}/pinned-model-source" rev-parse HEAD)"

      - name: Install dependencies from pinned source
        run: python -m pip install -r "${RUNNER_TEMP}/pinned-model-source/requirements.txt"

      - name: Verify runtime import origins before checkpoint
        run: |
          set -euo pipefail
          python scripts/verify_gatea_source_identity.py \
            --source-root "${RUNNER_TEMP}/pinned-model-source" \
            --output-file results_gatea/source_identity.json

      - name: Execute one-time C030_G030 trial IDs 1201..2400
        timeout-minutes: 38
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}${PYTHONPATH:+:${PYTHONPATH}}"
          python scripts/cp_gatea_c030_n2400_checkpoint.py \
            --source-root "${RUNNER_TEMP}/pinned-model-source" \
            --output-dir results_gatea \
            --time-budget-seconds 2100

      - name: Print final checkpoint report
        if: always()
        shell: bash
        run: |
          if [ -f results_gatea/checkpoint_report.json ]; then
            cat results_gatea/checkpoint_report.json
          else
            echo "CHECKPOINT_REPORT_NOT_CREATED"
          fi
          if [ -f results_gatea/checkpoint_progress.json ]; then
            echo "CHECKPOINT_PROGRESS:"
            cat results_gatea/checkpoint_progress.json
          fi

      - name: Upload immutable checkpoint results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatea-c030-n2400-checkpoint-attempt-${{ github.run_attempt }}
          path: results_gatea/
          if-no-files-found: warn
          retention-days: 90
