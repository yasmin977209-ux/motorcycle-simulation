name: S6 explicit cohort identity contract (safe tests)
on:
  push:
    branches:
      - "fix/explicit-cohort-identity-20261108"
    paths:
      - "scripts/s6_daily_path_identity.py"
      - "scripts/s6_first_checkpoint.py"
      - "scripts/s4_c100_golden.py"
      - "scripts/s6_checkpoint_config.json"
      - "tests/test_s6_daily_path_identity_contract.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"
      - "requirements-lock-py311.txt"
      - "docs/experiments/NEW_SIMULATION_EXPERIMENT_PROTOCOL_2026-11-08.md"
      - "docs/experiments/NEW_SIMULATION_PREFLIGHT_REPORT_2026-11-08.md"
      - "docs/stage_d/SESSION_STATUS_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/stage_d/CONTINUITY_HANDOFF_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/PROJECT_CONTINUITY.md"
      - ".github/workflows/s6-explicit-cohort-identity-contract.yml"
  pull_request:
    branches:
      - "tmp/d1-rebuild-20261101"
    paths:
      - "scripts/s6_daily_path_identity.py"
      - "scripts/s6_first_checkpoint.py"
      - "scripts/s4_c100_golden.py"
      - "scripts/s6_checkpoint_config.json"
      - "tests/test_s6_daily_path_identity_contract.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"
      - "requirements-lock-py311.txt"
      - "docs/experiments/NEW_SIMULATION_EXPERIMENT_PROTOCOL_2026-11-08.md"
      - "docs/experiments/NEW_SIMULATION_PREFLIGHT_REPORT_2026-11-08.md"
      - "docs/stage_d/SESSION_STATUS_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/stage_d/CONTINUITY_HANDOFF_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/PROJECT_CONTINUITY.md"
      - ".github/workflows/s6-explicit-cohort-identity-contract.yml"
permissions:
  contents: read
jobs:
  explicit-identity-contract:
    name: Explicit identity and schema tests only (no Trial)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.18"
      - name: Pin pip and install exact dependency lock
        run: |
          python -m pip install --upgrade pip==26.2.2
          python -m pip install --only-binary=:all: -r requirements-lock-py311.txt
          python -m pip check
      - name: Compile identity validators
        run: python -m py_compile scripts/s6_daily_path_identity.py scripts/s6_first_checkpoint.py scripts/s4_c100_golden.py
      - name: Run isolated identity contract tests
        run: python -m pytest -q tests/test_s6_daily_path_identity_contract.py tests/test_s6_daily_balance_snapshot_schema.py
      - name: Confirm this job has no simulation invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/s6-explicit-cohort-identity-contract.yml").read_text(encoding="utf-8")
          forbidden = ("run_" + "single_trial", "run_trials_" + "parallel", "run_full_" + "trials")
          assert all(name not in workflow for name in forbidden)
          assert "pytest -q tests/test_s6_daily_path_identity_contract.py tests/test_s6_daily_balance_snapshot_schema.py" in workflow
          print("SIMULATION_TRIALS=NOT_EXECUTED")
          PY
