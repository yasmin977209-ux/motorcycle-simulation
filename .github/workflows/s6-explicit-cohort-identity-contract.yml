name: S6 explicit cohort identity contract (safe tests)
on:
  push:
    branches:
      - "fix/explicit-cohort-identity-20261108"
    paths:
      - "scripts/s6_daily_path_identity.py"
      - "scripts/s6_first_checkpoint.py"
      - "scripts/s4_c100_golden.py"
      - "scripts/s6_checkpoint_config.json"
      - "tests/test_s6_daily_path_identity_contract.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"
      - "requirements-lock-py311.txt"
      - "requirements-lock-py311-hashed.txt"
      - ".github/workflows/s6-isolated-execution.yml"
      - ".github/workflows/s6-security-scan.yml"
      - "tests/test_workflow_safety_contract.py"
      - "tests/test_s6_source_pin_separation.py"
      - "requirements-lock-py311-hashed.txt"
      - ".github/workflows/s6-isolated-execution.yml"
      - ".github/workflows/s6-security-scan.yml"
      - "tests/test_workflow_safety_contract.py"
      - "tests/test_s6_source_pin_separation.py"
      - "docs/experiments/NEW_SIMULATION_EXPERIMENT_PROTOCOL_2026-11-08.md"
      - "docs/experiments/NEW_SIMULATION_PREFLIGHT_REPORT_2026-11-08.md"
      - "docs/stage_d/SESSION_STATUS_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/stage_d/CONTINUITY_HANDOFF_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/PROJECT_CONTINUITY.md"
      - ".github/workflows/s6-explicit-cohort-identity-contract.yml"
  pull_request:
    branches:
      - "docs/new-simulation-protocol-20261108"
    paths:
      - "scripts/s6_daily_path_identity.py"
      - "scripts/s6_first_checkpoint.py"
      - "scripts/s4_c100_golden.py"
      - "scripts/s6_checkpoint_config.json"
      - "tests/test_s6_daily_path_identity_contract.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"
      - "requirements-lock-py311.txt"
      - "requirements-lock-py311-hashed.txt"
      - ".github/workflows/s6-isolated-execution.yml"
      - ".github/workflows/s6-security-scan.yml"
      - "tests/test_workflow_safety_contract.py"
      - "tests/test_s6_source_pin_separation.py"
      - "docs/experiments/NEW_SIMULATION_EXPERIMENT_PROTOCOL_2026-11-08.md"
      - "docs/experiments/NEW_SIMULATION_PREFLIGHT_REPORT_2026-11-08.md"
      - "docs/stage_d/SESSION_STATUS_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/stage_d/CONTINUITY_HANDOFF_2026-11-08_NEW_SIMULATION_PROTOCOL.md"
      - "docs/PROJECT_CONTINUITY.md"
      - ".github/workflows/s6-explicit-cohort-identity-contract.yml"
permissions:
  contents: read
jobs:
  explicit-identity-contract:
    name: Explicit identity and schema tests only (no Trial)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
      - name: Set up Python 3.11
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.18"
      - name: Pin pip and install exact dependency lock
        run: |
          python -m pip install --upgrade --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-lock-py311-hashed.txt
          python -m pip check
      - name: Generate platform-specific wheel SHA-256 lock artifact
        run: |
          set -euo pipefail
          rm -rf /tmp/s6-wheelhouse
          mkdir -p /tmp/s6-wheelhouse
          python -m pip download --only-binary=:all: --require-hashes --dest /tmp/s6-wheelhouse -r requirements-lock-py311-hashed.txt
          python - <<'PY'
          from pathlib import Path
          import hashlib
          from packaging.utils import canonicalize_name, parse_wheel_filename
          wheels = sorted(Path("/tmp/s6-wheelhouse").glob("*.whl"))
          if not wheels:
              raise SystemExit("NO_COMPATIBLE_WHEELS_DOWNLOADED")
          entries = {}
          for wheel in wheels:
              name, version, _, _ = parse_wheel_filename(wheel.name)
              key = canonicalize_name(name)
              if key in entries:
                  raise SystemExit(f"DUPLICATE_WHEEL_FOR_PACKAGE:{key}")
              entries[key] = (str(version), hashlib.sha256(wheel.read_bytes()).hexdigest())
          expected = {}
          for line in Path("requirements-lock-py311.txt").read_text(encoding="utf-8").splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              name, version = line.split("==", 1)
              expected[canonicalize_name(name)] = version
          if set(entries) != set(expected):
              raise SystemExit(f"WHEEL_PACKAGE_SET_MISMATCH:missing={sorted(set(expected)-set(entries))}:extra={sorted(set(entries)-set(expected))}")
          lines = [
              "# Generated from CPython 3.11.18 / ubuntu-24.04 x86_64 wheels.",
              "# Install with: python -m pip install --only-binary=:all: --require-hashes -r requirements-lock-py311-hashed.txt",
              "# Regenerate whenever the runner, Python patch version, or dependency versions change.",
          ]
          for name in sorted(entries):
              version, digest = entries[name]
              if version != expected[name]:
                  raise SystemExit(f"WHEEL_VERSION_MISMATCH:{name}:{version}!={expected[name]}")
              lines.append(f"{name}=={version} --hash=sha256:{digest}")
          Path("/tmp/requirements-lock-py311-hashed.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"HASH_LOCK_PACKAGES={len(entries)}")
          PY
          diff -u requirements-lock-py311-hashed.txt /tmp/requirements-lock-py311-hashed.txt
      - name: Upload generated hash lock for reviewed commit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: requirements-lock-py311-hashed-${{ github.sha }}
          path: /tmp/requirements-lock-py311-hashed.txt
          if-no-files-found: error
          retention-days: 7
      - name: Compile identity validators
        run: python -m py_compile scripts/s6_daily_path_identity.py scripts/s6_first_checkpoint.py scripts/s4_c100_golden.py
      - name: Run isolated identity contract tests
        run: python -m pytest -q tests/test_s6_daily_path_identity_contract.py tests/test_s6_daily_balance_snapshot_schema.py tests/test_workflow_safety_contract.py tests/test_s6_source_pin_separation.py
      - name: Confirm this job has no simulation invocation
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path(".github/workflows/s6-explicit-cohort-identity-contract.yml").read_text(encoding="utf-8")
          forbidden = ("run_" + "single_trial", "run_trials_" + "parallel", "run_full_" + "trials")
          assert all(name not in workflow for name in forbidden)
          assert "pytest -q tests/test_s6_daily_path_identity_contract.py tests/test_s6_daily_balance_snapshot_schema.py tests/test_workflow_safety_contract.py tests/test_s6_source_pin_separation.py" in workflow
          print("SIMULATION_TRIALS=NOT_EXECUTED")
          PY
