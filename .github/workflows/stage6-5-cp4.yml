name: Stage 6.5 CP4 Heaviest Scenario

on:
  push:
    branches:
      - tmp/stage6.5-cp4-20261003

permissions:
  contents: write

jobs:
  cp4:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Measure C050_G100 log_events=True
        run: |
          python -m scripts.stage6_5_measure_heavy \
            --scenario C050_G100 \
            --trial-ids 1 2 3 4 5 \
            --log-events True \
            --output-dir results_stage6_5

      - name: Measure C050_G100 log_events=False
        run: |
          python -m scripts.stage6_5_measure_heavy \
            --scenario C050_G100 \
            --trial-ids 1 2 3 4 5 \
            --log-events False \
            --output-dir results_stage6_5

      - name: Validate CP4 R8
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          true_path = Path("results_stage6_5") / "cp4_measure_True.json"
          false_path = Path("results_stage6_5") / "cp4_measure_False.json"

          true_payload = json.loads(true_path.read_text(encoding="utf-8"))
          false_payload = json.loads(false_path.read_text(encoding="utf-8"))

          true_by_id = {int(row["trial_id"]): row for row in true_payload["trials"]}
          false_by_id = {int(row["trial_id"]): row for row in false_payload["trials"]}

          rows = []
          for trial_id in true_payload["trial_ids"]:
              true_row = true_by_id[trial_id]
              false_row = false_by_id[trial_id]
              sha_match = true_row["trial_result_sha256"] == false_row["trial_result_sha256"]
              if not sha_match:
                  raise AssertionError(f"SHA mismatch trial_id={trial_id}")
              if true_row["event_log_len"] <= 0:
                  raise AssertionError(f"True event_log not positive trial_id={trial_id}")
              if false_row["event_log_len"] != 0:
                  raise AssertionError(f"False event_log not zero trial_id={trial_id}")
              rows.append({
                  "trial_id": trial_id,
                  "T_True": true_row["elapsed_seconds"],
                  "T_False": false_row["elapsed_seconds"],
                  "difference_pct": (
                      (false_row["elapsed_seconds"] - true_row["elapsed_seconds"])
                      / true_row["elapsed_seconds"]
                      * 100.0
                  ),
                  "RSS_True": true_row["rss_max_kb"],
                  "RSS_False": false_row["rss_max_kb"],
                  "SHA_match": sha_match,
                  "event_log_True": true_row["event_log_len"],
                  "event_log_False": false_row["event_log_len"],
              })

          mean_true_t = sum(row["T_True"] for row in rows) / len(rows)
          mean_false_t = sum(row["T_False"] for row in rows) / len(rows)
          mean_true_rss = sum(row["RSS_True"] for row in rows) / len(rows)
          mean_false_rss = sum(row["RSS_False"] for row in rows) / len(rows)
          time_reduction_pct = (mean_true_t - mean_false_t) / mean_true_t * 100.0
          rss_reduction_pct = (mean_true_rss - mean_false_rss) / mean_true_rss * 100.0

          if not (mean_false_t < mean_true_t):
              raise AssertionError(
                  f"False mean time is not lower: true={mean_true_t} false={mean_false_t}"
              )
          if not (mean_false_rss < mean_true_rss):
              raise AssertionError(
                  f"False mean RSS is not lower: true={mean_true_rss} false={mean_false_rss}"
              )

          print("| trial_id | T_True | T_False | فرق% | RSS_True | RSS_False | SHA_match | event_log_True | event_log_False |")
          print("|---:|---:|---:|---:|---:|---:|:---:|---:|---:|")
          for row in rows:
              print(
                  f'| {row["trial_id"]} | {row["T_True"]:.6f} | '
                  f'{row["T_False"]:.6f} | {row["difference_pct"]:.6f} | '
                  f'{row["RSS_True"]} | {row["RSS_False"]} | '
                  f'{str(row["SHA_match"]).lower()} | {row["event_log_True"]} | '
                  f'{row["event_log_False"]} |'
              )

          summary = {
              "scenario_id": "C050_G100",
              "trial_count": len(rows),
              "all_sha_match": all(row["SHA_match"] for row in rows),
              "all_true_event_log_positive": all(
                  row["event_log_True"] > 0 for row in rows
              ),
              "all_false_event_log_zero": all(
                  row["event_log_False"] == 0 for row in rows
              ),
              "mean_T_True_s": mean_true_t,
              "mean_T_False_s": mean_false_t,
              "time_reduction_pct": time_reduction_pct,
              "mean_RSS_True_KB": mean_true_rss,
              "mean_RSS_False_KB": mean_false_rss,
              "rss_reduction_pct": rss_reduction_pct,
          }
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          PY

      - name: Show CP4 JSON
        run: |
          cat results_stage6_5/cp4_measure_True.json
          cat results_stage6_5/cp4_measure_False.json

      - name: Upload CP4 results
        uses: actions/upload-artifact@v4
        with:
          name: stage6-5-cp4-results
          path: results_stage6_5/
