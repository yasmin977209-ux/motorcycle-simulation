name: Gate B Cumulative Inputs and N=1200 Checkpoint

on:
  push:
    branches:
      - "tmp/gateb-historical-1200-verify-20261012"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate source pins, checkpoint evidence, and audit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Test N=1200 identity and statistical gates
        run: python -m pytest -q tests/test_stage12_gateb_n1200_audit.py
      - name: Verify current main, source identities and N=300 prior checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "2325b6ae6e110d9e54e614aa9b1e255be5965375"
          git diff --check "2325b6ae6e110d9e54e614aa9b1e255be5965375...$GITHUB_SHA"
          python scripts/stage12_gateb_n1200_audit.py --preflight --output-file results_gateb/preflight.json
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n1200-preflight
          path: results_gateb/preflight.json
          if-no-files-found: warn
          retention-days: 30

  prepare-cumulative-600:
    name: Revalidate N=600 artifacts and cumulative trial IDs 1..600
    needs: [preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download prior-run artifacts, validate provenance, and recompute N=600 hash map
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: python scripts/stage12_gateb_n1200_audit.py --prepare-cumulative-600 --output-file results_gateb/cumulative_600.json
      - name: Upload exact cumulative N=600 analytical input set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n1200-cumulative-600
          path: results_gateb/cumulative_600.json
          if-no-files-found: warn
          retention-days: 30

  run-new-trials:
    name: Run only missing IDs 601–1200 — ${{ matrix.scenario }}
    needs: [preflight, prepare-cumulative-600]
    if: needs.preflight.result == 'success' && needs.prepare-cumulative-600.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        scenario:
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download verified cumulative N=600 proof
        uses: actions/download-artifact@v4
        with:
          name: gateb-n1200-cumulative-600
          path: cumulative_proof
      - name: Confirm the cumulative proof is complete before any simulation
        run: |
          python -c 'import json; d=json.load(open("cumulative_proof/cumulative_600.json")); assert d["status"] == "PASS" and d["total_records_verified"] == 12000 and d["ordered_scenario_trial_hash_map_sha256_n600"] == "dd537fe96c5a8736201441e9a620db148a0d16cadae518d2a777fbc723db395f"'
      - name: Checkout exact source engine commit in a separate worktree
        env:
          SOURCE_COMMIT: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/pinned-model-source" "$SOURCE_COMMIT"
          python -m pip install -r "$RUNNER_TEMP/pinned-model-source/requirements.txt"
      - name: Materialize only missing IDs 601–1200; restore same-run completed IDs first
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          PYTHONPATH: .
        run: |
          python scripts/stage12_gateb_n1200_audit.py \
            --run-new-trials \
            --scenario "$SCENARIO" \
            --source-root "$RUNNER_TEMP/pinned-model-source" \
            --input-file cumulative_proof/cumulative_600.json \
            --output-root gateb_n1200_new
      - name: Upload outputs materialized in this attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n1200-new-${{ matrix.scenario }}-attempt-${{ github.run_attempt }}
          path: gateb_n1200_new/trial_outputs/
          if-no-files-found: warn
          retention-days: 30

  aggregate-n1200:
    name: Validate 24,000 keys and calculate all 60 N=1200 CI points
    needs: [preflight, prepare-cumulative-600, run-new-trials]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Download verified N=600 cumulative inputs when available
        if: needs.prepare-cumulative-600.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gateb-n1200-cumulative-600
          path: cumulative_inputs
      - name: Download per-scenario, per-attempt N=1200 trial outputs if available
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gateb-n1200-new-*
          path: new_trial_artifacts
          merge-multiple: false
      - name: Aggregate cumulative IDs 1..1200 and calculate Student-t intervals
        if: needs.preflight.result == 'success' && needs.prepare-cumulative-600.result == 'success' && needs.run-new-trials.result == 'success'
        env:
          PYTHONPATH: .
        run: |
          python scripts/stage12_gateb_n1200_audit.py \
            --aggregate-n1200 \
            --cumulative-file cumulative_inputs/cumulative_600.json \
            --new-root new_trial_artifacts \
            --output-file results_gateb/gate_b_n1200_report.json
      - name: Upload N=1200 checkpoint report when produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n1200-checkpoint-report
          path: results_gateb/gate_b_n1200_report.json
          if-no-files-found: warn
          retention-days: 30
