name: CP Stage 7 helper Gate B strict Boolean verification

on:
  push:
    branches:
      - "tmp/cp-stage7-helper-bool-gate-20261022"
    paths:
      - "scripts/stage7_stability.py"
      - "tests/test_stage7_authoring.py"
      - ".github/workflows/cp-stage7-helper-bool-gate-20261022.yml"
      - "docs/audits/CP_STAGE7_HELPER_GATEB_STRICT_BOOLEAN_R4_2026-10-22.md"

permissions:
  contents: read

concurrency:
  group: cp-stage7-helper-bool-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-authoring:
    name: Exact-SHA compile and Stage 7 authoring tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Compile Gate B helper
        run: python -m compileall -q scripts/stage7_stability.py
      - name: Run deterministic Stage 7 authoring regressions
        shell: bash
        run: |
          mkdir -p validation_output
          set +e
          python -m pytest -q tests/test_stage7_authoring.py --junitxml=validation_output/pytest.junit.xml 2>&1 | tee validation_output/pytest.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "$rc" > validation_output/pytest_exit_code.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path
          paths = [
              "scripts/stage7_stability.py",
              "tests/test_stage7_authoring.py",
              ".github/workflows/cp-stage7-helper-bool-gate-20261022.yml",
          ]
          identity = {
              "tested_sha": os.environ.get("GITHUB_SHA"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "source_blobs": {
                  path: subprocess.check_output(
                      ["git", "hash-object", path], text=True
                  ).strip()
                  for path in paths
              },
          }
          Path("validation_output/source_identity.json").write_text(
              json.dumps(identity, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          exit "$rc"
      - name: Upload exact-SHA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-stage7-helper-bool-gate-evidence
          path: validation_output/
          if-no-files-found: error
