name: S6 Gate A independent Golden verifier tests

on:
  push:
    branches:
      - "tmp/s6-gatea-integrator-20261028"
    paths:
      - "scripts/s6_golden_gate.py"
      - "tests/test_s6_golden_gate.py"
      - ".github/workflows/s6-gatea-integrator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s6-gatea-integrator-test
  cancel-in-progress: false
  queue: max

jobs:
  unit:
    name: Test fail-closed Golden map verifier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact test commit and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Gate A verifier
        run: python -m py_compile scripts/s6_golden_gate.py tests/test_s6_golden_gate.py
      - name: Run Gate A verifier tests
        run: python -m pytest -q tests/test_s6_golden_gate.py
      - name: Record tested revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD
          sha256sum scripts/s6_golden_gate.py tests/test_s6_golden_gate.py
