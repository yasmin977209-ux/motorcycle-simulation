name: D3 Candidate Exact Financial Registry Audit

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - '.github/workflows/d3-candidate-financial-audit.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: d3-candidate-financial-audit
  cancel-in-progress: false

jobs:
  audit-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install openpyxl lxml python-docx pypdf pytest

      - name: Assert exact branch and candidate source identity
        env:
          EXPECTED_TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "tmp/d1-rebuild-20261101"
          test "$(git rev-parse HEAD)" = "${EXPECTED_TESTED_SHA}"
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "${EXPECTED_TESTED_SHA}"
          echo "D3_CANDIDATE_AUDIT_TESTED_SHA=${EXPECTED_TESTED_SHA}"

      - name: Run D6 and D3 focused regression tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts/audit_s6_deliverables_bundle.py tests/test_d6_audit.py
          python -m pytest -q -rs tests/test_d6_audit.py tests/test_d3_excel_export_complete.py tests/test_d3_registry_extension.py

      - name: Download and verify exact owner-approved D3 candidate Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,requests
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          artifact_id=13288779998
          source_run_id=41754147172
          source_sha="3325fd961005c2c47de071d25904a748af7a21a6"
          expected_bytes=535567142
          expected_sha="e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe"
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          base=f"https://api.github.com/repos/{repo}"
          meta=requests.get(f"{base}/actions/artifacts/{artifact_id}",headers=headers,timeout=60)
          meta.raise_for_status(); a=meta.json()
          run=requests.get(f"{base}/actions/runs/{source_run_id}",headers=headers,timeout=60)
          run.raise_for_status(); r=run.json()
          checks={
            "artifact_id":a.get("id")==artifact_id,
            "artifact_name":a.get("name")=="D3-Owner-Approved-Source-Reprocessing-41754147172",
            "artifact_size":a.get("size_in_bytes")==expected_bytes,
            "artifact_digest":a.get("digest")=="sha256:"+expected_sha,
            "artifact_not_expired":a.get("expired") is False,
            "artifact_source_run":a.get("workflow_run",{}).get("id")==source_run_id,
            "artifact_source_sha":a.get("workflow_run",{}).get("head_sha")==source_sha,
            "source_run_id":r.get("id")==source_run_id,
            "source_run_sha":r.get("head_sha")==source_sha,
            "source_run_success":r.get("conclusion")=="success",
          }
          if not all(checks.values()):
            raise SystemExit("D3_CANDIDATE_ARTIFACT_LINEAGE_MISMATCH:"+json.dumps(checks,sort_keys=True))
          response=requests.get(f"{base}/actions/artifacts/{artifact_id}/zip",headers=headers,stream=True,timeout=(60,300))
          response.raise_for_status()
          target=pathlib.Path("/tmp/d3-candidate-artifact.zip")
          h=hashlib.sha256(); total=0
          with target.open("wb") as out:
            for chunk in response.iter_content(8*1024*1024):
              if chunk:
                out.write(chunk); h.update(chunk); total+=len(chunk)
          digest=h.hexdigest()
          if total!=expected_bytes or digest!=expected_sha:
            raise SystemExit(f"D3_CANDIDATE_OUTER_FINGERPRINT_MISMATCH:{total}:{digest}")
          pathlib.Path("/tmp/d3-candidate-meta.json").write_text(json.dumps({
            "artifact_id":artifact_id,"source_run_id":source_run_id,"source_sha":source_sha,
            "bytes":total,"sha256":digest,"expires_at":a.get("expires_at"),
            "metadata_digest":a.get("digest"),"lineage_checks":checks
          },ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print("D3_CANDIDATE_ARTIFACT_VERIFIED "+json.dumps(checks,sort_keys=True))
          print(f"D3_CANDIDATE_ARTIFACT_BYTES={total} SHA256={digest}")
          PY

      - name: Audit exact workbook bytes against pinned Number Registry
        env:
          TESTED_SHA: ${{ github.sha }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import decimal,hashlib,json,os,pathlib,posixpath,stat,zipfile,xml.etree.ElementTree as ET
          from scripts.audit_s6_deliverables_bundle import (
            REGISTRY_SIZE,REGISTRY_SHA,EXTENSION_SIZE,EXTENSION_SHA,
            build_d3_evidence_indexes,scan_xlsx_xml,registry_display
          )
          root=pathlib.Path(".")
          archive=pathlib.Path("/tmp/d3-candidate-artifact.zip")
          required={
            "Full_Results_EN.xlsx":(259442692,"8b14ec0b2555beae117d453722abc6c733b49ef941bfa8b3e15d299d7983d77d"),
            "النتائج_الكاملة_AR.xlsx":(259444534,"e6617de7799e9a1ee00533e9e5eb77da3ab7d32d3c9d6940fcb87dd04afcbc5d"),
            "D3_NUMBER_REGISTRY_EXTENSION.json.gz":(16440292,"7b7e082424a0dab9519723028e8bb99e699e2e590168db258429bb14be6c4024"),
          }
          out=root/"deliverables"; out.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
            infos=z.infolist(); names=[x.filename for x in infos]
            if len(names)!=len(set(names)): raise SystemExit("D3_CANDIDATE_DUPLICATE_ZIP_MEMBER")
            for info in infos:
              p=pathlib.PurePosixPath(info.filename)
              if p.is_absolute() or ".." in p.parts or "\\" in info.filename or ((info.external_attr>>16)&0o170000)==stat.S_IFLNK:
                raise SystemExit("D3_CANDIDATE_UNSAFE_ZIP_MEMBER:"+info.filename)
            bad=z.testzip()
            if bad: raise SystemExit("D3_CANDIDATE_ZIP_CRC_FAILURE:"+bad)
            extracted={}
            for basename,(expected_size,expected_sha) in required.items():
              hits=[x for x in infos if pathlib.PurePosixPath(x.filename).name==basename and not x.is_dir()]
              if len(hits)!=1: raise SystemExit("D3_CANDIDATE_MEMBER_NOT_UNIQUE:"+basename)
              target=out/basename; h=hashlib.sha256(); total=0
              with z.open(hits[0]) as src,target.open("wb") as dst:
                for chunk in iter(lambda:src.read(8*1024*1024),b""):
                  dst.write(chunk); h.update(chunk); total+=len(chunk)
              digest=h.hexdigest()
              if total!=expected_size or digest!=expected_sha:
                raise SystemExit(f"D3_CANDIDATE_MEMBER_FINGERPRINT_MISMATCH:{basename}:{total}:{digest}")
              extracted[basename]={"member":hits[0].filename,"bytes":total,"sha256":digest}
          registry_path=root/"results/number_registry.json"
          raw=registry_path.read_bytes()
          if len(raw)!=REGISTRY_SIZE or hashlib.sha256(raw).hexdigest()!=REGISTRY_SHA:
            raise SystemExit("D3_BASE_NUMBER_REGISTRY_FINGERPRINT_MISMATCH")
          registry=json.loads(raw.decode("utf-8"),parse_float=decimal.Decimal)
          entries_by_id,series_by_id,ledger_by_id=build_d3_evidence_indexes(root,registry)
          workbooks={}
          for name in ("Full_Results_EN.xlsx","النتائج_الكاملة_AR.xlsx"):
            audit=scan_xlsx_xml(out/name,entries_by_id,series_by_id,ledger_by_id,registry)
            if len(audit["sheetnames"])!=185: raise SystemExit("D3_CANDIDATE_SHEET_COUNT_INVALID:"+name)
            if audit["financial_mismatch_count"]!=0:
              raise SystemExit("D3_CANDIDATE_FINANCIAL_REGISTRY_MISMATCH:"+name+":"+json.dumps(audit["financial_mismatch_samples"][:20],ensure_ascii=False))
            workbooks[name]={
              "status":"PASS_SCOPED","sheet_count":len(audit["sheetnames"]),
              "numeric_cells":audit["numeric_count"],"financial_cells_registry_matched":audit["financial_count"],
              "financial_mismatch_count":audit["financial_mismatch_count"],
              "numeric_digest":audit["numeric_digest"],"sha256":extracted[name]["sha256"],
              "bytes":extracted[name]["bytes"]
            }
          if workbooks["Full_Results_EN.xlsx"]["numeric_digest"]!=workbooks["النتائج_الكاملة_AR.xlsx"]["numeric_digest"]:
            raise SystemExit("D3_CANDIDATE_BILINGUAL_NUMERIC_PARITY_MISMATCH")
          result={
            "schema_version":"d3-candidate-exact-financial-registry-audit-v1",
            "status":"PASS_SCOPED",
            "classification":"T2_INTERIM / NOT_FINAL_BLOCKED",
            "repository":"yasmin977209-ux/motorcycle-simulation",
            "branch":"tmp/d1-rebuild-20261101",
            "audit_tested_sha":os.environ["TESTED_SHA"],
            "audit_run_id":int(os.environ["AUDIT_RUN_ID"]),
            "candidate_source_run_id":41754147172,
            "candidate_source_sha":"3325fd961005c2c47de071d25904a748af7a21a6",
            "candidate_artifact_id":13288779998,
            "candidate_artifact_bytes":535567142,
            "candidate_artifact_sha256":"e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe",
            "candidate_artifact_metadata":json.loads(pathlib.Path("/tmp/d3-candidate-meta.json").read_text()),
            "base_number_registry":{"path":"results/number_registry.json","bytes":len(raw),"sha256":REGISTRY_SHA},
            "registry_extension":extracted["D3_NUMBER_REGISTRY_EXTENSION.json.gz"],
            "workbooks":workbooks,
            "exact_financial_cells":{
              "SCENARIO_MATRIX!UB7":{"number_id":"NR-e51bacd2a4c626dbc4c5e832","expected":"83735327.68"},
              "SCENARIO_MATRIX!AFJ10":{"number_id":"NR-b48c8eb8a49a603dc4fbf63d","expected":"91969804.71"}
            },
            "bilingual_numeric_parity":"PASS_SCOPED",
            "d3_gate_status":"NOT_PROMOTED_PENDING_SEPARATE_D3_ACCEPTANCE_AND_D4_RERUN",
            "no_trial_simulation_monte_carlo_n_expansion_backfill_zero_fill":True
          }
          path=root/"docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.json"
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          md=[
            "# D3 Candidate Exact Financial Registry Audit — 2026-11-04","",
            "- Candidate D3 source Run: 41754147172.",
            "- Candidate D3 source SHA: 3325fd961005c2c47de071d25904a748af7a21a6.",
            "- Candidate Artifact: 13288779998.",
            "- Candidate Artifact bytes: 535567142.",
            "- Candidate Artifact SHA-256: e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe.",
            "- Audit status: PASS_SCOPED — exact financial Registry comparisons and bilingual numeric parity passed.",
            "- This is a candidate-specific scoped check; it does not by itself close D3, reopen D4, or authorize D5.",
            "",
            "## Workbooks",
            "",
            "| Workbook | Bytes | SHA-256 | Sheets | Numeric cells | Financial Registry matches | Mismatches |",
            "|---|---:|---|---:|---:|---:|---:|"
          ]
          for name,v in workbooks.items():
            md.append(f"| {name} | {v['bytes']} | {v['sha256']} | {v['sheet_count']} | {v['numeric_cells']} | {v['financial_cells_registry_matched']} | {v['financial_mismatch_count']} |")
          md += [
            "",
            "## Exact cells under review",
            "",
            "- SCENARIO_MATRIX!UB7 — NR-e51bacd2a4c626dbc4c5e832 — expected exact Decimal 83735327.68.",
            "- SCENARIO_MATRIX!AFJ10 — NR-b48c8eb8a49a603dc4fbf63d — expected exact Decimal 91969804.71.",
            "- The XML-level scan compared every financial numeric cell against the pinned Number Registry; zero mismatches were required for PASS_SCOPED.",
            "",
            "## Preserved boundaries",
            "",
            "- D3 remains NOT_PROMOTED pending separate acceptance and D4 rerun.",
            "- No historical Artifact or manifest was changed.",
            "- No Trial, Simulation, Monte Carlo, N expansion, backfill, zero-fill, identity change, main write, merge, Release, or final acceptance."
          ]
          (root/"docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          print("D3_CANDIDATE_FINANCIAL_AUDIT_PASS_SCOPED")
          print(json.dumps({"workbooks":workbooks,"registry":result["base_number_registry"]},ensure_ascii=False,sort_keys=True))
          PY

      - name: Append candidate audit continuity and commit
        env:
          TESTED_SHA: ${{ github.sha }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "${TESTED_SHA}"
          python - <<'PY'
          import os,pathlib
          entry=(
            "\n\n## D3 candidate exact financial Registry audit — 2026-11-04 (append-only)\n\n"
            f"- Audit Run {os.environ['AUDIT_RUN_ID']}; tested commit {os.environ['TESTED_SHA']}.\n"
            "- Candidate source Run 41754147172 / SHA 3325fd961005c2c47de071d25904a748af7a21a6; Artifact 13288779998.\n"
            "- Exact workbook financial Registry comparison and bilingual numeric parity are recorded in docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.md/.json.\n"
            "- This candidate-specific audit does not itself promote D3 or authorize D4/D5; preserve the separate gate and owner-approved sequence.\n"
          )
          for name in ("docs/PROJECT_CONTINUITY.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-03.md"):
            p=pathlib.Path(name); p.write_text(p.read_text(encoding="utf-8")+entry,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.md docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.json docs/PROJECT_CONTINUITY.md docs/PROJECT_HANDOFF.md docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-03.md
          git commit -m "docs(d3): record candidate exact financial audit"
          git push origin HEAD:tmp/d1-rebuild-20261101

      - name: Remote Raw readback and exact final HEAD validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,pathlib,subprocess,urllib.parse,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          if subprocess.check_output(["git","ls-remote","origin","refs/heads/tmp/d1-rebuild-20261101"],text=True).split()[0]!=head:
            raise SystemExit("D3_CANDIDATE_AUDIT_FINAL_HEAD_MISMATCH")
          if subprocess.check_output(["git","ls-remote","origin","refs/heads/main"],text=True).split()[0]!="c6e54349a5e94f65d5aa9f83141f225d777bb474":
            raise SystemExit("MAIN_HEAD_CHANGED_UNEXPECTEDLY")
          paths=["docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.md","docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.json","docs/PROJECT_CONTINUITY.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-03.md"]
          for path in paths:
            local=pathlib.Path(path).read_bytes()
            url=f"https://raw.githubusercontent.com/{repo}/{head}/{urllib.parse.quote(path,safe='/')}"
            req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]})
            with urllib.request.urlopen(req,timeout=180) as response: remote=response.read()
            if remote!=local: raise SystemExit("D3_CANDIDATE_AUDIT_RAW_READBACK_MISMATCH:"+path)
            blob=hashlib.sha1(b"blob "+str(len(remote)).encode()+b"\0"+remote).hexdigest()
            print(f"VERIFIED_LIVE {path} bytes={len(remote)} sha256={hashlib.sha256(remote).hexdigest()} blob_sha1={blob} commit={head} url={url}")
          print("D3_CANDIDATE_AUDIT_EXACT_FINAL_HEAD_PASS",head)
          PY

      - name: Publish candidate financial audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: D3_Candidate_Financial_Audit_2026-11-04
          path: |
            docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.md
            docs/stage_d/D3_CANDIDATE_FINANCIAL_AUDIT_2026-11-04.json
          if-no-files-found: error
          retention-days: 30
