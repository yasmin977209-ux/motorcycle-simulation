name: S6 security and dependency audit

on:
  pull_request:
    branches:
      - "docs/new-simulation-protocol-20261108"
  push:
    branches:
      - "fix/explicit-cohort-identity-20261108"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-and-dependency-scan:
    name: Full-history secret scan and pinned dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history without persisted credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.0"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Scan all reachable Git history with redacted output
        id: full_history_scan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks-8.30.0/gitleaks git . --redact --exit-code 2 --report-format json --report-path /tmp/gitleaks-full-history.json

      - name: Emit finding metadata only; never print secret material
        id: finding_metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = Path("/tmp/gitleaks-full-history.json")
          if not report.is_file():
              raise SystemExit("GITLEAKS_FULL_HISTORY_REPORT_MISSING")
          findings = json.loads(report.read_text(encoding="utf-8"))
          for item in findings:
              print(json.dumps({
                  "rule_id": item.get("RuleID"),
                  "description": item.get("Description"),
                  "file": item.get("File"),
                  "commit": item.get("Commit"),
                  "start_line": item.get("StartLine"),
                  "end_line": item.get("EndLine"),
                  "secret_value_emitted": False,
              }, sort_keys=True))
          with open(__import__("os").environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"finding_count={len(findings)}\\n")
          print(f"GITLEAKS_FULL_HISTORY_FINDINGS={len(findings)}")
          PY

      - name: Fail closed when any historical finding remains
        if: always()
        shell: bash
        env:
          FINDING_COUNT: ${{ steps.finding_metadata.outputs.finding_count }}
        run: |
          set -euo pipefail
          test "${FINDING_COUNT:-missing}" = "0"
      - name: Audit the exact runtime lock when present
        if: ${{ hashFiles('requirements-lock-py311-hashed.txt') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/pip-audit-env
          /tmp/pip-audit-env/bin/python -m pip install --disable-pip-version-check pip-audit==2.10.1
          /tmp/pip-audit-env/bin/pip-audit --requirement requirements-lock-py311-hashed.txt --strict

      - name: Record lock-generation prerequisite if the hash lock is not yet committed
        if: ${{ hashFiles('requirements-lock-py311-hashed.txt') == '' }}
        run: echo "DEPENDENCY_AUDIT=BLOCKED_HASH_LOCK_NOT_YET_COMMITTED" >> "$GITHUB_STEP_SUMMARY"
