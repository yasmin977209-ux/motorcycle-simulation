name: stage4-verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage4:
    name: stage4-acceptance-v2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Generate acceptance v2 files when absent
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          if [ ! -f tests/test_acceptance_16_v2.py ] || [ ! -f tests/acceptance_helpers.py ] || [ ! -f docs/ACCEPTANCE_PORT.md ]; then
            mkdir -p work tests docs
            cat stage7_source/source.b64.* > work/source.b64
            base64 -d work/source.b64 > work/source.gz
            tar -xzf work/source.gz -C work
            cp work/orig/tests/test_acceptance_16_full.py work/test_acceptance_16_full.py

            cat > tests/acceptance_helpers.py <<'PYHELP'
from __future__ import annotations

from datetime import date

import daily_engine
from entities import Bike, BikeSource, BikeState, Contract, ContractType, Project
from accounting import accrue_rent
from closure import execute_dynamic_closure


def add_active_contract(
    project: Project,
    *,
    contract_type: str = "PRIMARY",
    start: date = date(2029, 1, 2),
    state: str | None = None,
    maturity: date | None = None,
    due: int = 0,
    paid: int = 0,
) -> tuple[Bike, Contract]:
    """Create only the test fixture state needed by acceptance tests."""
    contract_type_enum = ContractType(contract_type)
    bike = Bike(
        bike_id=f"T{len(project.bikes) + 1:06d}",
        source=BikeSource.INITIAL,
        purchase_date=date(2026, 12, 26),
        scheduled_ready_date=start,
        funding_completion_date=date(2026, 12, 26),
        actual_ready_date=start,
        prep_paid=True,
        customs_paid=True,
        gross_cost=360_000,
        current_state=BikeState(state or ("ACTIVE_PRIMARY" if contract_type_enum is ContractType.PRIMARY else "ACTIVE_SECONDARY")),
    )
    project.bikes.append(bike)
    contract = daily_engine._new_contract(project, bike, contract_type_enum, start)
    contract.total_due = due
    contract.total_paid = paid
    if due:
        accrue_rent(project, contract, amount=due)
        if paid:
            project.project_cash += paid
            project.accounts_receivable -= paid
    if maturity is not None:
        contract.maturity_date = maturity
    bike.current_state = BikeState(state or ("ACTIVE_PRIMARY" if contract_type_enum is ContractType.PRIMARY else "ACTIVE_SECONDARY"))
    if contract_type_enum is ContractType.PRIMARY:
        bike.delivery_date = start
    bike.current_contract_id = contract.contract_id
    bike.current_tenant_id = contract.tenant_id
    return bike, contract


def mark_all_initial_owned(project: Project) -> None:
    """Set initial test fixtures to the owned state without business calculations."""
    for bike in project.bikes:
        bike.current_state = BikeState.OWNED_TRANSFERRED
        bike.current_contract_id = None
        bike.current_tenant_id = None


def make_secondary_default_case(
    outstanding: int = 10_000,
    *,
    start: date = date(2031, 1, 4),
) -> tuple[Project, Bike, Contract]:
    """Create a secondary notice-state fixture at the default threshold."""
    project = daily_engine.create_initial_project(recovery_rate_pct=100)
    bike, contract = add_active_contract(
        project,
        contract_type="SECONDARY",
        start=start,
        state="NOTICE_SECONDARY",
        due=outstanding,
        paid=0,
    )
    return project, bike, contract


def invoke_closure_and_get_state(
    project: Project,
    current_date: date,
    recovery_rate_pct: int,
) -> dict[str, int | date | None]:
    """Invoke the current closure API and expose its resulting project state."""
    execute_dynamic_closure(project, current_date, recovery_rate_pct)
    return {
        "final_close_date": project.final_close_date,
        "final_net_project_equity": project.final_net_project_equity,
        "partner1_final_entitlement": project.partner1_final_entitlement,
        "partner2_final_entitlement": project.partner2_final_entitlement,
    }
PYHELP

