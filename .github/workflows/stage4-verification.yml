def call_map(text):
    t = ast.parse(text)
    out = {}
    for node in t.body:
        if isinstance(node, ast.FunctionDef) and node.name.startswith('test_'):
            calls = []
            for sub in ast.walk(node):
                if isinstance(sub, ast.Call):
                    fn = ast.unparse(sub.func)
                    if fn.startswith(prefixes):
                        calls.append(ast.unparse(sub))
            out[node.name] = calls
    return out

