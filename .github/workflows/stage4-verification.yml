          python -m pytest -q tests/test_acceptance_16_v2.py -v 2>&1 | tee /tmp/acceptance_v2.log
          rc=$?
          echo "PYTEST_EXIT_CODE=$rc" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n 12 /tmp/acceptance_v2.log
          exit "$rc"

      - name: Acceptance status counts
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/acceptance_v2.log').read_text(encoding='utf-8', errors='replace') if Path('/tmp/acceptance_v2.log').exists() else ''
          tail = log[-5000:]
          passed = failed = skipped = 0
          m = re.search(r'(\d+) passed(?:, (\d+) failed)?(?:, (\d+) skipped)?', tail)
          if m:
              passed = int(m.group(1))
              failed = int(m.group(2) or 0)
              skipped = int(m.group(3) or 0)
          deferred = 4 if skipped >= 4 else 0
          adjudication = 1 if skipped >= 5 else 0
          print(f'PASS={passed}')
          print(f'FAIL={failed}')
          print(f'DEFERRED={deferred}')
          print(f'ADJUDICATION={adjudication}')
          print(f'SKIPPED_TOTAL={skipped}')
          PY
