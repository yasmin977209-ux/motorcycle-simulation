name: Tri-hash Preservation Verification — legacy entrypoint (no provider secrets)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: tri-hash-preservation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  github-raw-stage-a:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Compile QuickXorHash
        run: |
          cc -O3 -fPIC -shared scripts/quickxorhash.c -o /tmp/libquickxorhash.so
          echo "QUICKXOR_LIB=/tmp/libquickxorhash.so" >> "$GITHUB_ENV"
      - name: Run Stage A without provider credentials
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p tri-hash-output
          python scripts/verify_github_raw_tri_hash_manifest.py --output tri-hash-output/GITHUB_RAW_TRI_HASH_MANIFEST_2026-11-07.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GITHUB-RAW-TRI-HASH-MANIFEST-${{ github.run_id }}
          path: tri-hash-output/GITHUB_RAW_TRI_HASH_MANIFEST_2026-11-07.json
          if-no-files-found: warn
          retention-days: 90
