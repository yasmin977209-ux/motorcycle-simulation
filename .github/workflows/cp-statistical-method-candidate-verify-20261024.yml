name: Candidate time-uniform indicator CS and stopping-window verification

on:
  push:
    branches:
      - "tmp/cp-time-uniform-indicator-cs-20261024"

permissions:
  contents: read

jobs:
  candidate-statistical-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout this exact candidate
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-time-uniform-indicator-cs-20261024
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile only statistical contract modules
        run: python -m compileall -q run_batch.py constants.py scripts/statistical_confidence_sequences.py

      - name: Run deterministic CS and stopping-window tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_statistical_confidence_sequences.py tests/test_run_batch.py

