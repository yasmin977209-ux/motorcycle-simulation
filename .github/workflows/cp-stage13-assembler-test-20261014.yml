name: CP-E Stage13 Assembler Test

on:
  push:
    branches:
      - "tmp/cp-stage13-assembler-20261014"

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[cp-stage13-assembler-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout exact CP-E candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Check diff, syntax, scope, and workflow policy
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 7578a1abcb0e831179f78cff624cd808bee50837...HEAD
          python -m compileall -q scripts/excel_builder.py scripts/stage13_assemble.py tests/test_stage13_assembler.py
          python - <<'PY'
          import subprocess, yaml
          from pathlib import Path
          workflow = yaml.safe_load(Path(".github/workflows/cp-stage13-assembler-test-20261014.yml").read_text())
          trigger = workflow.get("on") or workflow.get(True) or {}
          assert trigger["push"]["branches"] == ["tmp/cp-stage13-assembler-20261014"]
          assert "workflow_dispatch" not in trigger
          assert workflow["jobs"]["verify"]["timeout-minutes"] == 45
          changed = subprocess.check_output(["git","diff","--name-only","7578a1abcb0e831179f78cff624cd808bee50837...HEAD"],text=True).splitlines()
          allowed = {
              "scripts/excel_builder.py", "scripts/stage13_assemble.py",
              "tests/test_stage13_assembler.py",
              ".github/workflows/cp-stage13-assembler-test-20261014.yml",
              ".github/workflows/cp-golden-provider-test-20261014.yml",
          }
          assert set(changed) <= allowed, changed
          assert not any(p.startswith("docs/") or p.startswith("results_stage") or p.endswith(".parquet") for p in changed), changed
          print("DIFF_SYNTAX_SCOPE_AND_WORKFLOW_POLICY=PASS")
          PY
      - name: Generate required test-only Stage 5 fixtures
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5
          cat > /tmp/stage5_fixture.py <<'PY'
          from __future__ import annotations
          import json, hashlib
          from dataclasses import asdict
          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          root = "results_stage5"
          result, daily = monte_carlo.run_single_trial("C100_G100", 1, master_seed=20270101)
          assert (result.final_net_project_equity, result.partner1_final_entitlement,
                  result.partner2_final_entitlement, result.final_cash) == (
                  209671000, 146769700, 62901300, 209671000)
          assert result.final_close_date == "2033-01-06" and len(daily) == 2198
          selection = monte_carlo.select_representative_trials([result])
          pq.write_table(pa.Table.from_pylist([asdict(result)]), f"{root}/trials_summary.parquet")
          pq.write_table(pa.Table.from_pylist([{"selection_key":k,"trial_id":int(v)} for k,v in selection.items()]), f"{root}/selection.parquet")
          with open(f"{root}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json","w",encoding="utf-8") as f:
              json.dump(daily,f,ensure_ascii=False,indent=2,sort_keys=True); f.write("\n")
          long_rows = monte_carlo.build_daily_distribution([result], {1:daily})
          wide = {}
          for item in long_rows:
              row = wide.setdefault(item["date"], {"date":item["date"],"active_trial_count":item["active_trial_count"]})
              for metric in ("Cash","Net_Equity","Active_Bikes","Owned_Transferred_Bikes","Pending_Claims"):
                  row[f"{item['quantile_name']}_{metric}"] = item[metric]
          pq.write_table(pa.Table.from_pylist([wide[k] for k in sorted(wide)]), f"{root}/daily_distribution.parquet")
          def sha(value):
              data=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":"),default=str).encode("utf-8")
              return hashlib.sha256(data).hexdigest()
          tids=(1,2,3)
          seq_results, seq_daily=monte_carlo.run_trials_sequentially("C070_G100",tids)
          p2_results,p2_daily=monte_carlo.run_trials_parallel("C070_G100",tids,2)
          p4_results,p4_daily=monte_carlo.run_trials_parallel("C070_G100",tids,4)
          index=lambda rows:{r.trial_id:r for r in rows}
          seq,p2,p4=map(index,(seq_results,p2_results,p4_results))
          rows=[]
          for tid in tids:
              a,b,c=asdict(seq[tid]),asdict(p2[tid]),asdict(p4[tid])
              rows.append({"scenario_id":"C070_G100","trial_id":tid,
                "exact_1_eq_2":a==b and seq_daily[tid]==p2_daily[tid],
                "exact_1_eq_4":a==c and seq_daily[tid]==p4_daily[tid],
                "trial_result_sha256_1":sha(a),"trial_result_sha256_2":sha(b),"trial_result_sha256_4":sha(c),
                "daily_slice_sha256_1":sha(seq_daily[tid]),"daily_slice_sha256_2":sha(p2_daily[tid]),"daily_slice_sha256_4":sha(p4_daily[tid])})
          assert all(row["exact_1_eq_2"] and row["exact_1_eq_4"] for row in rows)
          with open(f"{root}/worker_equivalence_manifest.json","w",encoding="utf-8") as f:
              json.dump(rows,f,ensure_ascii=False,indent=2,sort_keys=True); f.write("\n")
          print("STAGE5_TEST_FIXTURES=PASS")
          PY
          python /tmp/stage5_fixture.py
      - name: Run CP-E focused tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cp_stage13_evidence
          python -m pytest -q tests/test_stage13_assembler.py tests/test_excel_builder_precision.py tests/test_excel_daily_sheet.py 2>&1 | tee cp_stage13_evidence/pytest_targeted.txt
      - name: Run full pytest suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee cp_stage13_evidence/pytest_full.txt
          status=$?
          printf '%s\n' "$status" > cp_stage13_evidence/pytest_exit_code.txt
          exit "$status"
      - name: Upload CP-E test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-stage13-assembler-evidence
          path: cp_stage13_evidence/
          if-no-files-found: warn
          retention-days: 30
