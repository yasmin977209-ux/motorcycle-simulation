name: Candidate delivery preflight (no production simulation)

on:
  push:
    branches:
      - owner-approved-delivery-preparation-20261025

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run acceptance tests that do not require the Stage 5 generated fixtures
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_acceptance_16_v2.py -k "not test_127 and not test_159 and not test_160 and not test_161"
      - name: Run deterministic delivery, ledger, and fail-closed gate regressions
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_run_batch.py \
            tests/test_stage7_authoring.py \
            tests/test_excel_daily_serialization.py \
            tests/test_stage13_assembler.py \
            tests/test_stage13_maxcase_audit_loader.py \
            tests/test_stage13_maxcase_pending_fields.py
