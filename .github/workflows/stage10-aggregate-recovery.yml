name: stage10-aggregate-recovery

on:
  push:
    branches:
      - "tmp/stage10-bench-20261008"
    paths:
      - ".stage10-aggregate-trigger"

permissions:
  contents: read
  actions: read

env:
  BENCHMARK_RUN_ID: "37709936740"

jobs:
  aggregate-recovery:
    name: stage10-aggregate-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Download benchmark artifacts from measurement Run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BENCHMARK_RUN_ID }}
          pattern: stage10-bench-*
          path: all_artifacts
          merge-multiple: false
      - name: Aggregate existing measurements only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.stage10_aggregate "${BENCHMARK_RUN_ID}"
      - name: Upload final Stage 10 metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage10-bench-final-recovery
          path: stage10_final/STAGE10_METRICS.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Stage 10 verdict
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("stage10_final/STAGE10_METRICS.json").read_text(encoding="utf-8"))
          print("STAGE10_VERDICT=" + str(d["verdict"]))
          if d["verdict"] != "PASS":
              raise SystemExit(1)
          PY
