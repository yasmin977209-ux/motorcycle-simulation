name: temporary-cp-d21-plus50-cleanup-tests

on:
  push:
    branches: ["tmp/cp-d21-plus50-cleanup-20261014"]

permissions:
  contents: read

jobs:
  verify-statistical-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Assert stale checkpoint names are absent
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'ITERATION_ESCALATION_STEP|STATISTICAL_CHECK_STEP_N|MINIMUM_STOP_N_FOR_NON_C100' constants.py tests/test_stage1.py .github/workflows/stage1-verification.yml; then
            echo "Obsolete checkpoint policy found in scoped files."
            exit 1
          fi
      - name: Run Stage 1, §2.5 unit, and Stage 7 authoring tests
        run: python -m pytest -q tests/test_stage1.py tests/test_stability_2_5_metrics.py tests/test_stage7_authoring.py
