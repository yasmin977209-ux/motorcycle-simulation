name: U1 hash-seed failure diagnostic

on:
  push:
    branches:
      - "tmp/u1-baseline-20261025"
    paths:
      - ".github/workflows/u1-diagnose-hashseed-20261025.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Reproduce first failing subprocess and print its captured message
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          sys.path.insert(0, str(Path.cwd() / 'tests'))
          import test_monte_carlo_round2 as testmod
          script = Path('/tmp/u1-round2-hashseed-probe.py')
          testmod._write_hashseed_probe_script(script)
          print('PYTHONPATH=' + repr(os.environ.get('PYTHONPATH')))
          try:
              result = testmod._run_hashseed(script, testmod.PYTHON_HASH_SEEDS[0])
          except subprocess.CalledProcessError as exc:
              print('CHILD_RETURN_CODE=' + str(exc.returncode))
              print('CHILD_STDOUT=' + repr(exc.stdout))
              print('CHILD_STDERR=' + repr(exc.stderr))
          else:
              print('CHILD_RESULT=' + repr(result))
          PY
