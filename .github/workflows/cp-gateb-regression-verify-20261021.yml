name: CP1 Gate B focused regression

on:
  push:
    branches:
      - "tmp/cp-gateb-guards-20261021"
    paths:
      - "run_batch.py"
      - "scripts/stage7_stability.py"
      - "constants.py"
      - ".github/workflows/stage7-full-run.yml"
      - "tests/test_gateb_regression.py"
      - "tests/test_run_batch.py"
      - "tests/test_stage7_authoring.py"

permissions:
  contents: read

concurrency:
  group: cp-gateb-guards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  focused-regression:
    name: Gate B deterministic regression only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile target modules
        run: python -m compileall -q run_batch.py scripts/stage7_stability.py
      - name: Run focused deterministic regressions
        run: >-
          python -m pytest -q
          tests/test_run_batch.py
          tests/test_stage7_authoring.py
          tests/test_gateb_regression.py
