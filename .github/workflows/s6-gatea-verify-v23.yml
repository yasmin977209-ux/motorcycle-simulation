name: S6 Gate A Golden preparer verification v2.3

on:
  push:
    branches:
      - "tmp/s4-c100-golden-v23-20261026"
    paths:
      - "scripts/s6_gate_a_golden.py"
      - "tests/test_s6_gate_a_golden.py"
  workflow_dispatch:

concurrency:
  group: s6-gatea-verify-v23-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-golden-preparer:
    name: Validate Gate A Golden preparer contracts without simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile Gate A preparer
        run: python -m compileall -q scripts/s6_gate_a_golden.py tests/test_s6_gate_a_golden.py

      - name: Run non-simulation contract tests
        run: python -m pytest -q tests/test_s6_gate_a_golden.py --junitxml=s6-gatea-verification-junit.xml
