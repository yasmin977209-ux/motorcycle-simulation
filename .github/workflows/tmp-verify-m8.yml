name: tmp-verify-m8

on:
  push:
    branches:
      - "tmp/verify-m8"
    paths-ignore:
      - "results_diag/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-m8:
    name: verify-m8
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/verify-m8
          fetch-depth: 0

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run diagnostic suite
        shell: bash
        run: |
          set +e
          echo "WORKFLOW_COMMIT=$(git rev-parse HEAD)" | tee /tmp/workflow_commit.txt
          echo "CODE_BASE_EXPECTED=e174ac69e5b5f28733671ebebead2ee05378b17b"
          PYTHONPATH=. python tools/diag_m8.py
          rc=$?
          echo "DIAGNOSTIC_EXIT_CODE=$rc" | tee results_diag/06_workflow_status.txt
          exit "$rc"

      - name: Publish results to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_diag
          if git diff --cached --quiet; then
            echo "No diagnostic result changes."
          else
            git commit -m "Record tmp M8 diagnostic results"
            git push origin HEAD:tmp/verify-m8
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmp-verify-m8
          path: results_diag/
          if-no-files-found: error
          retention-days: 7
