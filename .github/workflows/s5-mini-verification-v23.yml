name: S5 v2.3 stochastic mini evidence and worker equivalence

on:
  push:
    branches:
      - "tmp/s5-statistical-gate-v23-20261026"
    paths:
      - ".github/workflows/s5-mini-verification-v23.yml"
      - "stats_integrity.py"
      - "scripts/s5_mini_verification.py"
      - "requirements.txt"
      - "tests/**"
      - "monte_carlo.py"
      - "validation.py"
      - "constants.py"
      - "daily_engine.py"
      - "partner_equity.py"
      - "closure.py"
      - "rng.py"
      - "entities.py"
      - "accounting.py"
      - "guarantee.py"
      - "dateutils.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s5-mini:
    name: Exact serial/parallel stochastic outputs, support bounds and artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare S5 evidence directory
        run: mkdir -p s5_evidence

      - name: Run the complete repository test inventory
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests --junitxml=s5_evidence/junit.xml 2>&1 | tee s5_evidence/pytest.log

      - name: Run actual stochastic mini cohort sequentially and in parallel
        id: s5_run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/s5_mini_verification.py \
            --source-sha "${GITHUB_SHA}" \
            --tested-commit "${GITHUB_SHA}"

      - name: Replace compute-plan runtime placeholder with measured results
        if: steps.s5_run.outcome == 'success'
        shell: bash
        env:
          S5_TESTED_SHA: ${{ github.sha }}
          S5_RUN_ID: ${{ github.run_id }}
          S5_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          benchmark = json.loads(Path("s5_evidence/runtime_benchmark.json").read_text(encoding="utf-8"))
          path = Path("docs/COMPUTE_PLAN.md")
          content = path.read_text(encoding="utf-8")
          begin = "<!-- S5_RUNTIME_BEGIN -->"
          end = "<!-- S5_RUNTIME_END -->"
          if content.count(begin) != 1 or content.count(end) != 1:
              raise SystemExit("S5_RUNTIME_MARKERS_INVALID")
          elapsed = benchmark["elapsed_seconds"]
          throughput = benchmark["throughput_trials_per_second"]
          speedups = benchmark["speedup_vs_sequential"]
          exact = "\n".join([
              f"Actual workflow Run: {os.environ['S5_RUN_ID']} (attempt {os.environ['S5_RUN_ATTEMPT']}); tested source SHA: {os.environ['S5_TESTED_SHA']}.",
              f"Measured mini workload: {benchmark['sample']['actual_trial_executions']} executions, {benchmark['sample']['unique_trial_paths']} unique scenario/trial paths, 20 stochastic scenarios, N=5 each.",
              f"- Sequential total: {elapsed['sequential_seconds']} s; throughput: {throughput['sequential_seconds']} trial/s.",
              f"- Parallel 2 workers total: {elapsed['parallel_2_workers_seconds']} s; throughput: {throughput['parallel_2_workers_seconds']} trial/s; speed-up: {speedups['parallel_2_workers']}x.",
              f"- Parallel 4 workers total: {elapsed['parallel_4_workers_seconds']} s; throughput: {throughput['parallel_4_workers_seconds']} trial/s; speed-up: {speedups['parallel_4_workers']}x.",
              f"- Total measured script elapsed: {benchmark['end_to_end_script_seconds']} s.",
              "S6 estimates are linear extrapolations from this small N=5 cohort, explicitly unmeasured; use them for worker sizing only, then revise with N=300 timings.",
              "C100 was hash-verified and reused from S4 Run 40263424595; it was not rerun."
          ])
          replacement = begin + "\n" + exact + "\n" + end
          left = content.index(begin)
          right = content.index(end, left) + len(end)
          path.write_text(content[:left] + replacement + content[right:], encoding="utf-8")
          PY
          git add docs/COMPUTE_PLAN.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "S5: record measured runtime and S6 compute plan"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce S5 execution evidence gate
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          S5_OUTCOME: ${{ steps.s5_run.outcome }}
        run: |
          set -euo pipefail
          if test "$TEST_OUTCOME" != "success"; then
            echo "S5_GATE_FAIL: complete pytest inventory did not pass." >&2
            exit 1
          fi
          if test "$S5_OUTCOME" != "success"; then
            echo "S5_GATE_FAIL: stochastic mini evidence generation or validation failed." >&2
            exit 1
          fi
          test -s s5_evidence/s5_manifest.json
          test -s s5_evidence/s5_acceptance.json
          test -s s5_evidence/worker_equivalence_manifest.json
          test -s s5_evidence/trials_summary.parquet
          test -s s5_evidence/selection.parquet
          test -s s5_evidence/daily_distribution.parquet
          echo "S5_GATE_PASS: mini evidence exists; formal scenario stability remains unevaluated at N=5."

      - name: Upload complete S5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-mini-v23-${{ github.sha }}
          if-no-files-found: warn
          path: |
            s5_evidence/
            docs/COMPUTE_PLAN.md
