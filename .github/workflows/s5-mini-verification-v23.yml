name: S5 v2.3 stochastic mini evidence and worker equivalence

on:
  push:
    branches:
      - "tmp/s5-statistical-gate-v23-20261026"
    paths:
      - ".github/workflows/s5-mini-verification-v23.yml"
      - "scripts/s5_finalize_docs.py"
      - "stats_integrity.py"
      - "scripts/s5_mini_verification.py"
      - "requirements.txt"
      - "tests/**"
      - "monte_carlo.py"
      - "validation.py"
      - "constants.py"
      - "daily_engine.py"
      - "partner_equity.py"
      - "closure.py"
      - "rng.py"
      - "entities.py"
      - "accounting.py"
      - "guarantee.py"
      - "dateutils.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s5-mini:
    name: Exact serial/parallel stochastic outputs, support bounds and artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      S5_TRIAL_COUNT: "50"
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare S5 evidence directory
        run: mkdir -p s5_evidence

      - name: Run the complete repository test inventory
        id: unit_tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests --junitxml=s5_evidence/junit.xml 2>&1 | tee s5_evidence/pytest.log

      - name: Run actual stochastic mini cohort sequentially and in parallel
        id: s5_run
        shell: bash
        run: |
          set -euo pipefail
          python scripts/s5_mini_verification.py \
            --source-sha "${GITHUB_SHA}" \
            --tested-commit "${GITHUB_SHA}"

      - name: S5-C finalize gate and compute plan after successful S5-B
        id: s5_c
        if: steps.unit_tests.outcome == 'success' && steps.s5_run.outcome == 'success'
        shell: bash
        env:
          S5_TESTED_SHA: ${{ github.sha }}
          S5_RUN_ID: ${{ github.run_id }}
          S5_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python scripts/s5_finalize_docs.py \
            --source-sha "${S5_TESTED_SHA}" \
            --tested-commit "${S5_TESTED_SHA}" \
            --run-id "${S5_RUN_ID}" \
            --run-attempt "${S5_RUN_ATTEMPT}"

      - name: Commit S5-C execution gate and compute plan
        id: s5_c_commit
        if: steps.s5_c.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add docs/stage7/statistical_execution_gate.json docs/COMPUTE_PLAN.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "S5-C: record successful S5-B evidence and OPT-1 policy"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Enforce S5 execution evidence gate
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
          S5_OUTCOME: ${{ steps.s5_run.outcome }}
          S5C_OUTCOME: ${{ steps.s5_c.outcome }}
          S5C_COMMIT_OUTCOME: ${{ steps.s5_c_commit.outcome }}
        run: |
          set -euo pipefail
          if test "$TEST_OUTCOME" != "success"; then
            echo "S5_GATE_FAIL: complete pytest inventory did not pass." >&2
            exit 1
          fi
          if test "$S5_OUTCOME" != "success"; then
            echo "S5_GATE_FAIL: stochastic mini evidence generation or validation failed." >&2
            exit 1
          fi
          if test "$S5C_OUTCOME" != "success" || test "$S5C_COMMIT_OUTCOME" != "success"; then
            echo "S5_GATE_FAIL: S5-C finalization or documentation commit failed." >&2
            exit 1
          fi
          test -s results_stage5/s5_manifest.json
          test -s results_stage5/s5_acceptance.json
          test -s results_stage5/worker_equivalence_manifest.json
          test -s results_stage5/trials_summary.parquet
          test -s results_stage5/selection.parquet
          test -s results_stage5/daily_distribution.parquet
          echo "S5_GATE_PASS: N=50 per stochastic scenario, second-pass representative fingerprints and OPT-1 sample evidence validated; formal scenario stability remains unevaluated below N=300."

      - name: Upload complete S5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-mini-v23-${{ github.sha }}
          if-no-files-found: warn
          path: |
            s5_evidence/
            results_stage5/
            docs/COMPUTE_PLAN.md
            docs/stage7/statistical_execution_gate.json
