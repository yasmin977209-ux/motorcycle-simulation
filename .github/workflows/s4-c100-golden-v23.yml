name: S4 C100 v2.3 new-source Golden

on:
  push:
    branches:
      - "tmp/s4-c100-golden-v23-20261026"
    paths-ignore:
      - "docs/golden/**"
      - "docs/audits/**"
      - "docs/continuity/**"
      - "s4_evidence/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  s4-c100:
    name: P50 rule, full pytest inventory, and 1,500 deterministic C100 trials
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      S4_SOURCE_SHA: "965281d52441cd0d4b744e211c9f68ee4cdc3753"
      S4_COHORT_ID: "c100-v23-s4-20261026-965281d5"
      S4_C100_TRIAL_COUNT: "300"
      S4_REFERENCE_BLOB_SHA: "4c9a84e034a97cde4bc0c2ff54e96c7f47428860"
      S4_RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - name: Checkout exact workflow candidate with source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project requirements
        run: python -m pip install -r requirements.txt

      - name: Preflight source identity, reference fixture, and protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "tmp/s4-c100-golden-v23-20261026"
          test "${GITHUB_REF_NAME}" != "main"
          git cat-file -e "${S4_SOURCE_SHA}^{commit}"
          git cat-file -e "${S4_SOURCE_SHA}:stats_integrity.py"
          git cat-file -e "${S4_SOURCE_SHA}:monte_carlo.py"
          MODEL_FILES=(
            constants.py dateutils.py rng.py entities.py state_machine.py
            daily_engine.py accounting.py collection.py guarantee.py friday.py
            settlement.py closure.py partner_equity.py monte_carlo.py stats_integrity.py
          )
          if ! git diff --quiet "${S4_SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"; then
            echo "S4_SOURCE_IDENTITY_DRIFT: model source differs from declared SOURCE_SHA" >&2
            git diff --name-status "${S4_SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"
            exit 1
          fi
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import constants
          ref_path = Path("docs/audits/S4_C100_REFERENCE_21_8.json")
          ref = json.loads(ref_path.read_text(encoding="utf-8"))
          assert ref["historical_comparison_only"] is True
          assert len(ref["snapshots"]) == 11
          assert len(ref["first_expansion_bikes"]) == 3
          assert constants.C100_STATISTICAL_START_TRIALS == int(os.environ["S4_C100_TRIAL_COUNT"])
          print(json.dumps({
              "source_sha": os.environ["S4_SOURCE_SHA"],
              "cohort_id": os.environ["S4_COHORT_ID"],
              "N0": constants.C100_STATISTICAL_START_TRIALS,
              "scenarios": [f"C100_G{rate:03d}" for rate in constants.GUARANTEE_RECOVERY_RATES],
              "reference_fixture_git_blob_sha": os.environ["S4_REFERENCE_BLOB_SHA"],
              "reference_fixture_sha256": hashlib.sha256(ref_path.read_bytes()).hexdigest(),
              "historical_comparison_only": True,
              "main_write": False,
          }, sort_keys=True))
          PY

      - name: Run the full pytest inventory including P50, Test 169, 190, and 193
        id: unit_tests
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p s4_evidence
          set +e
          python -m pytest -q tests --junitxml=s4_evidence/junit.xml 2>&1 | tee s4_evidence/full-suite.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "${rc}" > s4_evidence/pytest-exit-code.txt
          sha256sum s4_evidence/full-suite.log s4_evidence/junit.xml 2>&1 | tee s4_evidence/pytest-hashes.txt
          echo "S4_PYTEST_EXIT_CODE=${rc}" >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

      - name: Run the five C100 scenarios for trial IDs 1 through 300
        id: s4_run
        if: ${{ steps.unit_tests.outcome }} == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/s4_c100_golden.py

      - name: Commit only the S4 output or explicit failure record
        if: always() && ${{ steps.unit_tests.outcome }} == 'success' && ${{ steps.s4_run.outcome }} != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audits/R4_S4_C100_P50_GOLDEN_2026-10-26.md
          for path in \
            "docs/golden/v2.3/C100_GOLDEN_${S4_SOURCE_SHA}.json" \
            "docs/audits/S4_C100_GOLDEN_MANIFEST_${S4_SOURCE_SHA}.json" \
            "docs/audits/S4_C100_GOLDEN_REPORT_${S4_SOURCE_SHA}.md" \
            "docs/audits/UNDEFINED_BUSINESS_RULE_S4_C100_${S4_SOURCE_SHA}.json" \
            "docs/audits/S4_EXECUTION_FAILURE_C100_${S4_SOURCE_SHA}.json"; do
            if test -f "${path}"; then git add "${path}"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "S4: record exact C100 v2.3 run evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "S4_OUTPUT_COMMIT=NO_CHANGES"
          fi

      - name: Upload exact run logs and S4 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4-c100-v23-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            s4_evidence/
            docs/golden/v2.3/C100_GOLDEN_${{ env.S4_SOURCE_SHA }}.json
            docs/audits/S4_C100_GOLDEN_MANIFEST_${{ env.S4_SOURCE_SHA }}.json
            docs/audits/S4_C100_GOLDEN_REPORT_${{ env.S4_SOURCE_SHA }.md
            docs/audits/UNDEFINED_BUSINESS_RULE_S4_C100_${{ env.S4_SOURCE_SHA }}.json
            docs/audits/S4_EXECUTION_FAILURE_C100_${{ env.S4_SOURCE_SHA }}.json
            docs/audits/R4_S4_C100_P50_GOLDEN_2026-10-26.md

      - name: Enforce S4 executable gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ steps.unit_tests.outcome }}" != "success"; then
            echo "S4_GATE_FAIL: full test inventory failed; C100 was not started." >&2
            exit 1
          fi
          if test "${{ steps.s4_run.outcome }}" != "success"; then
            echo "S4_GATE_FAIL: C100 run did not pass; inspect the uploaded evidence and failure record." >&2
            exit 1
          fi
          test -f "docs/golden/v2.3/C100_GOLDEN_${S4_SOURCE_SHA}.json"
          echo "S4_GATE_PASS: 177 UNIQUE tests plus C100 1500-trial deterministic Golden."
