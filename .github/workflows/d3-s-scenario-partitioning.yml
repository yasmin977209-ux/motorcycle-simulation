name: D3-S Surgical OOXML Partitioning and Reassembly — final exact-head execution
on:
  push:
    branches: [tmp/d1-rebuild-20261101]
    paths:
      - scripts/d3_s_ooxml_partition.py
      - scripts/d3_s_create_transport_chunks.py
      - scripts/test_d3_18_manifest_remote_readback.py
      - .github/workflows/d3-s-scenario-partitioning.yml
      - docs/stage_d/D3_18_INVOCATION_RECONCILIATION_2026-11-05.json
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: d3-s-ooxml-${{ github.ref }}
  cancel-in-progress: false
jobs:
  partition:
    name: D3-S1/S2 ${{ matrix.lang }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lang: EN
            member: deliverables/Full_Results_EN.xlsx
            expected_bytes: 259442692
            expected_sha256: 8b14ec0b2555beae117d453722abc6c733b49ef941bfa8b3e15d299d7983d77d
          - lang: AR
            member: deliverables/النتائج_الكاملة_AR.xlsx
            expected_bytes: 259444534
            expected_sha256: e6617de7799e9a1ee00533e9e5eb77da3ab7d32d3c9d6940fcb87dd04afcbc5d
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install OOXML and workbook validators
        run: python -m pip install --disable-pip-version-check lxml==5.3.0 openpyxl==3.1.5 requests==2.32.3
      - name: Download and verify pinned original D3 Artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MEMBER: ${{ matrix.member }}
          EXPECTED_BYTES: ${{ matrix.expected_bytes }}
          EXPECTED_SHA256: ${{ matrix.expected_sha256 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, requests, zipfile
          repo="yasmin977209-ux/motorcycle-simulation"
          aid=13288779998
          expected_artifact_bytes=535567142
          expected_artifact_sha="e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe"
          headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json"}
          meta=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",headers=headers,timeout=45)
          meta.raise_for_status(); item=meta.json()
          if item.get("expired") or item.get("size_in_bytes")!=expected_artifact_bytes or item.get("digest")!=f"sha256:{expected_artifact_sha}":
            raise SystemExit("D3_SOURCE_ARTIFACT_METADATA_PIN_MISMATCH")
          response=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip",headers=headers,stream=True,timeout=(45,180))
          response.raise_for_status()
          p=pathlib.Path("d3-source.zip"); h=hashlib.sha256(); count=0
          with p.open("wb") as f:
            for chunk in response.iter_content(1024*1024):
              if chunk: f.write(chunk); h.update(chunk); count+=len(chunk)
          if count!=expected_artifact_bytes or h.hexdigest()!=expected_artifact_sha:
            raise SystemExit(f"D3_SOURCE_ARTIFACT_RAW_HASH_MISMATCH:{count}:{h.hexdigest()}")
          with zipfile.ZipFile(p) as z:
            if z.testzip(): raise SystemExit("D3_SOURCE_ARTIFACT_ZIP_CRC_FAILURE")
            member=os.environ["MEMBER"]
            if member not in z.namelist(): raise SystemExit("D3_WORKBOOK_MEMBER_MISSING:"+member)
            raw=z.read(member)
          if len(raw)!=int(os.environ["EXPECTED_BYTES"]) or hashlib.sha256(raw).hexdigest()!=os.environ["EXPECTED_SHA256"]:
            raise SystemExit("D3_WORKBOOK_RAW_HASH_MISMATCH:"+member)
          out=pathlib.Path("d3-s-source")/("source.xlsx")
          out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(raw)
          print(f"VERIFIED_D3_SOURCE_ARTIFACT={aid} bytes={count} sha256={h.hexdigest()}")
          print(f"VERIFIED_WORKBOOK={member} bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}")
          PY
      - name: D3-S1 surgical OOXML filtering and D3-S2 byte-exact reassembly
        env:
          D3_SOURCE_ARTIFACT_ID: "13288779998"
          D3_SOURCE_RUN_ID: "41754147172"
          D3_SOURCE_ARTIFACT_SHA256: "e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe"
        run: |
          set -euo pipefail
          python scripts/d3_s_ooxml_partition.py --source d3-s-source/source.xlsx --lang "${{ matrix.lang }}" --outdir "d3-s-output/${{ matrix.lang }}"
      - name: Validate output inventory and preserve D3-18 scoped invocation record
        env:
          LANG_CODE: ${{ matrix.lang }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          out=pathlib.Path("d3-s-output")/os.environ["LANG_CODE"]
          xlsx=sorted(p.name for p in out.glob("*.xlsx"))
          if len(xlsx)!=5: raise SystemExit(f"PARTITION_OUTPUT_COUNT_NOT_5:{xlsx}")
          coverage=json.loads((out/f"D3_S_{os.environ['LANG_CODE']}_SCENARIO_COVERAGE.json").read_text())
          if sum(len(v) for v in coverage.values())!=25: raise SystemExit("SCENARIO_COVERAGE_NOT_25_OF_25")
          record=json.loads(pathlib.Path("docs/stage_d/D3_18_INVOCATION_RECONCILIATION_2026-11-05.json").read_text())
          if record.get("gate",{}).get("d3_18")!="PASS_SCOPED" or not record.get("acceptance",{}).get("workflow_run_id") or not record.get("acceptance",{}).get("job_id"):
            raise SystemExit("D3_18_PRIOR_SCOPED_INVOCATION_EVIDENCE_INVALID")
          print("D3_18_PRIOR_RUN_ID="+str(record["acceptance"]["workflow_run_id"]))
          print("D3_18_PRIOR_JOB_ID="+str(record["acceptance"]["job_id"]))
          print("D3_18_TESTED_WORKFLOW_HEAD_SHA="+str(record["acceptance"]["workflow_head_sha"]))
          print("D3_18_PRIOR_LEDGER_CLASSIFICATION=PASS_SCOPED; actual invocation is performed in the independent D3-18 job")
          PY
      - name: Upload language-specific partition outputs and evidence
        uses: actions/upload-artifact@v4
        with:
          name: D3-S-${{ matrix.lang }}-partitions
          path: |
            d3-s-output/${{ matrix.lang }}/*.xlsx
            d3-s-output/${{ matrix.lang }}/*.json
            d3-s-output/${{ matrix.lang }}/*.txt
          if-no-files-found: error
          retention-days: 30
  d3-18:
    name: D3-18 Manifest and Exact-HEAD Raw Readback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install D3-18 readback dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Invoke D3-18 actual test against GitHub Raw
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/test_d3_18_manifest_remote_readback.py
      - name: Upload D3-18 actual invocation evidence
        uses: actions/upload-artifact@v4
        with:
          name: D3-18-Manifest-Exact-Head-Readback
          path: d3-18-output/D3_18_ACTUAL_INVOCATION_2026-11-06.json
          if-no-files-found: error
          retention-days: 30
  aggregate:
    name: Publish combined D3-S evidence
    needs: partition
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download both language partition artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: D3-S-*-partitions
          merge-multiple: true
          path: combined-d3-s
      - name: Verify ten-workbook combined inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path("combined-d3-s")
          books=sorted(root.glob("*.xlsx"))
          if len(books)!=10: raise SystemExit(f"COMBINED_PARTITION_COUNT_NOT_10:{len(books)}")
          manifests=sorted(root.glob("D3_S_*_MANIFEST.json"))
          if len(manifests)!=2: raise SystemExit("LANGUAGE_MANIFEST_COUNT_NOT_2")
          for p in books: print(f"{p.name} {p.stat().st_size} {hashlib.sha256(p.read_bytes()).hexdigest()}")
          manifest_data=[json.loads(p.read_text(encoding="utf-8")) for p in manifests]
          if any(m.get("reassembly",{}).get("status")!="PASS_SCOPED_BYTE_EXACT_WORKSHEET_REASSEMBLY" for m in manifest_data):
            raise SystemExit("D3_S_REASSEMBLY_STATUS_NOT_PASS")
          if any(m.get("semantic_numeric_equivalence",{}).get("status")!="PASS_SCOPED_BY_EXACT_WORKSHEET_XML_BYTES" for m in manifest_data):
            raise SystemExit("D3_S_SEMANTIC_NUMERIC_EQUIVALENCE_NOT_PASS")
          if any(m.get("source",{}).get("sheet_count")!=185 or m.get("partition_count")!=5 for m in manifest_data):
            raise SystemExit("D3_S_SOURCE_OR_PARTITION_COUNT_MISMATCH")
          report={"status":"PASS_SCOPED","tested_sha":"${{ github.sha }}","workflow_run_id":"${{ github.run_id }}","partition_workbooks":10,"languages":["EN","AR"],"scenario_coverage":"25/25 per language","semantic_numeric_equivalence":"PASS_SCOPED_BY_EXACT_WORKSHEET_XML_BYTES","byte_exact_reassembly":"PASS_SCOPED","manifests":[p.name for p in manifests]}
          (root/"D3_S_COMBINED_RUN_REPORT.json").write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          PY
      - name: Publish combined D3-S Artifact
        uses: actions/upload-artifact@v4
        with:
          name: D3-S-10-workbooks-and-equivalence-evidence
          path: combined-d3-s/*
          if-no-files-found: error
          retention-days: 30
      - name: Build and raw-byte verify 80 MiB OneDrive transport parts
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/d3_s_create_transport_chunks.py --source-dir combined-d3-s --output-dir transport-parts
      - name: Publish OneDrive transport part D3S-000
        uses: actions/upload-artifact@v4
