name: U2 ordered reference correction validation

on:
  push:
    branches:
      - "u2/verify-ordered-tests-20261025"

permissions:
  contents: read

jobs:
  ordered-u2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Prepare isolated evidence
        run: mkdir -p u2_validation

      - name: "U2-1 Friday eligibility and stored contract date"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_acceptance_16_v2.py -k 'test_019 or test_020 or test_021 or test_022 or test_023 or test_024' 2>&1 | tee u2_validation/item1-friday.log
          a=${PIPESTATUS[0]}
          python -m pytest -q tests/test_u2_reference_corrections.py::test_168_first_eligible_friday_is_stored_per_secondary_contract 2>&1 | tee -a u2_validation/item1-friday.log
          b=${PIPESTATUS[0]}
          rc=0; if [ "$a" -ne 0 ] || [ "$b" -ne 0 ]; then rc=1; fi
          echo "U2_ITEM1_RC=$rc" >> "$GITHUB_ENV"
          echo "| 1. تقويم الجمعة | الاختبارات 19–24 و168 | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-2 settlement start and exact day-30 failure"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_acceptance_16_v2.py tests/test_u2_reference_corrections.py -k 'test_046 or test_047 or test_052 or test_053 or test_054 or test_055 or test_164 or test_165' 2>&1 | tee u2_validation/item2-settlement.log
          rc=${PIPESTATUS[0]}
          echo "U2_ITEM2_RC=$rc" >> "$GITHUB_ENV"
          echo "| 2. التسوية R8 | 46 و47 و52–55 و164–165 | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-3 one expansion purchase per day"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_u2_reference_corrections.py::test_166_m2_purchases_at_most_one_expansion_bike_per_day 2>&1 | tee u2_validation/item3-m2.log
          rc=${PIPESTATUS[0]}
          echo "U2_ITEM3_RC=$rc" >> "$GITHUB_ENV"
          echo "| 3. M2 شراء واحد | 166 | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-4 customs and cash roll-forward"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_u2_reference_corrections.py::test_167_customs_are_in_investing_cash_outflows_and_cash_rollforward tests/test_stage3b_rollforward.py::test_ch10_rollforward_equations_and_fixed_fields 2>&1 | tee u2_validation/item4-customs-rollforward.log
          rc=${PIPESTATUS[0]}
          echo "U2_ITEM4_RC=$rc" >> "$GITHUB_ENV"
          echo "| 4. الجمارك والتدفق النقدي | 167 وRoll-forward | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-5 central partner allocation helpers"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_stage3b_partner_equity.py tests/test_u2_reference_corrections.py::test_partner_split_has_one_algorithm_and_inflows_use_allocator 2>&1 | tee u2_validation/item5-partner-allocation.log
          a=${PIPESTATUS[0]}
          python -m pytest -q tests/test_acceptance_16_v2.py -k 'test_120 or test_121 or test_122 or test_123 or test_124 or test_125' 2>&1 | tee -a u2_validation/item5-partner-allocation.log
          b=${PIPESTATUS[0]}
          rc=0; if [ "$a" -ne 0 ] || [ "$b" -ne 0 ]; then rc=1; fi
          echo "U2_ITEM5_RC=$rc" >> "$GITHUB_ENV"
          echo "| 5. التوزيع المركزي 70/30 | 120–125 واختبارات partner_equity | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-6 unified names and numeric constants"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_u2_reference_corrections.py -k 'test_177 or test_178' 2>&1 | tee u2_validation/item6-names-constants.log
          rc=${PIPESTATUS[0]}
          echo "U2_ITEM6_RC=$rc" >> "$GITHUB_ENV"
          echo "| 6. التسميات والأرقام المرمّزة | 177–178 | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-7 collection-level RNG and integer threshold"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_acceptance_16_v2.py tests/test_u2_reference_corrections.py -k 'test_126 or test_128 or test_129 or test_132 or test_171' 2>&1 | tee u2_validation/item7-rng.log
          rc=${PIPESTATUS[0]}
          echo "U2_ITEM7_RC=$rc" >> "$GITHUB_ENV"
          echo "| 7. RNG وربط البذور والحساب الصحيح | 126 و128 و129 و132 و171 | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: "U2-8 lifecycle fields, reserved M10, M15.3, and stall detector"
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_acceptance_16_v2.py tests/test_u2_reference_corrections.py -k 'test_155 or test_pending_writeoff_today_is_consumed_by_m16 or test_m13_failure_claim_uses_recovery_rate_pct_in_daily_sequence or test_m15_3_final_closure_receivable_uses_scenario_recovery_rate or test_173' 2>&1 | tee u2_validation/item8-lifecycle-stall.log
          a=${PIPESTATUS[0]}
          python - <<'PY' 2>&1 | tee -a u2_validation/item8-lifecycle-stall.log
          import inspect
          import daily_engine
          source = inspect.getsource(daily_engine.run_day)
          assert "daily_engine._m10" not in source and "self._m10" not in source
          print("M10_RESERVED_PASS")
          PY
          b=${PIPESTATUS[0]}
          rc=0; if [ "$a" -ne 0 ] || [ "$b" -ne 0 ]; then rc=1; fi
          echo "U2_ITEM8_RC=$rc" >> "$GITHUB_ENV"
          echo "| 8. الحقول وM10 وM15.3 والجمود | 155 و173 واختبارات دورة الحياة | $([ "$rc" -eq 0 ] && echo PASS || echo FAIL) |" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Enforce all ordered U2 test gates
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for n in 1 2 3 4 5 6 7 8; do
            var="U2_ITEM${n}_RC"
            rc="${!var:-missing}"
            echo "U2_ITEM${n}_RC=$rc"
            if [ "$rc" != "0" ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "U2_ORDERED_TEST_GATE=FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "U2_ORDERED_TEST_GATE=PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload U2 item-by-item test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u2-ordered-test-evidence-${{ github.run_id }}
          path: u2_validation/
          if-no-files-found: error
