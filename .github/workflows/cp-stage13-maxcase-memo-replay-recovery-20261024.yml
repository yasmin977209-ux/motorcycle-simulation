name: CP Stage 13 exact MaxCase memo-balance replay recovery

on:
  push:
    branches:
      - "tmp/cp-stage13-current-main-integration-20261021"
    paths:
      - "scripts/stage13_maxcase_replay_recovery.py"
      - "tests/test_stage13_maxcase_replay_recovery.py"
      - ".github/workflows/cp-stage13-maxcase-memo-replay-recovery-20261024.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: cp-stage13-maxcase-memo-replay-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-selected-trial-replay:
    name: Replay ten exact selected MaxCase Trials against canonical evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact authorized candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Prepare recovery evidence directory
        run: mkdir -p stage13_recovery_input stage13_recovery_output
      - name: Compile recovery utility
        run: python -m compileall -q scripts/stage13_maxcase_replay_recovery.py
      - name: Run recovery-plan contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage13_maxcase_replay_recovery.py
      - name: Download and verify the immutable Stage 12/MaxCase audit artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="stage13_recovery_input/source-audit.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12544311885/zip" > "$archive"
          printf '%s  %s\n' "93b150e5d3360c8d160f3facad85c28dc676819466ed3fded3167bcb703c3f32" "$archive" | sha256sum --check -
          unzip -q "$archive" -d stage13_recovery_input
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "stage13_maxcase_source_audit.json": "f599e59d5e8fa66e42a4bff7f42849bf7a627f79c88a48fd44bf519632bdb468",
              "stage13_maxcase_daily_payloads.json": "c2c0e2b9541534c59901bbcd369f4d9cf6e630f35c0f7b18b8ce542e3ca52e9d",
          }
          for name, sha in expected.items():
              path = Path("stage13_recovery_input") / name
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != sha:
                  raise SystemExit(f"INPUT_SHA256_MISMATCH {name}: expected={sha} actual={actual}")
          print("Immutable audit and paired daily-payload JSON digests verified.")
          PY
      - name: Replay the ten approved Trial IDs and reconcile daily accounting rows
        env:
          PYTHONPATH: .
        run: |
          python -m scripts.stage13_maxcase_replay_recovery \
            --audit stage13_recovery_input/stage13_maxcase_source_audit.json \
            --payloads stage13_recovery_input/stage13_maxcase_daily_payloads.json \
            --output stage13_recovery_output/stage13_maxcase_replay_recovery.json
      - name: Record tested source identity and output digest
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          output = Path("stage13_recovery_output/stage13_maxcase_replay_recovery.json")
          record = {
              "tested_head_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "recovery_script_git_blob_sha": subprocess.check_output(
                  ["git", "hash-object", "scripts/stage13_maxcase_replay_recovery.py"], text=True
              ).strip(),
              "workflow_run_id": "${{ github.run_id }}",
              "output_exists": output.is_file(),
              "output_sha256": hashlib.sha256(output.read_bytes()).hexdigest() if output.is_file() else None,
              "source_commit": "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b",
              "source_audit_artifact_id": 12537818827,
              "new_trial_ids_created": False,
              "canonical_stage12_files_modified": False,
              "production_workbook_built": False,
          }
          Path("stage13_recovery_output/source_identity.json").write_text(
              json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload exact replay recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-maxcase-replay-recovery-${{ github.run_id }}
          path: stage13_recovery_output/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
