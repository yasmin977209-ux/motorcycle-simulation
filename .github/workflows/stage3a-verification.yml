name: stage3a-verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3a:
    name: stage3a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Execute Stage 3A and regression groups
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          : > /tmp/stage3a_status

          run_group() {
            local label="$1"
            shift
            local output rc summary
            output="$(python -m pytest -q "$@" 2>&1)"
            rc=$?
            printf '%s\n' "$output"
            summary="$(printf '%s\n' "$output" | tail -1)"
            printf '%s|%s|%s\n' "$label" "$rc" "$summary" >> /tmp/stage3a_status
          }

          run_group "CH5" tests/test_stage3a.py -k "ch5"
          run_group "CH6" tests/test_stage3a.py -k "ch6"
          run_group "CH7" tests/test_stage3a.py -k "ch7"
          run_group "CH8" tests/test_stage3a.py -k "ch8"
          run_group "CH9" tests/test_stage3a.py -k "ch9"
          run_group "STAGE1_REGRESSION" tests/test_stage1.py
          run_group "STAGE2_REGRESSION" tests/test_stage2.py

          overall=0
          {
            printf '\n| Test group | Status | Actual pytest summary |\n'
            printf '|---|---|---|\n'
            while IFS='|' read -r label rc summary; do
              if [ "$rc" -eq 0 ]; then
                status="PASS"
              else
                status="FAIL"
                overall=1
              fi
              case "$label" in
                CH5) display="Chapter 5 unit tests" ;;
                CH6) display="Chapter 6 unit tests" ;;
                CH7) display="Chapter 7 unit tests" ;;
                CH8) display="Chapter 8 unit tests" ;;
                CH9) display="Chapter 9 unit tests" ;;
                STAGE1_REGRESSION) display="Stage 1 regression" ;;
                STAGE2_REGRESSION) display="Stage 2 regression" ;;
                *) display="$label" ;;
              esac
              printf '| %s | %s | %s |\n' "$display" "$status" "$summary"
            done < /tmp/stage3a_status
            printf '| Tests 127, 159, 160, 161 | DEFERRED | later-stage inputs |\n'
            printf '| Test 158 | ADJUDICATION | rule 8 conflict retained |\n'
          } | tee /tmp/stage3a_summary
          cat /tmp/stage3a_summary >> "$GITHUB_STEP_SUMMARY"

          exit "$overall"
