name: stage3a-verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3a:
    name: stage3a
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Execute Stage 3A tests and render actual status table
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          overall=0

          run_group() {
            local label="$1"
            shift
            local output
            output="$(python -m pytest -q "$@" 2>&1)"
            local rc=$?
            printf '%s\n' "$output"
            if [ "$rc" -eq 0 ]; then
              printf '%s=PASS\n' "$label" >> /tmp/stage3a_status
            else
              printf '%s=FAIL\n' "$label" >> /tmp/stage3a_status
              overall=1
            fi
          }

          : > /tmp/stage3a_status

          run_group CH5 tests/test_stage3a.py -k test_ch5
          run_group CH6 tests/test_stage3a.py -k test_ch6
          run_group CH7 tests/test_stage3a.py -k test_ch7
          run_group CH8 tests/test_stage3a.py -k test_ch8
          run_group CH9 tests/test_stage3a.py -k test_ch9
          run_group PATHS_44 tests/test_stage2.py -k "reference_path"

          mkdir -p /tmp/acceptance_runtime
          cat stage7_source/source.b64.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "c7429d1a31037e98201a05ed98b62c9c68118b2fda89064804d2d2cea2dfed79  /tmp/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C /tmp/acceptance_runtime
          cp /tmp/acceptance_runtime/tests/test_acceptance_16_full.py tests/test_acceptance_16_full.py

          # Stage-specific filtering is applied in CI; the acceptance source is unchanged.
          # 127/159/160/161 require later-stage data; 158 is adjudication-only.
          acceptance_output="$(python -m pytest -q tests/test_acceptance_16_full.py -k 'not test_127 and not test_158 and not test_159 and not test_160 and not test_161' 2>&1)"
          acceptance_rc=$?
          printf '%s\n' "$acceptance_output"
          rm -f tests/test_acceptance_16_full.py

          if printf '%s' "$acceptance_output" | grep -Eq 'ModuleNotFoundError|ImportError|cannot import name'; then
            printf 'ACCEPTANCE_163=WORKFLOW_DEFECT\n' >> /tmp/stage3a_status
            overall=1
          else
            summary="$(printf '%s\n' "$acceptance_output" | grep -E '[0-9]+ passed|[0-9]+ failed' | tail -1 || true)"
            passed="$(printf '%s\n' "$summary" | grep -oE '[0-9]+ passed' | awk '{print $1}' | head -1 || true)"
            failed="$(printf '%s\n' "$summary" | grep -oE '[0-9]+ failed' | awk '{print $1}' | head -1 || true)"
            printf 'ACCEPTANCE_RUNNABLE_SUMMARY=%s\n' "$summary" >> /tmp/stage3a_status
            printf 'ACCEPTANCE_PASS=%s\n' "${passed:-0}" >> /tmp/stage3a_status
            printf 'ACCEPTANCE_FAIL=%s\n' "${failed:-0}" >> /tmp/stage3a_status
            printf 'ACCEPTANCE_DEFERRED=4\n' >> /tmp/stage3a_status
            printf 'ACCEPTANCE_ADJUDICATION=1\n' >> /tmp/stage3a_status
            if [ "$acceptance_rc" -eq 0 ]; then
              printf 'ACCEPTANCE_163=PASS\n' >> /tmp/stage3a_status
            else
              printf 'ACCEPTANCE_163=FAIL\n' >> /tmp/stage3a_status
              overall=1
            fi
          fi

          printf '\n| Test group | Status |\n|---|---|\n'
          while IFS='=' read -r label status; do
            case "$label" in
              CH5) printf '| Chapter 5 unit tests | %s |\n' "$status" ;;
              CH6) printf '| Chapter 6 unit tests | %s |\n' "$status" ;;
              CH7) printf '| Chapter 7 unit tests | %s |\n' "$status" ;;
              CH8) printf '| Chapter 8 unit tests | %s |\n' "$status" ;;
              CH9) printf '| Chapter 9 unit tests | %s |\n' "$status" ;;
              PATHS_44) printf '| Chapter 4.4 regression paths | %s |\n' "$status" ;;
              ACCEPTANCE_163) printf '| Acceptance gate after stage filtering | %s |\n' "$status" ;;
              ACCEPTANCE_PASS) printf '| Acceptance PASS (actual pytest output) | %s |\n' "$status" ;;
              ACCEPTANCE_FAIL) printf '| Acceptance FAIL (actual pytest output) | %s |\n' "$status" ;;
              ACCEPTANCE_DEFERRED) printf '| Acceptance DEFERRED (later-stage data) | %s |\n' "$status" ;;
              ACCEPTANCE_ADJUDICATION) printf '| Acceptance ADJUDICATION | %s |\n' "$status" ;;
              ACCEPTANCE_RUNNABLE_SUMMARY) printf '| Acceptance pytest summary | %s |\n' "$status" ;;
            esac
          done < /tmp/stage3a_status
          printf '| test_158 | ADJUDICATION_REQUIRED |\n'
          exit "$overall"
