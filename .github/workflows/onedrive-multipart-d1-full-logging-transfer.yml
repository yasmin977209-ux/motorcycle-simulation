name: OneDrive Multipart Transport for D1 Full Logging
on:
  push:
    branches: [tmp/d1-rebuild-20261101]
    paths:
      - .github/workflows/onedrive-multipart-d1-full-logging-transfer.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: onedrive-multipart-d1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  split:
    name: Verify and split exact D1 Full Logging artifact for OneDrive transfer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded transfer dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Download, raw-hash verify, CRC-check and split into 80 MiB transport parts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib,requests,zipfile
          repo="yasmin977209-ux/motorcycle-simulation"; aid=12998778418
          expected_size=310827203
          expected_sha="403371cc8eb12880dda05529b4c83dd675bfa609e8680c09d35efa729c5b5aeb"
          chunk_size=80*1024*1024
          headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],"Accept":"application/vnd.github+json"}
          meta=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",headers=headers,timeout=60)
          meta.raise_for_status(); item=meta.json()
          if item.get("expired") or item.get("size_in_bytes")!=expected_size or item.get("digest")!="sha256:"+expected_sha:
            raise SystemExit("D1_SOURCE_ARTIFACT_METADATA_PIN_MISMATCH")
          response=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip",headers=headers,stream=True,timeout=(60,300))
          response.raise_for_status()
          root=pathlib.Path("split-output"); root.mkdir(exist_ok=True)
          source=root/"D1.source.zip"; h=hashlib.sha256(); size=0
          with source.open("wb") as out:
            for block in response.iter_content(4*1024*1024):
              if block: out.write(block); h.update(block); size+=len(block)
          if size!=expected_size or h.hexdigest()!=expected_sha:
            raise SystemExit(f"D1_SOURCE_RAW_SHA256_MISMATCH:{size}:{h.hexdigest()}")
          with zipfile.ZipFile(source) as z:
            bad=z.testzip()
            if bad: raise SystemExit("D1_SOURCE_ZIP_CRC_FAILURE:"+bad)
          parts=[]
          with source.open("rb") as src:
            index=0
            while True:
              block=src.read(chunk_size)
              if not block: break
              name=f"D1.part{index:03d}.bin"; digest=hashlib.sha256(block).hexdigest()
              (root/name).write_bytes(block)
              record={"source_artifact_id":aid,"source_bytes":size,"source_sha256":h.hexdigest(),
                "part_index":index,"part_count":(size+chunk_size-1)//chunk_size,"offset_bytes":index*chunk_size,
                "part_name":name,"part_bytes":len(block),"part_sha256":digest}
              (root/f"D1.part{index:03d}.json").write_text(json.dumps(record,sort_keys=True,indent=2)+"\n")
              parts.append(record); index+=1
          if len(parts)!=4: raise SystemExit("D1_EXPECTED_FOUR_PARTS")
          restore={"schema_version":"onedrive-multipart-transport-v1","tested_sha":"${{ github.sha }}","chunk_size_bytes":chunk_size,
            "sources":{"D1":{"artifact_id":aid,"source_bytes":size,"source_sha256":h.hexdigest(),"part_count":len(parts),"parts":parts}}}
          (root/"D1_RESTORE_MANIFEST.json").write_text(json.dumps(restore,sort_keys=True,indent=2)+"\n")
          print(f"VERIFIED_AND_SPLIT kind=D1 bytes={size} sha256={h.hexdigest()} parts={len(parts)}")
          PY
      - name: Publish OneDrive transport part D1-000
        uses: actions/upload-artifact@v4
        with:
          name: OD-Multipart-D1-000
          path: |
            split-output/D1.part000.bin
            split-output/D1.part000.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish OneDrive transport part D1-001
        uses: actions/upload-artifact@v4
        with:
          name: OD-Multipart-D1-001
          path: |
            split-output/D1.part001.bin
            split-output/D1.part001.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish OneDrive transport part D1-002
        uses: actions/upload-artifact@v4
        with:
          name: OD-Multipart-D1-002
          path: |
            split-output/D1.part002.bin
            split-output/D1.part002.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish OneDrive transport part D1-003
        uses: actions/upload-artifact@v4
        with:
          name: OD-Multipart-D1-003
          path: |
            split-output/D1.part003.bin
            split-output/D1.part003.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish D1 multipart restoration manifest
        uses: actions/upload-artifact@v4
        with:
          name: OD-Multipart-D1-Restore-Manifest
          path: split-output/D1_RESTORE_MANIFEST.json
          if-no-files-found: error
          retention-days: 30
      - name: Exact source tested SHA and transport inventory
        run: |
          echo "ONEDRIVE_D1_MULTIPART_TESTED_SHA=$GITHUB_SHA"
          find split-output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
