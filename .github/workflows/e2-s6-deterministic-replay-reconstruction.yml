name: E2 S6 deterministic accounting replay reconstruction
on:
  push:
    branches: ["tmp/d1-rebuild-20261101"]
    paths:
      - ".github/workflows/e2-s6-deterministic-replay-reconstruction.yml"
      - "scripts/e2_prepare_replay_source.py"
      - "scripts/e2_deterministic_replay_scenario.py"
      - "scripts/e2_replay_aggregate.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
concurrency:
  group: e2-s6-deterministic-replay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    name: Verify owner authorization and pinned source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: a23ba71f48487f3ebead99bc30039b14ef9b7609
          path: execution-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: execution-source/requirements.txt
      - name: Verify explicit owner authorization for Option A
        run: |
          set -euo pipefail
          grep -Fq 'Decision state: OWNER_AUTHORIZED_OPTION_A' docs/post_d/E2_OWNER_DECISION_REQUIRED.md
          grep -Fq 'REPLAY_RECONSTRUCTED_NOT_ORIGINAL_PRESERVED' docs/post_d/E2_OWNER_DECISION_REQUIRED.md
          grep -Fq '48,000 Trials' docs/post_d/E2_OWNER_DECISION_REQUIRED.md
      - name: Verify exact original source run and execution revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C execution-source rev-parse HEAD)" = "a23ba71f48487f3ebead99bc30039b14ef9b7609"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40731224990" --jq '.head_sha == "a23ba71f48487f3ebead99bc30039b14ef9b7609" and .run_attempt == 1' | grep -qx true
      - name: Install dependencies from original execution revision
        run: python -m pip install -r execution-source/requirements.txt
      - name: Prepare overlay and execute fail-closed balance guard tests
        run: |
          set -euo pipefail
          python scripts/e2_prepare_replay_source.py --source-dir execution-source --overlay-dir /tmp/e2-replay-overlay
          PYTHONPATH="/tmp/e2-replay-overlay:$GITHUB_WORKSPACE/execution-source" python -m py_compile scripts/e2_deterministic_replay_scenario.py scripts/e2_replay_aggregate.py
          PYTHONPATH="/tmp/e2-replay-overlay:$GITHUB_WORKSPACE/execution-source" python - <<'PY'
          from scripts.e2_deterministic_replay_scenario import validate_balance
          row={"Cash":1,"Accounts_Receivable":0,"Guarantee_Claim_Receivable":0,"Gross_Bike_Assets":1,"Accumulated_Depreciation":0,"Net_Bike_Assets":1,"Total_Assets":2,"Total_Equity":2,"Liabilities":0,"Balance_Difference":0,"Net_Equity":2,"date":"2027-01-01"}
          validate_balance(row,"C085_G100",1)
          row["Total_Assets"]=1
          row["Balance_Difference"]=-1
          try:
              validate_balance(row,"C085_G100",1)
          except RuntimeError as exc:
              assert "REPLAY_ASSETS_EQUITY_MISMATCH" in str(exc)
          else:
              raise SystemExit("UNBALANCED_ROW_ACCEPTED")
          print("REPLAY_BALANCE_GUARD_TESTS=PASS")
          PY
      - name: Confirm all original scenario Artifacts remain available
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40731224990/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == "a23ba71f48487f3ebead99bc30039b14ef9b7609")] | length' | awk '$1 >= 20 {ok=1} END {exit !ok}'
  replay:
    name: Replay ${{ matrix.scenario }} against its original immutable Artifact
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - scenario: C030_G000
            source_artifact: s6-n2400-C030_G000-40731224990
            source_artifact_id: 12839053751
            source_artifact_digest: "sha256:683133a5619981e6daf76d54dc41b4fedf8082fe9e856a24e512fab3aba85f52"
          - scenario: C030_G030
            source_artifact: s6-n2400-C030_G030-40731224990
            source_artifact_id: 12840210926
            source_artifact_digest: "sha256:b70ec893c3c57b98355738f5a9add9cbb5bad70f9a217fc51640c659f8645488"
          - scenario: C030_G050
            source_artifact: s6-n2400-C030_G050-40731224990
            source_artifact_id: 12840360793
            source_artifact_digest: "sha256:47245a1c5467f683d5dec720a6a11e60661d82f673d1915637ed223bcfaab76c"
          - scenario: C030_G070
            source_artifact: s6-n2400-C030_G070-40731224990
            source_artifact_id: 12840482357
            source_artifact_digest: "sha256:a8335cb1e01c1dc0d164e0d6c7c42fd5ceab32ec06b91c31db75e3f4af470a2a"
          - scenario: C030_G100
            source_artifact: s6-n2400-C030-G100-40731224990
            source_artifact_id: 12836747552
            source_artifact_digest: "sha256:77724045a5ffa52e1845bfed4334e7e82ea90a33f1bce3255ec4327caf294052"
          - scenario: C050_G000
            source_artifact: s6-n2400-C050_G000-40731224990
            source_artifact_id: 12842638708
            source_artifact_digest: "sha256:fb02fb4e36bb0cf113125f3595a45a5ddae43a35e4b27291ca38154810fa8767"
          - scenario: C050_G030
            source_artifact: s6-n2400-C050_G030-40731224990
            source_artifact_id: 12842495430
            source_artifact_digest: "sha256:77f15ce173dc41141c26fa66100a7c382ce0f5d5f1fabd12a8cd6343720ec9b6"
          - scenario: C050_G050
            source_artifact: s6-n2400-C050_G050-40731224990
            source_artifact_id: 12842099758
            source_artifact_digest: "sha256:fa0082a22853dd2ea23856e8cbf4a9698f12807f4831f25a8839947be375c993"
          - scenario: C050_G070
            source_artifact: s6-n2400-C050_G070-40731224990
            source_artifact_id: 12842976168
            source_artifact_digest: "sha256:915eaa21f7f95f90802d371916d5e7b8a7604bcdd1b88341b40859dd9481a3ce"
          - scenario: C050_G100
            source_artifact: s6-n2400-C050-G100-40731224990
            source_artifact_id: 12838242824
            source_artifact_digest: "sha256:7bbf4d50df56d184f175155660add5ba7684d07c955285294261163ee1857f17"
          - scenario: C070_G000
            source_artifact: s6-n2400-C070_G000-40731224990
            source_artifact_id: 12839062393
            source_artifact_digest: "sha256:c1e7bae523dc1b30fe2d21c344a01449ef4867e76bfe63292d5b3621b7694c9c"
          - scenario: C070_G030
            source_artifact: s6-n2400-C070_G030-40731224990
