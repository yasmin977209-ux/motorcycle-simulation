          - scenario: C070_G050
            source_artifact: s6-n2400-C070_G050-40731224990
            source_artifact_id: 12838987686
            source_artifact_digest: "sha256:5f28aa1f273c9bd013bfcd120bc919bce80eb3b58da78b4ce4db0c720e55b60c"
          - scenario: C070_G070
            source_artifact: s6-n2400-C070_G070-40731224990
            source_artifact_id: 12839361726
            source_artifact_digest: "sha256:ce5b38e0af6d41b5ce7415d41dba139b2390019760b236cb24679aea69cd109d"
          - scenario: C070_G100
            source_artifact: s6-n2400-C070-G100-40731224990
            source_artifact_id: 12839945046
            source_artifact_digest: "sha256:5a4c30d6c2c8c31b1ab9f8b72f22f6e624e8a5b85df496bc4dbc58501a7dcc51"
          - scenario: C085_G000
            source_artifact: s6-n2400-C085_G000-40731224990
            source_artifact_id: 12839875625
            source_artifact_digest: "sha256:1aa1f47e8fc8aab7244ba2bf9320434b48c27d7ffae367465092e01209b6df7c"
          - scenario: C085_G030
            source_artifact: s6-n2400-C085_G030-40731224990
            source_artifact_id: 12838339633
            source_artifact_digest: "sha256:bb687a075e229d04388b516f931de967d7bc14b71da7db38e42b3e847ee32293"
          - scenario: C085_G050
            source_artifact: s6-n2400-C085_G050-40731224990
            source_artifact_id: 12839102296
            source_artifact_digest: "sha256:14c87c9f97461f8f372c41d9b64954a94321642c9ae72a6b0e4e76347b7b7e93"
          - scenario: C085_G070
            source_artifact: s6-n2400-C085_G070-40731224990
            source_artifact_id: 12838354545
            source_artifact_digest: "sha256:76bd639a360dfc5ef90cdb83aa9d25c64de619295a576ef8695e11bd5ee76137"
          - scenario: C085_G100
            source_artifact: s6-n2400-C085-G100-40731224990
            source_artifact_id: 12838992458
            source_artifact_digest: "sha256:f6a82fcf0ed75111d492f740a3b6dfa5bc1c9d1fd5dec1dd9950c0e3281665ed"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: a23ba71f48487f3ebead99bc30039b14ef9b7609
          path: execution-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: execution-source/requirements.txt
      - name: Install pinned execution dependencies
        run: python -m pip install -r execution-source/requirements.txt
      - name: Prepare instrumentation overlay
        run: |
          set -euo pipefail
          python scripts/e2_prepare_replay_source.py --source-dir execution-source --overlay-dir /tmp/e2-replay-overlay
          echo "PYTHONPATH=/tmp/e2-replay-overlay:$GITHUB_WORKSPACE/execution-source" >> "$GITHUB_ENV"
      - name: Verify exact original Artifact ID, digest, and source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/${{ matrix.source_artifact_id }}" --jq '[.name,.digest,(.expired|tostring),(.workflow_run.id|tostring),.workflow_run.head_sha]|@tsv')"
          expected="$(printf '%s\t%s\tfalse\t40731224990\ta23ba71f48487f3ebead99bc30039b14ef9b7609' '${{ matrix.source_artifact }}' '${{ matrix.source_artifact_digest }}')"
          test "$actual" = "$expected"
      - name: Download immutable original scenario Artifact
        uses: actions/download-artifact@v4
        with:
          run-id: "40731224990"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ matrix.source_artifact }}
          path: source-artifact
      - name: Execute deterministic 2,400-Trial reconstruction and full daily balance capture
        run: |
          set -euo pipefail
          python scripts/e2_deterministic_replay_scenario.py \
            --scenario "${{ matrix.scenario }}" \
            --source-artifact-dir source-artifact \
            --source-artifact-name "${{ matrix.source_artifact }}" \
            --source-artifact-id "${{ matrix.source_artifact_id }}" \
            --source-artifact-digest "${{ matrix.source_artifact_digest }}" \
            --overlay-dir /tmp/e2-replay-overlay \
            --workers 2 --batch-trials 40 \
            --output-dir "replay-output/${{ matrix.scenario }}"
      - name: Upload new immutable replay-labelled evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-s6-replay-${{ matrix.scenario }}-${{ github.run_id }}
          path: replay-output/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 90
  aggregate:
    name: Verify complete 48,000-Trial replay reconciliation
    if: always() && needs.preflight.result == 'success'
    needs: [preflight, replay]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all available replay scenario evidence
        uses: actions/download-artifact@v4
        with:
          pattern: e2-s6-replay-*-${{ github.run_id }}
          path: replay-scenarios
          merge-multiple: false
      - name: Require exact 20-scenario and 48,000-Trial coverage
        run: |
          set -euo pipefail
          python scripts/e2_replay_aggregate.py --input-root replay-scenarios --output-dir replay-aggregate --run-id "$GITHUB_RUN_ID" --head-sha "$GITHUB_SHA"
      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-s6-replay-aggregate-${{ github.run_id }}
          path: replay-aggregate/
          if-no-files-found: warn
          retention-days: 90
