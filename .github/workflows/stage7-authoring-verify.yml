name: stage7-authoring-verify

on:
  push:
    branches:
      - "tmp/stage7-authoring-20261004"
      - "tmp/cp-stage7-timeout-parallelism-20261019"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyyaml

      - name: AST parse Stage 7 helpers
        run: |
          python -c "import ast; ast.parse(open('scripts/stage7_run_trial_block.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('scripts/stage7_state.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('scripts/stage7_stability.py', encoding='utf-8').read())"

      - name: YAML lint
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/stage7-full-run.yml', encoding='utf-8'))"
          python -c "import yaml; yaml.safe_load(open('.github/workflows/stage7-authoring-verify.yml', encoding='utf-8'))"

      - name: Stage 7 authoring contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_stage7_authoring.py

      - name: All 25 scenarios parse
        run: |
          python - <<'PY'
          import yaml
          import monte_carlo

          spec = yaml.safe_load(
              open(".github/workflows/stage7-full-run.yml", encoding="utf-8")
          )
          scenarios = spec["jobs"]["matrix-simulation"]["strategy"]["matrix"]["scenario"]

          assert len(scenarios) == 25, f"expected 25, got {len(scenarios)}"
          assert len(set(scenarios)) == 25, "duplicate scenarios"

          for scenario in scenarios:
              probability, recovery = monte_carlo.parse_scenario_id(scenario)
              print(scenario, probability, recovery)

          print("ALL_25_OK")
          PY

      - name: Verify JSON newline serialization
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path("scripts/stage7_run_trial_block.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          writes = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and node.func.attr == "write_text"
              and isinstance(node.func.value, ast.Name)
              and node.func.value.id == "metadata_path"
          ]
          assert len(writes) == 1, f"expected one metadata write, got {len(writes)}"
          assert writes[0].args, "metadata write has no content argument"
          expression = writes[0].args[0]
          assert isinstance(expression, ast.BinOp) and isinstance(expression.op, ast.Add), (
              "metadata JSON must append a newline character"
          )
          assert isinstance(expression.right, ast.Constant) and expression.right.value == "\n", (
              "metadata JSON must append a real newline, not a literal backslash-n"
          )
          print("JSON_NEWLINE_SERIALIZATION_OK")
          PY
