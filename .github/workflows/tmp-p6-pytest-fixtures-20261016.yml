name: P6 pytest fixture repair and subprocess diagnostics (temporary)

on:
  push:
    branches:
      - "tmp/p6-pytest-fixture-repair-20261016"

permissions:
  contents: read

jobs:
  p6-pytest:
    name: P6 fixture audit, subprocess diagnostic, and full pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact P6 candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Build Stage 5 fixtures for v2 parquet tests
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py

      - name: Verify fixture content and record exact identity
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation_output
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          import constants
          import pyarrow.parquet as pq
          import rng

          root = Path("results_stage5")
          required = [
              "trials_summary.parquet",
              "selection.parquet",
              "daily_distribution.parquet",
              "worker_equivalence_manifest.json",
          ]
          for name in required:
              path = root / name
              assert path.is_file() and path.stat().st_size > 0, f"missing/empty fixture: {path}"

          summary_path = root / "trials_summary.parquet"
          selection_path = root / "selection.parquet"
          distribution_path = root / "daily_distribution.parquet"
          worker_path = root / "worker_equivalence_manifest.json"

          summary = pq.read_table(summary_path).to_pylist()
          selection = pq.read_table(selection_path).to_pylist()
          distribution = pq.read_table(distribution_path).to_pylist()
          worker_manifest = json.loads(worker_path.read_text(encoding="utf-8"))

          assert len(summary) == 1, f"expected one C100 fixture row, found {len(summary)}"
          assert summary[0].get("scenario_id") == "C100_G100"
          assert int(summary[0].get("trial_id")) == 1
          assert {row["selection_key"] for row in selection} == {
              "p50_trial_id", "p10_trial_id", "p90_trial_id", "loss_case_trial_id"
          }
          assert len(distribution) == 2198, f"expected 2198 daily distribution rows, found {len(distribution)}"
          assert str(distribution[0]["date"]) == "2027-01-01"
          assert str(distribution[-1]["date"]) == "2033-01-06"
          assert len(worker_manifest) == 3
          assert [int(row["trial_id"]) for row in worker_manifest] == [1, 2, 3]
          assert all(row.get("scenario_id") == "C070_G100" for row in worker_manifest)
          assert all(row["exact_1_eq_2"] and row["exact_1_eq_4"] for row in worker_manifest)

          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return {"bytes": path.stat().st_size, "sha256": h.hexdigest()}

          output_files = [
              *[root / name for name in required],
              *sorted(root.glob("C100_G100_trial_*_daily.json")),
          ]
          fixture_inventory = {
              "candidate_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha_from_state": json.loads(Path("state.json").read_text(encoding="utf-8"))["source_sha"],
              "master_seed": constants.MASTER_SEED,
              "rng_algorithm": rng.HASH_ALGORITHM,
              "rng_key_fields": ["master_seed", "scenario_id", "trial_id", "bike_id", "date", "event_type"],
              "fixture_purpose": "ephemeral Stage 5 CI fixtures; not a statistical checkpoint or production cohort",
              "trial_identity": {
                  "C100_G100": [1],
                  "C070_G100": [1, 2, 3],
                  "worker_counts": [2, 4],
                  "python_hash_seeds_tested_by_test": [1, 42, 987654]
              },
              "schema_version_declared_by_original_fixture_builder": None,
              "parquet_schemas": {
                  path.name: pq.read_schema(path).names
                  for path in [summary_path, selection_path, distribution_path]
              },
              "rows": {
                  "trials_summary": len(summary),
                  "selection": len(selection),
                  "daily_distribution": len(distribution),
                  "worker_equivalence_manifest": len(worker_manifest)
              },
              "files": {
                  str(path): digest(path)
                  for path in output_files
              },
              "output_data_committed_to_git": False,
              "historical_datasets_modified": False
          }
          Path("validation_output/fixture-inventory.json").write_text(
              json.dumps(fixture_inventory, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          identity = {
              "candidate_sha": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_sha_from_state": fixture_inventory["source_sha_from_state"],
              "master_seed": constants.MASTER_SEED,
              "rng_algorithm": rng.HASH_ALGORITHM,
              "rng_module_sha256": digest(Path("rng.py"))["sha256"],
              "daily_engine_sha256": digest(Path("daily_engine.py"))["sha256"],
              "monte_carlo_sha256": digest(Path("monte_carlo.py"))["sha256"],
              "state_sha256": digest(Path("state.json"))["sha256"],
              "fixture_schema_version_declared": None
          }
          Path("validation_output/pytest-identity.json").write_text(
              json.dumps(identity, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(fixture_inventory, ensure_ascii=False, sort_keys=True))
          PY

      - name: Focused diagnostic tests (unset PYTHONPATH to expose child failure)
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          unset PYTHONPATH || true
          python -m pytest -q \
            tests/test_acceptance_16_v2.py::test_127_تطابق_التسلسلي_والمتوازي \
            tests/test_acceptance_16_v2.py::test_159_اختيار_التكرار_التمثيلي_حسب_Final_Net_Project_Equity_فقط \
            tests/test_acceptance_16_v2.py::test_160_التكرارات_التوضيحية_الاربعة_تنتج_فعليا \
            tests/test_acceptance_16_v2.py::test_161_DAILY_DISTRIBUTION_لكل_يوم_تقويمي_بلا_فجوات \
            tests/test_monte_carlo_round2.py::test_parallel_fingerprints_match_across_python_hash_seeds \
            2>&1 | tee validation_output/focused-pytest.log
          test_status=${PIPESTATUS[0]}
          printf 'focused_pytest_exit_code=%s\n' "$test_status" >> validation_output/pytest-status.txt
          exit "$test_status"

      - name: Full pytest with the project's root import path
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee validation_output/full-pytest.log
          full_status=${PIPESTATUS[0]}
          printf 'full_pytest_exit_code=%s\n' "$full_status" >> validation_output/pytest-status.txt
          exit "$full_status"

      - name: Upload P6 evidence only (never upload results_stage5 data files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-pytest-diagnostic-evidence
          path: |
            validation_output/focused-pytest.log
            validation_output/full-pytest.log
            validation_output/pytest-status.txt
            validation_output/pytest-identity.json
            validation_output/fixture-inventory.json
          if-no-files-found: error
          retention-days: 30
