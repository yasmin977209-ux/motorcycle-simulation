name: Gate A Exact Golden Fingerprint Bridge

on:
  push:
    branches:
      - "tmp/gatea-golden-fingerprint-bridge-20261011"

permissions:
  contents: read
  actions: read

jobs:
  unit:
    name: Test strict source metadata parser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Stage 10 source metadata parser behavior
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage13_gatea_fingerprint_bridge.py

  gate-a-scenario:
    name: Gate A exact source fingerprint — ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - name: Checkout exact audit branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source parquet reader dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare Stage 7/10 golden hashes to immutable Stage 12 daily parquet
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          PYTHONPATH: .
        run: python scripts/stage13_gatea_fingerprint_bridge.py --scenario "$SCENARIO"
      - name: Upload scenario fingerprint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatea-scenario-${{ matrix.scenario }}
          path: gatea_evidence/scenarios/${{ matrix.scenario }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate 11,005 Gate A golden comparisons
    if: always()
    needs: [unit, gate-a-scenario]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download all scenario reports
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: gatea-scenario-*
          path: gatea_inputs
          merge-multiple: false
      - name: Aggregate exact gate evidence and canonical hash
        if: always()
        env:
          GATEA_UNIT_RESULT: ${{ needs.unit.result }}
          GATEA_MATRIX_RESULT: ${{ needs.gate-a-scenario.result }}
        run: |
          python scripts/stage13_gatea_aggregate.py \
            --input-root gatea_inputs \
            --output-root gatea_evidence \
            --unit-result "$GATEA_UNIT_RESULT" \
            --matrix-result "$GATEA_MATRIX_RESULT"
      - name: Upload complete Gate A report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatea-full-fingerprint-bridge-report
          path: gatea_evidence/
          if-no-files-found: warn
          retention-days: 30
