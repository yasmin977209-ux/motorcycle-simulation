name: stage2-verification

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-stage2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest Stage 2 suite
        run: python -m pytest -q tests/test_stage2.py
