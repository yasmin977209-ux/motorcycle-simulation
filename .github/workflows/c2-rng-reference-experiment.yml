name: C2 RNG reference-pairing experiment

on:
  push:
    branches:
      - c2-reference-better-rng-experiment-20261025

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Run focused RNG and acceptance tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage1.py tests/test_acceptance_16_v2.py
