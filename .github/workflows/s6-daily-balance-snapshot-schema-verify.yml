name: S6 daily balance snapshot schema unit verification

on:
  push:
    branches:
      - "tmp/s6-aggregate-contract-fix-20261027"
    paths:
      - "monte_carlo.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"
      - ".github/workflows/s6-daily-balance-snapshot-schema-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify pure daily snapshot projection contract (no simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile the modified projection and test
        run: |
          python -m py_compile monte_carlo.py tests/test_s6_daily_balance_snapshot_schema.py
      - name: Run only the non-simulation projection contract test
        run: python -m pytest -q tests/test_s6_daily_balance_snapshot_schema.py
