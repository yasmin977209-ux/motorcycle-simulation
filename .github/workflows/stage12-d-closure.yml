name: stage12-d-closure

on:
  push:
    branches: ["tmp/stage12-d-closure-20261009"]

permissions:
  contents: read
  actions: read

jobs:
  validate-closure:
    name: CP-12-D dynamic closure and terminal settlement audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CP12B_RUN_ID: "37964656154"
      CP12B_RUN_SHA: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
      CP12C_RUN_ID: "37971902520"
      CP12C_RUN_SHA: "d4b335926d25d4bc2c6440effc7568260ef5aeb8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned CP-12-C run metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_stage12_cp12d
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CP12C_RUN_ID}" > results_stage12_cp12d/cp12c_run.json
      - name: Download the successful CP-12-C evidence artifact
        uses: actions/download-artifact@v4
        with:
          run-id: 37971902520
          github-token: ${{ github.token }}
          name: stage12-cp12c-accounting-audit
          path: cp12c_evidence
      - name: Verify CP-12-C run and PASS evidence before CP-12-D
        run: python scripts/stage12_verify_cp12c_result.py --run-json results_stage12_cp12d/cp12c_run.json --audit-json cp12c_evidence/rollforward_result.json
      - name: Download the exact CP-12-B daily Parquet dataset
        uses: actions/download-artifact@v4
        with:
          run-id: 37964656154
          github-token: ${{ github.token }}
          pattern: stage12-daily-*
          merge-multiple: true
          path: artifacts
      - name: Unit-test closure auditor gates
        run: python -m pytest -q tests/test_stage12_closure_audit.py
      - name: Audit dynamic closure terminal rows and settlement result fields
        run: python scripts/stage12_validate_closure.py --root artifacts --cp12c-report cp12c_evidence/rollforward_result.json --output results_stage12_cp12d/closure_result.json
      - name: Upload CP-12-D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-cp12d-closure-audit
          path: results_stage12_cp12d/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
