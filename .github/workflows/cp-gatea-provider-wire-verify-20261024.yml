name: Gate A provider wiring verification

on:
  push:
    branches:
      - "tmp/cp-gatea-provider-wire-20261024"
    paths:
      - ".github/workflows/stage7-full-run.yml"
      - ".github/workflows/cp-gatea-provider-wire-verify-20261024.yml"
      - "docs/stage7/statistical_execution_gate.json"
      - "docs/PROJECT_CONTINUITY.md"
      - "run_batch.py"
      - "scripts/golden_reference_provider.py"
      - "tests/test_golden_provider_workflow_integration.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: cp-gatea-provider-wire-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provider-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Build Stage 5 fixtures for full Gate A branch inventory
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py
      - name: Verify immutable Golden map and cache round-trip (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.golden_reference_provider import (
              GoldenReferenceProvider, golden_authority_status,
              statistical_execution_status,
          )

          authority = golden_authority_status(Path("docs/governance/DECISIONS_LOG.md"))
          statistics = statistical_execution_status(Path("docs/stage7/statistical_execution_gate.json"))
          provider = GoldenReferenceProvider()
          if not provider._verified:
              raise SystemExit(f"GOLDEN_PROVIDER_BLOCKED: {provider.load_error}")
          path = Path("stage7-golden-provider.json")
          path.write_text(
              json.dumps(provider.to_verified_payload(), ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          round_trip = GoldenReferenceProvider.from_verified_payload(path)
          assert round_trip._verified
          assert round_trip.source_map_sha256 == provider.source_map_sha256
          assert round_trip.get_golden_reference_id() == provider.get_golden_reference_id()
          assert round_trip.scenario_count == 25 and round_trip.trial_count == 25205
          for scenario in round_trip._fingerprints:
              coverage = round_trip.get_coverage(scenario)
              if scenario.startswith("C100_"):
                  assert 1 in coverage
              else:
                  for n in (300, 600, 1200):
                      assert set(range(1, n + 1)).issubset(coverage)
          assert set(range(1, 2401)).issubset(round_trip.get_coverage("C030_G030"))
          print(json.dumps({
              "status": "PASS",
              "trial_count": round_trip.trial_count,
              "scenario_count": round_trip.scenario_count,
              "source_map_sha256": round_trip.source_map_sha256,
              "reference_id": round_trip.get_golden_reference_id(),
              "production_authority_status": authority["status"],
              "production_authority_blockers": authority["blockers"],
              "statistical_execution_status": statistics["status"],
              "statistical_execution_blockers": statistics["blockers"],
              "no_simulation_or_trial_execution": True,
          }, sort_keys=True))
          PY
      - name: Compile changed Stage 7 modules
        run: python -m compileall -q run_batch.py scripts/golden_reference_provider.py scripts/stage7_stability.py
      - name: Parse production workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/stage7-full-run.yml', encoding='utf-8'))"
      - name: Run provider and Stage 7 authoring tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_golden_provider_workflow_integration.py tests/test_stage7_authoring.py

      - name: Prepare full accepted-inventory evidence
        if: always()
        run: mkdir -p gatea_full_suite_evidence
      - name: Compile complete repository
        run: python -m compileall -q .
      - name: Run full accepted fixture-first repository inventory
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests --junitxml=gatea_full_suite_evidence/pytest.junit.xml 2>&1 | tee gatea_full_suite_evidence/pytest.log
      - name: Capture exact candidate identity
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          paths = [
              "constants.py",
              "run_batch.py",
              "daily_engine.py",
              "monte_carlo.py",
              "scripts/golden_reference_provider.py",
              "scripts/stage7_stability.py",
              ".github/workflows/stage7-full-run.yml",
              "docs/governance/DECISIONS_LOG.md",
              "docs/stage7/statistical_execution_gate.json",
          ]
          tests = sorted(str(p) for p in Path("tests").glob("test_*.py"))
          record = {
              "tested_head_sha": git("rev-parse", "HEAD"),
              "git_blob_sha": {p: git("hash-object", p) for p in paths + tests},
              "sha256": {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
              "production_stage7_dispatched": False,
              "production_trial_or_checkpoint_run": False,
              "fixture_first_inventory": True,
          }
          Path("gatea_full_suite_evidence/source_identity.json").write_text(
              json.dumps(record, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload full-inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatea-provider-full-inventory-${{ github.run_id }}
          path: gatea_full_suite_evidence/
          if-no-files-found: error
          retention-days: 30
