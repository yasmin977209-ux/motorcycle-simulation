name: U1 baseline pytest as-is

on:
  push:
    branches:
      - "tmp/u1-baseline-20261025"
    paths:
      - ".github/workflows/u1-baseline-20261025.yml"

permissions:
  contents: read

jobs:
  baseline:
    name: Run current full test suite without source or test edits
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact baseline HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository requirements
        run: python -m pip install -r requirements.txt

      - name: Run current tests as-is
        shell: bash
        run: |
          set +e
          python -m pytest -q tests 2>&1 | tee "$RUNNER_TEMP/u1-pytest.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUNNER_TEMP/u1-pytest.exit"
          echo "U1_PYTEST_EXIT_CODE=$rc"
          exit 0

      - name: Upload test log and exit code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: u1-baseline-${{ github.sha }}
          path: |
            ${{ runner.temp }}/u1-pytest.log
            ${{ runner.temp }}/u1-pytest.exit
          if-no-files-found: error
          retention-days: 7

      - name: Preserve pytest result as job conclusion
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/u1-pytest.exit" ]]; then
            rc="$(cat "$RUNNER_TEMP/u1-pytest.exit")"
            if [[ "$rc" -ne 0 ]]; then
              exit "$rc"
            fi
          fi
