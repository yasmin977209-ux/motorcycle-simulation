name: stage3-c030-timing

on:
  workflow_dispatch:

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Small C030 preflight
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          import os, time
          from daily_engine import create_initial_project, run_day

          p = create_initial_project(recovery_rate_pct=0)
          d = date(2027, 1, 1)
          t0 = time.perf_counter()
          for _ in range(30):
              if p.simulation_stopped:
                  break
              run_day(p, d, 0.30, "C030_G000", 1, 0)
              d += timedelta(days=1)
          elapsed = time.perf_counter() - t0
          size = int(os.popen("du -sb . | cut -f1").read().strip())
          print({
              "scenario_id": "C030_G000",
              "preflight_days_requested": 30,
              "preflight_days_executed": len(p.daily_balance_checks),
              "elapsed_seconds": elapsed,
              "seconds_per_executed_day": elapsed / max(1, len(p.daily_balance_checks)),
              "cpu_count": os.cpu_count(),
              "workflow_timeout_minutes": 15,
              "working_tree_size_bytes": size,
          })
          PY
      - name: One full C030_G000 timing run (hard stop at 600 seconds)
        shell: bash
        run: |
          set +e
          start=$SECONDS
          timeout 600s python -u - <<'PY'
          from datetime import date, timedelta
          import json, os, time
          from daily_engine import create_initial_project, run_day

          p = create_initial_project(recovery_rate_pct=0)
          d = date(2027, 1, 1)
          t0 = time.perf_counter()
          days = 0
          while not p.simulation_stopped:
              run_day(p, d, 0.30, "C030_G000", 1, 0)
              days += 1
              d += timedelta(days=1)
              if days % 100 == 0:
                  elapsed = time.perf_counter() - t0
                  with open("/tmp/c030_progress.json", "w", encoding="utf-8") as f:
                      json.dump({
                          "scenario_id": "C030_G000",
                          "days_executed": days,
                          "elapsed_seconds": elapsed,
                          "last_date": (d - timedelta(days=1)).isoformat()
                      }, f)
          elapsed = time.perf_counter() - t0
          print(json.dumps({
              "scenario_id": "C030_G000",
              "trial_id": 1,
              "days_executed": days,
              "elapsed_seconds": elapsed,
              "final_close_date": p.final_close_date.isoformat() if p.final_close_date else None,
              "final_cash": p.project_cash,
              "final_net_project_equity": p.final_net_project_equity,
              "partner1_final_entitlement": p.partner1_final_entitlement,
              "partner2_final_entitlement": p.partner2_final_entitlement,
              "claims": len(p.guarantee_claims),
              "contracts": len(p.contracts),
          }, ensure_ascii=False))
          PY
          rc=$?
          wall=$((SECONDS-start))
          if [ "$rc" -eq 124 ]; then
            echo "C030_STATUS=STOPPED_AT_600_SECONDS"
            echo "C030_PARTIAL_ELAPSED_SECONDS=$wall"
            if [ -f /tmp/c030_progress.json ]; then
              cat /tmp/c030_progress.json
            fi
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "C030_STATUS=FAIL rc=$rc"
            exit "$rc"
          fi
          echo "C030_STATUS=COMPLETED"
          echo "C030_WALL_SECONDS=$wall"
