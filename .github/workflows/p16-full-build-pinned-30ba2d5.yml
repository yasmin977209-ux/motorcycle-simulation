name: P16 full provisional build pinned to code SHA 30ba2d5
on:
  push:
    branches:
      - tmp/p16-diagnostic-benchmark-20261021
    paths:
      - docs/audits/P16_FULL_BUILD_TRIGGER.txt
permissions:
  contents: read
  actions: read
concurrency:
  group: p16-provisional-full-pin-30ba2d5
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify seven provisional deliverables from pinned code
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact P16 source SHA
        uses: actions/checkout@v4
        with:
          ref: 30ba2d5d47d3a3d6c117f0ef667115401c337ad7
          fetch-depth: 0
      - name: Assert pinned code, manifest, and unchanged main
        shell: bash
        env:
          WORKFLOW_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "30ba2d5d47d3a3d6c117f0ef667115401c337ad7"
          test "$(git rev-parse HEAD:docs/stage9a/dataset_manifest.json)" = "e796fa2443493b607f1f9c60b58eb63607959c26"
          test "$(git rev-parse HEAD:scripts/excel_builder_p16.py)" = "1274e0055a81988ef72709a4c6ff9fc1f1351f3a"
          test "$(git rev-parse HEAD:scripts/p16_produce_deliverables_v4.py)" = "c3f630b883ec1c02c2fca6ab93363b2c099da51d"
          test "$(git rev-parse HEAD:scripts/stage13_assemble.py)" = "73aaf723753939a222dc4544990f71c4dae71c1f"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "6a218ebe0fccf210ec18f3552b141afbdd1a49ef"
          git merge-base --is-ancestor "6a218ebe0fccf210ec18f3552b141afbdd1a49ef" HEAD
          mkdir -p p16_test_evidence deliverables
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tested = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          record = {
              "workflow_trigger_sha": os.environ["WORKFLOW_TRIGGER_SHA"],
              "tested_source_sha": tested,
              "base_main_sha": "6a218ebe0fccf210ec18f3552b141afbdd1a49ef",
              "main_modified": False,
              "source_sha": "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b",
              "reference_sha256": "ee277aea4f68ffa2e801e100ebb8eee939c44b2c6150494aea0a6c4d1a6b7479",
              "main_manifest_git_blob": "e796fa2443493b607f1f9c60b58eb63607959c26",
              "production_trials_or_simulation": False,
              "confidence_sequences": False,
              "delivery": "NOT_ACCEPTED",
              "release": "BLOCKED / NOT_AUTHORIZED"
          }
          Path("p16_test_evidence/branch_identity.json").write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile pinned P16 modules
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts/excel_builder.py scripts/excel_builder_p16.py scripts/stage13_assemble.py scripts/p16_produce_deliverables_v4.py scripts/p16_finalize_register.py
      - name: Run deterministic regression tests on pinned code
        id: tests
        shell: bash
        run: |
          set -uo pipefail
          set +e
          python -m pytest -q \
            tests/test_stage13_assembly_contract.py \
            tests/test_excel_daily_serialization.py \
            tests/test_p16_provisional_outputs.py \
            --junitxml=p16_test_evidence/pytest.junit.xml \
            2>&1 | tee p16_test_evidence/pytest.log
          rc=${PIPESTATUS[0]}
          printf '%s\n' "${rc}" > p16_test_evidence/pytest_exit_code.txt
          exit "${rc}"
      - name: Build the seven provisional deliverables from existing artifacts
        id: build
        if: steps.tests.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .
          PYTHONUNBUFFERED: "1"
          WORKFLOW_TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          df -h .
          set +e
          python -u - <<'PY' 2>&1 | tee p16_test_evidence/build.log
          import os, runpy, sys
          os.environ["P16_WORKFLOW_TRIGGER_SHA"] = os.environ.get("WORKFLOW_TRIGGER_SHA", "")
          os.environ["GITHUB_SHA"] = "30ba2d5d47d3a3d6c117f0ef667115401c337ad7"
          sys.argv = ["scripts/p16_produce_deliverables_v4.py"]
          runpy.run_path(sys.argv[0], run_name="__main__")
          PY
          rc=${PIPESTATUS[0]}
          printf '%s\n' "${rc}" > p16_test_evidence/build_exit_code.txt
          exit "${rc}"
      - name: Copy CI evidence alongside outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp -R p16_test_evidence deliverables/p16_test_evidence || true
      - name: Upload primary deliverables and build evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p16-provisional-seven-deliverables-pinned-30ba2d5-${{ github.run_id }}
          path: deliverables/
          if-no-files-found: warn
          retention-days: 30
      - name: Finalize provenance with distinct trigger and tested SHAs
        id: final-register
        if: ${{ steps.tests.outcome == 'success' && steps.build.outcome == 'success' && steps.upload.outcome == 'success' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_TRIGGER_BRANCH: ${{ github.ref_name }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          BASE = "30ba2d5d47d3a3d6c117f0ef667115401c337ad7"
          MAIN = "6a218ebe0fccf210ec18f3552b141afbdd1a49ef"
          SOURCE = "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          REFERENCE = "ee277aea4f68ffa2e801e100ebb8eee939c44b2c6150494aea0a6c4d1a6b7479"
          REPO = "yasmin977209-ux/motorcycle-simulation"
          OUT = Path("deliverables")
          token = os.environ["GITHUB_TOKEN"]
          run_id = int(os.environ["WORKFLOW_RUN_ID"])
          trigger_sha = os.environ["WORKFLOW_TRIGGER_SHA"]
          branch = os.environ["WORKFLOW_TRIGGER_BRANCH"]
          manifest_path = OUT / "output_manifest.json"
          evidence_path = OUT / "p16_build_evidence.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "PASS_SCOPED_PROVISIONAL_OUTPUTS_NOT_ACCEPTED":
              raise RuntimeError("DELIVERABLE_MANIFEST_NOT_PASS_SCOPED")
          if manifest.get("tested_sha") != BASE or evidence.get("tested_sha") != BASE:
              raise RuntimeError("TESTED_CODE_SHA_MISMATCH")
          if manifest.get("source_sha") != SOURCE or manifest.get("reference_sha256") != REFERENCE:
              raise RuntimeError("SOURCE_OR_REFERENCE_IDENTITY_MISMATCH")
          if manifest.get("base_main_sha") != MAIN:
              raise RuntimeError("BASE_MAIN_SHA_MISMATCH")
          if len(manifest.get("seven_files", {})) != 7:
              raise RuntimeError("SEVEN_FILE_MANIFEST_COUNT_MISMATCH")

          def sha256_file(path):
              h = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          for name, entry in manifest["seven_files"].items():
              path = OUT / name
              if not path.is_file():
                  raise RuntimeError("DELIVERABLE_MISSING:" + name)
              if path.stat().st_size != entry.get("bytes") or sha256_file(path) != entry.get("sha256"):
                  raise RuntimeError("DELIVERABLE_SHA_OR_SIZE_MISMATCH:" + name)

          request = Request(
              f"https://api.github.com/repos/{REPO}/actions/runs/{run_id}/artifacts?per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "p16-pinned-final-provenance",
              },
          )
          with urlopen(request, timeout=45) as response:
              api = json.loads(response.read())
          expected_name = f"p16-provisional-seven-deliverables-pinned-30ba2d5-{run_id}"
          matches = [a for a in api.get("artifacts", []) if a.get("name") == expected_name]
          if len(matches) != 1:
              raise RuntimeError(f"PRIMARY_ARTIFACT_NOT_UNIQUE:{expected_name}:{len(matches)}")
          artifact = matches[0]
          if artifact.get("expired") is True:
              raise RuntimeError("PRIMARY_ARTIFACT_EXPIRED")
          run_meta = artifact.get("workflow_run") or {}
          if run_meta.get("id") != run_id or run_meta.get("head_sha") != trigger_sha or run_meta.get("head_branch") != branch:
              raise RuntimeError("ARTIFACT_RUN_BRANCH_TRIGGER_SHA_MISMATCH")

          manifest["run_id"] = run_id
          manifest["branch"] = branch
          manifest["tested_sha"] = BASE
          manifest["workflow_trigger_sha"] = trigger_sha
          manifest["workflow_trigger_sha_semantics"] = "commit that triggered the Actions workflow; source code checkout/tested SHA remains 30ba2d5d47d3a3d6c117f0ef667115401c337ad7"
          manifest["deliverable_artifact_id"] = artifact["id"]
          manifest["deliverable_artifact_name"] = artifact["name"]
          manifest["deliverable_artifact_bytes"] = artifact["size_in_bytes"]
          manifest["deliverable_artifact_digest"] = artifact.get("digest")
          for entry in manifest["seven_files"].values():
              entry["run_id"] = run_id
              entry["branch"] = branch
              entry["tested_sha"] = BASE
              entry["workflow_trigger_sha"] = trigger_sha
              entry["artifact_id"] = artifact["id"]
              entry["artifact_name"] = artifact["name"]
              entry["source_sha"] = SOURCE
              entry["reference_sha256"] = REFERENCE
          evidence["run_id"] = run_id
          evidence["tested_sha"] = BASE
          evidence["workflow_trigger_sha"] = trigger_sha
          evidence["branch"] = branch
          evidence["primary_deliverable_artifact_id"] = artifact["id"]
          evidence["primary_deliverable_artifact_name"] = artifact["name"]
          evidence["primary_deliverable_artifact_bytes"] = artifact["size_in_bytes"]
          evidence["primary_deliverable_artifact_digest"] = artifact.get("digest")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          register = {
              "schema_version": "1.0",
              "status": "READ_BACK_VERIFIED_PASS_SCOPED_PROVISIONAL_OUTPUTS_NOT_ACCEPTED",
              "run_id": run_id,
              "branch": branch,
              "tested_sha": BASE,
              "workflow_trigger_sha": trigger_sha,
              "base_main_sha": MAIN,
              "source_sha": SOURCE,
              "reference_sha256": REFERENCE,
              "artifact_id": artifact["id"],
              "artifact_name": artifact["name"],
              "artifact_bytes": artifact["size_in_bytes"],
              "artifact_digest": artifact.get("digest"),
              "delivery": "NOT_ACCEPTED",
              "release": "BLOCKED / NOT_AUTHORIZED",
              "files": manifest["seven_files"],
          }
          register_path = OUT / "p16_final_provenance_register.json"
          register_path.write_text(json.dumps(register, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          checked_manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          checked_evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          checked_register = json.loads(register_path.read_text(encoding="utf-8"))
          if checked_manifest.get("deliverable_artifact_id") != artifact["id"]:
              raise RuntimeError("OUTPUT_MANIFEST_ARTIFACT_READBACK_FAIL")
          if checked_manifest.get("tested_sha") != BASE or checked_manifest.get("workflow_trigger_sha") != trigger_sha:
              raise RuntimeError("OUTPUT_MANIFEST_SHA_SEMANTICS_READBACK_FAIL")
          if len(checked_manifest.get("seven_files", {})) != 7 or len(checked_register.get("files", {})) != 7:
              raise RuntimeError("OUTPUT_FILE_REGISTER_READBACK_COUNT_FAIL")
          if checked_evidence.get("primary_deliverable_artifact_id") != artifact["id"]:
              raise RuntimeError("BUILD_EVIDENCE_ARTIFACT_READBACK_FAIL")
          for name, entry in checked_manifest["seven_files"].items():
              path = OUT / name
              if path.stat().st_size != entry["bytes"] or sha256_file(path) != entry["sha256"]:
                  raise RuntimeError("DELIVERABLE_POST_REGISTER_READBACK_FAIL:" + name)
          print(json.dumps({
              "status": checked_register["status"],
              "run_id": run_id,
              "tested_sha": BASE,
              "workflow_trigger_sha": trigger_sha,
              "artifact_id": artifact["id"],
              "artifact_name": artifact["name"],
              "file_count": len(checked_register["files"]),
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload sealed final seven-deliverable bundle and provenance
        id: sealed
        if: ${{ steps.final-register.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: p16-sealed-seven-deliverables-pinned-30ba2d5-${{ github.run_id }}
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
