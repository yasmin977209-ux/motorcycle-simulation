name: D3 Complete Source-Verified Closure (Disabled Pending Eligible Sources)
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  blocked:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed until post-cutoff source artifacts are available
        run: |
          echo "BLOCKED: no eligible D3 source artifacts dated 2026-10-31 or later have been verified."
          exit 1
