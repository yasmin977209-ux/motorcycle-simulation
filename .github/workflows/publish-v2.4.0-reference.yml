name: Publish approved v2.4.0 governing reference

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - .github/workflows/publish-v2.4.0-reference.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the active D1 branch
        uses: actions/checkout@v4
        with:
          ref: tmp/d1-rebuild-20261101
          fetch-depth: 0

      - name: Download Gist revision and verify exact bytes
        run: |
          set -euo pipefail
          url="https://gist.githubusercontent.com/yasmin977209-ux/c3e5362f5928da22ee079fc94817224e/raw/384c27810e76572e77e79e9829c5f92c1c4165d7/reference_v240.md"
          expected_sha="225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          expected_size="401397"

          curl --fail --location --silent --show-error "$url" --output /tmp/ref.md

          actual_size="$(wc -c < /tmp/ref.md | tr -d ' ')"
          actual_sha="$(sha256sum /tmp/ref.md | awk '{print $1}')"
          echo "Downloaded reference: bytes=$actual_size sha256=$actual_sha"

          if [ "$actual_size" != "$expected_size" ]; then
            echo "::error::REFERENCE_SIZE_MISMATCH expected=$expected_size actual=$actual_size"
            exit 1
          fi
          if [ "$actual_sha" != "$expected_sha" ]; then
            echo "::error::REFERENCE_SHA256_MISMATCH expected=$expected_sha actual=$actual_sha"
            exit 1
          fi

          echo "REFERENCE_DOWNLOAD_VERIFIED path=/tmp/ref.md"

      - name: Publish if absent and verify exact GitHub raw readback
        run: |
          set -euo pipefail
          target="docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md"
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          if [ -f "$target" ]; then
            if ! cmp -s /tmp/ref.md "$target"; then
              echo "::error::EXISTING_REFERENCE_BYTES_DIFFER_FROM_APPROVED_GIST"
              exit 1
            fi
            echo "REFERENCE_ALREADY_PRESENT_AND_BYTE_IDENTICAL"
          else
            mkdir -p "$(dirname "$target")"
            cp /tmp/ref.md "$target"
            git add "$target"
            git commit -m "docs(governance): publish v2.4.0 via gist"
            git push origin HEAD:refs/heads/tmp/d1-rebuild-20261101
          fi

          published_commit="$(git rev-parse HEAD)"
          raw_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${published_commit}/${target}"
          curl --fail --location --silent --show-error "$raw_url" --output /tmp/remote-ref.md
          remote_size="$(wc -c < /tmp/remote-ref.md | tr -d ' ')"
          remote_sha="$(sha256sum /tmp/remote-ref.md | awk '{print $1}')"
          expected_size="401397"
          expected_sha="225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          blob_sha="$(git rev-parse "${published_commit}:${target}")"

          echo "REMOTE_REFERENCE_READBACK bytes=$remote_size sha256=$remote_sha blob_sha1=$blob_sha commit=$published_commit"
          if [ "$remote_size" != "$expected_size" ] || [ "$remote_sha" != "$expected_sha" ]; then
            echo "::error::REMOTE_REFERENCE_READBACK_MISMATCH"
            exit 1
          fi
          echo "VERIFIED_LIVE_REFERENCE path=$target"
