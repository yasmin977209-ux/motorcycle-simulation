name: Publish approved v2.4.0 governing reference

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - tmp/reference-payload/READY

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      published_head: ${{ steps.commit.outputs.published_head }}
    steps:
      - name: Checkout the exact payload commit
        uses: actions/checkout@v4
        with:
          ref: tmp/d1-rebuild-20261101
          fetch-depth: 0

      - name: Reconstruct and verify the exact approved reference
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, bz2, hashlib
          from pathlib import Path

          root = Path("tmp/reference-payload")
          if not (root / "READY").is_file():
              raise SystemExit("REFERENCE_PAYLOAD_MARKER_MISSING")
          chunks = sorted(root.glob("chunk-*.b85"))
          if len(chunks) != 10:
              raise SystemExit(f"REFERENCE_PAYLOAD_CHUNK_COUNT:{len(chunks)}")
          encoded = b"".join(p.read_bytes().strip() for p in chunks)
          compressed = base64.b85decode(encoded)
          raw = bz2.decompress(compressed)
          expected_size = 401397
          expected_sha = "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          actual_sha = hashlib.sha256(raw).hexdigest()
          if len(raw) != expected_size or actual_sha != expected_sha:
              raise SystemExit(f"REFERENCE_BYTES_MISMATCH:{len(raw)}:{actual_sha}")
          target = Path("docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(raw)
          print(f"VERIFIED_REFERENCE_SOURCE bytes={len(raw)} sha256={actual_sha}")
          PY

      - name: Commit canonical reference and remove transfer payload
        id: commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md | awk '{print $1}')" = "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md
          git rm -r tmp/reference-payload
          git commit -m "docs(governance): publish owner-approved v2.4.0 governing reference"
          git push origin HEAD:refs/heads/tmp/d1-rebuild-20261101
          git fetch origin tmp/d1-rebuild-20261101
          remote_head="$(git rev-parse FETCH_HEAD)"
          local_head="$(git rev-parse HEAD)"
          test "$remote_head" = "$local_head"
          echo "published_head=$remote_head" >> "$GITHUB_OUTPUT"
          raw_path="docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$remote_head/$raw_path" -o /tmp/v240-remote.md
          raw_bytes="$(wc -c < /tmp/v240-remote.md | tr -d ' ')"
          raw_sha="$(sha256sum /tmp/v240-remote.md | awk '{print $1}')"
          blob_sha="$(git rev-parse "$remote_head:$raw_path")"
          test "$raw_bytes" = "401397"
          test "$raw_sha" = "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          echo "VERIFIED_LIVE_REFERENCE commit=$remote_head blob=$blob_sha bytes=$raw_bytes sha256=$raw_sha"

  validate-final-head:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Clone final branch HEAD and install validation dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 --branch tmp/d1-rebuild-20261101 https://github.com/yasmin977209-ux/motorcycle-simulation.git d1
          cd d1
          python -m pip install --upgrade pytest pyarrow requests

      - name: Download and cryptographically verify the three pinned historical artifacts
        working-directory: d1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, requests
          repo = "yasmin977209-ux/motorcycle-simulation"
          pins = {
              12852969854: (9357996, "ec05a69ae8968585decf83cf0716d56c264f47f86187cfd3cf53b11f52ca2e54", "aggregate.zip"),
              12998778418: (310827203, "403371cc8eb12880dda05529b4c83dd675bfa609e8680c09d35efa729c5b5aeb", "full-logging.zip"),
              12630457193: (361733, "c977d1cbb5204919eadc72358533f77cdbbc239902bcd6f921bf1a915a716e79", "c100.zip"),
          }
          headers = {"Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}", "Accept": "application/vnd.github+json"}
          out = pathlib.Path("stage-d-artifacts")
          out.mkdir(exist_ok=True)
          for artifact_id, (expected_size, expected_sha, filename) in pins.items():
              meta = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}", headers=headers, timeout=60)
              meta.raise_for_status()
              item = meta.json()
              if item.get("expired") or item.get("size_in_bytes") != expected_size or item.get("digest") != f"sha256:{expected_sha}":
                  raise SystemExit(f"ARTIFACT_METADATA_PIN_MISMATCH:{artifact_id}")
              response = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip",
                                      headers=headers, allow_redirects=False, timeout=60)
              if response.status_code not in (301, 302, 303, 307, 308) or not response.headers.get("Location"):
                  raise SystemExit(f"ARTIFACT_DOWNLOAD_REDIRECT_MISSING:{artifact_id}:{response.status_code}")
              target = out / filename
              digest = hashlib.sha256()
              size = 0
              with requests.get(response.headers["Location"], stream=True, timeout=180) as download:
                  download.raise_for_status()
                  with target.open("wb") as stream:
                      for chunk in download.iter_content(1024 * 1024):
                          if chunk:
                              stream.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)
              if size != expected_size or digest.hexdigest() != expected_sha:
                  raise SystemExit(f"ARTIFACT_BYTES_PIN_MISMATCH:{artifact_id}:{size}:{digest.hexdigest()}")
              print(f"VERIFIED_ARTIFACT id={artifact_id} bytes={size} sha256={digest.hexdigest()}")
          PY

      - name: Compile source and run unit plus real artifact integration tests
        working-directory: d1
        env:
          STAGE_D_AGGREGATE: stage-d-artifacts/aggregate.zip
          STAGE_D_FULL_LOGGING: stage-d-artifacts/full-logging.zip
          STAGE_D_C100: stage-d-artifacts/c100.zip
        run: |
          set -euo pipefail
          python -m compileall -q scripts/s6_artifact_reader.py scripts/s6_deliverables_model.py scripts/s6_manifest_resolver.py scripts/s6_deliverables_builder.py scripts/s6_number_registry.py scripts/s6_validate_representatives.py tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
          python -m pytest -q -rs tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py

      - name: Assert exact final HEAD and remote reference triple
        working-directory: d1
        env:
          EXPECTED_PUBLISHED_HEAD: ${{ needs.publish.outputs.published_head }}
        run: |
          set -euo pipefail
          tested_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)"
          test "$tested_head" = "$remote_head"
          test "$tested_head" = "$EXPECTED_PUBLISHED_HEAD"
          path="docs/governance/MOTORCYCLE_SIMULATION_GOVERNING_REFERENCE_V2.4.0.md"
          curl -fsSL "https://raw.githubusercontent.com/yasmin977209-ux/motorcycle-simulation/$tested_head/$path" -o /tmp/v240-final.md
          bytes="$(wc -c < /tmp/v240-final.md | tr -d ' ')"
          sha="$(sha256sum /tmp/v240-final.md | awk '{print $1}')"
          blob="$(git rev-parse "$tested_head:$path")"
          test "$bytes" = "401397"
          test "$sha" = "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
          echo "PASS_EXACT_FINAL_HEAD=$tested_head"
          echo "VERIFIED_LIVE_REFERENCE blob=$blob bytes=$bytes sha256=$sha"
