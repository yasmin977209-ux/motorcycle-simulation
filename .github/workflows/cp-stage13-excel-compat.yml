name: TEMP CP Stage 13 synthetic Excel compatibility

on:
  push:
    branches:
      - tmp/cp-stage13-excel-compat-20261017
    paths:
      - ".github/workflows/cp-stage13-excel-compat.yml"
      - "scripts/stage13_assemble.py"
      - "scripts/excel_builder.py"
      - "tests/test_stage13_assembler.py"
      - "tests/test_excel_builder_adaptive_mode.py"
      - "tests/test_excel_builder_legacy_compat.py"
      - "tests/test_excel_builder_precision.py"
      - "docs/stage13/R4_clean_main_excel_compat_20261017.md"
      - "docs/stage13/OWNER_SCOPE_AUTHORIZATION_20261017.md"

permissions:
  contents: read

jobs:
  stage13-synthetic-compatibility:
    name: Stage 13 synthetic tests and workbook content audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_BRANCH: tmp/cp-stage13-excel-compat-20261017
      EXPECTED_MAIN_SHA: 647c19826b90d8224ce73ef9b90c306a45e03fb0
      SOURCE_SHA: f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b
      MASTER_SEED: NOT_APPLICABLE_SYNTHETIC_TESTS_ONLY
      RNG_IDENTITY: NOT_USED_SYNTHETIC_TESTS_ONLY
      DATASET_IDENTITY: SYNTHETIC_FIXTURE_ONLY
      SCENARIO_SCOPE: SYNTHETIC_DEMO_FIXTURE_ALL_25_SCENARIOS
    steps:
      - name: Checkout exact pinned branch
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-stage13-excel-compat-20261017
          fetch-depth: 0

      - name: Verify branch pin and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$EXPECTED_MAIN_SHA^{commit}"
          test "$(git merge-base "$EXPECTED_MAIN_SHA" HEAD)" = "$EXPECTED_MAIN_SHA"
          mkdir -p results_stage13_test
          cp docs/stage13/R4_clean_main_excel_compat_20261017.md results_stage13_test/
          cp docs/stage13/OWNER_SCOPE_AUTHORIZATION_20261017.md results_stage13_test/
          printf '%s\n' "BRANCH_PIN=PASS" "MAIN_ANCESTRY=PASS" > results_stage13_test/preflight.txt
          printf 'HEAD_SHA=%s\nEXPECTED_MAIN_SHA=%s\n' "$GITHUB_SHA" "$EXPECTED_MAIN_SHA" >> results_stage13_test/preflight.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Run focused synthetic regression tests
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            tests/test_stage13_assembler.py \
            tests/test_excel_builder_adaptive_mode.py \
            tests/test_excel_builder_legacy_compat.py \
            tests/test_excel_builder_precision.py \
            > results_stage13_test/pytest.txt 2>&1
          rc=$?
          cat results_stage13_test/pytest.txt
          echo "PYTEST_EXIT_CODE=$rc" >> "$GITHUB_ENV"
          exit 0

      - name: Build and inspect synthetic workbook
        if: always()
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import hashlib, importlib.util, json, os, traceback
          from pathlib import Path
          from openpyxl import load_workbook
          import scripts.stage13_assemble as assembler

          root = Path("results_stage13_test")
          output = root / "stage13_synthetic_demo.xlsx"
          audit_path = root / "workbook_audit.json"
          audit = {
              "status": "FAIL",
              "scope": "SYNTHETIC_TEST_ONLY",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "expected_main_sha": os.environ.get("EXPECTED_MAIN_SHA"),
              "source_sha": os.environ.get("SOURCE_SHA"),
              "master_seed": os.environ.get("MASTER_SEED"),
              "rng_identity": os.environ.get("RNG_IDENTITY"),
              "dataset_identity": os.environ.get("DATASET_IDENTITY"),
              "scenario_scope": os.environ.get("SCENARIO_SCOPE"),
              "pytest_exit_code": os.environ.get("PYTEST_EXIT_CODE"),
          }
          try:
              spec = importlib.util.spec_from_file_location(
                  "stage13_synthetic_fixture", "tests/test_stage13_assembler.py"
              )
              fixture = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(fixture)
              data = fixture.demo_data()
              result = assembler.assemble_workbook(data, output, mode="demo")
              if not result.get("success"):
                  raise AssertionError("ASSEMBLER_REPORTED_FAILURE: " + repr(result))
              wb = load_workbook(output, data_only=False, read_only=False)
              try:
                  expected = assembler._expected_sheet_names()
                  names = list(wb.sheetnames)
                  if names != expected:
                      raise AssertionError(
                          f"WORKSHEET_NAME_OR_ORDER_MISMATCH: got={len(names)} expected={len(expected)}"
                      )
                  if len(names) != 185:
                      raise AssertionError(f"WORKSHEET_COUNT_MISMATCH: {len(names)}")
                  readme_count = None
                  for row in wb["README"].iter_rows(min_row=2, max_col=2, values_only=True):
                      if row[0] == "Excel sheets":
                          readme_count = row[1]
                          break
                  if readme_count != 185:
                      raise AssertionError(f"README_SHEET_COUNT_MISMATCH: {readme_count!r}")
                  formulas = []
                  errors = []
                  for ws in wb.worksheets:
                      for row in ws.iter_rows():
                          for cell in row:
                              if cell.data_type == "f":
                                  formulas.append(f"{ws.title}!{cell.coordinate}")
                              if cell.data_type == "e":
                                  errors.append(f"{ws.title}!{cell.coordinate}={cell.value!r}")
                  if formulas:
                      raise AssertionError("FORMULA_CELLS_PRESENT: " + repr(formulas[:20]))
                  if errors:
                      raise AssertionError("EXCEL_ERROR_CELLS_PRESENT: " + repr(errors[:20]))
                  audit.update({
                      "status": "PASS",
                      "success": result.get("success"),
                      "sheets_count": len(names),
                      "sheet_names": names,
                      "readme_sheet_count": readme_count,
                      "formula_cell_count": len(formulas),
                      "excel_error_cell_count": len(errors),
                      "workbook_bytes": output.stat().st_size,
                      "workbook_sha256": hashlib.sha256(output.read_bytes()).hexdigest(),
                      "trial_count": result.get("trial_count"),
                      "mode": "demo",
                  })
              finally:
                  wb.close()
          except Exception as exc:
              audit["status"] = "FAIL"
              audit["error"] = f"{type(exc).__name__}: {exc}"
              audit["traceback"] = traceback.format_exc()
          audit_path.write_text(json.dumps(audit, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          evidence = {
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "required_main_base_sha": os.environ.get("EXPECTED_MAIN_SHA"),
              "source_sha": os.environ.get("SOURCE_SHA"),
              "master_seed": os.environ.get("MASTER_SEED"),
              "rng_identity": os.environ.get("RNG_IDENTITY"),
              "data_identity": os.environ.get("DATASET_IDENTITY"),
              "scenario_scope": os.environ.get("SCENARIO_SCOPE"),
              "pytest_exit_code": os.environ.get("PYTEST_EXIT_CODE"),
              "workbook_audit_status": audit["status"],
              "artifact_scope": "synthetic tests and synthetic demo workbook only",
          }
          (root / "evidence.json").write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(json.dumps({"workbook_audit_status": audit["status"], "workbook_bytes": audit.get("workbook_bytes")}))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"WORKBOOK_AUDIT_STATUS={audit['status']}\n")
          PY
          exit 0

      - name: Upload inspectable synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage13-excel-compat-synthetic-evidence-${{ github.sha }}
          path: results_stage13_test/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce test and workbook audit results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${PYTEST_EXIT_CODE:-999}" = "0"
          test "${WORKBOOK_AUDIT_STATUS:-MISSING}" = "PASS"
