name: stage8-authoring-verify

on:
  push:
    branches:
      - "tmp/stage8-authoring-20261004"
      - tmp/stage8-verify-fix-20261005
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Git ref or SHA to verify"
        required: true
        default: "tmp/stage8-authoring-20261004"

permissions:
  contents: read

jobs:
  verify:
    name: stage8-authoring-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate target_ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/validate || true
          git init -q /tmp/validate
          cd /tmp/validate
          git remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch --depth=1 origin "${{ inputs.target_ref }}"; then
            echo "Invalid target_ref: ${{ inputs.target_ref }}" >&2
            exit 1
          fi
          git cat-file -e FETCH_HEAD^{commit}
          echo "VALIDATED_REF=${{ inputs.target_ref }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref || 'tmp/stage8-authoring-20261004' }}
          fetch-depth: 1

      - name: Fetch pinned SOURCE_SHA for diff
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          if ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${SOURCE_SHA}"
          fi
          git cat-file -e "${SOURCE_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: AST parse Stage 8
        run: |
          python -c "import ast; ast.parse(open('run_batch.py', encoding='utf-8').read())"
          python -c "import ast; ast.parse(open('tests/test_run_batch.py', encoding='utf-8').read())"

      - name: YAML lint
        run: |
          python -c "import yaml; yaml.safe_load(open('.github/workflows/stage8-authoring-verify.yml', encoding='utf-8'))"

      - name: Stage 7 authoring regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage7_authoring.py

      - name: Stage 8 authoring tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_run_batch.py

      - name: Confirm production modules are untouched
        run: |
          git diff --exit-code f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b HEAD -- \
            constants.py dateutils.py rng.py entities.py state_machine.py \
            daily_engine.py accounting.py collection.py guarantee.py friday.py \
            settlement.py closure.py partner_equity.py monte_carlo.py
