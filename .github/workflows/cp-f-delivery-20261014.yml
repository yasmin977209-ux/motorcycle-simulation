name: CP-F delivery source readiness audit

on:
  push:
    branches:
      - tmp/cp-f-delivery-20261014
    paths:
      - .github/workflows/cp-f-delivery-20261014.yml
      - scripts/cp_f_delivery_probe.py

permissions:
  contents: read
  actions: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact CP-F branch
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-f-delivery-20261014

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install approved project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Inspect official source artifacts and fail closed on missing payloads
        id: audit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/cp_f_delivery_probe.py

      - name: Upload CP-F source readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-f-source-readiness-evidence
          path: cp-f-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Propagate blocked acceptance gate
        if: steps.audit.outcome == 'failure'
        run: |
          echo "CP-F delivery is blocked; see cp-f-source-readiness-evidence."
          exit 1
