name: stage12-b3-25jobs

on:
  push:
    branches: ["tmp/stage12-b3-25jobs-20261009"]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/stage12_materialize.py --help
      - run: python scripts/stage12_aggregate.py --help

  materialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Materialize complete scenario
        run: PYTHONPATH=. python scripts/stage12_materialize.py --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-daily-${{ matrix.scenario }}
          path: docs/stage12/daily_accounting/${{ matrix.scenario }}.parquet
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: materialize
    if: ${{ needs.materialize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: stage12-daily-*
          path: artifacts
          merge-multiple: true
      - run: python scripts/stage12_aggregate.py --root artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-cp12b-result
          path: docs/stage12/reproduction_result.json
          if-no-files-found: error
          retention-days: 30
