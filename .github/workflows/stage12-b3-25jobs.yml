name: stage12-b3-25jobs

on:
  push:
    branches: ["tmp/stage12-b3-25jobs-20261009"]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Build fresh temporary acceptance fixtures
        run: python scripts/stage12_prepare_acceptance_fixtures.py
      - name: Acceptance and regression gates from the current Stage 5 contract
        shell: bash
        run: |
          set -euo pipefail
          echo "== Chapter 16 v2 acceptance (163-test contract) =="
          python -m pytest -q tests/test_acceptance_16_v2.py
          echo "== Stage 1 =="
          python -m pytest -q tests/test_stage1.py
          echo "== Stage 2 =="
          python -m pytest -q tests/test_stage2.py tests/test_stage2_entities_additions.py
          echo "== Stage 3A Chapter 5 =="
          python -m pytest -q tests/test_stage3a.py -k ch5
          echo "== Stage 3A Chapter 6 =="
          python -m pytest -q tests/test_stage3a.py -k ch6
          echo "== Stage 3A Chapter 7 =="
          python -m pytest -q tests/test_stage3a.py -k ch7
          echo "== Stage 3A Chapter 8 =="
          python -m pytest -q tests/test_stage3a.py -k ch8
          echo "== Stage 3A Chapter 9 =="
          python -m pytest -q tests/test_stage3a.py -k ch9
          echo "== Stage 1 regression =="
          python -m pytest -q tests/test_stage1.py
          echo "== Stage 2 regression =="
          python -m pytest -q tests/test_stage2.py
          echo "== Stage 3B accounting =="
          python -m pytest -q tests/test_stage3b_accounting.py
          echo "== Stage 3B partner equity =="
          python -m pytest -q tests/test_stage3b_partner_equity.py
          echo "== Stage 3B M1..M17 order =="
          python -m pytest -q tests/test_stage3b_m_order.py
          echo "== Stage 3B closure =="
          python -m pytest -q tests/test_stage3b_closure.py
          echo "== Stage 4.4 path 1 =="
          python -m pytest -q tests/test_stage3b_path1.py
          echo "== Stage 4.4 paths 2..6 =="
          python -m pytest -q tests/test_stage3b_paths.py
          echo "== Dynamic closure; no artificial time cap =="
          python -m pytest -q tests/test_stage3b_no_time_cap.py
          echo "== Stage 3B determinism =="
          python -m pytest -q tests/test_stage3b_determinism.py
          echo "== Monte Carlo round 1 =="
          python -m pytest -q tests/test_monte_carlo_round1.py
          echo "== Monte Carlo round 2 / hash-seed invariance =="
          python -m pytest -q tests/test_monte_carlo_round2.py
          echo "== Monte Carlo round 3 =="
          python -m pytest -q tests/test_monte_carlo_round3.py
          echo "== Monte Carlo round 4 =="
          python -m pytest -q tests/test_monte_carlo_round4.py
      - name: Validate Stage 12 script interfaces
        run: |
          python scripts/stage12_materialize.py --help
          python scripts/stage12_aggregate.py --help

  materialize:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Materialize complete scenario
        run: PYTHONPATH=. python scripts/stage12_materialize.py --scenario "${{ matrix.scenario }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-daily-${{ matrix.scenario }}
          path: docs/stage12/daily_accounting/${{ matrix.scenario }}.parquet
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: materialize
    if: ${{ needs.materialize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: stage12-daily-*
          path: artifacts
          merge-multiple: true
      - run: python scripts/stage12_aggregate.py --root artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-cp12b-result
          path: docs/stage12/reproduction_result.json
          if-no-files-found: error
          retention-days: 30
