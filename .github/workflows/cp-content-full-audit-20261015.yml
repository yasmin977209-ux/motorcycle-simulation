name: Full CP-F Parquet content audit

on:
  push:
    branches: ["tmp/cp-content-audit-20261015"]
    paths: ["scripts/cp_content_full_audit.py"]

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tmp/cp-content-audit-20261015"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyarrow pandas numpy
      - name: Check artifact hashes and source identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/cp_content_full_audit.py preflight --output-dir cp-content-audit-inputs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-content-audit-input-index
          path: cp-content-audit-inputs/
          if-no-files-found: warn
          retention-days: 30

  audit-scenario:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix:
        scenario: [C100_G100, C100_G070, C100_G050, C100_G030, C100_G000, C085_G100, C085_G070, C085_G050, C085_G030, C085_G000, C070_G100, C070_G070, C070_G050, C070_G030, C070_G000, C050_G100, C050_G070, C050_G050, C050_G030, C050_G000, C030_G100, C030_G070, C030_G050, C030_G030, C030_G000]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tmp/cp-content-audit-20261015"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyarrow pandas numpy
      - uses: actions/download-artifact@v4
        with:
          name: cp-content-audit-input-index
          path: cp-content-audit-input-index
      - name: Audit full accounting and daily-distribution population
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p audit-reports
          python scripts/cp_content_full_audit.py scenario --scenario "${{ matrix.scenario }}" --input-index cp-content-audit-input-index --output "audit-reports/${{ matrix.scenario }}.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report-${{ matrix.scenario }}
          path: audit-reports/${{ matrix.scenario }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    if: always()
    needs: [preflight, audit-scenario]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tmp/cp-content-audit-20261015"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyarrow pandas numpy
      - if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: audit-report-*
          path: cp-content-audit-reports
          merge-multiple: true
          if-no-artifact-found: ignore
      - if: always()
        uses: actions/download-artifact@v4
        with:
          name: cp-content-audit-input-index
          path: cp-content-audit-reports/preflight
          if-no-artifact-found: ignore
      - name: Write aggregate result and content hash
        if: always()
        run: |
          python scripts/cp_content_full_audit.py aggregate --reports-dir cp-content-audit-reports --output cp-content-audit-final.json
          sha256sum cp-content-audit-final.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-content-audit-final-report
          path: cp-content-audit-final.json
          if-no-files-found: warn
          retention-days: 30
