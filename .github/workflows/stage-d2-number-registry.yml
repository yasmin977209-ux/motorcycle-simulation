name: Stage D2 Number Registry Build and Exact Head Validation

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - "docs/stage_d/D2_COMPLETION_TRIGGER_2026-11-01.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stage-d2-number-registry-tmp-d1-rebuild-20261101
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: python -m pip install --upgrade pytest requests pyarrow==26.0.0

      - name: Download and verify pinned source artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/tmp/d1-rebuild-20261101"
          python - <<'PY'
          import hashlib, os, pathlib, requests
          repo = "yasmin977209-ux/motorcycle-simulation"
          pins = {
              "aggregate": (12852969854, 9357996, "ec05a69ae8968585decf83cf0716d56c264f47f86187cfd3cf53b11f52ca2e54", "aggregate.zip"),
              "full_logging": (12998778418, 310827203, "403371cc8eb12880dda05529b4c83dd675bfa609e8680c09d35efa729c5b5aeb", "full-logging.zip"),
              "c100": (12630457193, 361733, "c977d1cbb5204919eadc72358533f77cdbbc239902bcd6f921bf1a915a716e79", "c100.zip"),
          }
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"], "Accept": "application/vnd.github+json"}
          dest = pathlib.Path(".stage-d2")
          dest.mkdir(exist_ok=True)
          for key, (artifact_id, expected_size, expected_sha, filename) in pins.items():
              meta = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}", headers=headers, timeout=60)
              meta.raise_for_status()
              item = meta.json()
              if item.get("expired") or item.get("size_in_bytes") != expected_size or item.get("digest") != "sha256:" + expected_sha:
                  raise SystemExit("ARTIFACT_METADATA_PIN_MISMATCH:" + str(artifact_id))
              response = requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip", headers=headers, allow_redirects=False, timeout=60)
              if response.status_code not in (301, 302, 303, 307, 308) or not response.headers.get("Location"):
                  raise SystemExit("ARTIFACT_REDIRECT_MISSING:" + str(artifact_id))
              target = dest / filename
              digest = hashlib.sha256()
              size = 0
              with requests.get(response.headers["Location"], stream=True, timeout=240) as download:
                  download.raise_for_status()
                  with target.open("wb") as output:
                      for chunk in download.iter_content(1024 * 1024):
                          if chunk:
                              output.write(chunk)
                              digest.update(chunk)
                              size += len(chunk)
              if size != expected_size or digest.hexdigest() != expected_sha:
                  raise SystemExit("ARTIFACT_BYTES_PIN_MISMATCH:" + str(artifact_id))
              print(f"VERIFIED_ARTIFACT {key} id={artifact_id} bytes={size} sha256={digest.hexdigest()}")
          PY

      - name: Compile and run tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts/s6_artifact_reader.py scripts/s6_deliverables_model.py scripts/s6_manifest_resolver.py scripts/s6_deliverables_builder.py scripts/s6_number_registry.py tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
          export STAGE_D_AGGREGATE=.stage-d2/aggregate.zip
          export STAGE_D_FULL_LOGGING=.stage-d2/full-logging.zip
          export STAGE_D_C100=.stage-d2/c100.zip
          python -m pytest -q -rs tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py

      - name: Build the Number Registry
        run: |
          set -euo pipefail
          python -m scripts.s6_number_registry build --aggregate .stage-d2/aggregate.zip --full-logging .stage-d2/full-logging.zip --c100 .stage-d2/c100.zip --source-head "$GITHUB_SHA" --workflow-run-id "$GITHUB_RUN_ID"
          python -m scripts.s6_number_registry validate --registry results/number_registry.json
          test "$(wc -c < results/number_registry.json)" -lt 90000000

      - name: Reconcile canonical D2 audit JSON without losing the local historical report
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from scripts.s6_number_registry import original_historical_report
          legacy_path = pathlib.Path("docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json")
          live_path = pathlib.Path("docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json")
          legacy = json.loads(legacy_path.read_text(encoding="utf-8"))
          historical = original_historical_report(legacy)
          live = json.loads(live_path.read_text(encoding="utf-8"))
          current = {
              "audit_id": "D2-S6-NUMBER-REGISTRY-2026-11-01",
              "status": "PASS_SCOPED_WITH_LIMITATIONS",
              "classification": "T2_INTERIM / NOT_FINAL_BLOCKED",
              "registry_path": "results/number_registry.json",
              "registry_sha256": live.get("registry_sha256"),
              "registry_git_blob_sha1": live.get("registry_git_blob_sha1"),
              "registry_size_bytes": live.get("registry_size_bytes", 24136918),
              "registry_containing_commit": live.get("registry_containing_commit"),
              "workflow_run_id": str(live["workflow_run_id"]),
              "source_head": live.get("source_head"),
              "aggregate_checkpoint_entries": live["aggregate_checkpoint_entries"],
              "entry_count": live["entry_count"],
              "daily_series_count": live["daily_series_count"],
              "daily_point_count": live["daily_point_count"],
              "daily_points_resolved": live.get("daily_points_resolved"),
              "daily_distribution_rows": live["daily_distribution_rows"],
              "representative_trial_count": live["representative_trial_count"],
              "representative_numeric_entries": live["representative_numeric_entries"],
              "cohort_counts": live["cohort_counts"],
              "artifact_pins": live["artifact_pins"],
              "gate_statuses": live["gate_statuses"],
              "unavailable_evidence": live["unavailable_evidence"],
              "full_logging_normalized_status": live["full_logging_normalized_status"],
              "c100_golden_revalidation": live["c100_golden_revalidation"],
              "historical_local_report": {
                  "status": "REPORTED_ONLY_LOCAL_ONLY",
                  "classification": "HISTORICAL_REPORT_NOT_CURRENT_REGISTRY",
                  "original_report": historical
              },
              "limitations": [
                  "Full Logging contains 105 representative keys only; normalized statuses remain NOT_VERIFIED.",
                  "C100 remains separate as CROSS_COHORT_DETERMINISTIC_REUSE; Golden revalidation remains NOT_RUN.",
                  "Production Gate A remains NOT_DECLARED.",
                  "Gate B N=2400 remains FAIL_SCOPED (10/10); Stability remains NOT_CONVERGED (0/60).",
                  "N=4800 remains NOT_EXECUTED.",
                  "The five missing historical accounting fields remain MISSING_EVIDENCE and are not backfilled or zero-filled.",
                  "No Trial, Simulation, Monte Carlo or N expansion was run."
              ],
              "audit_note": "This canonical audit JSON supersedes the original top-level local-only disposition while retaining the complete original report under historical_local_report."
          }
          legacy_path.write_text(json.dumps(current, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          md_path = pathlib.Path("docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md")
          marker = "## Current D2 status correction — 2026-11-01"
          md = md_path.read_text(encoding="utf-8")
          if marker not in md:
              block = (
                  "\n\n" + marker + "\n\n"
                  + "- Current canonical status: PASS_SCOPED_WITH_LIMITATIONS, proven by the successful exact-head D2 workflow in Run " + str(live["workflow_run_id"]) + ".\n"
                  + "- The opening REPORTED_ONLY_LOCAL header and 13,954-entry count above are retained as historical local audit context only; they are not the current repository registry.\n"
                  + "- Current repository registry: 2,640 entries (960 aggregate checkpoint values + 1,680 numeric values for 105 representative Full Logging keys), 1,000 daily series and 2,086,550 addressable daily points.\n"
                  + "- Every daily point now has a deterministic D2D number_id scheme and a callable resolve_number lookup that returns its exact value and source provenance.\n"
                  + "- Historical report contents were retained inside docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json under historical_local_report; no historical result was silently deleted.\n"
              )
              with md_path.open("a", encoding="utf-8") as output:
                  output.write(block)
          PY

      - name: Append continuity and handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          reg = json.loads(pathlib.Path("results/number_registry.json").read_text(encoding="utf-8"))
          audit = json.loads(pathlib.Path("docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json").read_text(encoding="utf-8"))
          section = f"""
          ## D2 Number Registry — 2026-11-01 (append-only)

          - Build: PASS_SCOPED_WITH_LIMITATIONS; exact-head validation is recorded in workflow Run {audit['workflow_run_id']}.
          - Registry entries: {audit['entry_count']}; daily series: {audit['daily_series_count']}; addressable daily points: {audit['daily_point_count']}.
          - S6 identity: {reg['scope']['S6']['source_sha']} / {reg['scope']['S6']['cohort_id']}.
          - C100 identity: {reg['scope']['C100']['source_sha']} / {reg['scope']['C100']['cohort_id']}; CROSS_COHORT_DETERMINISTIC_REUSE; Golden revalidation NOT_RUN.
          - Full Logging: 105 representative keys only; normalized statuses NOT_VERIFIED.
          - Gate A financial PASS_SCOPED; production NOT_DECLARED; Gate B FAIL_SCOPED; Stability NOT_CONVERGED; N=4800 NOT_EXECUTED.
          - Five accounting fields remain MISSING_EVIDENCE; no backfill or zero-fill.
          - No Trial, Simulation, Monte Carlo, N expansion or main update.
          """
          marker = "D2 Number Registry — 2026-11-01 (append-only)"
          names = [
              "docs/PROJECT_CONTINUITY.md",
              "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md",
              "docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md",
          ]
          for name in names:
              path = pathlib.Path(name)
              prior = path.read_text(encoding="utf-8")
              if marker not in prior:
                  with path.open("a", encoding="utf-8") as output:
                      output.write(section)
          PY

      - name: Commit D2 output on the working branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/tmp/d1-rebuild-20261101"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/number_registry.json docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md docs/PROJECT_CONTINUITY.md docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md
          git diff --cached --check
          git commit -m "stage-d(d2): publish scoped number registry"
          git push origin HEAD:refs/heads/tmp/d1-rebuild-20261101

      - name: Verify final head and exact raw bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, requests, subprocess
          repo = "yasmin977209-ux/motorcycle-simulation"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          remote = subprocess.check_output(["git", "ls-remote", "origin", "refs/heads/tmp/d1-rebuild-20261101"], text=True).split()[0]
          if head != remote:
              raise SystemExit("EXACT_HEAD_MISMATCH:" + head + ":" + remote)
          names = [
              "results/number_registry.json",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json",
              "docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md",
              "docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md",
              "docs/PROJECT_CONTINUITY.md",
              "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md",
              "docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md",
          ]
          for name in names:
              raw = pathlib.Path(name).read_bytes()
              url = f"https://raw.githubusercontent.com/{repo}/{head}/{name}"
              response = requests.get(url, timeout=180)
              response.raise_for_status()
              if response.content != raw:
                  raise SystemExit("RAW_READBACK_MISMATCH:" + name)
              blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + bytes([0]) + raw).hexdigest()
              print(f"VERIFIED_RAW path={name} bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} blob={blob} commit={head}")
          if subprocess.check_output(["git", "status", "--porcelain", "--untracked-files=no"], text=True).strip():
              raise SystemExit("WORKTREE_NOT_CLEAN")
          print("EXACT_FINAL_HEAD_PASS " + head)
          PY

      - name: Finalize D2 matrix and evidence ledger after first exact-head gate
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess
          matrix_path = pathlib.Path("docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md")
          matrix = matrix_path.read_text(encoding="utf-8")
          matrix = matrix.replace("PENDING_COMPLETION_RUN", "PASS_SCOPED (completion workflow must conclude SUCCESS)")
          matrix += (
              "\n\n## Completion workflow record\n\n"
              + "- Workflow Run: " + os.environ["GITHUB_RUN_ID"] + "\n"
              + "- Triggering source SHA: " + os.environ["GITHUB_SHA"] + "\n"
              + "- Registry-containing commit: " + subprocess.check_output(["git", "log", "-1", "--format=%H", "--", "results/number_registry.json"], text=True).strip() + "\n"
              + "- First exact-head gate passed before this documentation finalization. The final post-finalization exact HEAD and all Raw byte triples are established by the last validation step and the SUCCESS conclusion of this same workflow Run.\n"
          )
          matrix_path.write_text(matrix, encoding="utf-8")
          ledger_path = pathlib.Path("docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md")
          ledger = ledger_path.read_text(encoding="utf-8")
          ledger += (
              "\n\n## Completion workflow record\n\n"
              + "- Workflow Run ID: " + os.environ["GITHUB_RUN_ID"] + "\n"
              + "- Triggering source SHA: " + os.environ["GITHUB_SHA"] + "\n"
              + "- Registry-containing commit: " + subprocess.check_output(["git", "log", "-1", "--format=%H", "--", "results/number_registry.json"], text=True).strip() + "\n"
              + "- Final exact HEAD and file evidence triples are printed by the final Raw readback step of this Run; a failed Run is not accepted as evidence.\n"
          )
          ledger_path.write_text(ledger, encoding="utf-8")
          audit_path = pathlib.Path("docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md")
          audit = audit_path.read_text(encoding="utf-8")
          audit += (
              "\n\n## D2 completion workflow record\n\n"
              + "- Workflow Run ID: " + os.environ["GITHUB_RUN_ID"] + "\n"
              + "- Full Daily resolver validation and all D2 gates are required to pass before the Artifact upload.\n"
              + "- Final exact HEAD and Raw evidence triples are authoritative in this Run's final validation log.\n"
          )
          audit_path.write_text(audit, encoding="utf-8")
          run_record = (
              "\n\n## D2 completion workflow record — " + os.environ["GITHUB_RUN_ID"] + "\n\n"
              + "- Completion workflow Run: " + os.environ["GITHUB_RUN_ID"] + "\n"
              + "- Triggering source SHA: " + os.environ["GITHUB_SHA"] + "\n"
              + "- Registry-containing commit: " + subprocess.check_output(["git", "log", "-1", "--format=%H", "--", "results/number_registry.json"], text=True).strip() + "\n"
              + "- Final exact HEAD and nine-file Raw evidence triples are established by the final verification step of this successful Run.\n"
              + "- D2 remains PASS_SCOPED_WITH_LIMITATIONS; no D3, Trial, Simulation, Monte Carlo, N expansion, backfill or zero-fill is authorized by this record.\n"
          )
          for name in (
              "docs/PROJECT_CONTINUITY.md",
              "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md",
              "docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md",
          ):
              path = pathlib.Path(name)
              with path.open("ab") as output:
                  output.write(run_record.encode("utf-8"))
          PY
          git add docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md docs/PROJECT_CONTINUITY.md docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md
          git diff --cached --check
          git commit -m "docs(d2): finalize requirements matrix and remote evidence ledger"
          git push origin HEAD:refs/heads/tmp/d1-rebuild-20261101

      - name: Verify exact final HEAD and all D2 Raw bytes after documentation finalization
        run: |
          set -euo pipefail
          python -m scripts.s6_number_registry validate --registry results/number_registry.json
          python - <<'PY'
          import hashlib, pathlib, requests, subprocess
          repo = "yasmin977209-ux/motorcycle-simulation"
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          remote = subprocess.check_output(["git", "ls-remote", "origin", "refs/heads/tmp/d1-rebuild-20261101"], text=True).split()[0]
          if head != remote:
              raise SystemExit("FINAL_EXACT_HEAD_MISMATCH:" + head + ":" + remote)
          names = [
              "results/number_registry.json",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md",
              "docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json",
              "docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md",
              "docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md",
              "docs/PROJECT_CONTINUITY.md",
              "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-01.md",
              "docs/stage_d/STAGE_D_CONTINUITY_HANDOFF_2026-11-01.md",
          ]
          for name in names:
              raw = pathlib.Path(name).read_bytes()
              url = f"https://raw.githubusercontent.com/{repo}/{head}/{name}"
              response = requests.get(url, timeout=180)
              response.raise_for_status()
              if response.content != raw:
                  raise SystemExit("FINAL_RAW_READBACK_MISMATCH:" + name)
              blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + bytes([0]) + raw).hexdigest()
              print(f"FINAL_VERIFIED_RAW path={name} bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()} blob={blob} commit={head}")
          subprocess.run(["rm", "-rf", ".stage-d2"], check=True)
          if subprocess.check_output(["git", "status", "--porcelain"], text=True).strip():
              raise SystemExit("FINAL_WORKTREE_NOT_CLEAN")
          print("EXACT_FINAL_HEAD_PASS " + head)
          PY

      - name: Upload D2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: d2-number-registry
          path: |
            results/number_registry.json
            docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.md
            docs/stage_d/D2_NUMBER_REGISTRY_AUDIT.json
            docs/stage_d/D2_NUMBER_REGISTRY_AUDIT_LIVE_2026-11-01.json
            docs/stage_d/D2_REQUIREMENTS_MATRIX_2026-11-01.md
            docs/stage_d/D2_REMOTE_EVIDENCE_LEDGER_2026-11-01.md
          if-no-files-found: error
          retention-days: 30
