name: cp-statistical-doubling-verify

on:
  push:
    branches:
      - "tmp/stage7.1-statistical-doubling-20261013"
    paths-ignore:
      - "state.json"

permissions:
  contents: read

jobs:
  verify:
    name: Regression, acceptance and Chapter 4.4 path verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact CP branch
        uses: actions/checkout@v4
        with:
          ref: "tmp/stage7.1-statistical-doubling-20261013"
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and verification dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml

      - name: Parse changed Python and workflow files
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import yaml
          for name in (
              "constants.py",
              "run_batch.py",
              "scripts/stage7_stability.py",
          ):
              ast.parse(Path(name).read_text(encoding="utf-8"), filename=name)
          for name in (
              ".github/workflows/stage7-full-run.yml",
              ".github/workflows/cp-statistical-doubling-verify.yml",
          ):
              yaml.safe_load(Path(name).read_text(encoding="utf-8"))
          print("CP_STATISTICAL_DOUBLING_STATIC_PARSE_PASS")
          PY

      - name: Regression, acceptance and Chapter 4.4 paths
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/cp-statistical-doubling-report
          python -m pytest -q \
            tests/test_run_batch.py \
            tests/test_stage7_authoring.py \
            tests/test_stage3_path_integration.py \
            tests/test_stage3b_path1.py \
            tests/test_stage3b_paths.py \
            2>&1 | tee /tmp/cp-statistical-doubling-report/pytest.txt
          test_status=${PIPESTATUS[0]}
          printf '{"pytest_exit_code": %s, "scope": "run_batch + Stage 7 authoring + Chapter 4.4 paths"}\n' "$test_status" \
            > /tmp/cp-statistical-doubling-report/summary.json
          exit "$test_status"

      - name: Upload CP evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-statistical-doubling-verification-report
          path: /tmp/cp-statistical-doubling-report/
          if-no-files-found: warn
          retention-days: 30
