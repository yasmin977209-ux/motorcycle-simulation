name: S6 isolated owner-gated initial execution

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character SHA of the selected branch HEAD; must equal GITHUB_SHA
        required: true
        type: string
      s6_cohort_id:
        description: Exact owner-approved S6 cohort identity
        required: true
        type: choice
        options:
          - s6-v23-rebuild-20261105
      c100_cohort_id:
        description: Exact owner-approved C100 cohort identity
        required: true
        type: choice
        options:
          - c100-v23-rebuild-20261105
      trial_count:
        description: First checkpoint only; later N expansion requires a separate owner decision
        required: true
        type: choice
        options:
          - "300"
      owner_decision_id:
        description: Exact owner decision ID stored in the protected environment secret
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: s6-isolated-initial-\${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Read-only source, identity, and environment preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact selected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: \${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python patch version
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.18"
      - name: Verify dispatch context and exact identities
        env:
          REQUESTED_SOURCE_SHA: \${{ inputs.source_sha }}
          REQUESTED_S6_COHORT: \${{ inputs.s6_cohort_id }}
          REQUESTED_C100_COHORT: \${{ inputs.c100_cohort_id }}
          REQUESTED_N: \${{ inputs.trial_count }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/explicit-cohort-identity-20261108"
          test "$REQUESTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REQUESTED_SOURCE_SHA"
          test "$REQUESTED_S6_COHORT" = "s6-v23-rebuild-20261105"
          test "$REQUESTED_C100_COHORT" = "c100-v23-rebuild-20261105"
          test "$REQUESTED_N" = "300"
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("scripts/s6_checkpoint_config.json").read_text(encoding="utf-8"))
          assert cfg == {
              "checkpoint_mode": "FRESH",
              "active_target_trials": 300,
              "trial_start": 1,
              "trial_end": 300,
              "cohort_id": "s6-v23-rebuild-20261105",
              "governing_decision_id": "D-2026-10-30-REFERENCE-V2.4.0",
              "reference_sha256": "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b",
          }
          print("READ_ONLY_PREFLIGHT=PASS")
          print("SIMULATION_TRIALS=NOT_EXECUTED")
          PY

  s6-initial-checkpoint:
    name: S6 N=300 — 20 scenarios, sequential fail-fast
    needs: preflight
    if: \${{ needs.preflight.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: s6-simulation-execution
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      S6_SOURCE_SHA: \${{ inputs.source_sha }}
      S6_COHORT_ID: \${{ inputs.s6_cohort_id }}
      S6_TRIAL_COUNT: \${{ inputs.trial_count }}
      OWNER_DECISION_ID_INPUT: \${{ inputs.owner_decision_id }}
      OWNER_EXECUTION_DECISION_ID: \${{ secrets.S6_OWNER_EXECUTION_DECISION_ID }}
      S6_EXECUTION_ENVIRONMENT_LOCKED: \${{ vars.S6_EXECUTION_ENVIRONMENT_LOCKED }}
      S6_EXECUTION_APPROVED_SOURCE_SHA: \${{ vars.S6_EXECUTION_APPROVED_SOURCE_SHA }}
      S6_EXECUTION_APPROVED_COHORT_ID: \${{ vars.S6_EXECUTION_APPROVED_COHORT_ID }}
      S6_EXECUTION_APPROVED_N: \${{ vars.S6_EXECUTION_APPROVED_N }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: \${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python patch version
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.18"
      - name: Install only the hash-pinned runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-lock-py311-hashed.txt
      - name: Verify protected environment approval before any Trial
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$S6_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$S6_SOURCE_SHA"
          test "$S6_EXECUTION_ENVIRONMENT_LOCKED" = "true"
          test "$S6_EXECUTION_APPROVED_SOURCE_SHA" = "$S6_SOURCE_SHA"
          test "$S6_EXECUTION_APPROVED_COHORT_ID" = "$S6_COHORT_ID"
          test "$S6_EXECUTION_APPROVED_N" = "$S6_TRIAL_COUNT"
          test -n "$OWNER_EXECUTION_DECISION_ID"
          test "$OWNER_EXECUTION_DECISION_ID" = "$OWNER_DECISION_ID_INPUT"
          echo "OWNER_APPROVAL_AND_ENVIRONMENT_PIN=PASS"
      - name: Run S6 scenarios sequentially; stop on first failure
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e results_stage7_s6
          mkdir -p results_stage7_s6
          active_scenario="PRE_START"
          trap 'rc=$?; trap - ERR INT TERM; printf "{\"status\":\"FAILED_OR_CANCELLED_DIAGNOSTIC_ONLY\",\"run_id\":\"%s\",\"run_attempt\":\"%s\",\"source_sha\":\"%s\",\"cohort_id\":\"%s\",\"scenario\":\"%s\",\"exit_code\":%s,\"recorded_at_utc\":\"%s\"}\n" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$S6_SOURCE_SHA" "$S6_COHORT_ID" "$active_scenario" "$rc" "$(date -u +%FT%TZ)" > results_stage7_s6/EXECUTION_FAILURE.json; exit "$rc"' ERR INT TERM
          for collection in 085 070 050 030; do
            for recovery in 100 070 050 030 000; do
              active_scenario="C\${collection}_G\${recovery}"
              args=(
                --mode scenario
                --scenario "$active_scenario"
                --source-sha "$S6_SOURCE_SHA"
                --cohort-id "$S6_COHORT_ID"
                --run-id "$GITHUB_RUN_ID"
                --run-attempt "$GITHUB_RUN_ATTEMPT"
                --trials 300
                --trial-start 1
                --trial-end 300
                --workers 2
                --output-dir "results_stage7_s6/$active_scenario"
              )
              if [[ "$recovery" != "100" && ( "$collection" == "085" || "$collection" == "070" ) ]]; then
                args+=(--base-dir "results_stage7_s6/C\${collection}_G100")
              fi
              echo "S6_SCENARIO_START=$active_scenario"
              python scripts/s6_first_checkpoint.py "\${args[@]}"
              echo "S6_SCENARIO_COMPLETE=$active_scenario"
            done
          done
          active_scenario="AGGREGATE"
          python scripts/s6_first_checkpoint.py \
            --mode aggregate \
            --source-sha "$S6_SOURCE_SHA" \
            --cohort-id "$S6_COHORT_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --trials 300 \
            --input-root results_stage7_s6
          trap - ERR INT TERM
          echo "S6_INITIAL_CHECKPOINT=COMPLETE"
          echo "S6_AGGREGATE_C100_EVIDENCE=HISTORICAL_READ_ONLY_REUSE_ONLY"
      - name: Upload all completed and partial S6 evidence as immutable diagnostics
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: s6-initial-n300-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: results_stage7_s6/
          if-no-files-found: warn
          retention-days: 90

  c100-initial-golden:
    name: C100 initial deterministic Golden — 5 scenarios × 300
    needs: s6-initial-checkpoint
    if: \${{ needs.s6-initial-checkpoint.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: s6-simulation-execution
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      S4_SOURCE_SHA: \${{ inputs.source_sha }}
      S4_COHORT_ID: \${{ inputs.c100_cohort_id }}
      S4_C100_TRIAL_COUNT: "300"
      S4_RUN_URL: https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}
      OWNER_DECISION_ID_INPUT: \${{ inputs.owner_decision_id }}
      OWNER_EXECUTION_DECISION_ID: \${{ secrets.S6_OWNER_EXECUTION_DECISION_ID }}
      S6_EXECUTION_ENVIRONMENT_LOCKED: \${{ vars.S6_EXECUTION_ENVIRONMENT_LOCKED }}
      S6_EXECUTION_APPROVED_SOURCE_SHA: \${{ vars.S6_EXECUTION_APPROVED_SOURCE_SHA }}
      C100_EXECUTION_APPROVED_COHORT_ID: \${{ vars.C100_EXECUTION_APPROVED_COHORT_ID }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: \${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact Python patch version
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.11.18"
      - name: Install only the hash-pinned runtime
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-lock-py311-hashed.txt
      - name: Verify protected environment approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$S4_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$S4_SOURCE_SHA"
          test "$S6_EXECUTION_ENVIRONMENT_LOCKED" = "true"
          test "$S6_EXECUTION_APPROVED_SOURCE_SHA" = "$S4_SOURCE_SHA"
          test "$C100_EXECUTION_APPROVED_COHORT_ID" = "$S4_COHORT_ID"
          test -n "$OWNER_EXECUTION_DECISION_ID"
          test "$OWNER_EXECUTION_DECISION_ID" = "$OWNER_DECISION_ID_INPUT"
          echo "OWNER_APPROVAL_AND_ENVIRONMENT_PIN=PASS"
      - name: Run exact C100 initial Golden
        run: python scripts/s4_c100_golden.py
      - name: Upload only new C100 outputs; exclude historical R4 report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: c100-initial-n300-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: |
            docs/golden/v2.3/C100_GOLDEN_\${{ inputs.source_sha }}.json
            docs/audits/S4_C100_GOLDEN_MANIFEST_\${{ inputs.source_sha }}.json
            docs/audits/S4_C100_GOLDEN_REPORT_\${{ inputs.source_sha }}.md
            docs/audits/UNDEFINED_BUSINESS_RULE_S4_C100_\${{ inputs.source_sha }}.json
            docs/audits/S4_EXECUTION_FAILURE_C100_\${{ inputs.source_sha }}.json
            s4_evidence/
          if-no-files-found: warn
          retention-days: 90
