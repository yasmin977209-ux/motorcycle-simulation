name: Temporary Gate A provider extension and source identity validation

on:
  push:
    branches:
      - "tmp/cp-gatea-c030-n2400-20261015"
    paths:
      - ".github/workflows/tmp-cp-gatea-provider-verify.yml"
      - "scripts/golden_reference_provider.py"
      - "scripts/verify_gatea_source_identity.py"
      - "scripts/verify_golden_provider_extension.py"

permissions:
  contents: read
  actions: read

jobs:
  gatea-provider-validation:
    name: Validate pinned source imports and 25,205-map provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact CP head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and pin approved model source
        env:
          SOURCE_COMMIT: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/pinned-model-source" "$SOURCE_COMMIT"
          test "$(git -C "$RUNNER_TEMP/pinned-model-source" rev-parse HEAD)" = "$SOURCE_COMMIT"
          python -m pip install -r "$RUNNER_TEMP/pinned-model-source/requirements.txt"
      - name: Run existing targeted tests without modifications
        run: python -m pytest -q tests/test_golden_reference_provider.py tests/test_cp_gatea_c030_n2400_reference.py
      - name: Verify runtime import origins for daily_engine and complete local import closure
        run: python scripts/verify_gatea_source_identity.py --source-root "$RUNNER_TEMP/pinned-model-source"
      - name: Verify live provider extension and exact combined coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PYTHONPATH=. python scripts/verify_golden_provider_extension.py
      - name: Upload inspected CP1 validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: gatea-provider-extension-validation-attempt-${{ github.run_attempt }}
          path: results_gatea/*.json
          if-no-files-found: error
          retention-days: 90
