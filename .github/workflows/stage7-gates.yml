name: stage7-gates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_ARCHIVE_SHA256: 8a368b983afa757666f11b872d350c0280dea889feefa0ecdbe306914cdefede

jobs:
  repository-cleanliness:
    name: repository-cleanliness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository policy
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(.*reference.*|.*المرجع.*|.*report.*|.*تقرير.*|.*\.(xlsx|xlsm|xls|pdf))$'; then
            echo "Forbidden reference/report/Excel/PDF file detected."
            exit 1
          fi
          test -f README.md
          test -f requirements.txt
          test -f state.json
          test -f stage7_evidence_slice.zip
          test -f .github/workflows/stage7-gates.yml
          test -f stage7_source/source.tar.gz
          echo "Repository cleanliness gate: PASS"

  acceptance-163:
    name: acceptance-163
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct verified Python source package
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_ARCHIVE_SHA256}  stage7_source/source.tar.gz" | sha256sum -c -
          tar -xzf stage7_source/source.tar.gz -C .
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Run all 163 acceptance tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_acceptance_16_full.py

  parallel-3-trials:
    name: parallel-3-trials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct verified Python source package
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_ARCHIVE_SHA256}  stage7_source/source.tar.gz" | sha256sum -c -
          tar -xzf stage7_source/source.tar.gz -C .
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run 3 trials with 2 workers
        env:
          PYTHONPATH: .
        run: python tests/run_worker_group_to_file.py 2 /tmp/workers2.json
      - name: Run 3 trials with 4 workers
        env:
          PYTHONPATH: .
        run: python tests/run_worker_group_to_file.py 4 /tmp/workers4.json
      - name: Compare fingerprints exactly
        shell: python
        run: |
          import json
          from pathlib import Path
          a=json.loads(Path('/tmp/workers2.json').read_text())
          b=json.loads(Path('/tmp/workers4.json').read_text())
          assert a == b
          assert sorted(a) == ['1','2','3']
          print(json.dumps({'exact_match':True,'trials':3,'workers':[2,4]},sort_keys=True))

  pause-resume:
    name: pause-resume
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct verified Python source package
        shell: bash
        run: |
          set -euo pipefail
          echo "${EXPECTED_ARCHIVE_SHA256}  stage7_source/source.tar.gz" | sha256sum -c -
          tar -xzf stage7_source/source.tar.gz -C .
      - name: Install test requirements
        run: python -m pip install -r requirements.txt
      - name: Prove pause and resume
        env:
          PYTHONPATH: .
        run: python tests/run_pause_resume_gate.py
