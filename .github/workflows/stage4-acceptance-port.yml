# SAFETY: This workflow MUST NOT write to main.
# Results are published as artifacts only.
# Trigger is restricted to non-main branches.
name: Stage 4 Acceptance Port

on:
  push:
    branches: [stage4-verify-*]
    paths-ignore:
      - "results/**"

permissions:
  contents: read

jobs:
  acceptance-port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Record run start
        run: |
          set -euo pipefail
          printf 'RUN_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build Stage 5 fixtures for v2 parquet tests
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py
      - name: Measure temporary Stage 5 fixtures
        shell: bash
        run: du -sb results_stage5

      - name: Run Chapter 16 v2 acceptance
        id: acceptance
        continue-on-error: true
        env:
          PYTEST_ADDOPTS: --junitxml=/tmp/v2_junit.xml
        run: |
          set -o pipefail
          python -m pytest -q tests/test_acceptance_16_v2.py -v 2>&1 | tee /tmp/v2_output.txt

      - name: Prepare v2 results
        env:
          TEST_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p results
          if [ -f /tmp/v2_output.txt ]; then
            cp /tmp/v2_output.txt results/v2_output.txt
          else
            printf '%s\n' 'pytest output file was not created because the pytest step did not start.' > results/v2_output.txt
          fi

          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit_path = Path("/tmp/v2_junit.xml")
          if not junit_path.exists():
              raise SystemExit("JUnit XML was not created; pytest did not reach test execution.")

          root = ET.parse(junit_path).getroot()
          testcases = list(root.iter("testcase"))

          pass_count = fail_count = deferred_count = adjudication_count = 0
          failed_tests = []

          for case in testcases:
              name = case.attrib.get("name", "")
              match = re.search(r"test_(\d+)_", name)
              test_id = (match.group(1).lstrip("0") or "0") if match else None

              skipped = case.find("skipped")
              failure = case.find("failure")
              error = case.find("error")

              if skipped is not None:
                  reason = skipped.attrib.get("message", "") or (skipped.text or "")
                  if "ADJUDICATION" in reason.upper():
                      adjudication_count += 1
                  else:
                      deferred_count += 1
              elif failure is not None or error is not None:
                  fail_count += 1
                  node = failure if failure is not None else error
                  raw = ((node.attrib.get("message", "") + "\n" + (node.text or "")).strip())
                  failed_tests.append({
                      "id": test_id,
                      "name": name,
                      "error": raw[-500:],
                  })
              else:
                  pass_count += 1

          summary = {
              "sha": os.environ["TEST_SHA"],
              "run_started_at": os.environ["RUN_STARTED_AT"],
              "pass_count": pass_count,
              "fail_count": fail_count,
              "deferred_count": deferred_count,
              "adjudication_count": adjudication_count,
              "failed_tests": failed_tests,
          }
          Path("results/v2_summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY


      - name: Upload v2 results
        uses: actions/upload-artifact@v4
        with:
          name: stage4-acceptance-results-${{ github.run_id }}
          path: results/v2_*

      - name: Round 4
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_monte_carlo_round4.py

      - name: Fail workflow when acceptance failed
        if: steps.acceptance.outcome == 'failure'
        run: exit 1
