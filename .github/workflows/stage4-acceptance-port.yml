name: Stage 4 Acceptance Port

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acceptance-port:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Materialize acceptance v2 payload
        env:
          STAGE4_PAYLOAD_B64: 
        run: |
          set -euo pipefail
          rm -rf /tmp/stage4_payload
          mkdir -p /tmp/stage4_payload
          printf '%s' "$STAGE4_PAYLOAD_B64" | base64 -d > /tmp/stage4_payload.tar.gz
          tar -xzf /tmp/stage4_payload.tar.gz -C /tmp/stage4_payload
          cp /tmp/stage4_payload/tests/acceptance_helpers.py tests/acceptance_helpers.py
          cp /tmp/stage4_payload/tests/test_acceptance_16_v2.py tests/test_acceptance_16_v2.py
          cp /tmp/stage4_payload/docs/ACCEPTANCE_PORT.md docs/ACCEPTANCE_PORT.md
          python -m py_compile tests/acceptance_helpers.py tests/test_acceptance_16_v2.py
      - name: Commit generated acceptance port files
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/acceptance_helpers.py tests/test_acceptance_16_v2.py docs/ACCEPTANCE_PORT.md
          if git diff --cached --quiet; then
            echo "generated_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Port Chapter 16 acceptance to current interfaces"
            git push origin HEAD:main
            echo "generated_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run Chapter 16 v2 acceptance
        run: python -m pytest -q tests/test_acceptance_16_v2.py -v
