name: Stage D1 Rebuilt S6 Source Validation

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - "scripts/s6_*.py"
      - "tests/test_s6_*.py"
      - ".github/workflows/stage-d1-rebuild-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-d1-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install D1 source test dependencies
        run: python -m pip install --upgrade pytest
      - name: Compile and run D1 source tests at exact commit
        run: |
          set -euo pipefail
          python -m compileall -q scripts/s6_artifact_reader.py scripts/s6_deliverables_model.py scripts/s6_manifest_resolver.py scripts/s6_deliverables_builder.py scripts/s6_number_registry.py scripts/s6_validate_representatives.py tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
          python -m pytest -q tests/test_s6_deliverables_builder.py tests/test_s6_number_registry.py
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
