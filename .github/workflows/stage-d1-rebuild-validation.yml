name: Stage D1 Rebuilt S6 Builder Validation

on:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - "scripts/s6_*.py"
      - "tests/test_s6_*.py"
      - ".github/workflows/stage-d1-rebuild-validation.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stage-d1-rebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test and Parquet dependencies
        run: python -m pip install --upgrade pytest pyarrow
      - name: Download and verify pinned GitHub artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage-d results
          python - <<'PY'
          import hashlib,json,os,pathlib,urllib.request
          repo="yasmin977209-ux/motorcycle-simulation"; token=os.environ["GH_TOKEN"]
          items=[
            ("aggregate",12852969854,40773412377,"4f2f2cc16d0cb5125262088704febccbae6f50ed",9357996,"ec05a69ae8968585decf83cf0716d56c264f47f86187cfd3cf53b11f52ca2e54","s6-n2400.zip"),
            ("full_logging",12998778418,41098699740,"e3c2098df9fc5dbc126eb1e77ad35c493ff3ac70",310827203,"403371cc8eb12880dda05529b4c83dd675bfa609e8680c09d35efa729c5b5aeb","full-logging.zip"),
            ("c100",12630457193,40263424595,"24050f15bc7eb3097e20f76785a45c5d177643dd",361733,"c977d1cbb5204919eadc72358533f77cdbbc239902bcd6f921bf1a915a716e79","c100-reuse.zip")]
          def get(url):
            q=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
            with urllib.request.urlopen(q,timeout=180) as r:return json.loads(r.read().decode())
          rows=[]
          for key,aid,rid,tested,size,expected,name in items:
            run=get(f"https://api.github.com/repos/{repo}/actions/runs/{rid}")
            art=get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}")
            if run.get("status")!="completed" or run.get("conclusion")!="success" or run.get("head_sha")!=tested:raise SystemExit("PINNED_RUN_METADATA_MISMATCH")
            if art.get("expired") or art.get("size_in_bytes")!=size:raise SystemExit("PINNED_ARTIFACT_METADATA_MISMATCH")
            q=urllib.request.Request(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip",headers={"Authorization":f"Bearer {token}","Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
            h=hashlib.sha256(); total=0; dest=pathlib.Path("/tmp/stage-d")/name
            from urllib.request import HTTPRedirectHandler, build_opener
            from urllib.error import HTTPError
            class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
            opener=build_opener(NoRedirect)
            try: response=opener.open(q,timeout=300)
            except HTTPError as e:
              if e.code not in (301,302,303,307,308): raise
              response=urllib.request.urlopen(urllib.request.Request(e.headers["Location"]),timeout=300)
            with response as r,dest.open("wb") as f:
              while True:
                block=r.read(1024*1024)
                if not block:break
                f.write(block);h.update(block);total+=len(block)
            if total!=size or h.hexdigest()!=expected:raise SystemExit(f"ARTIFACT_BYTES_MISMATCH:{aid}")
            rows.append({"key":key,"artifact_id":aid,"run_id":rid,"tested_sha":tested,"size_bytes":total,"sha256":h.hexdigest()})
          pathlib.Path("results/D1_REBUILD_ARTIFACT_RECHECK.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
      - name: Compile and test the rebuilt source at this commit
        env:
          STAGE_D_AGGREGATE: /tmp/stage-d/s6-n2400.zip
          STAGE_D_FULL_LOGGING: /tmp/stage-d/full-logging.zip
          STAGE_D_C100: /tmp/stage-d/c100-reuse.zip
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m pytest -q
      - name: Build D1 Shared Model and validate the frozen map
        run: |
          set -euo pipefail
          python -m scripts.s6_deliverables_builder --aggregate /tmp/stage-d/s6-n2400.zip --full-logging /tmp/stage-d/full-logging.zip --c100 /tmp/stage-d/c100-reuse.zip --output results/shared_model.json
          python -m scripts.s6_validate_representatives --aggregate /tmp/stage-d/s6-n2400.zip --full-logging /tmp/stage-d/full-logging.zip --c100 /tmp/stage-d/c100-reuse.zip --output results/representative_validation.json
      - name: Confirm exact tested branch head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-rebuild-exact-head-evidence
          path: |
            results/D1_REBUILD_ARTIFACT_RECHECK.json
            results/shared_model.json
            results/representative_validation.json
          if-no-files-found: error
          retention-days: 90
