name: temporary-cp-d20-stage7-metric-tests

on:
  push:
    branches: ["tmp/cp-d20-stage7-metrics-20261014"]

permissions:
  contents: read
  actions: read

jobs:
  test-stability-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run §2.5 evaluator and Stage 7 authoring tests
        run: python -m pytest -q tests/test_stability_2_5_metrics.py tests/test_stage7_authoring.py

      - name: Download canonical Stage 12 C100 Parquet only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage12-c100
          while read -r scenario artifact_id; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "/tmp/${scenario}.zip"
            mkdir -p "/tmp/stage12-c100/${scenario}"
            unzip -oq "/tmp/${scenario}.zip" -d "/tmp/stage12-c100/${scenario}"
          done <<'ARTIFACTS'
          C100_G000 11633515803
          C100_G030 11633915162
          C100_G050 11633475828
          C100_G070 11633660943
          C100_G100 11632649937
          ARTIFACTS
      - name: Inspect canonical C100 Parquet records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq

          root = Path("/tmp/stage12-c100")
          output = {}
          for scenario_dir in sorted(root.iterdir()):
              paths = list(scenario_dir.rglob("*.parquet"))
              assert len(paths) == 1, (scenario_dir.name, [str(p) for p in paths])
              table = pq.read_table(paths[0])
              first = table.slice(0, 1).to_pylist()[0]
              last = table.slice(table.num_rows - 1, 1).to_pylist()[0]
              output[scenario_dir.name] = {
                  "path": paths[0].name,
                  "rows": table.num_rows,
                  "columns": table.column_names,
                  "schema": str(table.schema),
                  "first_row": first,
                  "last_row": last,
              }
          target = Path("c100-parquet-inspection.json")
          target.write_text(json.dumps(output, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          print(json.dumps({k:{"rows":v["rows"],"columns":v["columns"],"first_row":v["first_row"],"last_row":v["last_row"]} for k,v in output.items()}, ensure_ascii=False, sort_keys=True))
          PY
      - name: Preserve C100 audit extract
        uses: actions/upload-artifact@v4
        with:
          name: temporary-c100-parquet-inspection
          path: c100-parquet-inspection.json
          if-no-files-found: error

      - name: Download canonical Stage 7 C100 TrialResult artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage7-c100
          while read -r scenario artifact_id; do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              -o "/tmp/stage7-${scenario}.zip"
            mkdir -p "/tmp/stage7-c100/${scenario}"
            unzip -oq "/tmp/stage7-${scenario}.zip" -d "/tmp/stage7-c100/${scenario}"
          done <<'ARTIFACTS'
          C100_G000 11312176891
          C100_G030 11312320486
          C100_G050 11311992664
          C100_G070 11311843040
          C100_G100 11312276587
          ARTIFACTS
      - name: Extract exact canonical C100 trial metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq

          root = Path("/tmp/stage7-c100")
          rows = {}
          required = {
              "scenario_id", "trial_id", "source_sha", "master_seed",
              "cumulative_project_profit", "final_cash",
              "termination_count", "held_assets",
          }
          for scenario_dir in sorted(root.iterdir()):
              paths = list(scenario_dir.rglob("*.parquet"))
              assert len(paths) == 1, (scenario_dir.name, [str(p) for p in paths])
              table = pq.read_table(paths[0])
              assert table.num_rows == 1, (scenario_dir.name, table.num_rows)
              row = table.slice(0,1).to_pylist()[0]
              assert row["scenario_id"] == scenario_dir.name, (scenario_dir.name,row["scenario_id"])
              assert row["trial_id"] == 1, (scenario_dir.name,row["trial_id"])
              assert row["source_sha"] == "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
              assert row["master_seed"] == 20270101
              assert required.issubset(row), (scenario_dir.name, required - row.keys(), row.keys())
              rows[scenario_dir.name] = {k:row[k] for k in sorted(required)}
          assert len(rows) == 5, rows.keys()
          Path("c100-canonical-trial-results.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8"
          )
          print(json.dumps(rows, ensure_ascii=False, sort_keys=True))
          PY
      - name: Preserve canonical C100 TrialResult extract
        uses: actions/upload-artifact@v4
        with:
          name: temporary-c100-canonical-trial-results
          path: c100-canonical-trial-results.json
          if-no-files-found: error
