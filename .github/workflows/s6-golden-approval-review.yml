name: S6 independent Golden approval and daily balance projection review

on:
  push:
    branches:
      - "tmp/s6-aggregate-contract-fix-20261027"
    paths:
      - ".github/workflows/s6-golden-approval-review.yml"
      - "docs/stage7/S6_GOLDEN_APPROVAL_DA1A_N2400.json"
      - "docs/stage7/statistical_execution_gate.json"
      - "docs/governance/D-2026-10-29-S6-REFERENCE-CHECKPOINT-RECONCILIATION.md"
      - "monte_carlo.py"
      - "tests/test_s6_daily_balance_snapshot_schema.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: s6-golden-approval-review
  cancel-in-progress: false

jobs:
  verify:
    name: Verify read-only Golden approval and balance projection contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run only the non-simulation daily projection test
        run: |
          set -euo pipefail
          python -m py_compile monte_carlo.py tests/test_s6_daily_balance_snapshot_schema.py
          python -m pytest -q tests/test_s6_daily_balance_snapshot_schema.py
      - name: Download the exact independent Golden candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: s6-independent-golden-da1a-n2400-40760465042
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40760465042
          path: audit-input/golden
      - name: Download the immutable production comparison audit
        uses: actions/download-artifact@v4
        with:
          name: s6-n2400-golden-accounting-audit-40784902124
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 40784902124
          path: audit-input/comparison
      - name: Validate independent map, manifest, approval and exact comparison without simulation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          approval = json.loads(Path("docs/stage7/S6_GOLDEN_APPROVAL_DA1A_N2400.json").read_text(encoding="utf-8"))
          gate = json.loads(Path("docs/stage7/statistical_execution_gate.json").read_text(encoding="utf-8"))
          golden_dir = Path("audit-input/golden")
          comparison_dir = Path("audit-input/comparison")
          map_path = golden_dir / "independent_golden_fingerprints.json"
          manifest_path = golden_dir / "independent_golden_manifest.json"
          comparison_path = comparison_dir / "S6_N2400_GOLDEN_ACCOUNTING_AUDIT.json"
          for path in (map_path, manifest_path, comparison_path):
              if not path.is_file():
                  raise SystemExit(f"REQUIRED_IMMUTABLE_EVIDENCE_MISSING:{path}")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          fmap_sha = sha256(map_path)
          manifest_sha = sha256(manifest_path)
          if fmap_sha != approval["golden_map_sha256"]:
              raise SystemExit("APPROVED_GOLDEN_MAP_SHA256_MISMATCH")
          if manifest_sha != approval["golden_manifest_sha256"]:
              raise SystemExit("APPROVED_GOLDEN_MANIFEST_SHA256_MISMATCH")

          fmap = json.loads(map_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          audit = json.loads(comparison_path.read_text(encoding="utf-8"))
          scenarios = manifest["scenario_ids"]
          expected = [
              f"C{c:03d}_G{g:03d}"
              for c in (85, 70, 50, 30)
              for g in (100, 70, 50, 30, 0)
          ]
          if scenarios != expected:
              raise SystemExit("GOLDEN_SCENARIO_ORDER_OR_SCOPE_MISMATCH")
          if fmap["status"] != "INDEPENDENT_GOLDEN_CANDIDATE_NOT_APPROVED":
              raise SystemExit("HISTORICAL_CANDIDATE_STATUS_CHANGED")
          if manifest["status"] != "INDEPENDENT_GOLDEN_CANDIDATE_NOT_APPROVED":
              raise SystemExit("HISTORICAL_MANIFEST_STATUS_CHANGED")
          for identity in (fmap, manifest):
              if identity.get("source_sha") != approval["source_sha"]:
                  raise SystemExit("GOLDEN_SOURCE_SHA_MISMATCH")
              if identity.get("cohort_id") != approval["cohort_id"]:
                  raise SystemExit("GOLDEN_COHORT_ID_MISMATCH")
              if identity.get("master_seed") != approval["master_seed"]:
                  raise SystemExit("GOLDEN_MASTER_SEED_MISMATCH")
              if identity.get("model_schema_version") != approval["model_schema_version"]:
                  raise SystemExit("GOLDEN_SCHEMA_VERSION_MISMATCH")
              if identity.get("independent_execution") is not True or identity.get("production_result_artifacts_read") is not False:
                  raise SystemExit("GOLDEN_INDEPENDENCE_CLAIM_INVALID")
          if fmap["trial_count_per_scenario"] != 2400 or fmap["trial_id_start"] != 1 or fmap["trial_id_end"] != 2400:
              raise SystemExit("GOLDEN_TRIAL_SCOPE_INVALID")
          if fmap["total_trial_fingerprints"] != 48000 or manifest["total_trial_fingerprints"] != 48000:
              raise SystemExit("GOLDEN_TOTAL_FINGERPRINT_COUNT_INVALID")
          if str(manifest["run_id"]) != "40760465042" or manifest["run_attempt"] != 1 or manifest["tested_sha"] != approval["tested_sha"]:
              raise SystemExit("GOLDEN_ACTIONS_PROVENANCE_MISMATCH")
          if manifest["map_file_sha256"] != fmap_sha or manifest["map_file"] != map_path.name:
              raise SystemExit("GOLDEN_MAP_MANIFEST_LINK_MISMATCH")

          manifest_by_scenario = {item["scenario_id"]: item for item in manifest["scenario_manifest"]}
          if set(manifest_by_scenario) != set(scenarios) or len(manifest_by_scenario) != 20:
              raise SystemExit("GOLDEN_SCENARIO_MANIFEST_SCOPE_INVALID")
          combined_lines = []
          for scenario in scenarios:
              entry = fmap["scenarios"][scenario]
              fingerprints = entry["trial_fingerprints"]
              expected_ids = {str(i) for i in range(1, 2401)}
              if set(fingerprints) != expected_ids or len(fingerprints) != 2400:
                  raise SystemExit(f"GOLDEN_TRIAL_COVERAGE_INVALID:{scenario}")
              if any(not isinstance(v, str) or len(v) != 64 for v in fingerprints.values()):
                  raise SystemExit(f"GOLDEN_FINGERPRINT_FORMAT_INVALID:{scenario}")
              ordered_lines = "\n".join(
                  f"{scenario}|{trial_id}|{fingerprints[str(trial_id)]}"
                  for trial_id in range(1, 2401)
              ) + "\n"
              scenario_hash = hashlib.sha256(ordered_lines.encode("utf-8")).hexdigest()
              if scenario_hash != entry["financial_trial_fingerprint_map_sha256"]:
                  raise SystemExit(f"GOLDEN_SCENARIO_MAP_HASH_INVALID:{scenario}")
              meta = manifest_by_scenario[scenario]
              if meta["trial_count"] != 2400 or meta["file_sha256"] != approval["scenario_artifact_file_sha256_by_scenario"].get(scenario):
                  raise SystemExit(f"GOLDEN_APPROVED_SCENARIO_ARTIFACT_HASH_MISMATCH:{scenario}")
              if meta["financial_trial_fingerprint_map_sha256"] != scenario_hash:
                  raise SystemExit(f"GOLDEN_MANIFEST_SCENARIO_HASH_MISMATCH:{scenario}")
              combined_lines.extend(
                  f"{scenario}|{trial_id}|{fingerprints[str(trial_id)]}"
                  for trial_id in range(1, 2401)
              )
          combined_sha = hashlib.sha256(("\n".join(combined_lines) + "\n").encode("utf-8")).hexdigest()
          if combined_sha != manifest["combined_financial_trial_fingerprint_map_sha256"]:
              raise SystemExit("GOLDEN_COMBINED_MAP_SHA256_MISMATCH")
          if combined_sha != approval["combined_financial_trial_fingerprint_map_sha256"]:
              raise SystemExit("APPROVAL_COMBINED_MAP_SHA256_MISMATCH")

          required_checks = (
              "source_lock_pass", "source_cohort_seed_schema_match", "full_scenario_coverage",
              "contiguous_trial_ids", "map_hashes_verified", "scenario_artifact_hashes_verified",
              "no_production_artifact_input", "tested_sha_verified_from_actions",
          )
          if approval.get("schema_version") != "s6-gate-a-golden-approval-v1":
              raise SystemExit("APPROVAL_SCHEMA_INVALID")
          if approval.get("status") != "APPROVED_FOR_GATE_A" or approval.get("review_status") != "APPROVED":
              raise SystemExit("APPROVAL_STATUS_INVALID")
          if any(approval.get("review_checks", {}).get(key) is not True for key in required_checks):
              raise SystemExit("APPROVAL_REVIEW_CHECKS_INCOMPLETE")
          if approval.get("golden_artifact_digest") != "sha256:e6d94d715eb7e52ffc8ba61ae6dafb766b76914d956879190f1e87b87e311078":
              raise SystemExit("GOLDEN_OUTER_ARTIFACT_DIGEST_MISMATCH")

          comparison = audit["golden_candidate_comparison"]
          if comparison.get("status") != "PASS_EXACT_MATCH" or comparison.get("compared_fingerprints") != 48000 or comparison.get("exact_matches") != 48000 or comparison.get("mismatch_count") != 0 or comparison.get("first_mismatches") != []:
              raise SystemExit("EXACT_PRODUCTION_COMPARISON_NOT_PASS")
          if audit.get("source_sha") != approval["source_sha"] or audit.get("cohort_id") != approval["cohort_id"] or audit.get("master_seed") != approval["master_seed"]:
              raise SystemExit("COMPARISON_SOURCE_IDENTITY_MISMATCH")
          accounting = audit["daily_balance_reconciliation"]
          if accounting.get("status") != "MISSING_EVIDENCE_FOR_INDEPENDENT_RECHECK" or accounting.get("rows_recomputed") != 0 or accounting.get("missing_component_rows") != accounting.get("rows_seen") or accounting.get("assets_field_present_all_scenarios") is not False:
              raise SystemExit("MISSING_BALANCE_EVIDENCE_STATUS_NOT_PRESERVED")
          if audit.get("original_source_run_metadata_sha256") is not None or audit.get("acceptance") != "NOT_GRANTED":
              raise SystemExit("SOURCE_METADATA_GAP_OR_ACCEPTANCE_BOUNDARY_CHANGED")
          if gate.get("source_basis", {}).get("reference_sha256") != "e5efaf0874384e8248c339ca10e248ea9e17e9f0882153b4ef88bc955b91d53f":
              raise SystemExit("S6_NORMATIVE_REFERENCE_HASH_MISMATCH")
          extension = gate.get("approved_policy", {}).get("checkpoint_extension_policy", {})
          if extension.get("no_fixed_upper_cap") is not True or extension.get("four_points_are_ceiling") is not False:
              raise SystemExit("CHECKPOINT_EXTENSION_CONTRACT_INVALID")
          if gate.get("execution_authorization", {}).get("scenario_stability_declaration_allowed") is not False or gate.get("execution_authorization", {}).get("final_delivery_acceptance_allowed") is not False:
              raise SystemExit("ACCEPTANCE_FLAGS_UNEXPECTEDLY_PROMOTED")

          from scripts.s6_first_checkpoint import load_approved_gate_a_golden
          loaded_golden = load_approved_gate_a_golden(
              str(map_path),
              str(manifest_path),
              "docs/stage7/S6_GOLDEN_APPROVAL_DA1A_N2400.json",
              expected_source_sha=approval["source_sha"],
              expected_cohort_id=approval["cohort_id"],
          )
          if loaded_golden is None or loaded_golden.get("status") != "APPROVED_FOR_GATE_A":
              raise SystemExit("S6_RUNTIME_GOLDEN_LOADER_REJECTED_APPROVAL")

          report = {
              "status": "PASS_SCOPED_GOLDEN_APPROVAL_AND_PROJECTION_TEST",
              "approval_id": approval["approval_id"],
              "approved_scope": "read-only financial fingerprint map only",
              "source_sha": approval["source_sha"],
              "cohort_id": approval["cohort_id"],
              "scenarios": 20,
              "trial_ids_per_scenario": "1..2400",
              "fingerprints_verified": 48000,
              "candidate_map_sha256": fmap_sha,
              "candidate_manifest_sha256": manifest_sha,
              "combined_map_sha256": combined_sha,
              "production_fingerprint_comparison": comparison["status"],
              "exact_matches": comparison["exact_matches"],
              "mismatches": comparison["mismatch_count"],
              "full_balance_sheet_status": "MISSING_EVIDENCE",
              "full_balance_rows_recomputed": accounting["rows_recomputed"],
              "source_run_metadata_sha256": audit["original_source_run_metadata_sha256"],
              "gate_a_production_checkpoint_status": "NOT_DECLARED_BY_THIS_APPROVAL",
              "gate_b_status": audit["statistical_evaluation"]["gate_b"],
              "stability_status": audit["statistical_evaluation"]["stability"],
              "final_acceptance": audit["acceptance"],
              "simulation_trials_run": False
          }
          Path("audit-output/S6_GOLDEN_APPROVAL_AND_BALANCE_PROJECTION_VERIFICATION.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY
      - name: Upload read-only verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s6-golden-approval-and-balance-projection-verification-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: warn
          retention-days: 30
