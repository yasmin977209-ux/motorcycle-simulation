name: U2 staged targeted tests

on:
  push:
    branches:
      - "tmp/u2-test-20261025"
    paths:
      - ".u2-test-stage"
      - ".github/workflows/u2-targeted-tests.yml"
      - "dateutils.py"
      - "entities.py"
      - "daily_engine.py"
      - "settlement.py"
      - "accounting.py"
      - "constants.py"
      - "rng.py"
      - "partner_equity.py"
      - "friday.py"
      - "state_machine.py"
      - "closure.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact staged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run affected tests for the current U2 item
        shell: bash
        run: |
          stage="$(cat .u2-test-stage)"
          set -euo pipefail
          case "$stage" in
            1)
              python -m pytest -q tests/test_stage1.py tests/test_stage3a.py
              python -m pytest -q tests/test_acceptance_16_v2.py -k "test_019 or test_020 or test_021 or test_022 or test_023 or test_024"
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_168"
              ;;
            2)
              python -m pytest -q tests/test_stage3a.py -k "ch7"
              python -m pytest -q tests/test_acceptance_16_v2.py -k "test_046 or test_047 or test_054"
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_164 or test_165"
              ;;
            3)
              python -m pytest -q tests/test_stage3b_paths.py tests/test_stage3b_no_time_cap.py
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_166"
              ;;
            4)
              python -m pytest -q tests/test_stage3b_rollforward.py
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_167"
              ;;
            5)
              python -m pytest -q tests/test_stage3b_partner_equity.py
              python -m pytest -q tests/test_stage3a.py -k "ch5_4 or ch5_5"
              ;;
            6)
              python -m pytest -q tests/test_stage2.py tests/test_stage2_entities_additions.py tests/test_stage3b_rollforward.py tests/test_stage3b_determinism.py
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_177 or test_178"
              ;;
            7)
              python -m pytest -q tests/test_monte_carlo_round2.py::test_parallel_matches_sequential_at_two_worker_counts
              python -m pytest -q tests/test_acceptance_16_v2.py -k "test_128"
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_171"
              ;;
            8)
              python -m pytest -q tests/test_stage3b_closure.py tests/test_stage3b_no_time_cap.py
              python -m pytest -q tests/test_u2_reference_corrections.py -k "test_173"
              ;;
            *) echo "Unsupported U2 test stage: $stage" >&2; exit 2 ;;
          esac
