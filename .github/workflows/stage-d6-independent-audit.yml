name: D6 Independent Post-Write Audit
on:
  workflow_dispatch:
  push:
    branches:
      - tmp/d1-rebuild-20261101
permissions:
  contents: read
  actions: read
concurrency:
  group: motorcycle-simulation-d6-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-post-write-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-core
          python -m pip install openpyxl python-docx pytest pypdf lxml numpy pyarrow scipy python-dateutil
      - name: Resolve D6 GitHub Job ID
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${AUDIT_RUN_ID}/jobs?per_page=100" -o /tmp/d6-jobs.json
          job_id="$(python -c 'import json; d=json.load(open("/tmp/d6-jobs.json")); print(next(x["id"] for x in d["jobs"] if x["name"]=="independent-post-write-audit"))')"
          echo "D6_JOB_ID=${job_id}" >> "$GITHUB_ENV"
          echo "D6_JOB_ID=${job_id}"
      - name: Run independent auditor unit tests
        run: python -m pytest -q -rs tests/test_d6_audit.py tests/test_d5_package.py tests/test_d4_numeric_occurrences.py
      - name: Download and verify original D0 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13535434691"
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" -o /tmp/d0-meta.json
          python - <<'PY'
          import json,pathlib,hashlib,zipfile
          m=json.loads(pathlib.Path("/tmp/d0-meta.json").read_text())
          assert m["id"]==13535434691 and m["expired"] is False
          assert m["size_in_bytes"]==2346
          assert m["digest"]=="sha256:898f650ca5f0196d7fae9fe49cd1987c8ffd2ad4d1cab54c63a130ad24022d7f"
          print("D0_ARTIFACT_METADATA_PASS",json.dumps({k:m.get(k) for k in ("id","name","size_in_bytes","digest","expires_at")}))
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api/zip" -o /tmp/d0-artifact.zip
          test "$(stat -c %s /tmp/d0-artifact.zip)" = "2346"
          python - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path("/tmp/d0-artifact.zip")
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          assert h=="898f650ca5f0196d7fae9fe49cd1987c8ffd2ad4d1cab54c63a130ad24022d7f",h
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              print("D0_ARTIFACT_ZIP_CRC_PASS",{"bytes":p.stat().st_size,"sha256":h,"members":len(z.infolist())})
          PY
      - name: Download exact D5 Artifact and verify GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(python -c 'import json; d=json.load(open("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json")); print(d["artifact"]["id"])')"
          expected_size="$(python -c 'import json; d=json.load(open("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json")); print(d["artifact"]["size_in_bytes"])')"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" -o /tmp/d5-meta.json; then break; fi
            sleep 5
          done
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("/tmp/d5-meta.json").read_text())
          d=json.loads(pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json").read_text())
          a=d["artifact"]
          assert m["id"]==int(a["id"]) and m["expired"] is False
          assert m["size_in_bytes"]==int(a["size_in_bytes"])
          assert m["digest"]==a["digest"]==("sha256:"+a["downloaded_zip_sha256"])
          assert m.get("workflow_run",{}).get("id")==int(d["workflow_run_id"])
          print(json.dumps({k:m.get(k) for k in ("id","name","size_in_bytes","digest","expires_at","workflow_run")},indent=2))
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api/zip" -o /tmp/d5-artifact.zip
          test "$(stat -c %s /tmp/d5-artifact.zip)" = "$expected_size"
          python - <<'PY'
          import hashlib,json,pathlib,zipfile
          outer=pathlib.Path("/tmp/d5-artifact.zip")
          pre=json.loads(pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json").read_text())
          with zipfile.ZipFile(outer) as z:
              assert z.testzip() is None, "D5_OUTER_ZIP_CRC_FAILURE"
              names=[n for n in z.namelist() if not n.endswith("/")]
              expected={"Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05.zip","manifest.json","SHA256SUMS.txt"}
              assert set(names)==expected, f"D5_OUTER_MEMBER_SET_MISMATCH:{names}"
              inner_name=pre["package"]["path"].split("/")[-1]
              inner=z.read(inner_name)
              manifest=z.read("manifest.json")
              sums=z.read("SHA256SUMS.txt")
          pkg=pre["package"]
          assert len(inner)==int(pkg["bytes"]), ("D5_INNER_PACKAGE_SIZE_MISMATCH",len(inner),pkg["bytes"])
          assert hashlib.sha256(inner).hexdigest()==pkg["sha256"], "D5_INNER_PACKAGE_SHA256_MISMATCH"
          assert hashlib.sha256(manifest).hexdigest()==pre["manifest"]["sha256"], "D5_MANIFEST_SHA256_MISMATCH"
          assert hashlib.sha256(sums).hexdigest()==pre["sha256sums"]["sha256"], "D5_SHA256SUMS_SHA256_MISMATCH"
          inner_path=pathlib.Path("/tmp/d5-package.zip")
          inner_path.write_bytes(inner)
          with zipfile.ZipFile(inner_path) as z:
              assert z.testzip() is None, "D5_INNER_ZIP_CRC_FAILURE"
              members=[n for n in z.namelist() if not n.endswith("/")]
              assert len(members)==int(pkg["members"])==8, f"D5_PACKAGE_EIGHT_MEMBERS_MISMATCH:{len(members)}:{members}"
              print("D5_PACKAGE_EIGHT_MEMBERS_PASS",members)
          print(json.dumps({"outer_bytes":outer.stat().st_size,"outer_sha256":hashlib.sha256(outer.read_bytes()).hexdigest(),"inner_bytes":len(inner),"inner_sha256":pkg["sha256"],"inner_members":members},sort_keys=True))
          PY
          echo "D5_ARTIFACT_BYTES_DOWNLOADED artifact_id=${artifact_id}"
      - name: Execute normative acceptance tests 175, 176, 179, 180, 181, 182, 183 and 186 on exact HEAD
        env:
          D5_ARTIFACT_ZIP: /tmp/d5-artifact.zip
          D6_RUN_ID: ${{ github.run_id }}
          D6_JOB_ID: ${{ env.D6_JOB_ID }}
          TESTED_SHA: ${{ github.sha }}
          D6_OUT: /tmp/D6_AUDIT_RUN_${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$D6_OUT"
          python -m pytest -q -rs tests/test_176_numeric_token_lineage.py tests/test_d6_normative_acceptance_ids.py --junitxml=/tmp/d6-acceptance-tests.xml
          python - <<'PY'
          import json, os, pathlib, re, xml.etree.ElementTree as ET
          root=ET.parse("/tmp/d6-acceptance-tests.xml").getroot()
          expected={"175","176","179","180","181","182","183","186"}
          records={}
          for case in root.findall(".//testcase"):
              name=case.attrib.get("name","")
              match=re.search(r"test_(175|176|179|180|181|182|183|186)_",name)
              if not match: continue
              tid=match.group(1)
              failed=bool(case.findall("failure") or case.findall("error") or case.findall("skipped"))
              records[tid]={
                  "result":"FAIL" if failed else "PASS",
                  "pytest_nodeid":case.attrib.get("classname","")+"::"+name,
                  "duration_seconds":float(case.attrib.get("time","0")),
                  "run_id":int(os.environ["D6_RUN_ID"]),
                  "job_id":int(os.environ["D6_JOB_ID"]),
                  "tested_sha":os.environ["TESTED_SHA"],
              }
          if set(records)!=expected:
              raise SystemExit("D6_ACCEPTANCE_TEST_ID_SET_MISMATCH:"+repr(sorted(set(records)^expected)))
          failed=[k for k,v in records.items() if v["result"]!="PASS"]
          if failed: raise SystemExit("D6_ACCEPTANCE_TEST_FAILURES:"+repr(failed))
          pin=json.loads(pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json").read_text(encoding="utf-8"))
          out={"schema_version":"d6-acceptance-test-execution-v1","run_id":int(os.environ["D6_RUN_ID"]),"job_id":int(os.environ["D6_JOB_ID"]),"tested_sha":os.environ["TESTED_SHA"],"d5_artifact_id":int(pin["artifact"]["id"]),"d5_artifact_sha256":pin["artifact"]["downloaded_zip_sha256"],"tests":records}
          path=pathlib.Path(os.environ["D6_OUT"])/"ACCEPTANCE_TEST_EXECUTION.json"
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"acceptance_tests":"PASS","test_ids":sorted(records),"run_id":out["run_id"],"job_id":out["job_id"],"tested_sha":out["tested_sha"]}))
          PY
      - name: Independent post-write audit
        env:
          D6_OUT: /tmp/D6_AUDIT_RUN_${{ github.run_id }}
          AUDIT_RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          D6_JOB_ID: ${{ env.D6_JOB_ID }}
        run: |
          python scripts/audit_s6_deliverables_bundle.py --artifact /tmp/d5-package.zip --root . --run-id "$AUDIT_RUN_ID" --tested-sha "$TESTED_SHA" --branch "$BRANCH_NAME" --job-id "$D6_JOB_ID" --output-dir "$D6_OUT"
      - name: Enforce fail-closed D6 audit disposition
        env:
          D6_OUT: /tmp/D6_AUDIT_RUN_${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,pathlib,os
          from scripts.audit_s6_deliverables_bundle import validate_d6_audit_disposition
          report=json.loads((pathlib.Path(os.environ["D6_OUT"])/"FINAL_AUDIT.json").read_text(encoding="utf-8"))
          validate_d6_audit_disposition(report)
          print("D6_AUDIT_DISPOSITION_GATE_PASS",report["status"],report["d6_disposition"])
          PY
      - name: Assert read-only exact HEAD and unchanged main
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "$TESTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "01a6f79eedc522bb734ed9c5ea31beee581f2468"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "D6_READ_ONLY_EXACT_HEAD_PASS tested_sha=$TESTED_SHA"
      - name: Publish D6 audit evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motorcycle_Simulation_D6_Post_Write_Audit_2026-11-07
          path: |
            /tmp/D6_AUDIT_RUN_${{ github.run_id }}/FINAL_AUDIT.md
            /tmp/D6_AUDIT_RUN_${{ github.run_id }}/FINAL_AUDIT.json
            /tmp/D6_AUDIT_RUN_${{ github.run_id }}/ACCEPTANCE_TEST_EXECUTION.json
          if-no-files-found: error
          retention-days: 30
