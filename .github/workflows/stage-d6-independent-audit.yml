name: D6 Independent Post-Write Audit
on:
  workflow_dispatch:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - 'docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json'
      - 'scripts/audit_s6_deliverables_bundle.py'
      - 'tests/test_d6_audit.py'
      - '.github/workflows/stage-d6-independent-audit.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: motorcycle-simulation-branch-writer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent-post-write-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-core
          python -m pip install openpyxl python-docx pytest pypdf lxml numpy pyarrow scipy python-dateutil
      - name: Resolve D6 GitHub Job ID
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${AUDIT_RUN_ID}/jobs?per_page=100" -o /tmp/d6-jobs.json
          job_id="$(python -c 'import json; d=json.load(open("/tmp/d6-jobs.json")); print(next(x["id"] for x in d["jobs"] if x["name"]=="independent-post-write-audit"))')"
          echo "D6_JOB_ID=${job_id}" >> "$GITHUB_ENV"
          echo "D6_JOB_ID=${job_id}"
      - name: Run independent auditor unit tests
        run: python -m pytest -q -rs tests/test_d6_audit.py tests/test_d5_package.py tests/test_d4_numeric_occurrences.py
      - name: Download exact D5 Artifact and verify GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(python -c 'import json; d=json.load(open("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json")); print(d["artifact"]["id"])')"
          expected_size="$(python -c 'import json; d=json.load(open("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json")); print(d["artifact"]["size_in_bytes"])')"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api" -o /tmp/d5-meta.json; then break; fi
            sleep 5
          done
          python - <<'PY'
          import json,pathlib
          m=json.loads(pathlib.Path("/tmp/d5-meta.json").read_text())
          d=json.loads(pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json").read_text())
          a=d["artifact"]
          assert m["id"]==int(a["id"]) and m["expired"] is False
          assert m["size_in_bytes"]==int(a["size_in_bytes"])
          assert m["digest"]==a["digest"]==("sha256:"+a["downloaded_zip_sha256"])
          assert m.get("workflow_run",{}).get("id")==int(d["workflow_run_id"])
          print(json.dumps({k:m.get(k) for k in ("id","name","size_in_bytes","digest","expires_at","workflow_run")},indent=2))
          PY
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$api/zip" -o /tmp/d5-artifact.zip
          test "$(stat -c %s /tmp/d5-artifact.zip)" = "$expected_size"
          echo "D5_ARTIFACT_BYTES_DOWNLOADED artifact_id=${artifact_id}"
      - name: Execute normative acceptance tests 175, 176, 179, 180, 181, 182, 183 and 186 on exact HEAD
        env:
          D5_ARTIFACT_ZIP: /tmp/d5-artifact.zip
          D6_RUN_ID: ${{ github.run_id }}
          D6_JOB_ID: ${{ env.D6_JOB_ID }}
          TESTED_SHA: ${{ github.sha }}
          D6_OUT: docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$D6_OUT"
          python -m pytest -q -rs tests/test_176_numeric_token_lineage.py tests/test_d6_normative_acceptance_ids.py --junitxml=/tmp/d6-acceptance-tests.xml
          python - <<'PY'
          import json, os, pathlib, re, xml.etree.ElementTree as ET
          root=ET.parse("/tmp/d6-acceptance-tests.xml").getroot()
          expected={"175","176","179","180","181","182","183","186"}
          records={}
          for case in root.findall(".//testcase"):
              name=case.attrib.get("name","")
              match=re.search(r"test_(175|176|179|180|181|182|183|186)_",name)
              if not match: continue
              tid=match.group(1)
              failed=bool(case.findall("failure") or case.findall("error") or case.findall("skipped"))
              records[tid]={
                  "result":"FAIL" if failed else "PASS",
                  "pytest_nodeid":case.attrib.get("classname","")+"::"+name,
                  "duration_seconds":float(case.attrib.get("time","0")),
                  "run_id":int(os.environ["D6_RUN_ID"]),
                  "job_id":int(os.environ["D6_JOB_ID"]),
                  "tested_sha":os.environ["TESTED_SHA"],
              }
          if set(records)!=expected:
              raise SystemExit("D6_ACCEPTANCE_TEST_ID_SET_MISMATCH:"+repr(sorted(set(records)^expected)))
          failed=[k for k,v in records.items() if v["result"]!="PASS"]
          if failed: raise SystemExit("D6_ACCEPTANCE_TEST_FAILURES:"+repr(failed))
          pin=json.loads(pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json").read_text(encoding="utf-8"))
          out={"schema_version":"d6-acceptance-test-execution-v1","run_id":int(os.environ["D6_RUN_ID"]),"job_id":int(os.environ["D6_JOB_ID"]),"tested_sha":os.environ["TESTED_SHA"],"d5_artifact_id":int(pin["artifact"]["id"]),"d5_artifact_sha256":pin["artifact"]["downloaded_zip_sha256"],"tests":records}
          path=pathlib.Path(os.environ["D6_OUT"])/"ACCEPTANCE_TEST_EXECUTION.json"
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({"acceptance_tests":"PASS","test_ids":sorted(records),"run_id":out["run_id"],"job_id":out["job_id"],"tested_sha":out["tested_sha"]}))
          PY
      - name: Independent post-write audit
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          D6_JOB_ID: ${{ env.D6_JOB_ID }}
        run: |
          python scripts/audit_s6_deliverables_bundle.py --artifact /tmp/d5-artifact.zip --root . --run-id "$AUDIT_RUN_ID" --tested-sha "$TESTED_SHA" --branch "$BRANCH_NAME" --job-id "$D6_JOB_ID" --output-dir "docs/stage_d/D6_AUDIT_RUN_${AUDIT_RUN_ID}"
      - name: Enforce fail-closed D6 audit disposition
        env:
          D6_OUT: docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,pathlib,os
          from scripts.audit_s6_deliverables_bundle import validate_d6_audit_disposition
          report=json.loads((pathlib.Path(os.environ["D6_OUT"])/"FINAL_AUDIT.json").read_text(encoding="utf-8"))
          validate_d6_audit_disposition(report)
          print("D6_AUDIT_DISPOSITION_GATE_PASS",report["status"],report["d6_disposition"])
          PY
      - name: Append D6 session and continuity evidence
        env:
          AUDIT_RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
          D6_OUT: docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}
          SESSION_PATH: docs/stage_d/D6_SESSION_RECORD_2026-11-05_RUN_${{ github.run_id }}.md
        run: |
          python - <<'PY'
          import json,pathlib,os
          r=json.loads((pathlib.Path(os.environ["D6_OUT"])/"FINAL_AUDIT.json").read_text(encoding="utf-8"))
          lines=[
            f"# D6 Session Record — 2026-11-05 / Run {os.environ['AUDIT_RUN_ID']}","",
            f"- Disposition: {r['status']}",
            f"- D6 workflow run: {os.environ['AUDIT_RUN_ID']}",
            f"- Tested source SHA: {os.environ['TESTED_SHA']}",
            f"- D5 source Run: {r['source_d5_run_id']}; Artifact: {r['source_d5_artifact_id']}",
            "- Scope: independent read-only post-write audit of the published D5 package and embedded deliverables.",
            "- D6 does not change D3/D4/D5 artifacts, business rules, thresholds, identities, or historical evidence.",
            "- No Trial, Simulation, Monte Carlo, N expansion, backfill, zero-fill, main write, merge, Release or final acceptance.",
            "",
            "## Check dispositions",""
          ]
          for k,v in r["checks"].items(): lines.append(f"- {k}: {v['status']}")
          lines += ["","## Limitations",""]+[f"- {x}" for x in r["limitations"]]
          session_path=pathlib.Path(os.environ["SESSION_PATH"])
          session_path.write_text("\n".join(lines)+"\n",encoding="utf-8")
          entry="\n\n## D5 publication record correction — 2026-11-05 (append-only)\n\n"+"- D5 Run 41928234377 tested source SHA: baf696af1e951cbf4a79e8a9e009c60c6b053b2d. The workflow committed publication evidence as 4c6a84b10ac78b6067175d0eafa149f3f12dbc2a; the earlier `publication_commit_sha` field and prose entry naming baf696... identify the triggering/tested SHA, not the documentation commit.\n"+"- D5 matrix path is dated 2026-11-05, but its internal title says 2026-11-03; this is a stale title only and does not change package bytes or test results.\n"+"- D5 exact-final-head Raw readback was performed at 4c6a84b10ac78b6067175d0eafa149f3f12dbc2a.\n\n## D6 independent post-write audit — 2026-11-05 (append-only)\n\n"+f"- Run {os.environ['AUDIT_RUN_ID']}; tested source SHA {os.environ['TESTED_SHA']}; D5 Artifact {r['source_d5_artifact_id']} from Run {r['source_d5_run_id']}.\n"+f"- Disposition {r['status']}; classification T2_INTERIM / NOT_FINAL_BLOCKED.\n"+f"- See {os.environ['D6_OUT']}/FINAL_AUDIT.md and FINAL_AUDIT.json for check-level results and limitations.\n"+"- D6 is not P17 acceptance, FINAL_ACCEPTED, CONVERGED or release authorization.\n"
          for name in ("docs/PROJECT_CONTINUITY.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md"):
            p=pathlib.Path(name); p.write_text(p.read_text(encoding="utf-8")+entry,encoding="utf-8")
          PY
      - name: Commit D6 audit reports and append-only handoff
        env:
          D6_OUT: docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}
          SESSION_PATH: docs/stage_d/D6_SESSION_RECORD_2026-11-05_RUN_${{ github.run_id }}.md
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$D6_OUT/FINAL_AUDIT.md" "$D6_OUT/FINAL_AUDIT.json" "$D6_OUT/ACCEPTANCE_TEST_EXECUTION.json" "$SESSION_PATH" docs/PROJECT_CONTINUITY.md docs/PROJECT_HANDOFF.md docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md
          git commit -m "docs(d6): record independent post-write audit"
          git push origin HEAD:tmp/d1-rebuild-20261101
      - name: Remote Raw readback and exact final HEAD validation
        env:
          GH_TOKEN: ${{ github.token }}
          D6_OUT: docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}
          SESSION_PATH: docs/stage_d/D6_SESSION_RECORD_2026-11-05_RUN_${{ github.run_id }}.md
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "$head"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "01a6f79eedc522bb734ed9c5ea31beee581f2468"
          python - <<'PY'
          import hashlib,os,pathlib,urllib.request,urllib.parse,subprocess
          repo=os.environ["GITHUB_REPOSITORY"]; sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          session=pathlib.Path(os.environ["SESSION_PATH"])
          if not session.is_file(): raise SystemExit("D6_EXACT_SESSION_RECORD_MISSING:"+str(session))
          out=os.environ["D6_OUT"]
          paths=[f"{out}/FINAL_AUDIT.md",f"{out}/FINAL_AUDIT.json",f"{out}/ACCEPTANCE_TEST_EXECUTION.json",str(session),"docs/PROJECT_CONTINUITY.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md"]
          for path in paths:
            local=pathlib.Path(path).read_bytes()
            url=f"https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(path,safe='/')}"
            req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]})
            with urllib.request.urlopen(req,timeout=180) as response: remote=response.read()
            if local!=remote: raise SystemExit("D6_RAW_READBACK_MISMATCH:"+path)
            blob=hashlib.sha1(b"blob "+str(len(remote)).encode()+b"\0"+remote).hexdigest()
            print(f"VERIFIED_LIVE {path} bytes={len(remote)} sha256={hashlib.sha256(remote).hexdigest()} blob_sha1={blob} commit={sha} url={url}")
          print("D6_EXACT_FINAL_HEAD_PASS",sha)
          PY
      - name: Publish D6 audit evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motorcycle_Simulation_D6_Post_Write_Audit_2026-11-05
          path: |
            docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}/FINAL_AUDIT.md
            docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}/FINAL_AUDIT.json
            docs/stage_d/D6_AUDIT_RUN_${{ github.run_id }}/ACCEPTANCE_TEST_EXECUTION.json
            docs/stage_d/D6_SESSION_RECORD_2026-11-05_RUN_${{ github.run_id }}.md
          if-no-files-found: error
          retention-days: 30
