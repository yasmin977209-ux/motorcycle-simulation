name: CP Excel Daily Fix Verification
on:
  push:
    branches:
      - tmp/cp-excel-daily-fix-20261013
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/cp-excel-daily-fix-20261013
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Targeted Excel DAILY regression and 25-sheet fixture acceptance
        run: python -m pytest -q tests/test_excel_daily_sheet.py
      - name: Full test suite
        run: python -m pytest -q tests
      - name: Report fixture workbook SHA-256
        if: always()
        run: |
          if test -f /tmp/cp-excel-daily-fixture.xlsx; then
            sha256sum /tmp/cp-excel-daily-fixture.xlsx
            echo "Fixture workbook SHA-256 printed in logs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Fixture workbook was not produced; targeted test may have failed before save."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp-excel-daily-fixture
          path: /tmp/cp-excel-daily-fixture.xlsx
          if-no-files-found: warn
          retention-days: 3
