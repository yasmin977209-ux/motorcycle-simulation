name: Gate B Historical Inputs and N=600 Checkpoint

on:
  push:
    branches:
      - "tmp/gateb-historical-600-verify-20261011"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Validate pins, previous N=300 evidence, and audit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned-source dependencies
        run: python -m pip install -r requirements.txt
      - name: Test audit identity and hash gates
        run: python -m pytest -q tests/test_stage12_gateb_n600_audit.py
      - name: Verify live source runs, exact main pin, N=300 checkpoint, and diff whitespace
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f9e7d06e4140612b1bd2ee2a8afd069f65a02d53"
          git diff --check "f9e7d06e4140612b1bd2ee2a8afd069f65a02d53...$GITHUB_SHA"
          python scripts/stage12_gateb_n600_audit.py --preflight --output-file results_gateb/preflight.json
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n600-preflight
          path: results_gateb/preflight.json
          if-no-files-found: warn
          retention-days: 30

  audit-historical:
    name: Validate historical trial inputs — ${{ matrix.scenario }}
    needs: [preflight]
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        scenario:
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Stage 7, Stage 10, Stage 12 identities, exact trial hashes, and 550-row coverage
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          PYTHONPATH: .
        run: python scripts/stage12_gateb_n600_audit.py --verify-historical --scenario "$SCENARIO" --output-root gateb_historical_inputs
      - name: Upload read-only historical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-historical-input-${{ matrix.scenario }}
          path: gateb_historical_inputs/${{ matrix.scenario }}.json
          if-no-files-found: warn
          retention-days: 30

  aggregate-historical:
    name: Require all 11,000 historical trial rows to validate
    needs: [preflight, audit-historical]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Download per-scenario historical evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gateb-historical-input-*
          path: historical_scenario_reports
          merge-multiple: true
      - name: Aggregate historical evidence without rerunning trials
        id: historical-aggregate
        if: always()
        env:
          PYTHONPATH: .
        run: |
          python scripts/stage12_gateb_n600_audit.py \
            --aggregate-historical \
            --input-root historical_scenario_reports \
            --output-file results_gateb/historical_inputs.json
      - name: Upload historical aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-historical-inputs-aggregate
          path: results_gateb/historical_inputs.json
          if-no-files-found: warn
          retention-days: 30

  run-new-trials:
    name: Run missing IDs 551–600 only — ${{ matrix.scenario }}
    needs: [preflight, aggregate-historical]
    if: needs.preflight.result == 'success' && needs.aggregate-historical.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        scenario:
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify aggregated historical gate artifact
        uses: actions/download-artifact@v4
        with:
          name: gateb-historical-inputs-aggregate
          path: historical_proof
      - name: Install dependencies from exact producer source commit
        env:
          SOURCE_COMMIT: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
        run: |
          set -euo pipefail
          python -c 'import json; d=json.load(open("historical_proof/historical_inputs.json")); assert d["status"] == "PASS" and d["historical_trial_count"] == 11000'
          git fetch origin "$SOURCE_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/pinned-model-source" "$SOURCE_COMMIT"
          python -m pip install -r "$RUNNER_TEMP/pinned-model-source/requirements.txt"
      - name: Materialize only missing new IDs 551–600; restore exact prior-attempt artifacts first
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          PYTHONPATH: .
        run: |
          python scripts/stage12_gateb_n600_audit.py \
            --run-new-trials \
            --scenario "$SCENARIO" \
            --source-root "$RUNNER_TEMP/pinned-model-source" \
            --output-root gateb_n600_new
      - name: Upload only trials first materialized in this attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-n600-new-${{ matrix.scenario }}-attempt-${{ github.run_attempt }}
          path: gateb_n600_new/trial_outputs/
          if-no-files-found: warn
          retention-days: 30

  aggregate-n600:
    name: Calculate all 60 N=600 Student-t CI points
    needs: [preflight, aggregate-historical, run-new-trials]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Download aggregate historical evidence if present
        if: needs.aggregate-historical.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: gateb-historical-inputs-aggregate
          path: historical_aggregate
      - name: Download all per-scenario, per-attempt new-trial artifacts if present
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gateb-n600-new-*
          path: new_trial_artifacts
          merge-multiple: false
      - name: Aggregate 1..550 analytical rows plus new 551..600 results
        if: needs.preflight.result == 'success' && needs.aggregate-historical.result == 'success' && needs.run-new-trials.result == 'success'
        env:
          PYTHONPATH: .
        run: |
          python scripts/stage12_gateb_n600_audit.py \
            --aggregate-n600 \
            --historical-file historical_aggregate/historical_inputs.json \
            --new-root new_trial_artifacts \
            --output-file results_gateb/gate_b_n600_report.json
      - name: Preserve N=600 report even when preceding jobs fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateb-historical-and-new-n600-report
          path: results_gateb/gate_b_n600_report.json
          if-no-files-found: warn
          retention-days: 30
