name: S5 stochastic smoke and output integrity v2.3

on:
  push:
    branches:
      - "tmp/s4-c100-golden-v23-20261026"
    paths:
      - "constants.py"
      - "monte_carlo.py"
      - "stats_integrity.py"
      - "scripts/s5_stage5_validation.py"
      - "tests/test_s5_stage5_output_contract.py"
  workflow_dispatch:

concurrency:
  group: s5-stochastic-smoke-v23-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  s5-stochastic-smoke:
    name: 20-scenario serial/parallel, representative replay, exact statistics
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
      S5_MODEL_SOURCE_SHA: "9fd34c2c4cf7250653ea6d86e33e1f939e6fba99"
    steps:
      - name: Checkout exact S5 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Preflight source identity and protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "tmp/s4-c100-golden-v23-20261026"
          test "${GITHUB_REF_NAME}" != "main"
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "${S5_MODEL_SOURCE_SHA}" = "9fd34c2c4cf7250653ea6d86e33e1f939e6fba99"
          git cat-file -e "${S5_MODEL_SOURCE_SHA}^{commit}"
          MODEL_FILES=(
            constants.py dateutils.py rng.py entities.py state_machine.py
            daily_engine.py accounting.py collection.py guarantee.py friday.py
            settlement.py closure.py partner_equity.py monte_carlo.py stats_integrity.py
          )
          for path in "${MODEL_FILES[@]}"; do
            git cat-file -e "${S5_MODEL_SOURCE_SHA}:${path}"
          done
          if ! git diff --quiet "${S5_MODEL_SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"; then
            echo "S5_SOURCE_IDENTITY_DRIFT: model files differ from pinned SOURCE_SHA" >&2
            git diff --name-status "${S5_MODEL_SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"
            exit 1
          fi
          python -m compileall -q constants.py monte_carlo.py stats_integrity.py scripts/s5_stage5_validation.py tests/test_s5_stage5_output_contract.py
          mkdir -p s5_evidence
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "SOURCE_SHA=${S5_MODEL_SOURCE_SHA}"
            echo "TESTED_COMMIT_SHA=${GITHUB_SHA}"
            echo "BRANCH=${GITHUB_REF_NAME}"
            echo "COMMAND=python scripts/s5_stage5_validation.py"
          } | tee s5_evidence/run_identity.txt

      - name: Run full v2.3 pytest inventory on this S5 candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests --junitxml=s5_evidence/full-suite-junit.xml 2>&1 | tee s5_evidence/full-suite.log
      - name: Build the isolated stochastic smoke artifacts
        shell: bash
        run: |
          set -o pipefail
          python scripts/s5_stage5_validation.py 2>&1 | tee s5_evidence/s5_driver.log

      - name: Run focused S5 acceptance and exact-output tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_acceptance_16_v2.py \
            tests/test_s5_stage5_output_contract.py \
            -k "test_127 or test_159 or test_160 or test_161 or test_s5_daily_distribution_exact_active_and_carry_forward or test_s5_summary_parquet_preserves_full_uint64_rng_checksum" \
            --junitxml=s5_evidence/targeted-junit.xml 2>&1 | tee s5_evidence/targeted-tests.log

      - name: Hash S5 execution logs
        if: always()
        shell: bash
        run: |
          set +e
          find s5_evidence -type f ! -name "SHA256SUMS.txt" -print0 | sort -z | xargs -0 -r sha256sum > s5_evidence/SHA256SUMS.txt
          cat s5_evidence/SHA256SUMS.txt
          if test -f results_stage5/benchmark.json; then cat results_stage5/benchmark.json; fi
          if test -f results_stage5/SHA256SUMS.txt; then cat results_stage5/SHA256SUMS.txt; fi

      - name: Upload real S5 outputs and run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-stochastic-smoke-v23-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            results_stage5/
            s5_evidence/
