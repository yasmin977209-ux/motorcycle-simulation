name: S6 Original Actions Archive Recovery Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "prepare preserves/resumes the draft; publish revalidates it and then publishes"
        required: true
        type: choice
        options:
          - prepare
          - publish
        default: prepare
      confirm:
        description: "Type PREPARE_S6_ARCHIVE or PUBLISH_S6_ARCHIVE to match the selected action"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: s6-archive-recovery-release
  cancel-in-progress: false

jobs:
  recover-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: s6-source-archive-recovery-2026-11-08
      ARCHIVE_SOURCE_SHA: f2ffb9743c8b9aff9fd9d4cadcdb5484e6069866
      ACTION_MODE: ${{ inputs.action }}
      INPUT_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Fail explicitly on wrong branch, action, or confirmation
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::This workflow must be dispatched from main."; exit 1; }
          case "$ACTION_MODE" in
            prepare)
              [[ "$INPUT_CONFIRM" == "PREPARE_S6_ARCHIVE" ]] || { echo "::error::Prepare requires exact confirmation PREPARE_S6_ARCHIVE."; exit 1; }
              ;;
            publish)
              [[ "$INPUT_CONFIRM" == "PUBLISH_S6_ARCHIVE" ]] || { echo "::error::Publish requires exact confirmation PUBLISH_S6_ARCHIVE."; exit 1; }
              ;;
            *)
              echo "::error::Unsupported action mode."
              exit 1
              ;;
          esac

      - name: Validate release action and enumerate original artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/assets
          : > recovery/artifacts.tsv
          : > recovery/validated.tsv
          for run_id in 40574326793 40596643263 40731224990 40773412377; do
            gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id,.name,.size_in_bytes,.expired,.expires_at,(.digest // "")] | @tsv' \
              >> recovery/artifacts.tsv
          done
          count="$(wc -l < recovery/artifacts.tsv | tr -d ' ')"
          test "$count" = "63" || { echo "::error::Expected 63 original artifacts; found $count."; exit 1; }
          if awk -F '\t' '$4 != "false" {bad=1} END {exit bad?0:1}' recovery/artifacts.tsv; then
            echo "::error::At least one original artifact is expired."
            exit 1
          fi
          echo "Enumerated $count non-expired original artifacts."

      - name: Download and validate exact original artifact ZIP bytes
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r id name expected_size expired expires_at digest; do
            [[ "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Unsafe artifact name: $name"; exit 1; }
            dest="recovery/assets/${name}.zip"
            curl --fail --silent --show-error --location --retry 4 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" \
              --output "$dest"
            actual_size="$(stat -c '%s' "$dest")"
            test "$actual_size" = "$expected_size" || { echo "::error::Size mismatch for $name"; exit 1; }
            unzip -tqq "$dest" || { echo "::error::ZIP integrity failure for $name"; exit 1; }
            actual_sha="sha256:$(sha256sum "$dest" | awk '{print $1}')"
            if [[ -n "$digest" && "$digest" != "$actual_sha" ]]; then
              echo "::error::GitHub artifact digest mismatch for $name"
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$name" "$actual_size" "$expires_at" "$actual_sha" "$dest" >> recovery/validated.tsv
            echo "Validated $name ($actual_size bytes)"
          done < recovery/artifacts.tsv
          test "$(wc -l < recovery/validated.tsv | tr -d ' ')" = "63"

      - name: Build manifest, checksums, and expected release asset inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, hashlib, json, os
          rows=[]
          with open("recovery/validated.tsv", newline="") as f:
              for artifact_id,name,size,expires_at,digest,path in csv.reader(f, delimiter="\t"):
                  h=hashlib.sha256()
                  with open(path,"rb") as z:
                      for chunk in iter(lambda:z.read(1024*1024), b""):
                          h.update(chunk)
                  actual=h.hexdigest()
                  if digest != "sha256:"+actual:
                      raise SystemExit("SHA-256 changed after ZIP validation: "+name)
                  rows.append({"artifact_id":int(artifact_id),"artifact_name":name,
                               "size_bytes":int(size),"expires_at":expires_at,
                               "sha256":actual,"asset":os.path.basename(path)})
          if len(rows)!=63:
              raise SystemExit("Inventory count mismatch")
          manifest={"purpose":"S6 original GitHub Actions artifact ZIP preservation",
                    "source_workflow_runs":[40574326793,40596643263,40731224990,40773412377],
                    "archive_source_branch_head":"f2ffb9743c8b9aff9fd9d4cadcdb5484e6069866",
                    "count":len(rows),"total_bytes":sum(x["size_bytes"] for x in rows),
                    "validation":"all 63 ZIP archives downloaded, size-checked, ZIP-tested and SHA-256 hashed",
                    "artifacts":rows}
          with open("recovery/MANIFEST.json","w") as f:
              json.dump(manifest,f,indent=2); f.write("\n")
          with open("recovery/SHA256SUMS","w") as f:
              for x in rows: f.write(x["sha256"]+"  "+x["asset"]+"\n")
          PY
          cat > recovery/RELEASE_NOTES.md <<'EOF'
          Archival preservation copy of the 63 original S6 GitHub Actions artifact ZIPs from runs:
          - 40574326793 (N=300)
          - 40596643263 (N=1200)
          - 40731224990 (N=2400)
          - 40773412377 (reconciled aggregate)

          Every ZIP is downloaded from its exact GitHub Actions artifact ID, checked against its API-reported size, tested with unzip, and SHA-256 hashed. MANIFEST.json records IDs, names, sizes, expiry metadata and hashes; SHA256SUMS supports independent verification.

          This is an archival transport release only. It does not change or upgrade any project gate, trial result, statistical disposition, D0/D1 status, or acceptance state. It does not repair missing historical accounting fields.
          EOF
          : > recovery/expected_assets.tsv
          while IFS=$'\t' read -r id name size expires_at digest path; do
            printf '%s\t%s\t%s\n' "$(basename "$path")" "$size" "$digest" >> recovery/expected_assets.tsv
          done < recovery/validated.tsv
          for file in recovery/MANIFEST.json recovery/SHA256SUMS; do
            printf '%s\t%s\tsha256:%s\n' "$(basename "$file")" "$(stat -c '%s' "$file")" "$(sha256sum "$file" | awk '{print $1}')" >> recovery/expected_assets.tsv
          done
          test "$(wc -l < recovery/expected_assets.tsv | tr -d ' ')" = "65"

      - name: Ensure exact Git tag and locate or create the draft release by ID
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # Validate/reuse the Release record before creating any missing Git tag.
          matches="$(gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, (.draft|tostring), .target_commitish] | @tsv")"
          match_count="$(printf '%s\n' "$matches" | awk 'NF {n++} END {print n+0}')"
          if [[ "$match_count" -gt 1 ]]; then
            echo "::error::More than one Release record uses the target tag."
            exit 1
          elif [[ "$match_count" -eq 1 ]]; then
            IFS=$'\t' read -r release_id is_draft target_commit <<< "$matches"
            if [[ "$target_commit" != "$ARCHIVE_SOURCE_SHA" ]]; then
              echo "::error::Existing Release target does not match ARCHIVE_SOURCE_SHA."
              exit 1
            fi
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::A published Release already exists; refusing to mutate it."
              exit 1
            fi
          else
            if [[ "$ACTION_MODE" == "publish" ]]; then
              echo "::error::Publish mode requires an existing draft Release; run prepare first."
              exit 1
            fi
            release_id="$(gh api --method POST "repos/$REPO/releases" \
              -f "tag_name=$TAG" \
              -f "target_commitish=$ARCHIVE_SOURCE_SHA" \
              -F draft=true \
              -F prerelease=true \
              -f "name=S6 Original Source Archive Recovery (63 artifacts)" \
              -f "body=$(cat recovery/RELEASE_NOTES.md)" \
              --jq '.id')"
          fi
          test -n "$release_id"

          # A draft prerelease remains unpublished; repair the existing draft metadata too.
          gh api --method PATCH "repos/$REPO/releases/$release_id" -F draft=true -F prerelease=true >/dev/null
          release_json="$(gh api "repos/$REPO/releases/$release_id")"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          test "$(jq -r '.prerelease' <<< "$release_json")" = "true"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$TAG"
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$ARCHIVE_SOURCE_SHA"

          # A failed lookup creates a tag only for an actual 404; auth/server errors fail closed.
          tag_http="$(gh api --include "repos/$REPO/git/ref/tags/$TAG" 2>&1 || true)"
          if grep -qE '^HTTP/[0-9.]+ 200' <<< "$tag_http"; then
            tag_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
            tag_type="$(jq -r '.object.type' <<< "$tag_json")"
            tag_sha="$(jq -r '.object.sha' <<< "$tag_json")"
            [[ "$tag_type" == "commit" && "$tag_sha" == "$ARCHIVE_SOURCE_SHA" ]] || { echo "::error::Existing tag points to the wrong object."; exit 1; }
          elif grep -qE '^HTTP/[0-9.]+ 404' <<< "$tag_http"; then
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$ARCHIVE_SOURCE_SHA" >/dev/null
          else
            echo "::error::Tag lookup failed for a reason other than 404; refusing to create or mutate the tag."
            printf '%s\n' "$tag_http"
            exit 1
          fi
          tag_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          test "$(jq -r '.object.type' <<< "$tag_json")" = "commit"
          test "$(jq -r '.object.sha' <<< "$tag_json")" = "$ARCHIVE_SOURCE_SHA"

          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
          echo "Using verified draft prerelease Release ID $release_id; existing assets will be preserved."

      - name: Resume uploads by Release ID without replacing existing assets
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r asset expected_size expected_digest; do
            path="recovery/assets/$asset"
            [[ "$asset" == "MANIFEST.json" ]] && path="recovery/MANIFEST.json"
            [[ "$asset" == "SHA256SUMS" ]] && path="recovery/SHA256SUMS"
            existing="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$asset\") | [.size, (.digest // \"\")] | @tsv")"
            existing_count="$(printf '%s\n' "$existing" | awk 'NF {n++} END {print n+0}')"
            if [[ "$existing_count" -gt 1 ]]; then
              echo "::error::Duplicate release assets named $asset."
              exit 1
            elif [[ "$existing_count" -eq 1 ]]; then
              IFS=$'\t' read -r existing_size existing_digest <<< "$existing"
              if [[ "$existing_size" != "$expected_size" || "$existing_digest" != "$expected_digest" ]]; then
                echo "::error::Existing asset $asset differs from the freshly validated source; preserving it and stopping."
                exit 1
              fi
              echo "Preserved and matched existing asset $asset."
            else
              if [[ "$ACTION_MODE" == "publish" ]]; then
                echo "::error::Publish mode requires a complete pre-existing draft; missing asset $asset."
                exit 1
              fi
              gh api --method POST \
                "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$asset" \
                -H "Content-Type: application/octet-stream" \
                --input "$path" >/dev/null
              echo "Uploaded missing asset $asset."
            fi
          done < recovery/expected_assets.tsv

      - name: Reverify exact release asset set and tag before any publication
        id: verify
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" > recovery/release-assets.json
          python3 - <<'PY'
          import csv, json
          expected={}
          with open("recovery/expected_assets.tsv", newline="") as f:
              for name,size,digest in csv.reader(f, delimiter="\t"):
                  if name in expected:
                      raise SystemExit("Duplicate expected asset: "+name)
                  expected[name]=(int(size),digest)
          with open("recovery/release-assets.json") as f:
              actual=json.load(f)
          if len(actual)!=65:
              raise SystemExit(f"Expected exactly 65 release assets; found {len(actual)}")
          seen={}
          for item in actual:
              name=item["name"]
              if name in seen:
                  raise SystemExit("Duplicate uploaded asset: "+name)
              seen[name]=(int(item["size"]),item.get("digest"))
          if set(seen)!=set(expected):
              raise SystemExit("Release asset names do not exactly match the 65-item expected inventory")
          for name,(size,digest) in expected.items():
              actual_size,actual_digest=seen[name]
              if actual_size!=size or actual_digest!=digest:
                  raise SystemExit(f"Release asset verification failed: {name}")
          print("Verified exactly 65 release assets by name, size, and SHA-256 digest.")
          PY
          tag_json="$(gh api "repos/$REPO/git/ref/tags/$TAG")"
          test "$(jq -r '.object.type' <<< "$tag_json")" = "commit"
          test "$(jq -r '.object.sha' <<< "$tag_json")" = "$ARCHIVE_SOURCE_SHA"
          release_json="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$TAG"
          test "$(jq -r '.target_commitish' <<< "$release_json")" = "$ARCHIVE_SOURCE_SHA"
          test "$(jq -r '.draft' <<< "$release_json")" = "true"
          test "$(jq -r '.prerelease' <<< "$release_json")" = "true"
          test "$(jq -r '.assets | length' <<< "$release_json")" = "65"
          echo "Release ID $RELEASE_ID is a verified draft prerelease. No publication has occurred."

      - name: Publish only when explicitly requested after verification
        if: ${{ inputs.action == 'publish' }}
        shell: bash
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # Publication is permitted only after the exact asset/tag/draft checks above.
          gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=true >/dev/null
          final_json="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          test "$(jq -r '.draft' <<< "$final_json")" = "false"
          test "$(jq -r '.prerelease' <<< "$final_json")" = "true"
          test "$(jq -r '.tag_name' <<< "$final_json")" = "$TAG"
          test "$(jq -r '.assets | length' <<< "$final_json")" = "65"
          test "$(jq -r '.target_commitish' <<< "$final_json")" = "$ARCHIVE_SOURCE_SHA"
          echo "Published verified S6 archival Release ID $RELEASE_ID."
          jq '{id,tag_name,target_commitish,draft,html_url,assets_count:(.assets|length)}' <<< "$final_json"
