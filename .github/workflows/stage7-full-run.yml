name: stage7-full-run

on:
  push:
    branches:
      - "tmp/stage7-full-run-20261004"

concurrency:
  group: stage7-full-run-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  MASTER_SEED: "20270101"
  INITIAL_NON_C100_TRIALS: "300"
  INITIAL_C100_TRIALS: "1"
  ESCALATION_MULTIPLIER: "2"
  STABILITY_CONSECUTIVE_CHECKS: "3"
  CI_RELATIVE_EPSILON: "0.01"
  CI_ABSOLUTE_EPSILON: "1"
  # Trial execution has no internal wall-clock cutoff; each 50-trial chunk is durable.
  # GitHub-hosted runner limits remain the external ceiling.
  SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
  CP3_RUN_ID: "37203438351"
  CP3_SCENARIO: "C070_G100"
  CP3_AGGREGATE_SHA256: "c09d39cd3f79e9460d16df4fc2a6a47b6b029983e2f596de4af4009bc169a14a"

jobs:
  preflight-gates:
    name: preflight-gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Stage 7-specific preflight
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          SCENARIOS=(
            C100_G100 C100_G070 C100_G050 C100_G030 C100_G000
            C085_G100 C085_G070 C085_G050 C085_G030 C085_G000
            C070_G100 C070_G070 C070_G050 C070_G030 C070_G000
            C050_G100 C050_G070 C050_G050 C050_G030 C050_G000
            C030_G100 C030_G070 C030_G050 C030_G030 C030_G000
          )
          stale_runs="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=tmp%2Fstage7-full-run-20261004&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == null) | [.id,.status] | join(" ")'
          )"
          stale_ids=()
          while read -r run_id status; do
            [ -n "${run_id}" ] || continue
            if [ "${run_id}" != "${GITHUB_RUN_ID}" ]; then
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null
              echo "CANCELLED_STALE_RUN=${run_id} STATUS=${status}"
              stale_ids+=("${run_id}")
            fi
          done <<< "${stale_runs}"
          for run_id in "${stale_ids[@]}"; do
            stopped=false
            for attempt in $(seq 1 90); do
              status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq ".status")"
              if [ "${status}" = "completed" ]; then
                stopped=true
                break
              fi
              sleep 2
            done
            if [ "${stopped}" != "true" ]; then
              echo "STALE_RUN_CANCELLATION_TIMEOUT=${run_id}" >&2
              exit 1
            fi
            echo "STALE_RUN_STOPPED=${run_id}"
          done
          git cat-file -e "${SOURCE_SHA}^{commit}"
          for path in constants.py dateutils.py rng.py entities.py state_machine.py daily_engine.py accounting.py collection.py guarantee.py friday.py settlement.py closure.py partner_equity.py monte_carlo.py; do
            git cat-file -e "${SOURCE_SHA}:${path}"
          done
          for scenario in "${SCENARIOS[@]}"; do
            STATE_BRANCH="stage7-state/${scenario}"
            STATE_REF="repos/${GITHUB_REPOSITORY}/git/ref/heads/${STATE_BRANCH}"
            STATE_CONTENTS="repos/${GITHUB_REPOSITORY}/contents/state.json?ref=${STATE_BRANCH}"
            if state_branch_sha="$(gh api "${STATE_REF}" --jq '.object.sha' 2>/dev/null)"; then
              state_payload="$(gh api "${STATE_CONTENTS}" 2>/dev/null || true)"
              state_identity=""
              if [ -n "${state_payload}" ]; then
                state_identity="$(
                  printf '%s\n' "${state_payload}" |
                    jq -r '.content // empty' 2>/dev/null |
                    tr -d '\n' |
                    base64 -d 2>/dev/null |
                    jq -r '[.scenario // empty,.source_sha // empty] | @tsv' 2>/dev/null || true
                )"
              fi
              if [ -z "${state_identity}" ]; then
                if [ "${state_branch_sha}" != "${SOURCE_SHA}" ]; then
                  echo "STAGE7_STATE_WITHOUT_CHECKPOINT=${scenario}; branch head is not the pinned source; refusing reuse or reset" >&2
                  exit 1
                fi
                echo "STAGE7_STATE_BRANCH_HAS_NO_CHECKPOINT=${scenario}; source-only branch preserved"
              else
                read -r saved_scenario saved_source_sha <<< "${state_identity}"
                if [ "${saved_scenario}" != "${scenario}" ] || [ "${saved_source_sha}" != "${SOURCE_SHA}" ]; then
                  echo "STAGE7_STATE_IDENTITY_MISMATCH=${scenario}; refusing to reset or reuse checkpoint" >&2
                  exit 1
                fi
                echo "STAGE7_STATE_PRESERVED=${scenario} SOURCE_SHA=${saved_source_sha}"
              fi
            else
              echo "STAGE7_STATE_ABSENT=${scenario}"
            fi
          done

          python - <<'PY'
          import yaml
          import monte_carlo

          spec = yaml.safe_load(
              open(".github/workflows/stage7-full-run.yml", encoding="utf-8")
          )
          scenarios = spec["jobs"]["matrix-simulation"]["strategy"]["matrix"]["scenario"]
          assert len(scenarios) == 25
          assert len(set(scenarios)) == 25
          for scenario in scenarios:
              monte_carlo.parse_scenario_id(scenario)
          print("STAGE7_PREFLIGHT_OK")
          PY
  matrix-simulation:
    name: simulation-${{ matrix.scenario }}
    needs: preflight-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 25
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify pinned model source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"

          MODEL_FILES=(
            constants.py
            dateutils.py
            rng.py
            entities.py
            state_machine.py
            daily_engine.py
            accounting.py
            collection.py
            guarantee.py
            friday.py
            settlement.py
            closure.py
            partner_equity.py
            monte_carlo.py
          )

          for path in "${MODEL_FILES[@]}"; do
            if ! git cat-file -e "${SOURCE_SHA}:${path}"; then
              echo "PINNED_SOURCE_FILE_MISSING=${path}" >&2
              exit 1
            fi
          done

          if ! git diff --quiet "${SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"; then
            echo "MODEL_SOURCE_DRIFT_DETECTED" >&2
            git diff --name-status "${SOURCE_SHA}" HEAD -- "${MODEL_FILES[@]}"
            exit 1
          fi

          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "MODEL_SOURCE_BOUNDARY_OK"

      - name: Restore previous scenario block artifacts when available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          MASTER_SEED: ${{ env.MASTER_SEED }}
        run: |
          set -euo pipefail
          mkdir -p "results_stage7/${SCENARIO}/blocks"

          # Use the same complete, truncation-aware Git-tree inventory as the
          # actual durable restore path. Do not turn API failures into an empty
          # directory result: that could incorrectly enter legacy-artifact migration.
          DURABLE_BLOCKS_COUNT="$(
            python - <<'PY'
            import os
            from pathlib import Path

            from scripts.stage7_state import StateStore

            store = StateStore(
                repo=os.environ["GITHUB_REPOSITORY"],
                token=os.environ["GH_TOKEN"],
                scenario=os.environ["SCENARIO"],
                source_sha=os.environ["SOURCE_SHA"],
                run_id=os.environ["GITHUB_RUN_ID"],
                run_attempt=os.environ["GITHUB_RUN_ATTEMPT"],
                local_path=Path("state.json"),
            )
            print(len(store._block_listing()))
            PY
          )"
          if [ "${DURABLE_BLOCKS_COUNT}" -gt 0 ]; then
            echo "STAGE7_DURABLE_BLOCKS_PRESENT=SCENARIO:${SCENARIO}; restoration delegated to StateStore"
            exit 0
          fi

          PREVIOUS_RUN_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/contents/state.json?ref=stage7-state/${SCENARIO}" 2>/dev/null |
              jq -r '.content // empty' | tr -d '\n' | base64 -d 2>/dev/null |
              jq -r '.run_id // empty' 2>/dev/null || true
          )"
          if [ -z "${PREVIOUS_RUN_ID}" ]; then
            echo "No legacy state run ID; there is no artifact migration source."
            exit 0
          fi

          ARTIFACT_ID="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${PREVIOUS_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[]? | select(.name | startswith("stage7-blocks-'"'${SCENARIO}'"'-")) | [.id,.created_at] | @tsv' \
              | sort -k2 | tail -1 | cut -f1
          )"
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "No legacy block artifact found for saved run ${PREVIOUS_RUN_ID}."
            exit 0
          fi

          echo "STAGE7_LEGACY_ARTIFACT_RESTORE=RUN_ID:${PREVIOUS_RUN_ID} ARTIFACT_ID:${ARTIFACT_ID} SCENARIO:${SCENARIO}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/previous_stage7_blocks.zip
          mkdir -p /tmp/previous_stage7_blocks
          unzip -q /tmp/previous_stage7_blocks.zip -d /tmp/previous_stage7_blocks
          find /tmp/previous_stage7_blocks -type f -name 'block_*.parquet' -exec cp {} "results_stage7/${SCENARIO}/blocks/" \;
          find /tmp/previous_stage7_blocks -type f -name 'block_*_metadata.json' -exec cp {} "results_stage7/${SCENARIO}/blocks/" \;

          BLOCK_RUN_IDS="$(find "results_stage7/${SCENARIO}/blocks" -type f -name 'block_*_metadata.json' -print0 | xargs -0 -r jq -r '.run_id // empty' | sort -u)"
          if [ -z "${BLOCK_RUN_IDS}" ]; then
            echo "LEGACY_BLOCK_IDENTITY_UNPROVEN: no originating run_id in block metadata" >&2
            exit 1
          fi
          : > /tmp/stage7-legacy-verified-runs.tsv
          while IFS= read -r block_run_id; do
            [ -n "${block_run_id}" ] || continue
            run_payload="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${block_run_id}")"
            run_head_sha="$(printf '%s\n' "${run_payload}" | jq -r '.head_sha // empty')"
            if [[ ! "${run_head_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "LEGACY_BLOCK_IDENTITY_UNPROVEN: invalid head SHA for run ${block_run_id}" >&2
              exit 1
            fi
            workflow_payload="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/stage7-full-run.yml?ref=${run_head_sha}")"
            workflow_blob_sha="$(printf '%s\n' "${workflow_payload}" | jq -r '.sha // empty')"
            workflow_content="$(printf '%s\n' "${workflow_payload}" | jq -r '.content // empty' | tr -d '\n' | base64 -d)"
            workflow_master_seed="$(printf '%s\n' "${workflow_content}" | sed -nE 's/^[[:space:]]*MASTER_SEED:[[:space:]]*"([0-9]+)"[[:space:]]*$/\1/p' | head -1)"
            workflow_source_sha="$(printf '%s\n' "${workflow_content}" | sed -nE 's/^[[:space:]]*SOURCE_SHA:[[:space:]]*"([0-9a-f]{40})"[[:space:]]*$/\1/p' | head -1)"
            if [[ ! "${workflow_blob_sha}" =~ ^[0-9a-f]{40}$ ]] || [ "${workflow_master_seed}" != "${MASTER_SEED}" ] || [ "${workflow_source_sha}" != "${SOURCE_SHA}" ]; then
              echo "LEGACY_BLOCK_IDENTITY_UNPROVEN: run ${block_run_id} workflow source/seed does not match current identity" >&2
              exit 1
            fi
            printf '%s\t%s\t%s\t%s\t%s\n' "${block_run_id}" "${run_head_sha}" "${workflow_blob_sha}" "${workflow_master_seed}" "${workflow_source_sha}" >> /tmp/stage7-legacy-verified-runs.tsv
          done <<< "${BLOCK_RUN_IDS}"

          LEGACY_RUNS_TSV=/tmp/stage7-legacy-verified-runs.tsv python - <<'PY'
          import json
          import os
          from pathlib import Path

          verified_runs = {}
          for line in Path(os.environ["LEGACY_RUNS_TSV"]).read_text(encoding="utf-8").splitlines():
              run_id, head_sha, workflow_blob_sha, seed, source_sha = line.split("\t")
              verified_runs[run_id] = {
                  "run_id": run_id,
                  "head_sha": head_sha,
                  "workflow_blob_sha": workflow_blob_sha,
                  "master_seed": int(seed),
                  "source_sha": source_sha,
                  "workflow_master_seed": int(seed),
                  "workflow_source_sha": source_sha,
              }
          proof = {
              "schema_version": "stage7-legacy-run-identity-v1",
              "scenario": os.environ["SCENARIO"],
              "source_sha": os.environ["SOURCE_SHA"],
              "master_seed": int(os.environ["MASTER_SEED"]),
              "verified_runs": verified_runs,
          }
          target = Path("results_stage7") / os.environ["SCENARIO"] / "blocks" / "legacy_run_identity.json"
          target.write_text(json.dumps(proof, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(f"LEGACY_RUN_IDENTITIES_VERIFIED={len(verified_runs)}")
          PY
      - name: Prepare CP3 overlap reference
        if: matrix.scenario == 'C070_G100'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CP3_RUN_ID: ${{ env.CP3_RUN_ID }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage7_cp3_reference/unpacked
          if ! ARTIFACT_ID="$(
            gh api --paginate \\
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CP3_RUN_ID}/artifacts?per_page=100" \\
              --jq '.artifacts[] | select(.name == "stage6-5-cp3-results") | .id' \\
              | tail -1
          )"; then
            echo "::warning::CP3 reference artifact lookup unavailable; cross-reference will be marked unavailable."
            exit 0
          fi
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::warning::CP3 reference artifact is unavailable (possibly expired); cross-reference will be marked unavailable."
            exit 0
          fi

          if ! gh api \\
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \\
            > /tmp/stage7_cp3_reference.zip; then
            echo "::warning::CP3 reference artifact download failed; cross-reference will be marked unavailable."
            exit 0
          fi

          if ! unzip -q \\
            /tmp/stage7_cp3_reference.zip \\
            -d /tmp/stage7_cp3_reference/unpacked; then
            echo "::warning::CP3 reference artifact extraction failed; cross-reference will be marked unavailable."
            exit 0
          fi

          if ! cp \\
            /tmp/stage7_cp3_reference/unpacked/trials_summary_6000.parquet \\
            /tmp/stage7_cp3_reference/trials_summary_6000.parquet; then
            echo "::warning::CP3 reference parquet is unavailable; cross-reference will be marked unavailable."
            exit 0
          fi

          if [ ! -s /tmp/stage7_cp3_reference/trials_summary_6000.parquet ]; then
            echo "::warning::CP3 reference parquet is empty; cross-reference will be marked unavailable."
            exit 0
          fi

      - name: Adaptive scenario orchestration
        env:
          PYTHONPATH: .
          GH_TOKEN: ${{ github.token }}
          SCENARIO: ${{ matrix.scenario }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MASTER_SEED: ${{ env.MASTER_SEED }}
          INITIAL_NON_C100_TRIALS: ${{ env.INITIAL_NON_C100_TRIALS }}
          INITIAL_C100_TRIALS: ${{ env.INITIAL_C100_TRIALS }}
          ESCALATION_MULTIPLIER: ${{ env.ESCALATION_MULTIPLIER }}
          STABILITY_CONSECUTIVE_CHECKS: ${{ env.STABILITY_CONSECUTIVE_CHECKS }}
          CI_RELATIVE_EPSILON: ${{ env.CI_RELATIVE_EPSILON }}
          CI_ABSOLUTE_EPSILON: ${{ env.CI_ABSOLUTE_EPSILON }}
          CP3_SCENARIO: ${{ env.CP3_SCENARIO }}
          CP3_AGGREGATE_SHA256: ${{ env.CP3_AGGREGATE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/stage7_orchestrator.py <<'PY'
          from __future__ import annotations
          import atexit
          import hashlib
          import json
          import math
          import os
          import subprocess
          import sys
          from pathlib import Path
          import numpy as np
          import pyarrow.parquet as pq
          from scipy.stats import t
          import constants
          import monte_carlo
          import rng
          import daily_engine
          from dataclasses import asdict
          from scripts.stage7_state import (
              STAGE7_RNG_POLICY_ID,
              StateStore,
              build_artifact_identity,
              validate_trial_sequence,
          )
          from scripts.stage7_stability import (
              STATISTICAL_ESCALATION_POLICY_ID,
              evaluate_gate_a, evaluate_gate_b, filter_statistical_history,
              is_statistical_checkpoint, next_statistical_checkpoint,
          )
          MAX_TRIALS_PER_BLOCK = 50

          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          SCENARIO = os.environ["SCENARIO"]
          collection_probability, recovery_rate_pct = monte_carlo.parse_scenario_id(SCENARIO)
          SOURCE_SHA = os.environ["SOURCE_SHA"]
          RUN_ID = os.environ["RUN_ID"]
          STATE_BRANCH = f"stage7-state/{SCENARIO}"
          MASTER_SEED = int(os.environ["MASTER_SEED"])
          INITIAL_NON_C100 = int(os.environ["INITIAL_NON_C100_TRIALS"])
          INITIAL_C100 = int(os.environ["INITIAL_C100_TRIALS"])
          ESCALATION_MULTIPLIER = int(os.environ["ESCALATION_MULTIPLIER"])
          REQUIRED_CONSECUTIVE = int(os.environ["STABILITY_CONSECUTIVE_CHECKS"])
          RELATIVE_EPSILON = float(os.environ["CI_RELATIVE_EPSILON"])
          ABSOLUTE_EPSILON = float(os.environ["CI_ABSOLUTE_EPSILON"])
          CP3_SCENARIO = os.environ["CP3_SCENARIO"]
          CP3_AGGREGATE_SHA256 = os.environ["CP3_AGGREGATE_SHA256"]
          RESULTS_DIR = Path("results_stage7") / SCENARIO
          BLOCKS_DIR = RESULTS_DIR / "blocks"
          BLOCKS_DIR.mkdir(parents=True, exist_ok=True)

          def _trial_result_sha256(result):
              raw = json.dumps(
                  asdict(result), ensure_ascii=False, sort_keys=True,
                  separators=(",", ":"), default=str,
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def all_results():
              rows = []
              parquet_paths = sorted(BLOCKS_DIR.glob("block_*.parquet"))
              parquet_keys = {path.stem for path in parquet_paths}
              metadata_paths = sorted(BLOCKS_DIR.glob("block_*_metadata.json"))
              metadata_keys = {path.name[:-len("_metadata.json")] for path in metadata_paths}
              if parquet_keys != metadata_keys:
                  raise RuntimeError("Stage 7 Parquet/metadata files are incomplete or unmatched")
              for path in parquet_paths:
                  metadata_path = path.with_name(f"{path.stem}_metadata.json")
                  metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
                  block_rows = pq.read_table(path).to_pylist()
                  block_results = sorted(
                      [monte_carlo.TrialResult(**row) for row in block_rows],
                      key=lambda item: item.trial_id,
                  )
                  if metadata.get("scenario") != SCENARIO:
                      raise RuntimeError(f"block scenario mismatch: {path.name}")
                  if metadata.get("source_sha") != SOURCE_SHA:
                      raise RuntimeError(f"block SOURCE_SHA mismatch: {path.name}")
                  try:
                      start_id = int(metadata["trial_id_start"])
                      end_id = int(metadata["trial_id_end"])
                      count = int(metadata["trial_count"])
                  except (KeyError, TypeError, ValueError) as exc:
                      raise RuntimeError(f"block metadata range invalid: {path.name}") from exc
                  if path.stem != f"block_{start_id}_{end_id}" or count != len(block_results) or count != end_id - start_id + 1:
                      raise RuntimeError(f"block filename/range/count mismatch: {path.name}")
                  if [item.trial_id for item in block_results] != list(range(start_id, end_id + 1)):
                      raise RuntimeError(f"block Trial IDs are missing or out of order: {path.name}")
                  if metadata.get("master_seed") is not None and int(metadata["master_seed"]) != MASTER_SEED:
                      raise RuntimeError(f"block master_seed mismatch: {path.name}")
                  if metadata.get("rng_policy_id") is not None and metadata["rng_policy_id"] != STAGE7_RNG_POLICY_ID:
                      raise RuntimeError(f"block RNG policy mismatch: {path.name}")
                  if metadata.get("sampling_policy_id") is not None and metadata["sampling_policy_id"] != STATISTICAL_ESCALATION_POLICY_ID:
                      raise RuntimeError(f"block sampling policy mismatch: {path.name}")
                  if metadata.get("schema_version") is not None and metadata["schema_version"] != "stage7-block-v1":
                      raise RuntimeError(f"unsupported block schema version: {path.name}")
                  parquet_sha = hashlib.sha256(path.read_bytes()).hexdigest()
                  if metadata.get("parquet_sha256") not in (None, parquet_sha):
                      raise RuntimeError(f"block Parquet SHA-256 mismatch: {path.name}")
                  actual_block_fingerprint = monte_carlo.fingerprint_trial_results(block_results)
                  if metadata.get("fingerprint_sha256") != actual_block_fingerprint:
                      raise RuntimeError(f"block fingerprint mismatch: {path.name}")
                  expected_per_trial = metadata.get("per_trial_sha256")
                  if expected_per_trial is not None:
                      actual_per_trial = [_trial_result_sha256(item) for item in block_results]
                      if expected_per_trial != actual_per_trial:
                          raise RuntimeError(f"per-trial SHA-256 mismatch: {path.name}")
                  rows.extend(asdict(item) for item in block_results)
              return sorted(
                  [monte_carlo.TrialResult(**row) for row in rows],
                  key=lambda x: x.trial_id,
              )

          def statistics(results):
              values = {
                  "final_net_project_equity": np.array([r.final_net_project_equity for r in results], dtype=float),
                  "partner1_final_entitlement": np.array([r.partner1_final_entitlement for r in results], dtype=float),
                  "partner2_final_entitlement": np.array([r.partner2_final_entitlement for r in results], dtype=float),
              }
              n = len(results)
              if n < 2:
                  raise ValueError("At least two observations are required for a t-based CI.")
              out = {}
              t_critical = float(t.ppf(0.975, n - 1))
              for key, sample in values.items():
                  mean = float(sample.mean())
                  sd = float(sample.std(ddof=1))
                  half_ci = t_critical * sd / math.sqrt(n)
                  limit = max(ABSOLUTE_EPSILON, RELATIVE_EPSILON * abs(mean))
                  out[key] = {
                      "n": n,
                      "mean": mean,
                      "sample_std": sd,
                      "t_critical": t_critical,
                      "half_ci_95": half_ci,
                      "limit": limit,
                      "stable": half_ci < limit,
                  }
              return out

          def write_json(path, value):
              path.write_text(
                  json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )

          def write_terminal_artifacts(results, state):
              write_json(
                  RESULTS_DIR / "statistics.json",
                  {
                      "scenario": SCENARIO,
                      "trial_count": len(results),
                      "final_fingerprint": state["final_fingerprint"],
                      "artifact_identity": state["artifact_identity"],
                      "stability_history": list(state.get("stability_history", [])),
                  },
              )
              cp3_match = None
              cp3_overlap = None
              cp3_reference_trial_count = None
              cp3_overlap_fingerprint = None
              stage7_overlap_fingerprint = None
              if SCENARIO == CP3_SCENARIO:
                  cp3_reference_path = Path(
                      "/tmp/stage7_cp3_reference/trials_summary_6000.parquet"
                  )
                  if not cp3_reference_path.exists():
                      print(
                          "WARNING: CP3 reference parquet unavailable; "
                          "cross-reference marked unavailable."
                      )
                      cp3_match = "unavailable"
                  else:
                      cp3_rows = pq.read_table(cp3_reference_path).to_pylist()
                      cp3_results = [
                          monte_carlo.TrialResult(**row) for row in cp3_rows
                      ]
                      cp3_reference_trial_count = len(cp3_results)
                      cp3_overlap = min(len(results), len(cp3_results))
                      stage7_prefix = [
                          result for result in results
                          if 1 <= result.trial_id <= cp3_overlap
                      ]
                      cp3_prefix = [
                          result for result in cp3_results
                          if 1 <= result.trial_id <= cp3_overlap
                      ]
                      if (
                          len(stage7_prefix) != cp3_overlap
                          or len(cp3_prefix) != cp3_overlap
                      ):
                          raise RuntimeError("CP3 overlap trial sequence mismatch")
                      stage7_overlap_fingerprint = monte_carlo.fingerprint_trial_results(
                          stage7_prefix
                      )
                      cp3_overlap_fingerprint = monte_carlo.fingerprint_trial_results(
                          cp3_prefix
                      )
                      cp3_match = (
                          stage7_overlap_fingerprint == cp3_overlap_fingerprint
                      )
              write_json(
                  RESULTS_DIR / "final_fingerprint.json",
                  {
                      "scenario": SCENARIO,
                      "source_sha": SOURCE_SHA,
                      "run_id": RUN_ID,
                      "trial_count": len(results),
                      "final_fingerprint": state["final_fingerprint"],
                      "included_in_final_stats": bool(
                          state.get("included_in_final_stats")
                      ),
                      "cp3_reference": {
                          "required": SCENARIO == CP3_SCENARIO,
                          "run_id": os.environ["CP3_RUN_ID"] if SCENARIO == CP3_SCENARIO else None,
                          "reference_sha256": CP3_AGGREGATE_SHA256 if SCENARIO == CP3_SCENARIO else None,
                          "reference_trial_count": cp3_reference_trial_count,
                          "overlap_trial_count": cp3_overlap,
                          "stage7_overlap_fingerprint": stage7_overlap_fingerprint,
                          "reference_overlap_fingerprint": cp3_overlap_fingerprint,
                          "matched": cp3_match,
                      },
                      "artifact_identity": state["artifact_identity"],
                  },
              )

          store = StateStore(
              repo=REPO,
              token=TOKEN,
              scenario=SCENARIO,
              source_sha=SOURCE_SHA,
              run_id=RUN_ID,
              run_attempt=os.environ["RUN_ATTEMPT"],
              local_path=Path("state.json"),
          )
          state, blob_sha = store.acquire()
          atexit.register(store.release)
          restored_durable_block_count = store.restore_trial_blocks(
              output_dir=Path("results_stage7"),
              master_seed=MASTER_SEED,
              sampling_policy_id=STATISTICAL_ESCALATION_POLICY_ID,
              expected_completed_trials=int(state.get("completed_trials", 0)),
          )
          print(json.dumps({
              "event": "durable_block_restore",
              "scenario": SCENARIO,
              "blocks_restored": restored_durable_block_count,
              "expected_completed_trials": int(state.get("completed_trials", 0)),
          }, sort_keys=True), flush=True)

          def local_block_pairs():
              parquet_paths = sorted(BLOCKS_DIR.glob("block_*.parquet"))
              parquet_keys = {path.stem for path in parquet_paths}
              metadata_paths = sorted(BLOCKS_DIR.glob("block_*_metadata.json"))
              metadata_keys = {path.name[:-len("_metadata.json")] for path in metadata_paths}
              if parquet_keys != metadata_keys:
                  raise RuntimeError("local Stage 7 block Parquet/metadata set differs")
              return [
                  (path, BLOCKS_DIR / f"{path.stem}_metadata.json")
                  for path in parquet_paths
              ]

          completed = int(state.get("completed_trials", 0))
          next_trial_id = int(
              state.get("next_trial_id", completed + 1)
          )
          history = list(state.get("stability_history", []))
          results = all_results()

          validate_trial_sequence(
              trial_ids=[result.trial_id for result in results],
              completed_trials=completed,
              next_trial_id=next_trial_id,
          )

          if results:
              expected_fingerprint = (
                  monte_carlo.fingerprint_trial_results(results)
              )
              expected_identity = build_artifact_identity(
                  scenario=SCENARIO,
                  source_sha=SOURCE_SHA,
                  trial_id_start=1,
                  trial_id_end=completed,
                  fingerprint_sha256=expected_fingerprint,
              )
              if state.get("final_fingerprint") != expected_fingerprint:
                  raise RuntimeError(
                      "State/artifact fingerprint mismatch: "
                      f"{state.get('final_fingerprint')} != "
                      f"{expected_fingerprint}"
                  )
              if state.get("artifact_identity") != expected_identity:
                  raise RuntimeError("State/artifact identity mismatch")
              if restored_durable_block_count == 0:
                  legacy_pairs = local_block_pairs()
                  if not legacy_pairs:
                      raise RuntimeError(
                          "Completed Stage 7 state has no restorable block files; refusing to rerun completed Trial IDs."
                      )
                  proof_path = BLOCKS_DIR / "legacy_run_identity.json"
                  if not proof_path.is_file():
                      raise RuntimeError(
                          "LEGACY_BLOCK_IDENTITY_UNPROVEN: missing verified prior-workflow seed/source proof"
                      )
                  legacy_identity_proof = json.loads(
                      proof_path.read_text(encoding="utf-8")
                  )
                  print(json.dumps({
                      "event": "legacy_block_migration",
                      "scenario": SCENARIO,
                      "completed_trials": completed,
                      "block_count": len(legacy_pairs),
                      "checkpoint_fingerprint_verified": True,
                      "legacy_run_identity_proof": True,
                  }, sort_keys=True), flush=True)
                  blob_sha = store.persist_trial_blocks_and_state(
                      block_pairs=legacy_pairs,
                      state=state,
                      blob_sha=blob_sha,
                      master_seed=MASTER_SEED,
                      sampling_policy_id=STATISTICAL_ESCALATION_POLICY_ID,
                      allow_legacy_metadata=True,
                      legacy_identity_proof=legacy_identity_proof,
                  )
                  restored_durable_block_count = store.restore_trial_blocks(
                      output_dir=Path("results_stage7"),
                      master_seed=MASTER_SEED,
                      sampling_policy_id=STATISTICAL_ESCALATION_POLICY_ID,
                      expected_completed_trials=completed,
                  )
          elif state.get("artifact_identity") is not None:
              raise RuntimeError(
                  "State contains artifact identity but no restored results"
              )

          stored_policy_id = state.get("statistical_policy_id")
          if SCENARIO.startswith("C100_"):
              target_n = INITIAL_C100
              state["statistical_policy_id"] = STATISTICAL_ESCALATION_POLICY_ID
          else:
              if stored_policy_id != STATISTICAL_ESCALATION_POLICY_ID and (completed or history):
                  if completed > 550:
                      raise RuntimeError(
                          "Legacy linear-schedule state exceeds authorized historical analytical range 1..550; "
                          "cannot migrate safely under the doubling policy."
                      )
                  history, discarded_points = filter_statistical_history(history)
                  reconstructed_n300 = False
                  if completed >= INITIAL_NON_C100 and not any(
                      int(item.get("n", -1)) == INITIAL_NON_C100 for item in history
                  ):
                      baseline_results = results[:INITIAL_NON_C100]
                      baseline_metrics = statistics(baseline_results)
                      history.insert(0, {
                          "n": INITIAL_NON_C100,
                          "gate_a": evaluate_gate_a(
                              previous_n=None,
                              previous_metrics=None,
                              current_n=INITIAL_NON_C100,
                              current_metrics=baseline_metrics,
                              escalation_multiplier=ESCALATION_MULTIPLIER,
                              relative_epsilon=RELATIVE_EPSILON,
                              absolute_epsilon=ABSOLUTE_EPSILON,
                          ),
                          "gate_b": evaluate_gate_b(baseline_metrics),
                          "metrics": baseline_metrics,
                          "reconstructed_from_identity_verified_rows": True,
                      })
                      reconstructed_n300 = True
                  state["policy_migration"] = {
                      "from_policy_id": stored_policy_id or "LEGACY_UNVERSIONED",
                      "to_policy_id": STATISTICAL_ESCALATION_POLICY_ID,
                      "preserved_checkpoint_n": [int(item["n"]) for item in history],
                      "discarded_noncompliant_checkpoint_n": discarded_points,
                      "n300_reconstructed_from_existing_verified_rows": reconstructed_n300,
                      "completed_trials_reused": completed,
                      "historical_trials_rerun": False,
                      "source_sha": SOURCE_SHA,
                      "master_seed": MASTER_SEED,
                  }
                  if completed:
                      state["final_status"] = None
                      state["stable_at_n"] = None
                      state["included_in_final_stats"] = False
                      state["reason_if_not_stable"] = (
                          "Legacy linear checkpoints excluded; next execution resumes on the approved doubling schedule."
                      )
              else:
                  history, discarded_points = filter_statistical_history(history)
                  if discarded_points:
                      raise RuntimeError(
                          "Current-policy Stage 7 state contains non-doubling checkpoints."
                      )
                  if stored_policy_id == STATISTICAL_ESCALATION_POLICY_ID and completed:
                      expected_next = next_statistical_checkpoint(completed)
                      if int(state.get("next_check_n", expected_next)) != expected_next:
                          raise RuntimeError(
                              "Current-policy state next_check_n differs from the approved doubling schedule."
                          )

              state["statistical_policy_id"] = STATISTICAL_ESCALATION_POLICY_ID
              state["policy"] = {
                  "statistical_policy_id": STATISTICAL_ESCALATION_POLICY_ID,
                  "initial_non_c100_trials": INITIAL_NON_C100,
                  "initial_c100_trials": INITIAL_C100,
                  "escalation_multiplier": ESCALATION_MULTIPLIER,
                  "stability_consecutive_checks": REQUIRED_CONSECUTIVE,
                  "ci_relative_epsilon": RELATIVE_EPSILON,
                  "ci_absolute_epsilon": ABSOLUTE_EPSILON,
              }
              state["stability_history"] = history
              target_n = next_statistical_checkpoint(completed)
              state["next_check_n"] = target_n

          if not SCENARIO.startswith("C100_") and completed >= INITIAL_NON_C100:
              latest_gate_a = (
                  history[-1].get("gate_a", {})
                  if history
                  else {}
              )
              latest_status = latest_gate_a.get("status")
              if latest_status != "PASS":
                  blocked_or_failed = "failed" if latest_status == "FAIL" else "blocked"
                  state["final_status"] = blocked_or_failed
                  state["stable_at_n"] = None
                  state["included_in_final_stats"] = False
                  state["reason_if_not_stable"] = (
                      f"Gate A {latest_status or 'UNVERIFIED'}: latest completed checkpoint "
                      "lacks an explicit exact-golden PASS; refusing to run additional trials"
                  )
                  state["next_check_n"] = next_statistical_checkpoint(completed)
                  if results:
                      state["final_fingerprint"] = monte_carlo.fingerprint_trial_results(results)
                      state["artifact_identity"] = build_artifact_identity(
                          scenario=SCENARIO,
                          source_sha=SOURCE_SHA,
                          trial_id_start=1,
                          trial_id_end=completed,
                          fingerprint_sha256=state["final_fingerprint"],
                      )
                  blob_sha = store.save_state(state, blob_sha)
                  write_json(
                      RESULTS_DIR / "statistics.json",
                      {
                          "scenario": SCENARIO,
                          "trial_count": len(results),
                          "final_fingerprint": state.get("final_fingerprint"),
                          "artifact_identity": state.get("artifact_identity"),
                          "stability_history": history,
                      },
                  )
                  write_json(
                      RESULTS_DIR / "final_fingerprint.json",
                      {
                          "scenario": SCENARIO,
                          "source_sha": SOURCE_SHA,
                          "run_id": RUN_ID,
                          "trial_count": len(results),
                          "final_fingerprint": state.get("final_fingerprint"),
                          "included_in_final_stats": False,
                          "gate_a_status": latest_status or "UNVERIFIED",
                          "reason_if_not_stable": state["reason_if_not_stable"],
                          "artifact_identity": state.get("artifact_identity"),
                      },
                  )
                  print(
                      "GATE_A_PREFLIGHT_BLOCKED="
                      + str(latest_status or "UNVERIFIED")
                      + "; refusing additional trials"
                  )
                  raise SystemExit(0)

          if state.get("final_status") == "stable":
              recent_gate_a_points = history[-REQUIRED_CONSECUTIVE:]
              previous_stable_state_is_valid = (
                  len(recent_gate_a_points) == REQUIRED_CONSECUTIVE
                  and all(
                      item.get("gate_a", {}).get("status") == "PASS"
                      and item.get("gate_a", {}).get("checked") is True
                      and item.get("gate_a", {}).get("stable") is True
                      and item.get("gate_b", {}).get("stable") is True
                      for item in recent_gate_a_points
                  )
              )
              if not previous_stable_state_is_valid:
                  state["final_status"] = None
                  state["stable_at_n"] = None
                  state["included_in_final_stats"] = False
                  state["reason_if_not_stable"] = (
                      "Prior stable status excluded: latest consecutive checkpoints "
                      "do not carry three explicit exact-golden Gate A PASS results."
                  )
                  blob_sha = store.save_state(state, blob_sha)
              else:
                  if len(results) != completed or not state.get("final_fingerprint"):
                      raise RuntimeError(
                          "Prior stable checkpoint does not match the restored result prefix."
                      )
                  write_terminal_artifacts(results, state)
                  print(json.dumps({
                      "scenario": SCENARIO,
                      "status": "already_stable",
                      "stable_at_n": state.get("stable_at_n"),
                      "final_fingerprint": state.get("final_fingerprint"),
                  }, sort_keys=True))
                  raise SystemExit(0)

          while True:
              # No internal wall-clock cutoff. Each block is durably committed with
              # state before another block starts; the platform's six-hour ceiling remains.
              trial_start = completed + 1
              trial_end = min(target_n, completed + MAX_TRIALS_PER_BLOCK)
              pending_trial_block = None

              if trial_end >= trial_start:
                  subprocess.run([
                      sys.executable,
                      "-m", "scripts.stage7_run_trial_block",
                      "--scenario", SCENARIO,
                      "--trial-id-start", str(trial_start),
                      "--trial-id-end", str(trial_end),
                      "--source-sha", SOURCE_SHA,
                      "--run-id", RUN_ID,
                      "--output-dir", "results_stage7",
                      "--master-seed", str(MASTER_SEED),
                  ], check=True)
                  completed = trial_end
                  pending_trial_block = (
                      BLOCKS_DIR / f"block_{trial_start}_{trial_end}.parquet",
                      BLOCKS_DIR / f"block_{trial_start}_{trial_end}_metadata.json",
                  )
                  if not all(path.is_file() for path in pending_trial_block):
                      raise RuntimeError("completed Trial block did not write both Parquet and metadata")

              state["completed_trials"] = completed
              state["next_trial_id"] = completed + 1
              results = all_results()
              validate_trial_sequence(
                  trial_ids=[result.trial_id for result in results],
                  completed_trials=completed,
                  next_trial_id=int(state["next_trial_id"]),
              )

              if not SCENARIO.startswith("C100_") and completed < target_n:
                  state["completed_trials"] = completed
                  state["next_trial_id"] = completed + 1
                  state["next_check_n"] = target_n
                  state["statistical_policy_id"] = STATISTICAL_ESCALATION_POLICY_ID
                  state["stability_history"] = history
                  state["final_status"] = None
                  state["stable_at_n"] = None
                  state["included_in_final_stats"] = False
                  state["reason_if_not_stable"] = (
                      f"durable progress saved at N={completed}; "
                      f"awaiting statistical checkpoint N={target_n}"
                  )
                  state["final_fingerprint"] = monte_carlo.fingerprint_trial_results(results)
                  state["artifact_identity"] = build_artifact_identity(
                      scenario=SCENARIO,
                      source_sha=SOURCE_SHA,
                      trial_id_start=1,
                      trial_id_end=completed,
                      fingerprint_sha256=state["final_fingerprint"],
                  )
                  blob_sha = store.persist_trial_blocks_and_state(
                      block_pairs=[pending_trial_block] if pending_trial_block is not None else [],
                      state=state,
                      blob_sha=blob_sha,
                      master_seed=MASTER_SEED,
                      sampling_policy_id=STATISTICAL_ESCALATION_POLICY_ID,
                  )
                  write_json(
                      RESULTS_DIR / "statistics.json",
                      {
                          "scenario": SCENARIO,
                          "trial_count": len(results),
                          "final_fingerprint": state["final_fingerprint"],
                          "artifact_identity": state["artifact_identity"],
                          "stability_history": history,
                          "pending_statistical_checkpoint": target_n,
                      },
                  )
                  print(json.dumps({
                      "event": "durable_progress_checkpoint",
                      "scenario": SCENARIO,
                      "trial_id_start": trial_start,
                      "trial_id_end": completed,
                      "completed_trials": completed,
                      "next_trial_id": completed + 1,
                      "next_statistical_checkpoint": target_n,
                      "fingerprint_sha256": state["final_fingerprint"],
                  }, sort_keys=True), flush=True)
                  continue

              if SCENARIO.startswith("C100_"):
                  if len(results) != 1:
                      raise RuntimeError(
                          f"C100 primary sample must remain n=1, got {len(results)}"
                      )

                  primary = results[0]
                  verification_project = daily_engine.run_deterministic_trial(
                      recovery_rate_pct=recovery_rate_pct,
                      trial_id=2,
                      scenario_id=SCENARIO,
                      master_seed=MASTER_SEED,
                      collection_probability=collection_probability,
                      log_events=False,
                  )
                  verification = monte_carlo._trial_result_from_project(
                      verification_project,
                      scenario_id=SCENARIO,
                      collection_probability=collection_probability,
                      recovery_rate_pct=recovery_rate_pct,
                      trial_id=2,
                  )

                  seed_primary = rng.seed_hex(
                      MASTER_SEED,
                      SCENARIO,
                      1,
                      "BK0001",
                      constants.INITIAL_FLEET_DELIVERY_DATE,
                      "PRIMARY_COLLECTION",
                  )
                  seed_verification = rng.seed_hex(
                      MASTER_SEED,
                      SCENARIO,
                      2,
                      "BK0001",
                      constants.INITIAL_FLEET_DELIVERY_DATE,
                      "PRIMARY_COLLECTION",
                  )
                  primary_dict = asdict(primary)
                  verification_dict = asdict(verification)

                  primary_trial_id = primary_dict.pop("trial_id")
                  verification_trial_id = verification_dict.pop("trial_id")

                  if primary_trial_id == verification_trial_id:
                      raise AssertionError(
                          "C100 independence requires distinct trial_id"
                      )

                  equality = primary_dict == verification_dict

                  c100_proof = {
                      "scenario": SCENARIO,
                      "primary_trial_id": 1,
                      "verification_trial_id": 2,
                      "primary_seed_hex": seed_primary,
                      "verification_seed_hex": seed_verification,
                      "different_trial_id": True,
                      "different_derived_seed": seed_primary != seed_verification,
                      "exact_result_equality": equality,
                      "stable": equality,
                  }
                  write_json(
                      RESULTS_DIR / "c100_independent_verification.json",
                      c100_proof,
                  )

                  state["c100_independent_verification"] = c100_proof
                  if equality:
                      state["stable_at_n"] = 1
                      state["final_status"] = "stable"
                      state["reason_if_not_stable"] = None
                  else:
                      state["stable_at_n"] = None
                      state["final_status"] = None
                      state["reason_if_not_stable"] = (
                          "independent C100 trial result mismatch"
                      )
              else:
                  current_stats = statistics(results)
                  previous = history[-1] if history else None

                  gate_a = evaluate_gate_a(
                      previous_n=previous.get("n") if previous else None,
                      previous_metrics=previous.get("metrics") if previous else None,
                      current_n=len(results),
                      current_metrics=current_stats,
                      escalation_multiplier=ESCALATION_MULTIPLIER,
                      relative_epsilon=RELATIVE_EPSILON,
                      absolute_epsilon=ABSOLUTE_EPSILON,
                  )
                  gate_b = evaluate_gate_b(current_stats)

                  check_entry = {
                      "n": len(results),
                      "gate_a": gate_a,
                      "gate_b": gate_b,
                      "metrics": current_stats,
                  }
                  history.append(check_entry)
                  state["stability_history"] = history

                  recent = history[-REQUIRED_CONSECUTIVE:]
                  gate_a_status = gate_a.get("status", "BLOCKED")
                  gate_a_stop = gate_a_status in ("BLOCKED", "FAIL")
                  stable_now = (
                      not gate_a_stop
                      and gate_a_status == "PASS"
                      and len(recent) == REQUIRED_CONSECUTIVE
                      and all(
                          item.get("gate_a", {}).get("status") == "PASS"
                          and item.get("gate_a", {}).get("checked") is True
                          and item.get("gate_a", {}).get("stable") is True
                          and item.get("gate_b", {}).get("stable") is True
                          for item in recent
                      )
                  )

                  if stable_now:
                      state["stable_at_n"] = len(results)
                      state["final_status"] = "stable"
                      state["reason_if_not_stable"] = None
                  elif gate_a_stop:
                      state["stable_at_n"] = None
                      state["final_status"] = (
                          "blocked" if gate_a_status == "BLOCKED" else "failed"
                      )
                      state["reason_if_not_stable"] = (
                          f"Gate A {gate_a_status}: {gate_a.get('reason')}; "
                          "execution stopped before the next checkpoint"
                      )
                  else:
                      state["stable_at_n"] = None
                      state["final_status"] = None
                      state["reason_if_not_stable"] = (
                          "dual stability gates not yet satisfied"
                      )

                  target_n = next_statistical_checkpoint(completed)
                  state["next_check_n"] = target_n
                  state["statistical_policy_id"] = STATISTICAL_ESCALATION_POLICY_ID

              state["stability_history"] = history
              state["included_in_final_stats"] = state["final_status"] == "stable"
              state["final_fingerprint"] = monte_carlo.fingerprint_trial_results(results)
              state["artifact_identity"] = build_artifact_identity(
                  scenario=SCENARIO,
                  source_sha=SOURCE_SHA,
                  trial_id_start=1,
                  trial_id_end=completed,
                  fingerprint_sha256=state["final_fingerprint"],
              )
              blob_sha = store.persist_trial_blocks_and_state(
                  block_pairs=[pending_trial_block] if pending_trial_block is not None else [],
                  state=state,
                  blob_sha=blob_sha,
                  master_seed=MASTER_SEED,
                  sampling_policy_id=STATISTICAL_ESCALATION_POLICY_ID,
              )
              pending_trial_block = None

              write_json(
                  RESULTS_DIR / "statistics.json",
                  {
                      "scenario": SCENARIO,
                      "trial_count": len(results),
                      "final_fingerprint": state["final_fingerprint"],
                      "artifact_identity": state["artifact_identity"],
                      "stability_history": history,
                  },
              )

              if state["final_status"] in ("blocked", "failed"):
                  write_json(
                      RESULTS_DIR / "final_fingerprint.json",
                      {
                          "scenario": SCENARIO,
                          "source_sha": SOURCE_SHA,
                          "run_id": RUN_ID,
                          "trial_count": len(results),
                          "final_fingerprint": state["final_fingerprint"],
                          "included_in_final_stats": False,
                          "gate_a_status": state["stability_history"][-1]["gate_a"].get("status"),
                          "reason_if_not_stable": state["reason_if_not_stable"],
                          "artifact_identity": state["artifact_identity"],
                      },
                  )
                  print(
                      "GATE_A_EXACT_GOLDEN_BLOCKED_OR_FAILED="
                      + str(state["stability_history"][-1]["gate_a"].get("status"))
                      + "; stopping before next trial block"
                  )
                  break

              if state["final_status"] == "stable":
                  write_terminal_artifacts(results, state)
                  break
          PY
          python /tmp/stage7_orchestrator.py

      - name: Upload scenario block artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-blocks-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: results_stage7/${{ matrix.scenario }}/blocks
          if-no-files-found: warn
          retention-days: 90

      - name: Upload final scenario artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-final-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: |
            results_stage7/${{ matrix.scenario }}/final_fingerprint.json
            results_stage7/${{ matrix.scenario }}/statistics.json
            state.json
          if-no-files-found: warn
          retention-days: 90

  final-report:
    name: final-report
    needs: matrix-simulation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read

    # if: always() does not run on job timeout.
    # On timeout, only state.json (persisted before timeout) remains.
    # final_fingerprint will be rebuilt on next run's resume.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download all final scenario artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stage7-final-*
          path: /tmp/stage7-final-artifacts
          merge-multiple: false
      - name: Produce unified Stage 7 summary
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_stage7
          python - <<'PY'
          from __future__ import annotations
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          scenarios = [
              "C100_G100",
              "C100_G070",
              "C100_G050",
              "C100_G030",
              "C100_G000",
              "C085_G100",
              "C085_G070",
              "C085_G050",
              "C085_G030",
              "C085_G000",
              "C070_G100",
              "C070_G070",
              "C070_G050",
              "C070_G030",
              "C070_G000",
              "C050_G100",
              "C050_G070",
              "C050_G050",
              "C050_G030",
              "C050_G000",
              "C030_G100",
              "C030_G070",
              "C030_G050",
              "C030_G030",
              "C030_G000",
          ]

          def get_json(path):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          per_scenario = []
          for scenario in scenarios:
              state = None
              state_error = None
              branch = f"stage7-state/{scenario}"
              try:
                  payload = get_json(
                      "contents/state.json?" + urllib.parse.urlencode({"ref": branch})
                  )
                  state = json.loads(
                      base64.b64decode(payload["content"]).decode("utf-8")
                  )
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      state_error = "STATE_NOT_FOUND_404"
                  else:
                      state_error = f"STATE_REMOTE_HTTP_ERROR_{exc.code}"
                  state = None
              except urllib.error.URLError:
                  state_error = "STATE_REMOTE_TRANSPORT_ERROR"
                  state = None
              except (KeyError, ValueError, UnicodeError):
                  state_error = "STATE_PARSE_ERROR"
                  state = None

              artifact_root = (
                  Path("/tmp/stage7-final-artifacts")
                  / f"stage7-final-{scenario}-{os.environ['RUN_ATTEMPT']}"
              )
              artifact_state_files = list(artifact_root.glob("state.json"))
              if state is None and len(artifact_state_files) == 1:
                  state = json.loads(
                      artifact_state_files[0].read_text(encoding="utf-8")
                  )

              if state is None:
                  per_scenario.append({
                      "scenario": scenario,
                      "state_path": f"stage7-state/{scenario}/state.json",
                      "final_trial_count": None,
                      "final_fingerprint": None,
                      "stable_at_n": None,
                      "final_status": "error",
                      "reason_if_not_stable": state_error or "STATE_UNAVAILABLE",
                      "final_stats_included": False,
                  })
              else:
                  fingerprint_paths = list(
                      artifact_root.glob(f"**/{scenario}/final_fingerprint.json")
                  )
                  statistics_paths = list(
                      artifact_root.glob(f"**/{scenario}/statistics.json")
                  )
                  artifact_error = None
                  if len(fingerprint_paths) != 1 or len(statistics_paths) != 1:
                      artifact_error = (
                          "SCENARIO_ARTIFACT_MISSING_OR_DUPLICATE:"
                          f"fingerprints={len(fingerprint_paths)},statistics={len(statistics_paths)}"
                      )
                  else:
                      try:
                          fingerprint_payload = json.loads(
                              fingerprint_paths[0].read_text(encoding="utf-8")
                          )
                          statistics_payload = json.loads(
                              statistics_paths[0].read_text(encoding="utf-8")
                          )
                      except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                          artifact_error = f"SCENARIO_ARTIFACT_PARSE_ERROR:{type(exc).__name__}"
                      else:
                          expected_count = int(state.get("completed_trials", -1))
                          expected_fingerprint = state.get("final_fingerprint")
                          expected_identity = state.get("artifact_identity")
                          expected_included = bool(state.get("included_in_final_stats"))
                          if (
                              state.get("scenario") != scenario
                              or fingerprint_payload.get("scenario") != scenario
                              or fingerprint_payload.get("source_sha") != state.get("source_sha")
                              or fingerprint_payload.get("trial_count") != expected_count
                              or fingerprint_payload.get("final_fingerprint") != expected_fingerprint
                              or fingerprint_payload.get("artifact_identity") != expected_identity
                              or bool(fingerprint_payload.get("included_in_final_stats")) != expected_included
                              or statistics_payload.get("scenario") != scenario
                              or statistics_payload.get("trial_count") != expected_count
                              or statistics_payload.get("final_fingerprint") != expected_fingerprint
                              or statistics_payload.get("artifact_identity") != expected_identity
                          ):
                              artifact_error = "SCENARIO_ARTIFACT_STATE_IDENTITY_OR_FINGERPRINT_MISMATCH"

                  if artifact_error is not None:
                      per_scenario.append({
                          "scenario": scenario,
                          "state_path": f"stage7-state/{scenario}/state.json",
                          "final_trial_count": None,
                          "final_fingerprint": None,
                          "stable_at_n": state.get("stable_at_n"),
                          "final_status": "error",
                          "reason_if_not_stable": artifact_error,
                          "final_stats_included": False,
                      })
                  else:
                      is_timeout = state.get("final_status") == "timeout"
                      per_scenario.append({
                          "scenario": scenario,
                          "state_path": f"stage7-state/{scenario}/state.json",
                          "final_trial_count": None if is_timeout else state.get("completed_trials"),
                          "final_fingerprint": None if is_timeout else state.get("final_fingerprint"),
                          "stable_at_n": state.get("stable_at_n"),
                          "final_status": state.get("final_status"),
                          "reason_if_not_stable": state.get("reason_if_not_stable"),
                          "final_stats_included": bool(state.get("included_in_final_stats")),
                      })

          stable_count = sum(row["final_status"] == "stable" for row in per_scenario)
          timeout_count = sum(row["final_status"] == "timeout" for row in per_scenario)
          error_count = sum(row["final_status"] == "error" for row in per_scenario)
          max_iterations_count = 0

          cp3_match = None
          c070 = next((row for row in per_scenario if row["scenario"] == "C070_G100"), None)

          if c070 is not None:
              c070_artifact_root = (
                  Path("/tmp/stage7-final-artifacts")
                  / f"stage7-final-C070_G100-{os.environ['RUN_ATTEMPT']}"
              )
              artifact_fingerprints = list(
                  c070_artifact_root.glob("**/C070_G100/final_fingerprint.json")
              )
              if len(artifact_fingerprints) == 1:
                  payload = json.loads(
                      artifact_fingerprints[0].read_text(encoding="utf-8")
                  )
                  cp3_match = payload.get("cp3_reference", {}).get("matched")
              else:
                  cp3_match = "unavailable"

          summary = {
              "total_scenarios": 25,
              "stable_count": stable_count,
              "timeout_count": timeout_count,
              "error_count": error_count,
              "max_iterations_count": max_iterations_count,
              "per_scenario": per_scenario,
              "cross_reference": {
                  "C070_G100": cp3_match
              },
          }

          Path("results_stage7/summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          expected_scenarios = 25
          all_scenarios_accepted = (
              len(per_scenario) == expected_scenarios
              and all(
                  row.get("final_status") == "stable"
                  and row.get("final_stats_included") is True
                  and row.get("final_trial_count") is not None
                  and row.get("final_fingerprint")
                  for row in per_scenario
              )
              and stable_count == expected_scenarios
              and timeout_count == 0
              and error_count == 0
          )
          if not all_scenarios_accepted:
              print(
                  "STAGE7_FAIL_CLOSED: incomplete or non-accepted scenarios; "
                  "summary is diagnostic only",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
      - name: Upload unified Stage 7 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage7-summary-${{ github.run_attempt }}
          path: results_stage7/summary.json
          if-no-files-found: error
          retention-days: 90