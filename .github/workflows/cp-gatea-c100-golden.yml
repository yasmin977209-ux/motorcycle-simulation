name: CP Gate A C100 golden extension (owner-authorized; no stability checkpoint)

on:
  push:
    branches:
      - tmp/cp-gatea-c100-golden-20261017
    paths:
      - .github/workflows/cp-gatea-c100-golden.yml
      - scripts/generate_c100_golden_extension.py
      - tests/test_c100_golden_extension.py

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
  SOURCE_COMMIT: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
  MASTER_SEED: "20270101"

jobs:
  generate-c100-approved-golden:
    name: Generate only approved C100 trial IDs 2..600 from pinned model source
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact CP branch and verify current head
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-gatea-c100-golden-20261017
          fetch-depth: 0
      - name: Verify one-time execution guard
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python - <<'PY'
          import json, os, subprocess, sys
          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"repos/{repo}/actions/workflows/cp-gatea-c100-golden.yml/runs?branch=tmp/cp-gatea-c100-golden-20261017&per_page=100"
          run = subprocess.run(
              ["gh", "api", url],
              check=True, capture_output=True, text=True,
              env={**os.environ, "GH_TOKEN": os.environ["GH_TOKEN"]},
          )
          payload = json.loads(run.stdout)
          current = int(os.environ["RUN_ID"])
          previous = [
              (item.get("id"), item.get("head_sha"), item.get("status"), item.get("conclusion"))
              for item in payload.get("workflow_runs", [])
              if int(item.get("id", -1)) != current
          ]
          if previous:
              print("PRIOR_GOLDEN_GENERATION_ATTEMPT_REQUIRES_RECONCILIATION=" + json.dumps(previous))
              sys.exit(1)
          print("ONE_TIME_GOLDEN_GENERATION_GUARD=PASS")
          PY
      - name: Checkout immutable approved model source
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          MODEL_FILES=(
            constants.py dateutils.py rng.py entities.py state_machine.py
            daily_engine.py accounting.py collection.py guarantee.py friday.py
            settlement.py closure.py partner_equity.py monte_carlo.py
          )
          git diff --exit-code "${SOURCE_SHA}" "${SOURCE_COMMIT}" -- "${MODEL_FILES[@]}"
          git worktree add --detach "$RUNNER_TEMP/pinned-model-source" "${SOURCE_COMMIT}"
          test "$(git -C "$RUNNER_TEMP/pinned-model-source" rev-parse HEAD)" = "${SOURCE_COMMIT}"
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}"
          echo "MODEL_SOURCE_CLOSURE_EQUAL=14/14"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies from pinned source tree
        run: python -m pip install -r "$RUNNER_TEMP/pinned-model-source/requirements.txt"
      - name: Run focused deterministic contract tests before generation
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile scripts/generate_c100_golden_extension.py
          python -m pytest -q tests/test_c100_golden_extension.py
      - name: Generate authorized C100 fingerprints from pinned source only
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          MASTER_SEED: ${{ env.MASTER_SEED }}
          PYTHONPATH: ${{ runner.temp }}/pinned-model-source
        run: |
          set -euo pipefail
          python scripts/generate_c100_golden_extension.py \
            --source-root "$RUNNER_TEMP/pinned-model-source" \
            --output results_gatea/c100_golden_extension.json \
            --progress results_gatea/c100_golden_extension.progress.jsonl
      - name: Upload inspectable output, including partial evidence on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatea-c100-golden-extension
          path: results_gatea/
          if-no-files-found: warn
          retention-days: 90
