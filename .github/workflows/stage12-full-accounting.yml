name: stage12-full-accounting-materialization
on:
  push:
    branches:
      - "tmp/stage12-materialize-20261008"
    paths:
      - ".github/workflows/stage12-full-accounting.yml"
      - "docs/stage11/global_manifest_11005.json"
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
  MASTER_SEED: "20270101"
jobs:
  materialize:
    name: mat-${{ matrix.scenario }}-${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - scenario: C100_G100
            start: 1
            end: 1
          - scenario: C100_G070
            start: 1
            end: 1
          - scenario: C100_G050
            start: 1
            end: 1
          - scenario: C100_G030
            start: 1
            end: 1
          - scenario: C100_G000
            start: 1
            end: 1
          - scenario: C085_G100
            start: 1
            end: 400
          - scenario: C085_G100
            start: 401
            end: 550
          - scenario: C085_G070
            start: 1
            end: 400
          - scenario: C085_G070
            start: 401
            end: 550
          - scenario: C085_G050
            start: 1
            end: 400
          - scenario: C085_G050
            start: 401
            end: 550
          - scenario: C085_G030
            start: 1
            end: 400
          - scenario: C085_G030
            start: 401
            end: 550
          - scenario: C085_G000
            start: 1
            end: 400
          - scenario: C085_G000
            start: 401
            end: 550
          - scenario: C070_G100
            start: 1
            end: 400
          - scenario: C070_G100
            start: 401
            end: 550
          - scenario: C070_G070
            start: 1
            end: 400
          - scenario: C070_G070
            start: 401
            end: 550
          - scenario: C070_G050
            start: 1
            end: 400
          - scenario: C070_G050
            start: 401
            end: 550
          - scenario: C070_G030
            start: 1
            end: 400
          - scenario: C070_G030
            start: 401
            end: 550
          - scenario: C070_G000
            start: 1
            end: 400
          - scenario: C070_G000
            start: 401
            end: 550
          - scenario: C050_G100
            start: 1
            end: 400
          - scenario: C050_G100
            start: 401
            end: 550
          - scenario: C050_G070
            start: 1
            end: 400
          - scenario: C050_G070
            start: 401
            end: 550
          - scenario: C050_G050
            start: 1
            end: 400
          - scenario: C050_G050
