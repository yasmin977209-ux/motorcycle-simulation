name: Stage D5 Delivery Package and Artifact Publication
on:
  workflow_dispatch:
  push:
    branches:
      - tmp/d1-rebuild-20261101
    paths:
      - docs/stage_d/D4_EFFECTIVE_CLOSURE_STATE_2026-11-07.json
permissions:
  contents: write
  actions: read
concurrency:
  group: stage-d5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package validation dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install openpyxl python-docx pytest
      - name: Assert exact starting HEAD and download exact approved governing reference
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "$EXPECTED_SHA"
          curl --fail --location --silent --show-error "https://gist.githubusercontent.com/yasmin977209-ux/c3e5362f5928da22ee079fc94817224e/raw/384c27810e76572e77e79e9829c5f92c1c4165d7/reference_v240.md" -o /tmp/approved-v240.md
          test "$(wc -c < /tmp/approved-v240.md | tr -d ' ')" = "401397"
          test "$(sha256sum /tmp/approved-v240.md | awk '{print $1}')" = "225de838d35d6ed383886bf8d0dbe104a6f3d7c72baa6eac5d15e352f4652c0b"
      - name: Download owner-approved D3 artifact by exact Artifact ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13288779998/zip" \
            -o /tmp/d3-owner-approved-artifact.zip
          test "$(wc -c < /tmp/d3-owner-approved-artifact.zip | tr -d ' ')" = "535567142"
          test "$(sha256sum /tmp/d3-owner-approved-artifact.zip | awk '{print $1}')" = "e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe"
      - name: Extract and verify the two exact D3 workbooks
        run: |
          set -euo pipefail
          python scripts/d5_package.py extract --artifact-zip /tmp/d3-owner-approved-artifact.zip --output-dir deliverables
      - name: Build, reopen and verify the eight-member D5 package (preflight only)
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python scripts/d5_package.py build --root . --reference /tmp/approved-v240.md --tested-sha "$TESTED_SHA" --run-id "$RUN_ID" --report docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json
      - name: Run D5 package safety and checksum unit tests
        run: |
          set -euo pipefail
          python -m compileall -q scripts/d5_package.py tests/test_d5_package.py
          python -m pytest -q -rs tests/test_d5_package.py
      - name: Publish D5 package Artifact (30-day retention)
        id: publish_d5
        uses: actions/upload-artifact@v4
        with:
          name: Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05
          path: |
            deliverables/Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05.zip
            deliverables/manifest.json
            deliverables/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Independently download and verify published D5 Artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.publish_d5.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.publish_d5.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" -o /tmp/d5-artifact-metadata.json; then break; fi
            sleep 5
          done
          curl --fail --location --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/d5-published-artifact.zip
          python - <<'PY'
          import hashlib,json,os,zipfile,pathlib
          meta=json.loads(pathlib.Path("/tmp/d5-artifact-metadata.json").read_text())
          p=pathlib.Path("/tmp/d5-published-artifact.zip")
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          expected=(os.environ["ARTIFACT_DIGEST"] or "").removeprefix("sha256:")
          if expected and digest != expected: raise SystemExit("D5_ARTIFACT_DIGEST_MISMATCH")
          if meta.get("expired") is not False: raise SystemExit("D5_ARTIFACT_EXPIRED")
          if int(meta["size_in_bytes"]) != p.stat().st_size: raise SystemExit("D5_ARTIFACT_SIZE_MISMATCH")
          expected_names={"Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05.zip","manifest.json","SHA256SUMS.txt"}
          with zipfile.ZipFile(p) as z:
              if set(z.namelist()) != expected_names: raise SystemExit("D5_ARTIFACT_OUTER_INVENTORY_MISMATCH")
              if z.testzip(): raise SystemExit("D5_ARTIFACT_OUTER_CRC_FAILURE")
              for name in expected_names:
                  local=pathlib.Path("deliverables")/name
                  if z.read(name) != local.read_bytes(): raise SystemExit("D5_ARTIFACT_REMOTE_BYTES_MISMATCH:"+name)
          print(json.dumps({"artifact_id":meta["id"],"name":meta["name"],"size_in_bytes":meta["size_in_bytes"],"digest":meta.get("digest"),"downloaded_zip_sha256":digest,"expires_at":meta["expires_at"],"retention_days":30,"remote_readback":"PASS"},indent=2))
          PY
      - name: Record D5 publication evidence and append-only continuity
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACT_ID: ${{ steps.publish_d5.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.publish_d5.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.publish_d5.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,os,hashlib
          report_path=pathlib.Path("docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json")
          report=json.loads(report_path.read_text(encoding="utf-8"))
          meta=json.loads(pathlib.Path("/tmp/d5-artifact-metadata.json").read_text())
          outer=pathlib.Path("/tmp/d5-published-artifact.zip")
          report["status"]="PUBLISHED_AND_REMOTE_READBACK_VERIFIED"
          report["publication"]="GITHUB_ACTIONS_ARTIFACT"
          report["artifact"]={"id":int(os.environ["ARTIFACT_ID"]),"name":meta["name"],"url":os.environ["ARTIFACT_URL"],"size_in_bytes":meta["size_in_bytes"],"digest":meta.get("digest"),"downloaded_zip_sha256":hashlib.sha256(outer.read_bytes()).hexdigest(),"expires_at":meta["expires_at"],"retention_days":30,"remote_readback":"PASS"}
          report["publication_commit_sha"]=os.environ["TESTED_SHA"]
          report_path.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          pkg=report["package"]; man=report["manifest"]; sums=report["sha256sums"]; art=report["artifact"]
          rows=[
            ("D5-01 Exact approved D3 Artifact ID/bytes/SHA-256","PASS","D3 Artifact 13288779998 independently downloaded and byte-verified."),
            ("D5-02 Governing reference identity","PASS","Pinned immutable Gist bytes and SHA-256 verified."),
            ("D5-03 Two Excel workbooks","PASS","Exact expected sizes/SHA-256 and 185 sheets per workbook."),
            ("D5-04 Five DOCX reports","PASS","Exact D4 sizes/SHA-256; each archive reopened and parsed."),
            ("D5-05 Number Registry external resource","PASS","Exact pinned bytes and SHA-256 verified."),
            ("D5-06 Eight-member ZIP and safe paths","PASS","ZIP reopened; seven deliverables plus manifest; exact inventory and CRC passed."),
            ("D5-07 SHA256SUMS coverage","PASS","ZIP + manifest + seven deliverables + external Number Registry; 10 entries."),
            ("D5-08 Publish D5 Artifact","PASS","New GitHub Actions Artifact published with 30-day retention."),
            ("D5-09 Remote readback","PASS","Artifact downloaded by exact ID; outer digest, size, inventory, CRC and all three payload byte streams matched.")
          ]
          md=["# D5 Requirements Matrix — 2026-11-03","","Overall: PASS_SCOPED_WITH_LIMITATIONS — package published and remote readback verified.","","| Requirement | Status | Evidence |","|---|---|---|"]
          md += [f"| {a} | {b} | {c} |" for a,b,c in rows]
          md += ["","## Verified fingerprints","",f"- Tested source SHA: {report['tested_sha']}.",f"- Workflow Run: {report['workflow_run_id']}.",f"- D5 ZIP: {pkg['bytes']} bytes; SHA-256 {pkg['sha256']}.",f"- manifest.json: {man['bytes']} bytes; SHA-256 {man['sha256']}.",f"- SHA256SUMS.txt: {sums['bytes']} bytes; SHA-256 {sums['sha256']}.",f"- Artifact ID: {art['id']}; size {art['size_in_bytes']} bytes; digest {art['digest']}; expires {art['expires_at']}; retention 30 days.",f"- Artifact download URL: {art['url']}.","- Package classification: T2_INTERIM / NOT_FINAL_BLOCKED.","- Full 177-unique-test acceptance suite: NOT_RUN.","- No Trial, Simulation, Monte Carlo, N expansion, backfill, zero-fill, identity change, main write, merge, Release, D6 or FINAL_ACCEPTED."]
          pathlib.Path("docs/stage_d/D5_REQUIREMENTS_MATRIX_2026-11-05.md").write_text("\n".join(md)+"\n",encoding="utf-8")
          entry=("\n\n## D5 package publication — 2026-11-05 (append-only)\n\n"
            f"- Workflow Run {report['workflow_run_id']}; tested source SHA {report['tested_sha']}; publication commit {os.environ['TESTED_SHA']}.\n"
            f"- D5 package ZIP: {pkg['bytes']} bytes; SHA-256 {pkg['sha256']}; 8 members; reopened, exact inventory and CRC PASS.\n"
            f"- manifest SHA-256 {man['sha256']}; external SHA256SUMS SHA-256 {sums['sha256']} (10 entries).\n"
            f"- New GitHub Actions Artifact ID {art['id']}; size {art['size_in_bytes']}; digest {art['digest']}; downloaded ZIP SHA-256 {art['downloaded_zip_sha256']}; expires {art['expires_at']}; retention 30 days.\n"
            "- Independent download by exact Artifact ID matched metadata digest/size, exact outer inventory, CRC and every payload byte.\n"
            "- Classification remains T2_INTERIM / NOT_FINAL_BLOCKED; D5 scoped package integrity only. Full 177-unique-test acceptance suite NOT_RUN; final acceptance NOT_DECLARED.\n"
            "- No Trial/Simulation/Monte Carlo/N expansion/backfill/zero-fill/identity change/main write/merge/Release/D6.\n")
          for path in ["docs/PROJECT_CONTINUITY.md","docs/PROJECT_CONTINUITY_ADDENDUM_2026-11-05.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md"]:
              p=pathlib.Path(path); p.write_text(p.read_text(encoding="utf-8")+entry,encoding="utf-8")
          PY
      - name: Remove temporary workbooks from runner workspace
        run: |
          rm -f deliverables/Full_Results_EN.xlsx "deliverables/النتائج_الكاملة_AR.xlsx"
      - name: Commit D5 publication evidence and package metadata
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json docs/stage_d/D5_REQUIREMENTS_MATRIX_2026-11-05.md docs/PROJECT_CONTINUITY.md docs/PROJECT_CONTINUITY_ADDENDUM_2026-11-05.md docs/PROJECT_HANDOFF.md docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md
          git commit -m "docs(d5): record package publication and readback evidence"
          git push origin HEAD:tmp/d1-rebuild-20261101
      - name: Remote Raw readback and exact final branch HEAD validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/tmp/d1-rebuild-20261101 | cut -f1)" = "$head"
          python - <<'PY'
          import hashlib, os, pathlib, urllib.parse, urllib.request, subprocess
          repo=os.environ["GITHUB_REPOSITORY"]; sha=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          paths=[
            "scripts/d5_package.py","tests/test_d5_package.py",".github/workflows/stage-d5-delivery-package.yml",
            "docs/stage_d/D5_PACKAGE_PREFLIGHT_2026-11-07.json","docs/stage_d/D5_REQUIREMENTS_MATRIX_2026-11-05.md",
            "docs/PROJECT_CONTINUITY_ADDENDUM_2026-11-05.md","docs/PROJECT_HANDOFF.md","docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-05.md"
          ]
          for path in paths:
            local=pathlib.Path(path).read_bytes()
            url=f"https://raw.githubusercontent.com/{repo}/{sha}/{urllib.parse.quote(path,safe='/')}"
            with urllib.request.urlopen(url,timeout=180) as r: remote=r.read()
            if remote!=local: raise SystemExit("D5_RAW_READBACK_MISMATCH:"+path)
            blob=hashlib.sha1(b"blob "+str(len(remote)).encode()+bytes([0])+remote).hexdigest()
            print(f"VERIFIED_RAW {path} bytes={len(remote)} sha256={hashlib.sha256(remote).hexdigest()} blob_sha1={blob} commit={sha} url={url}")
          print("D5_PUBLICATION_EXACT_FINAL_HEAD_PASS",sha)
          PY
