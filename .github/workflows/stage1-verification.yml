name: stage1-verification

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify-stage1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install stage-1 dependency
        run: python -m pip install "python-dateutil>=2.9,<3"
      - name: Execute reference checks
        shell: python
        run: |
          import ast
          import json
          import os
          import sys
          from datetime import date

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          import constants
          import dateutils
          import rng

          assert constants.C100_STATISTICAL_START_TRIALS == 1
          assert constants.NON_C100_STATISTICAL_START_TRIALS == 300
          assert constants.ITERATION_ESCALATION_STEP == 50
          assert constants.STATISTICAL_CHECK_START_N == 300
          assert constants.STATISTICAL_CHECK_STEP_N == 50
          assert constants.MINIMUM_STOP_N_FOR_NON_C100 == 400
          assert constants.STABILITY_CONSECUTIVE_CHECKS_REQUIRED == 3
          assert constants.INITIAL_SMOKE_TRIALS_PER_SCENARIO == 1
          assert constants.C100_CI_GATE_ENABLED is False
          assert constants.CI_ABSOLUTE_EPSILON == 1

          deliveries = {
              "2027-01-02": "2027-01-08",
              "2027-01-03": "2027-01-08",
              "2027-01-04": "2027-01-08",
              "2027-01-05": "2027-01-15",
              "2027-01-06": "2027-01-15",
              "2027-01-07": "2027-01-15",
          }
          friday_results = []
          for ds, expected in deliveries.items():
              d = date.fromisoformat(ds)
              got = dateutils.first_eligible_friday(d)
              assert got.isoformat() == expected
              assert got.weekday() == 4
              friday_results.append({
                  "delivery_date": ds,
                  "delivery_weekday_index": d.weekday(),
                  "eligible_friday": got.isoformat(),
              })

          assert dateutils.is_friday(date(2027, 1, 1))
          assert dateutils.next_business_day_on_or_after(date(2027, 1, 1)) == date(2027, 1, 2)
          assert dateutils.scheduled_ready_date(date(2026, 12, 26)) == date(2027, 1, 1)
          assert dateutils.primary_maturity_date(date(2027, 1, 2)) == date(2029, 1, 2)
          assert dateutils.settlement_due_date(date(2027, 1, 15), 20) == date(2027, 2, 5)
          assert dateutils.settlement_due_date(date(2027, 1, 15), 0) == date(2027, 1, 15)

          base = dict(
              master_seed=constants.MASTER_SEED,
              scenario_id="C085_G070",
              trial_id=1,
              bike_id="BK0001",
              day=date(2027, 1, 2),
          )
          s1 = rng.derive_seed(**base, event_type="PRIMARY_COLLECTION")
          s1b = rng.derive_seed(**base, event_type="PRIMARY_COLLECTION")
          assert s1 == s1b
          assert rng.rng_draw(s1) == rng.rng_draw(s1b)

          variants = [
              rng.derive_seed(**dict(base, scenario_id="C085_G071"), event_type="PRIMARY_COLLECTION"),
              rng.derive_seed(**dict(base, trial_id=2), event_type="PRIMARY_COLLECTION"),
              rng.derive_seed(**dict(base, bike_id="BK0002"), event_type="PRIMARY_COLLECTION"),
              rng.derive_seed(**dict(base, day=date(2027, 1, 3)), event_type="PRIMARY_COLLECTION"),
              rng.derive_seed(**base, event_type="SECONDARY_COLLECTION"),
              rng.derive_seed(**base, event_type="LEGACY_DEBT_COLLECTION"),
          ]
          assert all(v != s1 for v in variants)
          assert len({s1, *variants}) == 7
          assert rng.deterministic_success(1.0, s1) is True
          assert rng.deterministic_success(0.0, s1) is False

          for filename in ("constants.py", "dateutils.py", "rng.py"):
              tree = ast.parse(open(os.path.join(os.environ["GITHUB_WORKSPACE"], filename), encoding="utf-8").read(), filename)
              assert all(
                  not (
                      isinstance(node, ast.Call)
                      and isinstance(node.func, ast.Name)
                      and node.func.id == "hash"
                  )
                  for node in ast.walk(tree)
              ), filename

          result = {
              "constants": {
                  "C100_STATISTICAL_START_TRIALS": constants.C100_STATISTICAL_START_TRIALS,
                  "NON_C100_STATISTICAL_START_TRIALS": constants.NON_C100_STATISTICAL_START_TRIALS,
                  "ITERATION_ESCALATION_STEP": constants.ITERATION_ESCALATION_STEP,
                  "STATISTICAL_CHECK_START_N": constants.STATISTICAL_CHECK_START_N,
                  "STATISTICAL_CHECK_STEP_N": constants.STATISTICAL_CHECK_STEP_N,
                  "MINIMUM_STOP_N_FOR_NON_C100": constants.MINIMUM_STOP_N_FOR_NON_C100,
                  "CI_ABSOLUTE_EPSILON": constants.CI_ABSOLUTE_EPSILON,
                  "scenario_count": len(constants.SCENARIO_IDS),
              },
              "calendar": {
                  "2027-01-01_weekday_index": date(2027, 1, 1).weekday(),
                  "2026-12-26_plus_6_calendar_days": dateutils.scheduled_ready_date(date(2026, 12, 26)).isoformat(),
                  "initial_delivery": dateutils.next_business_day_on_or_after(date(2027, 1, 1)).isoformat(),
                  "primary_maturity_from_2027-01-02": dateutils.primary_maturity_date(date(2027, 1, 2)).isoformat(),
                  "friday_examples": friday_results,
              },
              "rng": {
                  "sha256_digest_hex": s1.hex(),
                  "draw": rng.rng_draw(s1),
                  "distinct_logical_event_seeds": len({s1, *variants}),
                  "p1": constants.PARTNER1_FINAL_SHARE_PCT,
                  "p2": constants.PARTNER2_FINAL_SHARE_PCT,
              },
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))