name: tmp-m4-mutation

on:
  push:
    branches:
      - "tmp/m4-mutation"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run trace and M4 behavioral tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage3b_m_order.py tests/test_stage3b_execution_trace_actual.py tests/test_stage3b_m4_behavior.py
