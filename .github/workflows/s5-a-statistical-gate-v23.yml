name: S5-A statistical gate v2.3

on:
  push:
    branches:
      - "tmp/s5-statistical-gate-v23-20261026"
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  statistical-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout S5-A candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run Test 192 coverage simulation and record proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p s5_evidence
          python scripts/test192_coverage.py --output docs/stage7/test192_coverage_proof.json | tee s5_evidence/test192-coverage.log
          git diff --exit-code -- docs/stage7/test192_coverage_proof.json
          sha256sum docs/stage7/test192_coverage_proof.json | tee s5_evidence/test192-proof.sha256
      - name: Run Test 172 and focused stats-integrity tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_s5_statistical_gate.py | tee s5_evidence/pytest-s5.log
          python -m compileall -q stats_integrity.py scripts/test192_coverage.py
      - name: Upload S5-A execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5-a-statistical-gate-${{ github.run_id }}
          if-no-files-found: error
          path: |
            s5_evidence/
            docs/stage7/test192_coverage_proof.json
