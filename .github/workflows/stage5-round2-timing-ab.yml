name: stage5-round2-timing-ab

on:
  push:
    branches: ["tmp/stage5-round2-timing-20261002"]

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Measure callback versus no callback
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import monte_carlo
          from daily_engine import run_deterministic_trial

          no_callback = []
          callback = []
          for _ in range(3):
              start = time.perf_counter()
              project = run_deterministic_trial(
                  recovery_rate_pct=100,
                  trial_id=1,
                  scenario_id="C100_G100",
                  master_seed=20270101,
              )
              no_callback.append({
                  "elapsed_seconds": time.perf_counter() - start,
                  "daily_balance_checks": len(project.daily_balance_checks),
                  "final_net_project_equity": project.final_net_project_equity,
              })

              start = time.perf_counter()
              result, rows = monte_carlo.run_single_trial(
                  "C100_G100",
                  1,
                  master_seed=20270101,
              )
              callback.append({
                  "elapsed_seconds": time.perf_counter() - start,
                  "daily_rows": len(rows),
                  "final_net_project_equity": result.final_net_project_equity,
              })

          print(json.dumps({
              "cpu_count": os.cpu_count(),
              "no_callback": no_callback,
              "with_on_day_end": callback,
          }, ensure_ascii=False, sort_keys=True))
          PY
