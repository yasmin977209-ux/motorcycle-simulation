name: Stage 7 fail-closed preflight verification

on:
  push:
    branches:
      - "tmp/cp-stage7-workflow-fail-closed-20261022"
    paths:
      - ".github/workflows/stage7-full-run.yml"
      - ".github/workflows/cp-stage7-workflow-fail-closed-verify-20261022.yml"
      - "tests/test_stage7_authoring.py"
      - "scripts/stage7_stability.py"
      - "scripts/stage7_state.py"
      - "run_batch.py"

permissions:
  contents: read

concurrency:
  group: cp-stage7-workflow-fail-closed-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-contract:
    name: Static workflow safety and Stage 7 authoring regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Parse Stage 7 production workflow YAML
        run: python -c "import yaml; yaml.safe_load(open('.github/workflows/stage7-full-run.yml', encoding='utf-8'))"
      - name: Compile Stage 7 modules
        run: python -m compileall -q run_batch.py scripts/stage7_stability.py scripts/stage7_state.py
      - name: Run authoring contracts only
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage7_authoring.py
