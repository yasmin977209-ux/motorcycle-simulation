name: S6 v2.3 cumulative checkpoint N600

on:
  push:
    branches:
      - "tmp/s6-aggregate-contract-fix-20261027"
    paths:
      - ".github/workflows/s6-n600-checkpoint.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: s6-n600-cumulative
  cancel-in-progress: false

env:
  PYTHONPATH: .
  PYTHONDONTWRITEBYTECODE: "1"
  SOURCE_RUN_ID: "40574326793"
  SOURCE_RUN_ATTEMPT: "1"
  SOURCE_SHA: "da1a9ea9b5cd789c944de3f07b08395bb67c49e7"
  MASTER_SEED: "20270101"
  S6_TRIAL_COUNT: "600"
  S6_TRIAL_START: "301"
  S6_WORKERS: "2"

jobs:
  preflight:
    name: Verify incremental N600 contract and prior checkpoint artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile and run focused tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/s6_first_checkpoint.py
          python scripts/s6_first_checkpoint.py --help
          python -m pytest -q tests/test_s6_first_checkpoint.py
      - name: Assert N600 is the next approved doubling point and never a convergence claim
        run: |
          set -euo pipefail
          python - <<'PY'
          import constants, json
          from scripts.s6_first_checkpoint import previous_checkpoint_n, verify_c100_reuse
          assert previous_checkpoint_n(600)==300
          c100=verify_c100_reuse()
          assert c100["run_id"]==40263424595 and c100["rerun"] is False
          print(json.dumps({"status":"S6_N600_PREFLIGHT_PASS","previous_n":300,
            "target_n":600,"incremental_trial_ids":[301,600],
            "c100_reuse":"READ_ONLY","convergence_claim":"PROHIBITED"},sort_keys=True))
          PY

  g100-base:
    name: S6 N600 G100 base — C${{ matrix.collection }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        collection: ["085", "070", "050", "030"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download immutable N300 G100 checkpoint
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: s6-n300-C${{ matrix.collection }}-G100-40574326793
          path: results_stage7_s6/previous
      - name: Execute only trial IDs 301–600, preserving the original N300 results
        shell: bash
        env:
          COLLECTION: ${{ matrix.collection }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          SCENARIO="C${COLLECTION}_G100"
          env -u GITHUB_SHA python scripts/s6_first_checkpoint.py \
            --mode scenario --scenario "$SCENARIO" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --trials "$S6_TRIAL_COUNT" --trial-start "$S6_TRIAL_START" --trial-end "$S6_TRIAL_COUNT" \
            --workers "$S6_WORKERS" --previous-dir results_stage7_s6/previous \
            --output-dir "results_stage7_s6/$SCENARIO"
          test -s "results_stage7_s6/$SCENARIO/scenario_manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: s6-n600-C${{ matrix.collection }}-G100-${{ github.run_id }}
          path: results_stage7_s6/C${{ matrix.collection }}_G100/
          if-no-files-found: error
          retention-days: 30

  lower-g:
    name: S6 N600 ${{ matrix.scenario }}
    needs: [preflight, g100-base]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        scenario:
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download the immutable N300 checkpoint for this scenario
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: s6-n300-${{ matrix.scenario }}-40574326793
          path: results_stage7_s6/previous
      - name: Download current N600 G100 base when OPT-1 applies
        if: startsWith(matrix.scenario, 'C085_') || startsWith(matrix.scenario, 'C070_')
        uses: actions/download-artifact@v4
        with:
          name: s6-n600-${{ startsWith(matrix.scenario, 'C085_') && 'C085' || 'C070' }}-G100-${{ github.run_id }}
          path: results_stage7_s6/base
      - name: Execute incremental block and apply the approved OPT-1 policy
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ "$SCENARIO" == C085_* || "$SCENARIO" == C070_* ]]; then ARGS+=(--base-dir results_stage7_s6/base); fi
          env -u GITHUB_SHA python scripts/s6_first_checkpoint.py \
            --mode scenario --scenario "$SCENARIO" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --trials "$S6_TRIAL_COUNT" --trial-start "$S6_TRIAL_START" --trial-end "$S6_TRIAL_COUNT" \
            --workers "$S6_WORKERS" --previous-dir results_stage7_s6/previous \
            --output-dir "results_stage7_s6/$SCENARIO" "${ARGS[@]}"
          test -s "results_stage7_s6/$SCENARIO/scenario_manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: s6-n600-${{ matrix.scenario }}-${{ github.run_id }}
          path: results_stage7_s6/${{ matrix.scenario }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Validate cumulative N600 evidence and keep acceptance gates closed
    needs: [preflight, g100-base, lower-g]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Download all 20 N600 scenario artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: s6-n600-*-${{ github.run_id }}
          path: results_stage7_s6/artifacts
          merge-multiple: false
      - name: Aggregate cumulative trial IDs 1–600 and validate fail-closed status
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test "$(find results_stage7_s6/artifacts -name scenario_manifest.json | wc -l)" -eq 20
          env -u GITHUB_SHA python scripts/s6_first_checkpoint.py \
            --mode aggregate --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --source-run-id "$RUN_ID" --source-run-attempt "$RUN_ATTEMPT" \
            --trials 600 --input-root results_stage7_s6/artifacts \
            --output-dir results_stage7_s6/aggregate
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("results_stage7_s6/aggregate/manifest.json").read_text(encoding="utf-8"))
          assert m["scenario_count"]==20 and m["checkpoint_n"]==600
          assert m["source_run_id"]==m["run_id"]
          assert m["total_scenario_combinations"]==25 and m["c100_reused_scenario_count"]==5
          assert sum(x["n_total"] for x in m["scenario_summaries"])==12000
          assert all(x["n_unique_paths"] is None and x["n_unique_paths_status"]=="UNDEFINED_BUSINESS_RULE" for x in m["scenario_summaries"])
          assert m["acceptance_status"]["n_unique_paths"]=="UNDEFINED_BUSINESS_RULE"
          assert m["acceptance_status"]["gate_a"]!="PASS"
          assert m["acceptance_status"]["gate_b"]=="NOT_EVALUATED_INTERMEDIATE_CHECKPOINT"
          assert m["acceptance_status"]["stability"]=="NOT_EVALUATED_INTERMEDIATE_CHECKPOINT"
          print(json.dumps({"status":"S6_N600_CHECKPOINT_EXECUTED_NOT_CONVERGED",
            "source_sha":m["source_sha"],"git_commit":m["git_commit"],"run_id":m["run_id"],
            "checkpoint_n":m["checkpoint_n"],"scenario_count":m["scenario_count"],
            "trial_rows":sum(x["n_total"] for x in m["scenario_summaries"]),
            "gate_a":m["acceptance_status"]["gate_a"],"gate_b":m["acceptance_status"]["gate_b"],
            "n_unique_paths":"UNDEFINED_BUSINESS_RULE"},ensure_ascii=False,sort_keys=True))
          PY
          sha256sum results_stage7_s6/aggregate/*
      - uses: actions/upload-artifact@v4
        with:
          name: s6-n600-aggregate-${{ github.run_id }}
          path: results_stage7_s6/aggregate/
          if-no-files-found: error
          retention-days: 30
