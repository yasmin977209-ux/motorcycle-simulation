name: stage3b-verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3b:
    name: stage3b
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: 30-day deterministic smoke metrics
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          /usr/bin/time -f 'ELAPSED_SECONDS=%e' python - <<'PY'
          import os, time
          from datetime import date, timedelta
          from daily_engine import create_initial_project, run_day

          project = create_initial_project(100)
          current = date(2027, 1, 1)
          started = time.perf_counter()
          for _ in range(30):
              run_day(
                  project,
                  current,
                  1.0,
                  "C100_G100",
                  1,
                  100,
                  20270101,
              )
              current += timedelta(days=1)
          elapsed = time.perf_counter() - started
          total = 0
          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for filename in files:
                  try:
                      total += os.path.getsize(os.path.join(root, filename))
                  except OSError:
                      pass
          print(f"ITERATIONS=30")
          print(f"SECONDS_PER_ITERATION={elapsed / 30}")
          print(f"CPU_COUNT={os.cpu_count()}")
          print("WORKFLOW_TIMEOUT_MINUTES=15")
          print(f"WORKING_TREE_SIZE_BYTES={total}")
          print(f"BALANCE_CHECKS={len(project.daily_balance_checks)}")
          print(
              "MAX_ABSOLUTE_BALANCE_DIFFERENCE="
              f"{max(abs(x['Balance_Difference']) for x in project.daily_balance_checks)}"
          )
          PY

      - name: Stage 3B test groups
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set +e
          : > /tmp/stage3b_status
          overall=0

          run_group() {
            local label="$1"
            shift
            local output rc summary
            output="$(python -m pytest -q "$@" 2>&1)"
            rc=$?
            printf '%s\n' "$output"
            summary="$(printf '%s\n' "$output" | tail -1)"
            printf '%s|%s|%s\n' "$label" "$rc" "$summary" >> /tmp/stage3b_status
            if [ "$rc" -ne 0 ]; then
              overall=1
            fi
          }

          run_group "CH10" tests/test_stage3b_accounting.py
          run_group "CH11" tests/test_stage3b_partner_equity.py
          run_group "CH12" tests/test_stage3b_m_order.py
          run_group "CH13" tests/test_stage3b_closure.py
          run_group "PATHS_4_4" tests/test_stage3b_paths.py
          run_group "NO_TIME_CAP" tests/test_stage3b_no_time_cap.py
          run_group "ROLLFORWARD_AND_C100" tests/test_stage3b_determinism.py

          {
            printf '| Test group | Status | Actual pytest summary |\n'
            printf '|---|---|---|\n'
            while IFS='|' read -r label rc summary; do
              if [ "$rc" -eq 0 ]; then
                status="PASS"
              else
                status="FAIL"
              fi
              case "$label" in
                CH10) display="Chapter 10" ;;
                CH11) display="Chapter 11" ;;
                CH12) display="Chapter 12 M1-M17" ;;
                CH13) display="Chapter 13" ;;
                PATHS_4_4) display="Chapter 4.4 paths 2-6" ;;
                NO_TIME_CAP) display="No time cap behavioral test" ;;
                ROLLFORWARD_AND_C100) display="Roll-forward + C100 deterministic repetitions" ;;
                *) display="$label" ;;
              esac
              printf '| %s | %s | %s |\n' "$display" "$status" "$summary"
            done < /tmp/stage3b_status
            printf '| Tests 127, 159, 160, 161 | DEFERRED | later-stage inputs |\n'
            printf '| Test 158 | ADJUDICATION | rule 8 conflict retained |\n'
          } | tee /tmp/stage3b_summary

          cat /tmp/stage3b_summary >> "$GITHUB_STEP_SUMMARY"
          exit "$overall"
