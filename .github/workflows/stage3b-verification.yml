name: stage3b-verification

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3b:
    name: stage3b
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: 30-day deterministic smoke metrics
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          /usr/bin/time -f 'ELAPSED_SECONDS=%e' python - <<'PY'
          import os, time
          from datetime import date, timedelta
          from daily_engine import create_initial_project, run_day

          project = create_initial_project(100)
          current = date(2027, 1, 1)
          started = time.perf_counter()
          for _ in range(30):
              run_day(
                  project,
                  current,
                  1.0,
                  "C100_G100",
                  1,
                  100,
                  20270101,
              )
              current += timedelta(days=1)
          elapsed = time.perf_counter() - started
          total = 0
          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for filename in files:
                  try:
                      total += os.path.getsize(os.path.join(root, filename))
                  except OSError:
                      pass
          print(f"ITERATIONS=30")
          print(f"SECONDS_PER_ITERATION={elapsed / 30}")
          print(f"CPU_COUNT={os.cpu_count()}")
          print("WORKFLOW_TIMEOUT_MINUTES=15")
          print(f"WORKING_TREE_SIZE_BYTES={total}")
          print(f"BALANCE_CHECKS={len(project.daily_balance_checks)}")
          print(
              "MAX_ABSOLUTE_BALANCE_DIFFERENCE="
              f"{max(abs(x['Balance_Difference']) for x in project.daily_balance_checks)}"
          )
          PY

      - name: Stage 3B unit and path tests before long run
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q             tests/test_stage3b_accounting.py             tests/test_stage3b_partner_equity.py             tests/test_stage3b_closure.py             tests/test_stage3b_m_order.py             tests/test_stage3b_paths.py             tests/test_stage3b_no_time_cap.py

      - name: Stage 3B status
        shell: bash
        run: |
          set -euo pipefail
          echo '| Test group | Status |'
          echo '|---|---|'
          echo '| Chapter 10 | unit tests executed above |'
          echo '| Chapter 11 | unit tests executed above |'
          echo '| Chapter 12 | unit/path tests executed above |'
          echo '| Chapter 13 | closure/path tests executed above |'
          echo '| 127/159/160/161 | DEFERRED |'
          echo '| 158 | ADJUDICATION |'
