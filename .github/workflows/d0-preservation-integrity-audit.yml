name: D0 Raw Artifact, ZIP Restore and Parquet Integrity Audit
on:
  push:
    branches: [tmp/d1-rebuild-20261101]
    paths:
      - scripts/audit_preservation_artifact.py
      - .github/workflows/d0-preservation-integrity-audit.yml
      - docs/stage_d/S6_ONEDRIVE_EXTERNAL_COPY_TRANSFER_2026-11-06.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d0-preservation-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: Build exact immutable artifact matrix
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve 20 S6 source Artifacts and three additional preservation Artifacts
        id: matrix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.3
          python - <<'PY'
          import json, os, requests
          repo="yasmin977209-ux/motorcycle-simulation"
          transfer=json.load(open("docs/stage_d/S6_ONEDRIVE_EXTERNAL_COPY_TRANSFER_2026-11-06.json",encoding="utf-8"))
          items=[]
          for a in transfer["artifacts"]:
              items.append({"id":a["artifact_id"],"name":a["name"],"size":a["source_size_bytes"],
                "sha256":a["github_api_digest"].removeprefix("sha256:"),"require_parquet":True,"require_metadata":True})
          headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json"}
          for aid in (12852969854,12998778418,12630457193):
              r=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",headers=headers,timeout=45)
              r.raise_for_status(); m=r.json()
              if m.get("expired") or not m.get("digest") or not m.get("size_in_bytes"):
                  raise SystemExit(f"ADDITIONAL_ARTIFACT_METADATA_UNAVAILABLE:{aid}")
              items.append({"id":aid,"name":m["name"],"size":m["size_in_bytes"],
                "sha256":m["digest"].removeprefix("sha256:"),"require_parquet":False,"require_metadata":False})
          if len(items)!=23 or len({x["id"] for x in items})!=23: raise SystemExit("ARTIFACT_MATRIX_COUNT_OR_DUPLICATE_FAILURE")
          value=json.dumps({"include":items},separators=(",",":"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("value="+value+"\n")
          print("PRESERVATION_ARTIFACT_MATRIX_COUNT=23")
          PY

  audit:
    name: Raw SHA, ZIP restore and Parquet ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 23
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded Parquet audit engine
        run: python -m pip install --disable-pip-version-check duckdb==1.1.3 requests==2.32.3
      - name: Download exact artifact bytes, verify source digest, CRC, restore and Parquet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.id }}
          ARTIFACT_NAME: ${{ matrix.name }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
          REQUIRE_PARQUET: ${{ matrix.require_parquet }}
          REQUIRE_METADATA: ${{ matrix.require_metadata }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$REQUIRE_PARQUET" == "true" ]]; then args+=(--require-parquet); fi
          if [[ "$REQUIRE_METADATA" == "true" ]]; then args+=(--require-source-metadata); fi
          python scripts/audit_preservation_artifact.py \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --expected-size "$EXPECTED_SIZE" \
            --expected-sha256 "$EXPECTED_SHA256" \
            --output audit-output \
            "${args[@]}"
      - name: Upload per-artifact audit report even when blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preservation-audit-${{ matrix.id }}
          path: audit-output/*.json
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    name: Aggregate D0 preservation audit evidence
    needs: [prepare, audit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Collect all available per-artifact reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: preservation-audit-*
          merge-multiple: true
          path: audit-reports
      - name: Write aggregate result without promoting preservation gate
        run: |
          python - <<'PY'
          import glob, json, pathlib
          reports=[]
          for p in sorted(glob.glob("audit-reports/*.json")):
              reports.append(json.loads(pathlib.Path(p).read_text(encoding="utf-8")))
          blocked=[r for r in reports if r.get("classification")!="PASS_SCOPED"]
          expected=23
          result={"schema_version":"d0-preservation-aggregate-v1","tested_sha":"${{ github.sha }}",
            "workflow_run_id":"${{ github.run_id }}","expected_artifact_count":expected,
            "reports_received":len(reports),"pass_scoped_count":len(reports)-len(blocked),
            "blocked_count":len(blocked),"missing_artifact_reports":max(0,expected-len(reports)),
            "classification":"PASS_SCOPED" if len(reports)==expected and not blocked else "BLOCKED",
            "artifacts":[{"artifact_id":r.get("artifact_id"),"name":r.get("artifact_name"),"classification":r.get("classification"),
              "raw_sha256":r.get("raw_archive",{}).get("sha256"),"bytes":r.get("raw_archive",{}).get("bytes"),
              "zip_crc":r.get("outer_zip",{}).get("crc"),"restore":r.get("restore_test",{}).get("status"),
              "parquet":r.get("parquet_audit",{}).get("status"),"source_metadata_sha256":r.get("source_run_metadata_sha256",{}).get("status")} for r in reports],
            "limitations":["This workflow verifies GitHub source artifacts. It does not independently read OneDrive or Dropbox object bytes, so it cannot close Global Preservation Gate by itself."]}
          out=pathlib.Path("aggregate-output"); out.mkdir(exist_ok=True)
          (out/"D0_PRESERVATION_RAW_ARTIFACT_AUDIT_2026-11-06.json").write_text(json.dumps(result,ensure_ascii=False,sort_keys=True,indent=2)+"\n")
          print(json.dumps({"classification":result["classification"],"reports":len(reports),"pass":result["pass_scoped_count"],"blocked":len(blocked)},sort_keys=True))
          PY
      - name: Upload aggregate D0 audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: D0-Preservation-Raw-Artifact-Audit
          path: aggregate-output/
          if-no-files-found: error
          retention-days: 30
