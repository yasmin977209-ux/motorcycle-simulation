name: CP State And Source Sync Verification
on:
  push:
    branches:
      - tmp/cp-state-and-source-sync-20261013
    paths:
      - .github/workflows/cp-state-source-sync-verify.yml
      - daily_engine.py
      - monte_carlo.py
      - requirements.txt
      - tests/test_state_governance_fields.py
      - tests/test_source_identity_exception.py
      - tests/test_excel_daily_sheet.py
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/cp-state-and-source-sync-20261013
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Verify CP-A ancestry, additive-only diff, and 10-trial historical replay
        env:
          SOURCE_SHA: f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor f0314795de3fdc25ba0fe79608124244fc3770aa HEAD
          echo "ANCESTOR_EXIT=0"
          echo "TESTED_HEAD_SHA=$(git rev-parse HEAD)"
          echo "MAIN_HEAD_AT_AUDIT=647c19826b90d8224ce73ef9b90c306a45e03fb0"

          git cat-file -e "${SOURCE_SHA}^{commit}"
          read -r added deleted path < <(git diff --numstat "${SOURCE_SHA}" -- daily_engine.py)
          echo "DAILY_ENGINE_NUMSTAT=${added} additions, ${deleted} deletions, ${path}"
          [[ "${added}" == "11" && "${deleted}" == "0" && "${path}" == "daily_engine.py" ]]
          git grep -n -E '_create_contract|_new_contract' -- daily_engine.py

          git worktree add --detach /tmp/source-identity-A "${SOURCE_SHA}"
          cat > /tmp/run_selected_trial_fingerprints.py <<'PY'
          from __future__ import annotations

          import json
          import monte_carlo

          CASES = {
              "C030_G000": (100, 200, 300),
              "C050_G050": (100, 200),
              "C070_G070": (100, 200),
              "C085_G100": (100, 200),
              "C100_G100": (1,),
          }

          def main():
              out = {}
              for scenario, trial_ids in CASES.items():
                  for trial_id in trial_ids:
                      result, _daily = monte_carlo.run_single_trial(
                          scenario, trial_id, master_seed=20270101
                      )
                      out[f"{scenario}:{trial_id}"] = (
                          monte_carlo.fingerprint_trial_results([result])
                      )
              print(json.dumps(out, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          (cd /tmp/source-identity-A && PYTHONPATH=. python /tmp/run_selected_trial_fingerprints.py > /tmp/fingerprint-A.json)
          PYTHONPATH=. python /tmp/run_selected_trial_fingerprints.py > /tmp/fingerprint-B.json

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          SOURCE_SHA = "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          CASES = {
              "C030_G000": (100, 200, 300),
              "C050_G050": (100, 200),
              "C070_G070": (100, 200),
              "C085_G100": (100, 200),
              "C100_G100": (1,),
          }
          manifest = json.loads(Path("docs/stage9a/dataset_manifest.json").read_text(encoding="utf-8"))
          assert manifest["source_sha"] == SOURCE_SHA, manifest["source_sha"]
          assert manifest["master_seed"] == 20270101, manifest["master_seed"]
          fingerprints_a = json.loads(Path("/tmp/fingerprint-A.json").read_text(encoding="utf-8"))
          fingerprints_b = json.loads(Path("/tmp/fingerprint-B.json").read_text(encoding="utf-8"))
          rows = []
          for scenario, trial_ids in CASES.items():
              for trial_id in trial_ids:
                  key = f"{scenario}:{trial_id}"
                  historical = manifest["trial_fingerprints"][scenario][trial_id - 1]
                  a_hash = fingerprints_a[key]
                  b_hash = fingerprints_b[key]
                  if a_hash != b_hash:
                      status = "DRIFT"
                  elif a_hash != historical:
                      status = "FAIL"
                  else:
                      status = "PASS"
                  row = {
                      "scenario": scenario,
                      "trial_id": trial_id,
                      "fingerprint_A": a_hash,
                      "fingerprint_B": b_hash,
                      "fingerprint_historical": historical,
                      "status": status,
                  }
                  rows.append(row)
                  print(json.dumps(row, sort_keys=True))
          summary = {
              "source_sha": SOURCE_SHA,
              "manifest_git_blob_sha": "e796fa2443493b607f1f9c60b58eb63607959c26",
              "manifest_global_sha256": manifest["global_manifest_sha256"],
              "master_seed": 20270101,
              "case_count": len(rows),
              "passed": sum(row["status"] == "PASS" for row in rows),
              "drift": sum(row["status"] == "DRIFT" for row in rows),
              "historical_mismatch": sum(row["status"] == "FAIL" for row in rows),
              "status": "PASS_10_OF_10" if all(row["status"] == "PASS" for row in rows) else "FAIL",
              "rows": rows,
              "production_monte_carlo": False,
              "dataset_modified": False,
              "parquet_modified": False,
          }
          Path("/tmp/source-identity-replay.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("REPLAY_SUMMARY=" + json.dumps({k: v for k, v in summary.items() if k != "rows"}, sort_keys=True))
          if summary["status"] != "PASS_10_OF_10":
              raise SystemExit(1)
          PY
      - name: Build Stage 5 fixtures for v2 parquet tests
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py
      - name: Measure temporary Stage 5 fixtures
        shell: bash
        run: du -sb results_stage5
      - name: Targeted state/source and Excel regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_state_governance_fields.py tests/test_source_identity_exception.py tests/test_excel_daily_sheet.py
      - name: Full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests
      - name: Report fixture workbook SHA-256
        if: always()
        shell: bash
        run: |
          if test -f /tmp/cp-excel-daily-fixture.xlsx; then
            sha256sum /tmp/cp-excel-daily-fixture.xlsx
          else
            echo "Fixture workbook not generated."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp-excel-daily-fixture
          path: /tmp/cp-excel-daily-fixture.xlsx
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cp-source-identity-replay
          path: /tmp/source-identity-replay.json
          if-no-files-found: warn
          retention-days: 3
