name: CP Gate A exact-golden fail-closed verification

on:
  push:
    branches:
      - tmp/cp-gatea-fail-closed-20261013
    paths-ignore:
      - state.json
      - "docs/**"

permissions:
  contents: read

jobs:
  gate-a-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate branch
        uses: actions/checkout@v4
        with:
          ref: tmp/cp-gatea-fail-closed-20261013
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run targeted regression and acceptance paths
        run: >-
          python -m pytest -q
          tests/test_run_batch.py
          tests/test_stage7_authoring.py
          tests/test_stage3_path_integration.py
          tests/test_stage3b_path1.py
          tests/test_stage3b_paths.py
      - name: Parse changed Python and workflow YAML
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import textwrap
          import yaml

          for path in (
              Path("run_batch.py"),
              Path("scripts/stage7_stability.py"),
              Path("tests/test_run_batch.py"),
              Path("tests/test_stage7_authoring.py"),
          ):
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))

          stage7_workflow_text = Path(
              ".github/workflows/stage7-full-run.yml"
          ).read_text(encoding="utf-8")
          script_start_marker = "cat > /tmp/stage7_orchestrator.py <<'PY'\\n"
          script_end_marker = "\\n          PY\\n          python /tmp/stage7_orchestrator.py"
          script_start = stage7_workflow_text.index(script_start_marker) + len(script_start_marker)
          script_end = stage7_workflow_text.index(script_end_marker, script_start)
          embedded_script = textwrap.dedent(stage7_workflow_text[script_start:script_end])
          ast.parse(embedded_script, filename=".github/workflows/stage7-full-run.yml#orchestrator")

          workflow = yaml.safe_load(
              Path(".github/workflows/cp-gatea-fail-closed-verify.yml")
              .read_text(encoding="utf-8")
          )
          assert workflow["jobs"]["gate-a-contract"]["timeout-minutes"] == 15
          trigger = workflow.get("on") or workflow.get(True) or {}
          assert "workflow_dispatch" not in trigger
          assert trigger["push"]["branches"] == ["tmp/cp-gatea-fail-closed-20261013"]
          print("AST_AND_YAML_PARSE=PASS")
          PY
