name: tmp-timing

on:
  push:
    branches:
      - "tmp/timing"

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run actual run_day timing trials
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from datetime import date, timedelta
          from daily_engine import create_initial_project, run_day

          cases = [
              ("C070_G100", 0.70, 100, [1, 2, 3]),
              ("C030_G000", 0.30, 0, [1]),
              ("C100_G100", 1.00, 100, [1, 2]),
          ]

          def run_trial(scenario_id, collection_probability, recovery_rate_pct, trial_id):
              project = create_initial_project(recovery_rate_pct=recovery_rate_pct)
              current = date(2027, 1, 1)
              started = time.perf_counter()
              iterations = 0
              while not project.simulation_stopped:
                  run_day(
                      project,
                      current,
                      collection_probability=collection_probability,
                      scenario_id=scenario_id,
                      trial_id=trial_id,
                      recovery_rate_pct=recovery_rate_pct,
                  )
                  iterations += 1
                  current += timedelta(days=1)
              elapsed = time.perf_counter() - started
              return {
                  "scenario_id": scenario_id,
                  "trial_id": trial_id,
                  "collection_probability": collection_probability,
                  "recovery_rate_pct": recovery_rate_pct,
                  "elapsed_seconds": elapsed,
                  "seconds_per_day": elapsed / iterations,
                  "days_executed": iterations,
                  "final_close_date": project.final_close_date.isoformat() if project.final_close_date else None,
                  "bike_count": len(project.bikes),
                  "Final_Net_Project_Equity": project.final_net_project_equity,
                  "P1": project.partner1_final_entitlement,
                  "P2": project.partner2_final_entitlement,
                  "event_log_count": len(project.event_log),
                  "contract_count": len(project.contracts),
                  "receivable_count": len(project.receivables),
                  "max_absolute_balance_difference": max(
                      abs(row["Balance_Difference"]) for row in project.daily_balance_checks
                  ),
              }

          results = []
          for scenario_id, probability, recovery, trial_ids in cases:
              for trial_id in trial_ids:
                  result = run_trial(scenario_id, probability, recovery, trial_id)
                  results.append(result)
                  print("TRIAL_RESULT=" + json.dumps(result, sort_keys=True))

          print("CPU_COUNT=" + str(os.cpu_count()))
          print("WORKFLOW_TIMEOUT_MINUTES=15")
          print("TRIAL_COUNT=" + str(len(results)))
          print("RESULTS=" + json.dumps(results, sort_keys=True))
          PY
      - name: Compare C100 old and current commits daily
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          OLD_SHA="2e3aa381d833fe430d2aec42e98dd0d29918c3bf"
          NEW_SHA="$(git rev-parse HEAD)"
          git fetch --no-tags origin "$OLD_SHA"
          git worktree add --detach /tmp/old "$OLD_SHA"
          python - <<'PY'
          import hashlib
          import json
          import os
          import sys
          import time
          from datetime import date, timedelta

          def execute(repo_path):
              sys.path.insert(0, repo_path)
              from daily_engine import create_initial_project, run_day
              project = create_initial_project(recovery_rate_pct=100)
              current = date(2027, 1, 1)
              started = time.perf_counter()
              days = 0
              while not project.simulation_stopped:
                  run_day(
                      project,
                      current,
                      collection_probability=1.0,
                      scenario_id="C100_G100",
                      trial_id=1,
                      recovery_rate_pct=100,
                  )
                  days += 1
                  current += timedelta(days=1)
              elapsed = time.perf_counter() - started
              rows = []
              for row in project.daily_balance_checks:
                  rows.append(
                      f'{row["Cash"]}|{row["Total_Assets"]}|{row["Total_Equity"]}\n'
                  )
              payload = "".join(rows).encode("utf-8")
              digest = hashlib.sha256(payload).hexdigest()
              return {
                  "days": days,
                  "daily_rows": len(rows),
                  "event_log_count": len(project.event_log),
                  "contract_count": len(project.contracts),
                  "receivable_count": len(project.receivables),
                  "final_close_date": project.final_close_date.isoformat() if project.final_close_date else None,
                  "final_equity": project.final_net_project_equity,
                  "daily_cash_assets_equity_sha256": digest,
                  "elapsed_seconds": elapsed,
                  "rows": [(r["Cash"], r["Total_Assets"], r["Total_Equity"]) for r in project.daily_balance_checks],
              }

          old = execute("/tmp/old")
          sys.path.pop(0)
          new = execute(os.getcwd())

          comparable = {
              key: old[key] == new[key]
              for key in (
                  "days",
                  "daily_rows",
                  "event_log_count",
                  "contract_count",
                  "receivable_count",
                  "final_close_date",
                  "final_equity",
                  "daily_cash_assets_equity_sha256",
              )
          }
          first_diff = None
          for index, (a, b) in enumerate(zip(old["rows"], new["rows"]), start=1):
              if a != b:
                  first_diff = {"row": index, "old": a, "new": b}
                  break
          print("OLD=" + json.dumps({k:v for k,v in old.items() if k != "rows"}, sort_keys=True))
          print("NEW=" + json.dumps({k:v for k,v in new.items() if k != "rows"}, sort_keys=True))
          print("COMPARABLE=" + json.dumps(comparable, sort_keys=True))
          print("FIRST_DAILY_DIFFERENCE=" + json.dumps(first_diff, sort_keys=True))
          assert old["days"] == new["days"] == 2198
          assert old["daily_rows"] == new["daily_rows"] == 2198
          assert old["event_log_count"] == new["event_log_count"]
          assert old["contract_count"] == new["contract_count"]
          assert old["receivable_count"] == new["receivable_count"]
          assert old["final_close_date"] == new["final_close_date"]
          assert old["final_equity"] == new["final_equity"]
          assert old["rows"] == new["rows"]
          assert old["daily_cash_assets_equity_sha256"] == new["daily_cash_assets_equity_sha256"]
          PY
