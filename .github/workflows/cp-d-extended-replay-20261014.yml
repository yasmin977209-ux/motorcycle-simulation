name: CP-D Extended Replay Validation

on:
  push:
    branches:
      - "tmp/cp-extended-replay-20261014"

permissions:
  contents: read

jobs:
  extended-replay:
    if: contains(github.event.head_commit.message, '[cp-d-replay-run]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAIN_HEAD: "647c19826b90d8224ce73ef9b90c306a45e03fb0"
      SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
      EXPECTED_BENCHMARK_BLOB: "d54602982b6422939955ca841a251ecd250b4139"
    steps:
      - name: Checkout the exact CP-D commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project test and replay dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          mkdir -p cp_d_evidence

      - name: Validate main/source identity and approved adapter-only drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$MAIN_HEAD"
          git cat-file -e "$MAIN_HEAD^{commit}"
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse "$MAIN_HEAD:scripts/stage10_benchmark.py")" = "$EXPECTED_BENCHMARK_BLOB"

          daily_numstat="$(git diff --numstat "$SOURCE_SHA" "$MAIN_HEAD" -- daily_engine.py)"
          printf '%s\n' "$daily_numstat" | tee cp_d_evidence/daily_engine_numstat.txt
          test "$daily_numstat" = $'11\t0\tdaily_engine.py'

          for model_file in constants.py dateutils.py rng.py entities.py state_machine.py accounting.py collection.py guarantee.py friday.py settlement.py closure.py partner_equity.py monte_carlo.py; do
            if ! git diff --quiet "$SOURCE_SHA" "$MAIN_HEAD" -- "$model_file"; then
              echo "UNAPPROVED_MODEL_SOURCE_DRIFT:$model_file"
              exit 1
            fi
          done

          git diff "$SOURCE_SHA" "$MAIN_HEAD" -- daily_engine.py > cp_d_evidence/daily_engine_identity.diff
          python - <<'PY'
          from pathlib import Path
          patch = Path("cp_d_evidence/daily_engine_identity.diff").read_text(encoding="utf-8")
          assert "def _create_contract(" in patch, "APPROVED_ADAPTER_MISSING"
          assert "return _new_contract(project, bike, contract_type, current_date)" in patch, "ADAPTER_TARGET_MISMATCH"
          added = [line for line in patch.splitlines() if line.startswith("+") and not line.startswith("+++")]
          removed = [line for line in patch.splitlines() if line.startswith("-") and not line.startswith("---")]
          assert len(added) == 11, f"ADDED_LINE_COUNT_MISMATCH:{len(added)}"
          assert not removed, f"DELETION_IN_SOURCE_EXCEPTION:{removed}"
          print("SOURCE_EXCEPTION_CHECK=PASS")
          PY
          git diff --check 80e74454fea8b771f69f06ba57c3fad528d8e4d6...HEAD

      - name: Create detached main and pinned-source worktrees
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/cp-d-main" "$MAIN_HEAD"
          git worktree add --detach "$RUNNER_TEMP/cp-d-source" "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/cp-d-main" rev-parse HEAD)" = "$MAIN_HEAD"
          test "$(git -C "$RUNNER_TEMP/cp-d-source" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Replay ten approved non-C100 trials plus separate C100 determinism trial
        id: replay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cp_d_extended_replay.py \
            --main-root "$RUNNER_TEMP/cp-d-main" \
            --source-root "$RUNNER_TEMP/cp-d-source" \
            --output cp_d_evidence/replay.json | tee cp_d_evidence/replay_summary.json

      - name: Inspect exact replay report before running the full suite
        if: steps.replay.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("cp_d_evidence/replay.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS", "REPLAY_REPORT_NOT_PASS"
          assert report["main_head_sha"] == "647c19826b90d8224ce73ef9b90c306a45e03fb0"
          assert report["source_sha"] == "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          assert report["benchmark_blob_sha"] == "d54602982b6422939955ca841a251ecd250b4139"
          assert report["counts"]["new_non_c100_trials_expected"] == 10
          assert report["counts"]["new_non_c100_trials_passed"] == 10
          assert report["counts"]["new_551_600_expected"] == report["counts"]["new_551_600_passed"] == 5
          assert report["counts"]["new_601_1200_expected"] == report["counts"]["new_601_1200_passed"] == 5
          assert report["counts"]["c100_determinism_expected"] == report["counts"]["c100_determinism_passed"] == 1
          assert len(report["replays"]) == 11
          assert all(row["status"] == "PASS" and row["a_equals_b"] and row["a_equals_historical"] and row["b_equals_historical"] for row in report["replays"])
          print("REPLAY_ARTIFACT_CONTENT_GATE=PASS")
          PY

      - name: Generate Stage 5 test fixtures
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results_stage5
          mkdir -p results_stage5

          cat > /tmp/stage5_round5_build.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import asdict

          import pyarrow as pa
          import pyarrow.parquet as pq
          import monte_carlo

          RESULTS = "results_stage5"

          def main():
              c100_result, c100_daily = monte_carlo.run_single_trial(
                  "C100_G100", 1, master_seed=20270101
              )
              c100_results = [c100_result]
              c100_slices = {1: c100_daily}
              selection = monte_carlo.select_representative_trials(c100_results)

              assert c100_result.final_net_project_equity == 209671000
              assert c100_result.partner1_final_entitlement == 146769700
              assert c100_result.partner2_final_entitlement == 62901300
              assert c100_result.final_cash == 209671000
              assert c100_result.final_close_date == "2033-01-06"
              assert len(c100_daily) == 2198

              pq.write_table(
                  pa.Table.from_pylist([asdict(c100_result)]),
                  f"{RESULTS}/trials_summary.parquet",
              )

              pq.write_table(
                  pa.Table.from_pylist([
                      {"selection_key": key, "trial_id": int(trial_id)}
                      for key, trial_id in selection.items()
                  ]),
                  f"{RESULTS}/selection.parquet",
              )

              with open(
                  f"{RESULTS}/C100_G100_trial_{selection.p50_trial_id:06d}_daily.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      c100_daily,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              long_distribution = monte_carlo.build_daily_distribution(
                  c100_results,
                  c100_slices,
              )

              wide_by_date = {}
              for row in long_distribution:
                  current = wide_by_date.setdefault(
                      row["date"],
                      {
                          "date": row["date"],
                          "active_trial_count": row["active_trial_count"],
                      },
                  )
                  for metric in (
                      "Cash",
                      "Net_Equity",
                      "Active_Bikes",
                      "Owned_Transferred_Bikes",
                      "Pending_Claims",
                  ):
                      current[f"{row['quantile_name']}_{metric}"] = row[metric]

              daily_distribution = [
                  wide_by_date[key]
                  for key in sorted(wide_by_date)
              ]

              pq.write_table(
                  pa.Table.from_pylist(daily_distribution),
                  f"{RESULTS}/daily_distribution.parquet",
              )

              print(json.dumps({
                  "artifacts": [
                      "results_stage5/trials_summary.parquet",
                      "results_stage5/daily_distribution.parquet",
                      "results_stage5/selection.parquet",
                  ],
                  "c100_golden": {
                      "final_net_project_equity": c100_result.final_net_project_equity,
                      "partner1_final_entitlement": c100_result.partner1_final_entitlement,
                      "partner2_final_entitlement": c100_result.partner2_final_entitlement,
                      "final_cash": c100_result.final_cash,
                      "final_close_date": c100_result.final_close_date,
                      "daily_balance_checks": len(c100_daily),
                  },
                  "selection": selection,
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python /tmp/stage5_round5_build.py

          cat > /tmp/stage5_round5_worker_manifest.py <<'PY2'
          from __future__ import annotations

          import hashlib
          import json
          from dataclasses import asdict

          import monte_carlo

          RESULTS = "results_stage5"

          def stable_sha(value):
              payload = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  default=str,
              ).encode("utf-8")
              return hashlib.sha256(payload).hexdigest()

          def main():
              trial_ids = (1, 2, 3)

              seq_results, seq_slices = monte_carlo.run_trials_sequentially(
                  "C070_G100",
                  trial_ids,
              )

              par2_results, par2_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  2,
              )

              par4_results, par4_slices = monte_carlo.run_trials_parallel(
                  "C070_G100",
                  trial_ids,
                  4,
              )

              def by_id(results):
                  return {result.trial_id: result for result in results}

              seq_by_id = by_id(seq_results)
              par2_by_id = by_id(par2_results)
              par4_by_id = by_id(par4_results)

              manifest = []
              for trial_id in trial_ids:
                  seq_result = asdict(seq_by_id[trial_id])
                  p2_result = asdict(par2_by_id[trial_id])
                  p4_result = asdict(par4_by_id[trial_id])
                  seq_daily = seq_slices[trial_id]
                  p2_daily = par2_slices[trial_id]
                  p4_daily = par4_slices[trial_id]

                  manifest.append({
                      "scenario_id": "C070_G100",
                      "trial_id": trial_id,
                      "exact_1_eq_2": (
                          seq_result == p2_result
                          and seq_daily == p2_daily
                      ),
                      "exact_1_eq_4": (
                          seq_result == p4_result
                          and seq_daily == p4_daily
                      ),
                      "trial_result_sha256_1": stable_sha(seq_result),
                      "trial_result_sha256_2": stable_sha(p2_result),
                      "trial_result_sha256_4": stable_sha(p4_result),
                      "daily_slice_sha256_1": stable_sha(seq_daily),
                      "daily_slice_sha256_2": stable_sha(p2_daily),
                      "daily_slice_sha256_4": stable_sha(p4_daily),
                  })

              assert all(
                  row["exact_1_eq_2"] and row["exact_1_eq_4"]
                  for row in manifest
              )

              with open(
                  f"{RESULTS}/worker_equivalence_manifest.json",
                  "w",
                  encoding="utf-8",
              ) as handle:
                  json.dump(
                      manifest,
                      handle,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )
                  handle.write("\n")

              print(json.dumps({
                  "worker_manifest_rows": len(manifest),
                  "exact_all": all(
                      row["exact_1_eq_2"] and row["exact_1_eq_4"]
                      for row in manifest
                  ),
              }, ensure_ascii=False, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY2

          python /tmp/stage5_round5_worker_manifest.py
          test -f results_stage5/worker_equivalence_manifest.json
          test -f results_stage5/trials_summary.parquet
          test -f results_stage5/daily_distribution.parquet


      - name: Run the complete pytest suite
        if: steps.replay.outcome == 'success'
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest -q tests 2>&1 | tee cp_d_evidence/pytest_full.txt
          pytest_status=$?
          printf '%s\n' "$pytest_status" > cp_d_evidence/pytest_exit_code.txt
          exit "$pytest_status"

      - name: Upload replay and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp-d-extended-replay-evidence
          path: cp_d_evidence/
          if-no-files-found: warn
          retention-days: 30
