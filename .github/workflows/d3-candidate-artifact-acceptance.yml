      - name: Raw readback and exact final HEAD validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,os,pathlib,requests,subprocess,urllib.parse
          repo=os.environ["REPOSITORY"]
          branch=os.environ["BRANCH"]
          token=os.environ["GH_TOKEN"]
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          remote=subprocess.check_output(["git","ls-remote","origin",f"refs/heads/{branch}"],text=True).split()[0]
          if remote!=head:
              raise SystemExit(f"D3_ACCEPTANCE_FINAL_HEAD_MISMATCH:{head}:{remote}")
          main=subprocess.check_output(["git","ls-remote","origin","refs/heads/main"],text=True).split()[0]
          if main!=os.environ["EXPECTED_MAIN_SHA"]:
              raise SystemExit(f"MAIN_HEAD_CHANGED_UNEXPECTEDLY:{main}")
          paths=[
            ".github/workflows/d3-candidate-artifact-acceptance.yml",
            "docs/stage_d/D3_CANDIDATE_ARTIFACT_INTEGRITY_AUDIT_2026-11-04.json",
            "docs/stage_d/D3_CANDIDATE_ARTIFACT_INTEGRITY_AUDIT_2026-11-04.md",
            "docs/stage_d/STAGE_D_SESSION_STATUS_2026-11-04.md",
            "docs/PROJECT_CONTINUITY.md","docs/PROJECT_HANDOFF.md",
            "docs/stage_d/D3_FINAL_REVIEW_AND_REMEDIATION_STATUS_2026-11-02.md"
          ]
          for path in paths:
              local=pathlib.Path(path).read_bytes()
              url=f"https://raw.githubusercontent.com/{repo}/{head}/{urllib.parse.quote(path,safe='/')}"
              response=requests.get(url,timeout=180)
              response.raise_for_status()
              remote_bytes=response.content
              if remote_bytes!=local:
                  raise SystemExit("D3_ACCEPTANCE_RAW_READBACK_MISMATCH:"+path)
              blob=hashlib.sha1(b"blob "+str(len(remote_bytes)).encode()+b"\0"+remote_bytes).hexdigest()
              print(f"VERIFIED_LIVE {path} bytes={len(remote_bytes)} sha256={hashlib.sha256(remote_bytes).hexdigest()} blob_sha1={blob} commit={head} url={url}")
          print("D3_CANDIDATE_ARTIFACT_INTEGRITY_AUDIT_EXACT_FINAL_HEAD_PASS "+head)
          print("MAIN_UNCHANGED "+main)
          PY
