name: tmp-run-m8-fixture
on:
  push:
    branches:
      - "tmp/run-m8-fixture-b67"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run M8 settlement API file
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_m8_settlement_api.py -v 2>&1 | tee /tmp/m8.txt
