    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify model source boundary
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git diff --quiet "${SOURCE_SHA}" HEAD -- constants.py dateutils.py rng.py entities.py state_machine.py daily_engine.py accounting.py collection.py guarantee.py friday.py settlement.py closure.py partner_equity.py monte_carlo.py
      - name: Fetch Stage 7 state identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/state.json?ref=stage7-state/${{ matrix.scenario }}" --jq '.content' | tr -d '\n' | base64 -d > baseline_state.json
      - name: Download Stage 7 baseline artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}
          artifact-ids: ${{ matrix.artifact_id }}
          path: baseline_input
      - name: Run Stage 10 benchmark chunk
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
          MASTER_SEED: ${{ env.MASTER_SEED }}
          EXPECTED_RUN_ID: ${{ env.SOURCE_RUN_ID }}
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = "canonical" ]; then
            python -m scripts.stage10_benchmark canonical ${{ matrix.scenario }} ${{ matrix.trial_start }} ${{ matrix.trial_end }} ${{ matrix.artifact_id }} ${EXPECTED_RUN_ID} ${GITHUB_RUN_ID} ${SOURCE_SHA} ${MASTER_SEED} baseline_input
          else
            python -m scripts.stage10_benchmark c100 ${{ matrix.scenario }} ${{ matrix.sample_start }} ${{ matrix.sample_end }} ${{ matrix.artifact_id }} ${EXPECTED_RUN_ID} ${GITHUB_RUN_ID} ${SOURCE_SHA} ${MASTER_SEED} baseline_input
          fi
      - name: Upload measurement artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage10-bench-${{ matrix.scenario }}-${{ matrix.chunk_id }}
          path: stage10_output/${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: aggregate-stage10
    if: ${{ !contains(github.event.head_commit.message, '[STAGE10-CANCEL-OLD]') }}
    needs: [bench-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve measurement Run ID
        id: measurement-run
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ contains(join(github.event.commits.*.modified, ','), '.stage10-aggregate-trigger') }}" == "true" ]]; then
            echo "run_id=${RECOVERY_MEASUREMENT_RUN_ID}" >> "${GITHUB_OUTPUT}"
          else
            echo "run_id=${GITHUB_RUN_ID}" >> "${GITHUB_OUTPUT}"
          fi
      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.measurement-run.outputs.run_id }}
          pattern: stage10-bench-*
          path: all_artifacts
          merge-multiple: false
      - name: Aggregate measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.stage10_aggregate "${{ steps.measurement-run.outputs.run_id }}"
      - name: Upload final metrics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stage10-bench-final
          path: stage10_final/STAGE10_METRICS.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce Stage 10 verdict
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("stage10_final/STAGE10_METRICS.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          print("STAGE10_VERDICT=" + str(d["verdict"]))
          if d["verdict"] != "PASS":
              raise SystemExit(1)
          PY
