name: stage10-benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA256: c7429d1a31037e98201a05ed98b62c9c68118b2fda89064804d2d2cea2dfed79
  JOB_TIMEOUT_MINUTES: "350"

jobs:
  benchmark:
    name: benchmark-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - C100_G100
          - C100_G070
          - C100_G050
          - C100_G030
          - C100_G000
          - C085_G100
          - C085_G070
          - C085_G050
          - C085_G030
          - C085_G000
          - C070_G100
          - C070_G070
          - C070_G050
          - C070_G030
          - C070_G000
          - C050_G100
          - C050_G070
          - C050_G050
          - C050_G030
          - C050_G000
          - C030_G100
          - C030_G070
          - C030_G050
          - C030_G030
          - C030_G000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct and verify current source archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/motorcycle_source
          mkdir -p /tmp/motorcycle_source
          cat stage7_source/source.b64.* | base64 -d > /tmp/current_source.tar.gz
          actual_sha256="$(sha256sum /tmp/current_source.tar.gz | awk '{print $1}')"
          test "$actual_sha256" = "$SOURCE_SHA256"
          tar -xzf /tmp/current_source.tar.gz -C /tmp/motorcycle_source
          cp -a /tmp/motorcycle_source/. .
          python -m py_compile *.py

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run one real trial and measure
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          export PYTHONPATH=.
          rm -rf benchmark_results
          mkdir -p benchmark_results
          start_epoch="$(python - <<'PY'
          import time
          print(time.perf_counter())
          PY
          )"
          start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python run_batch.py --scenario "$SCENARIO" --output benchmark_results --demo-total 1
          end_epoch="$(python - <<'PY'
          import time
          print(time.perf_counter())
          PY
          )"
          end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          elapsed="$(python - "$start_epoch" "$end_epoch" <<'PY'
          import sys
          print(f"{float(sys.argv[2])-float(sys.argv[1]):.6f}")
          PY
          )"
          nproc_value="$(nproc)"
          cpu_model="$(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ //')"
          files_json="$(python - <<'PY'
          import json
          from pathlib import Path
          root=Path("benchmark_results")
          rows=[]
          total=0
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  size=p.stat().st_size
                  total += size
                  rows.append({"path":str(p),"bytes":size})
          print(json.dumps({"total_bytes":total,"files":rows},sort_keys=True))
          PY
          )"
          python - "$SCENARIO" "$start_utc" "$end_utc" "$elapsed" "$nproc_value" "$cpu_model" "$files_json" <<'PY'
          import json,sys
          from pathlib import Path
          scenario,start_utc,end_utc,elapsed,nproc,cpu_model,files_json=sys.argv[1:]
          payload=json.loads(files_json)
          out={
            "stage":10,
            "scenario":scenario,
            "trials_completed":1,
            "trial_mode":"demo_total_1",
            "start_utc":start_utc,
            "end_utc":end_utc,
            "elapsed_seconds":float(elapsed),
            "cores_reported":int(nproc),
            "cpu_model":cpu_model,
            "job_timeout_minutes":350,
            "saved_output_bytes":payload["total_bytes"],
            "saved_files":payload["files"],
          }
          Path("benchmark_results/benchmark.json").write_text(
            json.dumps(out,ensure_ascii=False,sort_keys=True,indent=2),
            encoding="utf-8"
          )
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage10-benchmark-${{ matrix.scenario }}
          path: benchmark_results/
          if-no-files-found: error
          retention-days: 7
