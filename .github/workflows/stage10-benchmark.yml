name: stage10-benchmark
on:
  push:
    branches:
      - "tmp/stage10-bench-20261008"
    paths:
      - ".stage10-benchmark-trigger"
      - ".stage10-aggregate-trigger"
      - ".stage10-cancel-trigger"
permissions:
  contents: read
  actions: read
env:
  SOURCE_SHA: "f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
  SOURCE_RUN_ID: "37225915321"
  MASTER_SEED: "20270101"
  RECOVERY_MEASUREMENT_RUN_ID: "37709936740"
  OLD_RECOVERY_RUN_ID: "37711587801"
jobs:
  emergency-cancel-old-recovery:
    if: ${{ contains(github.event.head_commit.message, '[STAGE10-CANCEL-OLD]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel incorrect recovery Run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ env.OLD_RECOVERY_RUN_ID }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
          echo "Cancelled Run ${TARGET_RUN_ID}"

  bench-matrix:
