      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python scripts/stage12_materialize_one_chunk.py --scenario "${{ matrix.scenario }}" --start "${{ matrix.start }}" --end "${{ matrix.end }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-daily-${{ matrix.scenario }}-${{ matrix.chunk_id }}
          path: docs/stage12/daily_accounting/${{ matrix.scenario }}_${{ matrix.start }}_${{ matrix.end }}.parquet
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: materialize
    if: ${{ needs.materialize.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: stage12-daily-*
          path: artifacts
          merge-multiple: true
      - run: python scripts/stage12_aggregate.py --root artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: stage12-cp12b-result
          path: docs/stage12/reproduction_result.json
          if-no-files-found: error
          retention-days: 30
