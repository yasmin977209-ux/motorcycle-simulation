name: stage12-c-rollforward

on:
  push:
    branches: ["tmp/stage12-c-rollforward-20261009"]

permissions:
  contents: read
  actions: read

jobs:
  validate-rollforward:
    name: CP-12-C daily roll-forward and balance audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: $@@{{ github.workspace }}
      CP12B_RUN_ID: "37964656154"
      CP12B_RUN_SHA: "0156c5f4272eb0ca7e32442657d0df9eaf4973d3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository requirements
        run: python -m pip install -r requirements.txt
      - name: Verify immutable CP-12-B source run
        env:
          GH_TOKEN: $@@{{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_stage12_cp12c
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CP12B_RUN_ID}" > results_stage12_cp12c/source_run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path("results_stage12_cp12c/source_run.json").read_text(encoding="utf-8"))
          assert run["id"] == int(os.environ["CP12B_RUN_ID"]), run
          assert run["status"] == "completed" and run["conclusion"] == "success", run
          assert run["head_sha"] == os.environ["CP12B_RUN_SHA"], run
          assert run["head_branch"] == "tmp/stage12-b3-25jobs-20261009", run
          print(json.dumps({
              "run_id": run["id"], "conclusion": run["conclusion"],
              "head_sha": run["head_sha"], "head_branch": run["head_branch"]
          }, sort_keys=True))
          PY
      - name: Download the 25 daily Parquet artifacts from pinned CP-12-B
        uses: actions/download-artifact@v4
        with:
          run-id: 37964656154
          github-token: $@@{{ github.token }}
          pattern: stage12-daily-*
          merge-multiple: true
          path: artifacts
      - name: Unit-test the independent accounting auditor
        run: python -m pytest -q tests/test_stage12_rollforward_audit.py
      - name: Audit every daily roll-forward and balance row
        run: python scripts/stage12_validate_rollforward.py --root artifacts --output results_stage12_cp12c/rollforward_result.json
      - name: Upload CP-12-C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage12-cp12c-accounting-audit
          path: results_stage12_cp12c/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
