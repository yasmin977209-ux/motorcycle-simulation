name: Pinned source identity and Stage 3 path regression

on:
  push:
    branches:
      - "tmp/cp-source-sha-drift-restore-pinned-20261022"
    paths:
      - "daily_engine.py"
      - "monte_carlo.py"
      - "tests/test_stage3_path_integration.py"
      - "tests/test_stage3b_path1.py"
      - "tests/test_stage3b_paths.py"
      - ".github/workflows/cp-source-sha-drift-restore-pinned-20261022.yml"

permissions:
  contents: read

concurrency:
  group: cp-source-sha-drift-pinned-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-and-test:
    name: Exact pinned source identity and path behavior
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate SHA and source history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Assert exact pinned model-source content
        shell: bash
        run: |
          SOURCE_SHA="f3af4f06fded8b7a4e8c7730b5f2d19201a0a84b"
          test "$(git hash-object daily_engine.py)" = "$(git rev-parse "${SOURCE_SHA}:daily_engine.py")"
          test "$(git hash-object monte_carlo.py)" = "$(git rev-parse "${SOURCE_SHA}:monte_carlo.py")"
          git diff --exit-code "${SOURCE_SHA}" -- daily_engine.py monte_carlo.py
      - name: Compile source modules
        run: python -m compileall -q daily_engine.py monte_carlo.py
      - name: Run focused path regression inventory
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_stage3_path_integration.py tests/test_stage3b_path1.py tests/test_stage3b_paths.py
