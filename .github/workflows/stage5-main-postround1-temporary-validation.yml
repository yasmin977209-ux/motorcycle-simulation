name: stage5-round1-temporary-validation

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "results_stage5_main_round1/**"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Run accepted regression gates
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/stage5_validation
          {
            echo "COMMIT_SHA=$GITHUB_SHA"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "== V2 =="
            python -m pytest -q tests/test_acceptance_16_v2.py
            echo "== STAGE 1 =="
            python -m pytest -q tests/test_stage1.py
            echo "== STAGE 2 =="
            python -m pytest -q tests/test_stage2.py tests/test_stage2_entities_additions.py
            echo "== STAGE 3A CH5 =="
            python -m pytest -q tests/test_stage3a.py -k ch5
            echo "== STAGE 3A CH6 =="
            python -m pytest -q tests/test_stage3a.py -k ch6
            echo "== STAGE 3A CH7 =="
            python -m pytest -q tests/test_stage3a.py -k ch7
            echo "== STAGE 3A CH8 =="
            python -m pytest -q tests/test_stage3a.py -k ch8
            echo "== STAGE 3A CH9 =="
            python -m pytest -q tests/test_stage3a.py -k ch9
            echo "== STAGE 3A STAGE1 REGRESSION =="
            python -m pytest -q tests/test_stage1.py
            echo "== STAGE 3A STAGE2 REGRESSION =="
            python -m pytest -q tests/test_stage2.py
            echo "== STAGE 3B CH10 =="
            python -m pytest -q tests/test_stage3b_accounting.py
            echo "== STAGE 3B CH11 =="
            python -m pytest -q tests/test_stage3b_partner_equity.py
            echo "== STAGE 3B CH12 =="
            python -m pytest -q tests/test_stage3b_m_order.py
            echo "== STAGE 3B CH13 =="
            python -m pytest -q tests/test_stage3b_closure.py
            echo "== STAGE 3B PATH 1 =="
            python -m pytest -q tests/test_stage3b_path1.py
            echo "== STAGE 3B PATHS 2-6 =="
            python -m pytest -q tests/test_stage3b_paths.py
            echo "== STAGE 3B NO TIME CAP =="
            python -m pytest -q tests/test_stage3b_no_time_cap.py
            echo "== STAGE 3B DETERMINISM =="
            python -m pytest -q tests/test_stage3b_determinism.py
            if [ -f tests/test_monte_carlo_round1.py ]; then
              echo "== ROUND 1 UNIT TESTS =="
              python -m pytest -q tests/test_monte_carlo_round1.py
            else
              echo "== ROUND 1 UNIT TESTS == NOT_PRESENT"
            fi
            if grep -qx 'pyarrow' requirements.txt; then
              echo "== FINAL C100_G100 METRICS =="
              python - <<'PY'
          import json
          import time
          import os

          from daily_engine import run_deterministic_trial

          started = time.perf_counter()
          project = run_deterministic_trial(
              recovery_rate_pct=100,
              trial_id=1,
              scenario_id="C100_G100",
              master_seed=20270101,
          )
          elapsed = time.perf_counter() - started

          result = {
              "final_net_project_equity": project.final_net_project_equity,
              "partner1_final_entitlement": project.partner1_final_entitlement,
              "partner2_final_entitlement": project.partner2_final_entitlement,
              "final_cash": project.project_cash,
              "final_close_date": project.final_close_date.isoformat(),
              "daily_balance_checks": len(project.daily_balance_checks),
              "elapsed_seconds": elapsed,
              "cpu_count": os.cpu_count(),
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result["final_net_project_equity"] == 209671000
          assert result["partner1_final_entitlement"] == 146769700
          assert result["partner2_final_entitlement"] == 62901300
          assert result["final_close_date"] == "2033-01-06"
          PY
            fi
            echo "VALIDATION_STATUS=PASS"
            echo "RUN_FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee /tmp/stage5_validation/validation.log

      - name: Persist validation outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results_stage5_round1
          cp /tmp/stage5_validation/validation.log "results_stage5_round1/validation_${GITHUB_SHA}.log" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results_stage5_round1
          if git diff --cached --quiet; then
            echo "No validation output changes."
          else
            git commit -m "Record Stage 5 round 1 validation"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
