name: D3 Workbook Size and Identity Reconciliation
on:
  push:
    branches: [tmp/d1-rebuild-20261101]
    paths:
      - scripts/d3_workbook_reconciliation.py
      - .github/workflows/d3-workbook-size-identity-reconciliation.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d3-workbook-reconciliation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reconcile:
    name: Compare Git tree, D3 Artifact and D5 package workbook identities
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install workbook inspection dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 requests==2.32.3
      - name: Download and verify exact D3 and D5 source Artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, pathlib, requests, zipfile, io
          repo="yasmin977209-ux/motorcycle-simulation"
          pins={
            13288779998:(535567142,"e49b206d8d80034b1dc0cb284bfee76d81f9e9759e2459b1608fad2f5c933ffe","d3.zip"),
            13369179742:(519116689,"80caf0567e31a6bf5397543dac8ef191b38999105dd3cedce4c3dad75b20bff1","d5.zip")
          }
          headers={"Authorization":f"Bearer {os.environ['GITHUB_TOKEN']}","Accept":"application/vnd.github+json"}
          root=pathlib.Path("reconciliation-input"); root.mkdir(exist_ok=True)
          for aid,(expected_size,expected_sha,name) in pins.items():
            meta=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",headers=headers,timeout=45)
            meta.raise_for_status(); item=meta.json()
            if item.get("expired") or item.get("size_in_bytes")!=expected_size or item.get("digest")!=f"sha256:{expected_sha}":
              raise SystemExit(f"ARTIFACT_METADATA_PIN_MISMATCH:{aid}")
            response=requests.get(f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}/zip",headers=headers,stream=True,timeout=(45,240))
            response.raise_for_status(); target=root/name; h=hashlib.sha256(); n=0
            with target.open("wb") as f:
              for chunk in response.iter_content(1024*1024):
                if chunk: f.write(chunk); h.update(chunk); n+=len(chunk)
            if n!=expected_size or h.hexdigest()!=expected_sha: raise SystemExit(f"ARTIFACT_RAW_HASH_MISMATCH:{aid}:{n}:{h.hexdigest()}")
            with zipfile.ZipFile(target) as z:
              if len(z.namelist())!=len(set(z.namelist())) or z.testzip(): raise SystemExit(f"ARTIFACT_ZIP_CRC_OR_DUPLICATE_FAILURE:{aid}")
            print(f"VERIFIED_ARTIFACT id={aid} bytes={n} sha256={h.hexdigest()}")
          out=root/"workbooks"; out.mkdir(exist_ok=True)
          with zipfile.ZipFile(root/"d3.zip") as d3:
            for member,name in (("deliverables/Full_Results_EN.xlsx","D3_EN.xlsx"),("deliverables/النتائج_الكاملة_AR.xlsx","D3_AR.xlsx")):
              (out/name).write_bytes(d3.read(member))
          with zipfile.ZipFile(root/"d5.zip") as d5:
            expected={"Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05.zip","manifest.json","SHA256SUMS.txt"}
            if set(d5.namelist())!=expected: raise SystemExit("D5_OUTER_MEMBER_INVENTORY_MISMATCH")
            inner=zipfile.ZipFile(io.BytesIO(d5.read("Motorcycle_Simulation_D5_T2_INTERIM_2026-11-05.zip")))
            if inner.testzip(): raise SystemExit("D5_INNER_ZIP_CRC_FAILURE")
            for member,name in (("Full_Results_EN.xlsx","D5_EN.xlsx"),("النتائج_الكاملة_AR.xlsx","D5_AR.xlsx")):
              (out/name).write_bytes(inner.read(member))
          for name,expected_size,expected_sha,blob in (
            ("Full_Results_EN.xlsx",27722355,None,"a01c1f4061da731de24fcc8d061113bb195e65b1"),
            ("النتائج_الكاملة_AR.xlsx",27734273,None,"056b7f482bbb84583526f093ae886e13b8c01356")
          ):
            p=pathlib.Path("deliverables")/name
            raw=p.read_bytes()
            actual_blob=hashlib.sha1(b"blob "+str(len(raw)).encode()+bytes([0])+raw).hexdigest()
            if len(raw)!=expected_size or actual_blob!=blob: raise SystemExit("GIT_TREE_WORKBOOK_PIN_MISMATCH:"+name)
          print("D3_D5_SOURCE_ARTIFACTS_AND_GIT_TREE_INPUTS_VERIFIED")
          PY
      - name: Compare workbook sizes, worksheet row/cell counts and source identities
        run: |
          set -euo pipefail
          python scripts/d3_workbook_reconciliation.py \
            --git-en deliverables/Full_Results_EN.xlsx \
            --git-ar deliverables/النتائج_الكاملة_AR.xlsx \
            --d3-en reconciliation-input/workbooks/D3_EN.xlsx \
            --d3-ar reconciliation-input/workbooks/D3_AR.xlsx \
            --d5-en reconciliation-input/workbooks/D5_EN.xlsx \
            --d5-ar reconciliation-input/workbooks/D5_AR.xlsx \
            --d3-artifact-id 13288779998 \
            --d5-artifact-id 13369179742 \
            --output reconciliation-output
      - name: Publish reconciliation JSON and Markdown
        uses: actions/upload-artifact@v4
        with:
          name: D3-WORKBOOK-SIZE-IDENTITY-RECONCILIATION
          path: reconciliation-output/*
          if-no-files-found: error
          retention-days: 30
      - name: Exact tested SHA and reconciliation inventory
        run: |
          echo "D3_WORKBOOK_RECONCILIATION_TESTED_SHA=$GITHUB_SHA"
          find reconciliation-output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
